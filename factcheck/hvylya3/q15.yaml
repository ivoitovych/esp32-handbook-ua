- id: T-E-027
  verdykt: pidtverdzheno
  fayl: ina219.pdf
  cytata: |
    Table 1. INA219 Address Pins and Slave Addresses
                                A1              A0                 SLAVE ADDRESS
                               GND             GND                      1000000
  de: сторінка з описом I2C адрес, таблиця 1
  notatka: |
    1000000 у двійковій системі = 0x40 у шістнадцятковій, це перша адреса з набору.
    Подальші адреси від 1000000 до 1001111 (0x40 до 0x4F) дають варіанти 0x40+
