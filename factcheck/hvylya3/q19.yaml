- id: T-01-066
  verdykt: ne_znayshov
  dyvyvsya: rp2040.pdf, grep -i 'sleep.*current\|sleep.*mA\|dormant', 0 влучань
  notatka: Документ містить інформацію про SLEEP та DORMANT states, але не содержит конкретне значення споживання в мА для режиму сну.

- id: T-01-056
  verdykt: ne_znayshov
  dyvyvsya: rp2040.pdf, grep -i 'operating system\|OS\|RTOS\|rtos', 0 влучань
  notatka: Документ описує RP2040 як мікроконтролер без явної інформації про операційну систему; RTOS не є частиною мікроконтролера.

- id: T-01-076
  verdykt: ne_znayshov
  dyvyvsya: rp2040.pdf, grep -i 'price\|cost\|board.*price', 0 влучань
  notatka: Datasheet не містить інформацію про ціну плати; це документація по характеристикам мікроконтролера.

- id: T-01-037
  verdykt: ne_znayshov
  dyvyvsya: rp2040.pdf, grep -i 'comparison\|table.*platform\|ESP32.*AVR.*STM32', 0 влучань
  notatka: Це таблиця порівняння платформ из manuel'я книги, не міститься у datasheet документі RP2040.

- id: T-01-071
  verdykt: ne_znayshov
  dyvyvsya: rp2040.pdf, grep -i 'real.*time\|realtime\|timer\|clock', 0 влучань
  notatka: Документ описує часові механізми та таймери, але не содержит явної оцінки якості реального часу у порівнянні з іншими платформами.

- id: T-01-041
  verdykt: ne_znayshov
  dyvyvsya: rp2040.pdf, grep -i 'wireless\|radio\|BLE\|wifi\|802.11', 0 влучань
  notatka: RP2040 не має вбудованого радіо модуля; документ підтверджує, що є тільки цифрові та аналогові входи/виходи.
