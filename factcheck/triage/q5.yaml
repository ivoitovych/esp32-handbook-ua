  bulo-shukaty: ESP-IDF документація OTA — поведінка запису в ota_1
  chomu: 'Було dzherelo-ye, але поле shukaty називає ТЕМУ, а не документ: «Electronics Manual», «Oscilloscope
    Reference Manual» — таких документів немає. За власним законом: не можеш назвати документ — це ne-rozibrav.
    Повертаю в чергу, а не лишаю в наряді на докачування, бо замовити за такою назвою нічого не можна.
    Знайшов М1 у своїй половині (61 зі 111 у його вибірці); мій тест по всіх 507 дав 166.'
