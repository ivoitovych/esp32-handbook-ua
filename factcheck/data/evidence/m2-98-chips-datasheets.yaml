- nazva: 'T-02-146: S2 без Bluetooth узагалі.'
  klas: B
  dzherelo: https://www.espressif.com/sites/default/files/documentation/esp32-s2_datasheet_en.pdf
  cytata: 2.4 GHz Wi-Fi (802.11 b/g/n)
  sposib: Даташит узято з кешу 2026-08-28 і цитату звірено з ним підрядком (шар 3, `citaty.tekst_dzherela`).
    Клас `verbatim` означає, що документ отримано й цитата точна — не те, що супровідник прочитав
    уривок і погодився.
  notatka: '2026-08-28. Одиниця з передачі М1 (227 на даташитах): у М1 espressif.com віддає
    403, у мене ці паспорти в кеші. Було: клас F.

    Заперечне твердження дослівно довести не можна: рядка «no Bluetooth» у паспорті немає
    й бути не може. Доводиться зіставленням: власний перелік можливостей S2 називає ЛИШЕ «2.4
    GHz Wi-Fi (802.11 b/g/n)», тоді як ESP32 на першій сторінці — «Wi-Fi + Bluetooth + Bluetooth
    LE SoC», а C6 — «Bluetooth 5 (LE)». Слово Bluetooth у паспорті S2 трапляється чотири рази:
    двічі в переліку застосувань («Wi-Fi + Bluetooth Networking Card», де Bluetooth дає окремий
    чип) і двічі в рядку про торгові марки. Жодного разу — як можливість кристала.'
