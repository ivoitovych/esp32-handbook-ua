- nazva: SSD1306 — інтерфейс I²C або SPI, обидва пін-вибіркові
  zbih: OLED SSD1306 · Інтерфейс → I²C або SPI
  klas: A
  dzherelo: Solomon Systech, SSD1306 Advance Information (Rev 1.1, Apr 2008), розділи 1 «General Description»
    і 2 «Features»
  cytata: "1     GENERAL DESCRIPTION\n     SSD1306 is a single-chip CMOS OLED/PLED driver with controller\
    \ for organic / polymer light emitting\n     diode dot-matrix graphic display system. It consists\
    \ of 128 segments and 64commons. This IC is\n     designed for Common Cathode type OLED panel.\n\n\
    \     The SSD1306 embeds with contrast control, display RAM and oscillator, which reduces the number\
    \ of\n     external components and power consumption. It has 256-step brightness control. Data/Commands\
    \ are\n     sent from general MCU through the hardware selectable 6800/8000 series compatible Parallel\
    \ Interface,\n     I2C interface or Serial Peripheral Interface.\n\n2     FEATURES\n        •   Pin\
    \ selectable MCU Interfaces:\n                o 8-bit 6800/8080-series parallel interface\n      \
    \          o 3 /4 wire Serial Peripheral Interface\n                o I2C Interface\n"
  sposib: PDF Solomon Systech, кеш `ssd1306.pdf`, реєстр `factcheck/DZHERELA-m2.md`, pdftotext -layout,
    2026-08-26
  notatka: 'Обидва інтерфейси підтверджені дослівно й напряму з кристала — книга точна. Побічне, вартого
    уваги: обидва режими «пін-вибіркові» (перемикаються рівнем на пінах BS1/BS2 при монтажі), тобто це
    не властивість, яку можна змінити в рантаймі — читач бере модуль уже розпаяний під один режим. І інтерфейси
    нерівноцінні за кількістю ліній: I²C — це справді два дроти (SDA, SCL) плюс живлення, а SPI-режим
    (розділ 8.1.5 датащита) додає щонайменше CS#, D/C#, RES#, тобто щонайменше п''ять ліній замість двох
    — рядок таблиці цю різницю не показує.

    Окремо, для звірки з уже закритим у реєстрі рядком додатка E: сам датащит (розділ 8.1.5 «MCU I2C Interface»)
    дає адресу прямим текстом — байт `0 1 1 1 1 0 SA0 R/W#`, де «Either “0111100” or “0111101”, can be
    selected as the slave address of SSD1306», тобто `0x3C`/`0x3D` вибираються станом піна SA0 (в I²C-режимі
    це D/C#), а не залежать від роздільності панелі. Це підтверджує вже наявний доказ T-E-030 ще твердіше,
    ніж коментар у джерелі U8g2, на який той спирався, — але юніт уже клас A, тож нового запису тут не
    заводжу.'
