# Сліди М2 з хвилі 1: одиниці, для яких помічник назвав, ДЕ шукати,
# але документа не дістав. Здогад не перевірено.
#
# Раніше вони лежали в реєстрі доказів із класом `F`, і М1 слушно
# показав, що це порожній запис: `F` означає ВІДСУТНІСТЬ доказу, тож
# доказ класу `F` не стверджує нічого й лише тримає ворота червоними.
# Але сама підказка «шукати в такому-то документі» — не порожня, і
# викидати її разом із записом було б втратою. Місце для неї —
# `tools/leads.py`, а не реєстр.

