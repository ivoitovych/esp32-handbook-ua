- nazva: DS18B20 повертає −127 при відсутності зв'язку
  zbih: −127|-127
  dzherelo: https://raw.githubusercontent.com/milesburton/Arduino-Temperature-Control-Library/master/DallasTemperature.h
  cytata: '#define DEVICE_DISCONNECTED_C -127

    '
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Симптом «DS18B20 показує −127 °C» книга подає в таблиці додатка B і в розділі
    37 як ознаку відсутнього зв''язку. Значення дослівне: це константа бібліотеки, яку повертає
    драйвер, коли датчик не відповідає.

    Практично важливо саме те, що це **не виміряна температура**, а маркер помилки: −127 у
    логу означає обрив, підтяжку або живлення, а не мороз.'
