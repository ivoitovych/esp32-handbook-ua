- nazva: Проєкт 62 свідомо на classic через тільки-вхідний GPIO34
  zbih: бо `GPIO34` там \*\*тільки\s*вхідний\*\*|не може випадково подати сигнал на реле|тільки-вхідних
    пінів немає взагалі
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/soc/{esp32,esp32s3,esp32c3}/include/soc/soc_caps.h
  cytata: "esp32:   SOC_GPIO_VALID_OUTPUT_GPIO_MASK\n           (SOC_GPIO_VALID_GPIO_MASK\
    \ & ~(BIT34|BIT35|BIT36|BIT37|BIT38|BIT39))\nesp32s3: SOC_GPIO_VALID_OUTPUT_GPIO_MASK\
    \ (SOC_GPIO_VALID_GPIO_MASK)\nesp32c3: SOC_GPIO_VALID_OUTPUT_GPIO_MASK SOC_GPIO_VALID_GPIO_MASK\n"
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Проєкт 62 не мав переліку складових узагалі, тож `tools/pins.py` його піни не
    перевіряв: файл нічого собі не приписував. Додано перелік і таблицю пінів на три сімейства
    — і разом із ними названо причину вибору.

    Причина механічна, і вона видна прямо в масках. На classic `GPIO34`–`GPIO39` вирізані
    з маски **виходів**: пін фізично не вміє бути виходом. Для проєкту, де помилка в коді
    заливає приміщення, це не дрібниця — датчик рівня сидить на піні, який неможливо випадково
    перетворити на джерело сигналу.

    На S3 і C3 маски виходу й входу збігаються, тільки-вхідних пінів немає, і цю властивість
    там не отримати. Тому вибір classic у цьому проєкті — рішення, а не інерція; так і записано.

    Клас `B`: маски отримано дослівно, висновок про безпекову властивість із них випливає
    однозначно, але сам він — міркування, а не цитата.'
