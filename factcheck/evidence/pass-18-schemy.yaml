- nazva: Підтягування I²C — діапазон, а не одне число
  zbih: ESP-IDF\s*рекомендує \*\*2–5 кОм\*\*|що вища частота, то менший резистор|не менше
    1 кОм
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/docs/en/api-reference/peripherals/i2c.rst
  cytata: 'The recommended value for pull-up resistors usually ranges from 1 kΩ to 10 kΩ.


    Keep in mind that the higher the frequency, the smaller the pull-up resistor

    should be (but not less than 1 kΩ). Indeed, large resistors will decline the

    current, which will increase the clock switching time and reduce the frequency.

    A range of 2 kΩ to 5 kΩ is recommended…


    enable_internal_pullup … Note: This is not strong enough to pullup buses under

    high-speed frequency. A suitable external pullup is recommended.

    '
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Доповнення. Книга скрізь називала 4.7 кОм, і це число всередині рекомендованого
    діапазону — тобто не помилка. Але подавалося воно як єдине правильне, без залежності,
    яка й пояснює, коли воно не працює.

    Тепер названо діапазон (2–5 кОм, припустимо 1–10) і правило: що вища частота, то менший
    резистор, але не менше 1 кОм. Це замикає пораду з розділу 34 «на 400 кГц зменшуйте до
    2.2 кОм», яка досі стояла без обґрунтування.

    Заразом підтверджено твердження книги про вбудоване підтягування: документація прямо каже,
    що його не вистачає на високій частоті.'
  title: Підтягування I²C — діапазон, а не одне число
  match: ESP-IDF\s*рекомендує \*\*2–5 кОм\*\*|що вища частота, то менший резистор|не менше
    1 кОм
