- nazva: GPIO15 низький глушить boot-лог ROM
  zbih: глушить лог ROM|вимикає boot-лог ROM|чи друкує ROM boot-лог|silences boot messages
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esptool/master/docs/en/advanced-topics/boot-mode-selection.rst
  cytata: '| 15 (MTDO)  | If driven Low, silences boot messages printed by the ROM

    |            | bootloader. Has an internal pull-up, so unconnected = High =

    |            | normal output.

    '
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Доповнення, і рівно в жанрі книги. Розділ 07 писав про `GPIO5` і `GPIO15` одним
    рядком — «режим і вивід логу при старті», наслідок «сміття в консолі». Насправді наслідок
    протилежний за характером: `GPIO15`, притиснутий до землі, не псує лог, а **прибирає його
    цілком**.

    Для книги, чия картка К6 присвячена читанню boot-логу, це закриває цілий сценарій: «плата
    мовчить на 115200» досі означало порт, живлення або швидкість, а тепер має ще одну причину
    — резистор чи світлодіод на `GPIO15`. Плата при цьому цілком справна.

    Додано блоком уваги в розділ 07 і рядком на картку К6.

    Рядок про `GPIO5` розділено: його роль (таймінги SDIO-веденого) лишається за datasheet
    і в наряді, тож книга більше не змішує його з `GPIO15` в одному твердженні.'
  title: GPIO15 низький глушить boot-лог ROM
  match: глушить лог ROM|вимикає boot-лог ROM|чи друкує ROM boot-лог|silences boot messages
