- nazva: Піни IOMUX для UART0 і SPI
  zbih: UART0 TX / RX \| 1 / 3|SPI2 MOSI / MISO / CLK / CS|SPI3 MOSI / MISO / CLK / CS|HSPI\*\*
    і \*\*VSPI|23/19/18/5
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/soc/{esp32,esp32s3,esp32c3}/include/soc/{uart_pins.h,spi_pins.h}
  cytata: "esp32:   U0TXD 1, U0RXD 3\n         HSPI(=SPI2) MOSI 13 MISO 12 CLK 14 CS 15\n\
    \         VSPI(=SPI3) MOSI 23 MISO 19 CLK 18 CS 5\n         MSPI (флеш) CLK 6 MISO 7 MOSI\
    \ 8 HD 9 WP 10 CS0 11\nesp32s3: U0TXD 43, U0RXD 44\n         SPI2 MOSI 11 MISO 13 CLK\
    \ 12 CS 10\n         MSPI CS1 26 HD 27 WP 28 CS0 29 CLK 30 MISO 31 MOSI 32\n         \
    \     D4 33 D5 34 D6 35 D7 36 DQS 37\nesp32c3: U0TXD 21, U0RXD 20\n         SPI2 MOSI\
    \ 7 MISO 2 CLK 6 CS 10\n         MSPI HD 12 WP 13 CS0 14 CLK 15 MOSI 16 MISO 17\n"
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Нуль розбіжностей. Усі дванадцять чисел таблиці IOMUX збігаються, і ототожнення
    `SPI2 = HSPI`, `SPI3 = VSPI` теж стоїть у заголовку дослівно (`#define SPI2_FUNC_NUM HSPI_FUNC_NUM`).

    Заразом підтверджено діапазони пінів флешу, які книга забороняє чіпати: classic 6–11,
    C3 12–17, S3 26–32 плюс 33–37 на модулях з Octal PSRAM. Останнє видно прямо: `MSPI_IOMUX_PIN_NUM_D4…DQS`
    — це саме 33…37.'
