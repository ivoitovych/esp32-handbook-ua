  quote: '| 15 (MTDO)  | If driven Low, silences boot messages printed by the ROM

    |            | bootloader. Has an internal pull-up, so unconnected = High =

    |            | normal output.

    '
  method: curl raw.githubusercontent, 2026-08-26
  note: 'Доповнення, і рівно в жанрі книги. Розділ 07 писав про `GPIO5` і `GPIO15` одним рядком
