- nazva: Другий strapping-пін на classic і S3 працює навпаки до C3
  zbih: низьким або вільним|низький або вільний|Другий strapping-пін працює на S3 і C3 у протилежні
    боки|`GPIO46` при цьому
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esptool/master/docs/en/advanced-topics/boot-mode-selection.rst
  cytata: ".. only:: esp32 or esp32s2 or esp32s3\n\n   {IDF_TARGET_STRAP_BOOT_2_GPIO} must\
    \ also be either left unconnected/floating,\n   or driven Low, in order to enter the serial\
    \ bootloader.\n\n.. only:: esp32c3 or esp32c2 or esp32h2 or esp32c6 or esp32p4 or esp32c5\
    \ or esp32c61 …\n\n   {IDF_TARGET_STRAP_BOOT_2_GPIO} must also be driven High, in order\
    \ to enter the\n   serial bootloader reliably. The strapping combination of {…STRAP_BOOT_2_GPIO}\
    \ = 0\n   and {…STRAP_BOOT_GPIO} = 0 is invalid and will trigger unexpected behavior.\n\
    \nIn normal boot mode ({…STRAP_BOOT_GPIO} high), {…STRAP_BOOT_2_GPIO} is ignored.\n"
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Виправлення, і воно дороге. Книга у трьох місцях писала, що на S3 «комбінація
    `GPIO46` = 1 разом із `GPIO0` = 0 недійсна». Це правило з **C3**, механічно перенесене
    на S3 — разом із переверненим рівнем.

    Правда протилежна: на classic, S2 і S3 другий пін мусить бути **низьким або вільним**,
    щоб увійти в бутлоадер. Поняття «недійсна комбінація» існує тільки в RISC-V сімействах,
    де другий пін навпаки має бути високим.

    Ціна помилки — саме та, заради якої пінаути й друкують: розробник плати на S3, читаючи
    книгу, підтягне `GPIO46` угору «щоб уникнути недійсної комбінації» — і зробить download
    mode недосяжним на всій партії.

    Виправлено в розділі 07, на картці К9 і в додатку A; у розділ 07 додано таблицю на три
    сімейства, бо саме перенесення плати з чипа на чип і породжує цю помилку.

    Заразом зафіксовано правило, якого книга не називала: у звичайному режимі (головний пін
    високий) другий пін ігнорується взагалі.'
  title: Другий strapping-пін на classic і S3 працює навпаки до C3
