# Прохід 12 — пінаути: ADC, touch, IOMUX, USB, strapping.
#
# Таблиці пінаутів — це те, за чим розводять плату. Помилка тут не
# псує сеанс налагодження, а псує партію друкованих плат, і виявляється
# після того, як їх виготовили.
#
# Джерела дістаються всі й повністю: канали ADC і touch, піни IOMUX і
# номери ліній USB лежать у заголовках `soc/`, а правила strapping —
# у документації esptool. Datasheet тут майже не потрібен.
#
# Прохід дав одне виправлення й одне доповнення, обидва — про strapping.





















- nazva: Канали ADC і touch за GPIO — усі три сімейства
  zbih: ADC2_1|ADC2_9|ADC1_4/5|T9/T8|ADC1\*\* \(працює завжди\)|1–10 \| ADC1|0–4 \| ADC1
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/soc/{esp32,esp32s3,esp32c3}/include/soc/adc_channel.h
    та .../esp32/include/soc/touch_sensor_channel.h
  cytata: '(esp32/adc_channel.h)

    ADC1: CH0→36 CH1→37 CH2→38 CH3→39 CH4→32 CH5→33 CH6→34 CH7→35

    ADC2: CH0→4 CH1→0 CH2→2 CH3→15 CH4→13 CH5→12 CH6→14 CH7→27 CH8→25 CH9→26


    (esp32/touch_sensor_channel.h)

    T0→4 T1→0 T2→2 T3→15 T4→13 T5→12 T6→14 T7→27 T8→33 T9→32


    (esp32s3) ADC1: 1…10   ADC2: 11…20

    (esp32c3) ADC1: 0…4    ADC2: 5

    '
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Нуль розбіжностей у найдрібнішому місці книги. Звірено **кожну** комірку таблиці
    classic: усі десять номерів каналів ADC2, усі вісім ADC1, усі десять сенсорів touch.

    Окремо звернімо увагу на рядок `32, 33 | ADC1_4/5 | T9/T8`: тут порядок навмисно різний,
    бо `GPIO32` — це `T9`, а `GPIO33` — `T8`. Легко було б поставити «T8/T9» і помилитися;
    у книзі стоїть правильно.

    Списки «ADC1 працює завжди: 32–39» і «ADC2 не працює при Wi-Fi: 0, 2, 4, 12–15, 25–27»
    збігаються з заголовком повністю.'
