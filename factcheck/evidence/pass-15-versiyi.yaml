- nazva: Компонент led_strip версії 3.0.3 і межа ^ у менеджері
  zbih: espressif/led_strip\^3\.0\.3|\^3\.0\.3` не візьме 4\.x
  dzherelo: https://raw.githubusercontent.com/espressif/idf-extra-components/master/led_strip/{idf_component.yml,CHANGELOG.md}
  cytata: "(idf_component.yml)\nversion: \"3.0.3\"\ndescription: Driver for Addressable LED\
    \ Strip (WS2812, etc)\ndependencies:\n  idf: \">=5.0\"\n\n(CHANGELOG.md)\n## 3.0.3\n-\
    \ Support WS2816 with 16-bit color\n## 3.0.0\n- Discontinued support for ESP-IDF v4.x\n"
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Версія в книзі збігається з поточною в реєстрі дослівно, і приклад `idf.py add-dependency
    "espressif/led_strip^3.0.3"` робочий.

    Заразом підтвердилося пояснення розділу 11 про `^`: сам компонент оголошує `idf: ">=5.0"`,
    а його CHANGELOG прямо каже, що 3.0.0 припинив підтримку ESP-IDF v4.x. Тобто мажорна межа
    в цьому компоненті справді несе зміну сумісності — саме те, заради чого книга радить `^`.'
  title: Компонент led_strip версії 3.0.3 і межа ^ у менеджері
  match: espressif/led_strip\^3\.0\.3|\^3\.0\.3` не візьме 4\.x
  status: verbatim
  source: https://raw.githubusercontent.com/espressif/idf-extra-components/master/led_strip/{idf_component.yml,CHANGELOG.md}
  quote: "(idf_component.yml)\nversion: \"3.0.3\"\ndescription: Driver for Addressable LED\
    \ Strip (WS2812, etc)\ndependencies:\n  idf: \">=5.0\"\n\n(CHANGELOG.md)\n## 3.0.3\n-\
    \ Support WS2816 with 16-bit color\n## 3.0.0\n- Discontinued support for ESP-IDF v4.x\n"
  method: curl raw.githubusercontent, 2026-08-26
  note: 'Версія в книзі збігається з поточною в реєстрі дослівно, і приклад `idf.py add-dependency
    "espressif/led_strip^3.0.3"` робочий.

    Заразом підтвердилося пояснення розділу 11 про `^`: сам компонент оголошує `idf: ">=5.0"`,
    а його CHANGELOG прямо каже, що 3.0.0 припинив підтримку ESP-IDF v4.x. Тобто мажорна межа
    в цьому компоненті справді несе зміну сумісності — саме те, заради чого книга радить `^`.'
