- nazva: Політика підтримки ESP-IDF — 30 місяців, без окремого LTS
  zbih: Окремого статусу LTS не існує|30 місяців підтримки має кожен major|Service-періоді|Maintenance
    бекпортують
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/master/SUPPORT_POLICY.md
  cytata: 'Each ESP-IDF major and minor release (V4.1, V4.2, etc) is supported for

    30 months after the initial stable release date.


    | Period      | Duration     | Recommended for new projects?         |

    | Service     | 12 months    | Yes                                   |

    | Maintenance | 18 months    | No                                    |


    During the Maintenance period, the version is still supported but only

    bugfixes for high severity issues or security issues will be applied.

    '
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Повторна звірка того, що прохід 1 уже закрив, — і вона дала те саме. Важливо саме
    як повторення: політика підтримки належить до тих тверджень, які змінюються без попередження,
    і формулювання «окремого LTS не існує» суперечить поширеній думці в мережі.

    Розкладка 12 + 18 = 30 підтверджена таблицею дослівно.

    Дата закінчення підтримки гілки v6.0 (2028-09-20) у `toolchain-baseline.yaml` виводиться
    з дати первинного релізу v6.0, якої в доступних звідси джерелах немає. Лишається як похідне
    твердження й у наряді.'
