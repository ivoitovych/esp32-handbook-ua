# Прохід 15 — версії тулчейну й компонентів.
#
# Найшвидкопсувніші факти книги. Решта тверджень старіє роками, ці —
# місяцями, і саме за ними читач судить, чи довіряти решті: номер версії,
# який видно неправильним із першого погляду, знецінює сусідні сторінки.
#
# Метод простий і повний: у сховищі є теґ — версія існує; наступного
# теґа немає — версія найновіша. Обидва боки перевіряються кодом
# відповіді, без здогадок.







































- nazva: Версії тулчейну — усі чотири найновіші на дату ревізії
  zbih: v?6\.0\.2(?!\d)|v?5\.3\.1(?!\d)|3\.3\.11(?!\d)|55\.03\.311|5\.5\.x|2\.2\.0(?!\d)
  dzherelo: 'raw.githubusercontent.com — наявність теґів і файли версій: espressif/esp-idf
    (components/esp_common/include/esp_idf_version.h), espressif/esptool (esptool/__init__.py),
    espressif/arduino-esp32 (platform.txt), pioarduino/platform-espressif32 (platform.json)'
  cytata: "esp-idf v6.0.2  → 200,  v6.0.3 → 404      esp_idf_version.h: MAJOR 6 MINOR 0 PATCH\
    \ 2\nesp-idf v5.5.5  → 200,  v5.5.6 → 404\nesptool v5.3.1  → 200,  v5.3.2 → 404      __init__.py:\
    \ __version__ = \"5.3.1\"\narduino-esp32 3.3.11 → 200, 3.3.12 → 404  platform.txt: version=3.3.11\n\
    pioarduino 55.03.311 → 200, 55.03.312 → 404\n    platform.json: \"version\": \"55.03.311\"\
    \n    і в ньому ж: .../arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11.tar.xz\n"
  sposib: curl raw.githubusercontent, коди відповіді + файли версій, 2026-08-26
  notatka: 'Нуль розбіжностей. Кожна з чотирьох версій підтверджена двічі: існуванням теґа
    й номером усередині самого репозиторію на цьому теґу. Наступного теґа немає в жодного
    — тобто це справді найновіші, а не просто наявні.

    Окремо цінне спостереження: `platform.json` pioarduino 55.03.311 тягне саме `esp32-core-3.3.11`.
    Тобто два рядки таблиці версій книги узгоджені між собою не за збігом, а за побудовою
    — форк PlatformIO пінує рівно ту версію Arduino core, яку книга називає поточною.

    `toolchain-baseline.yaml` уже мав `status: verified` на всіх чотирьох; цей прохід перевірив,
    що позначка відповідає дійсності, а не лишилася від попередньої ревізії.'
