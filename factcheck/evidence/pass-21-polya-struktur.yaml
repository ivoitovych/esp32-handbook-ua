# Прохід 21 — імена полів структур ESP-IDF у прикладах.
#
# Прохід за пунктом 8 зовнішньої рецензії («код має стати перевірюваним
# артефактом»). Він дав два результати різного роду, і другий чесніший за
# перший.
#
# Перший: усі 39 імен полів, які книга вживає у восьми конфігураційних
# структурах, існують у заголовках ESP-IDF. Розбіжностей нуль.
#
# Другий: спроба зробити повну компіляційну перевірку прикладів **не
# вдалася**, і її прибрано, а не залишено як видимість. Подробиці — у
# звіті `reviews/`.







- nazva: Поля конфігураційних структур збігаються із заголовками ESP-IDF
  zbih: \.sda_io_num|\.scl_io_num|\.mosi_io_num|\.sclk_io_num|\.duty_resolution|\.pin_bit_mask|\.spics_io_num|\.dev_addr_length|\.timer_sel|\.flow_ctrl
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/ {esp_driver_i2c,esp_driver_spi,esp_driver_uart,esp_driver_ledc,esp_driver_gpio}/include/driver/
    {i2c_master.h,spi_common.h,spi_master.h,uart.h,ledc.h,gpio.h}
  cytata: 'Звірено вісім структур, усі поля, які книга ініціалізує:


    i2c_master_bus_config_t        6 полів книги ⊂ 11 у заголовку

    i2c_device_config_t            3 ⊂ 17

    spi_bus_config_t               6 ⊂ 18

    spi_device_interface_config_t  4 ⊂ 16

    uart_config_t                  6 ⊂ 11

    ledc_timer_config_t            4 ⊂ 16

    ledc_channel_config_t          5 ⊂ 10

    gpio_config_t                  5 ⊂ 6


    Жодного імені поза заголовком.

    '
  sposib: curl raw.githubusercontent + зіставлення `tools/struct_fields.py`, 2026-08-26
  notatka: "Нуль розбіжностей у 39 іменах. Це не дрібниця: імена полів конфігураційних структур\
    \ — саме те, що тихо змінюється між версіями ESP-IDF, і саме те, що читач набирає дослівно\
    \ з книжкової сторінки.\nГоловне тут не результат, а те, що він тепер постійний. `tools/struct_fields.py`\
    \ стоїть у `make check` і бере перелік полів із заголовків, а не з книги. Якби перелік\
    \ брався з книги, перевірка була б тавтологією: приклад завжди узгоджений сам із собою.\n\
    Випробувано підкинутою вадою: заміна `.sda_io_num` на `.sda_gpio_num` дає\n\n    manual/35-i2c.md:110:\
    \ у `i2c_master_bus_config_t` немає поля\n    `sda_gpio_num`\n\nНа чистому дереві — тиша."
