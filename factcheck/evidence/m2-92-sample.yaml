- nazva: 'T-39-093: ESP32 не бачить 5 ГГц мережі'
  zbih: ESP32 не бачить 5 ГГц — найчастіша причина «мережі немає в списку».
  klas: A
  dzherelo: 'Espressif Systems, ESP32 Series Datasheet — розділ 1 «Features», Wi-Fi (кеш:
    source-cache/21953a2f-esp32_datasheet_en.pdf)'
  cytata: 'ESP32 is a single 2.4 GHz Wi-Fi-and-Bluetooth combo chip designed with the TSMC
    low-power 40 nm

    • 802.11n (2.4 GHz), up to 150 Mbps

    '
  sposib: factcheck/tools/layer3.py tekst_dzherela по кешованому PDF, 2026-08-27
  notatka: 'Було E — «зовнішнього джерела не існує». Існує, і воно найпряміше з можливих:
    даташит називає чип 2.4-гігагерцовим у першому ж рядку опису й перелічує лише b/g/n у
    діапазоні 2.4 ГГц. Твердження «ESP32 не бачить 5 ГГц мереж» доводиться відсутністю 5 ГГц
    у переліку підтримуваних стандартів, а не окремою заявою виробника — тому цитата подає
    обидва рядки.'
