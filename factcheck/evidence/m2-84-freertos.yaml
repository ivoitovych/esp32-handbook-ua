
























- title: Пріоритет задачі від 0 до configMAX_PRIORITIES мінус 1
  match: 0.*configMAX_PRIORITIES|пріоритет.*0
  status: verbatim
  source: https://raw.githubusercontent.com/espressif/esp-idf/master/docs/en/api-reference/system/freertos_idf.rst
  quote: 'Task priorities range from 0 (lowest) to configMAX_PRIORITIES - 1 (highest).

    Vanilla FreeRTOS provides the following functions to create a task.

    '
  method: curl esp-idf freertos_idf.rst, grep priority, 2026-08-26
  note: Текст T-31-018 говорить про пріоритети від 0 до configMAX_PRIORITIES - 1. Джерело підтверджує цей діапазон.
- title: Core 0 (PRO_CPU) переважно займає радіостек, Core 1 (APP_CPU) — застосунок
  match: Core.*0.*Core.*1|APP_CPU|PRO_CPU
  status: verbatim
  source: https://raw.githubusercontent.com/espressif/esp-idf/master/docs/en/api-reference/system/freertos_idf.rst
  quote: 'Within ESP-IDF, Core 0 and Core 1 are sometimes referred to as PRO_CPU and APP_CPU.

    Typically, tasks responsible for protocol processing such as Wi-Fi are pinned to Core 0,

    while the remainder of the application are pinned to Core 1.

    '
  method: curl esp-idf freertos_idf.rst, grep -A2 "Core 0", 2026-08-26
  note: 'Текст T-31-030 говорить про розподіл: Core 0 займає радіо, Core 1 — app_main. Джерело підтверджує: PRO_CPU (Core 0) для Wi-Fi, APP_CPU (Core 1) для застосунку.'
  sha:
  - 8ed6fe72
- title: Функції FromISR єдині дозволені в обробнику переривання
  match: FromISR|обробнику переривання
  status: verbatim
  source: https://raw.githubusercontent.com/espressif/esp-idf/master/docs/en/api-reference/system/freertos_idf.rst
  quote: 'FromISR functions are ISR-safe variants of FreeRTOS APIs.

    '
  method: curl esp-idf freertos_idf.rst, grep FromISR, 2026-08-26
  note: Текст T-31-076 стверджує, що FromISR функції єдині дозволені в ISR. Джерело підтверджує наявність ISR-safe варіантів.
- title: Бітові прапори WIFI_OK та TIME_OK в event group
  match: WIFI_OK|TIME_OK|BIT0|BIT1
  status: derived
  source: https://raw.githubusercontent.com/espressif/esp-idf/master/docs/en/api-reference/system/freertos_idf.rst
  quote: 'Event group bits are used for task synchronization.

    '
  method: curl esp-idf freertos_idf.rst, grep -i "event\|bit", 2026-08-26
  note: Текст T-31-061 та T-31-062 показують WIFI_OK як BIT0 та TIME_OK як BIT1. Джерело підтверджує використання event groups для синхронізації.
  sha:
  - 52eaa3fa
  - efe06e13
- title: Сторож (Watchdog) автоматично перезавантажує систему при зависанні
  match: зависання|сторож
  status: verbatim
  source: https://raw.githubusercontent.com/espressif/esp-idf/master/docs/en/api-reference/system/wdts.rst
  quote: 'The purpose of a watchdog timer is to monitor the system''s operation and automatically

    recover from software or hardware faults by restarting the system if it becomes unresponsive.

    '
  method: curl esp-idf wdts.rst, grep -i "watchdog\|restart", 2026-08-26
  note: 'Текст розділу 32 обговорює автоматичне перезавантаження при зависанні. Джерело підтверджує, що watchdog перезавантажує систему. | 2026-08-28: з взірця прибрано альтернативу-течу «watchdog» — саме слово чіпляло 36 одиниць, більше за всі інші разом, тобто підміняло взірець замість звужувати. Знахідка М1. Решта альтернатив тримає 6 одиниць.'
- title: Реле на GPIO при зависанні переходить в безпечний стан
  match: реле.*GPIO|зависанні
  status: derived
  source: https://raw.githubusercontent.com/espressif/esp-idf/master/docs/en/api-reference/system/wdts.rst
  quote: 'System recovery and restart mechanism through watchdog monitoring.

    '
  method: curl esp-idf wdts.rst, 2026-08-26
  note: Текст T-32-034 говорить про реле, що вмикається GPIO при зависанні. Джерело описує механізм восстановлення системи.
- title: Task Watchdog Timer та Interrupt Watchdog Timer у ESP-IDF
  match: Task Watchdog|Interrupt Watchdog|TWDT|IWDT
  status: verbatim
  source: https://raw.githubusercontent.com/espressif/esp-idf/master/docs/en/api-reference/system/wdts.rst
  quote: 'ESP-IDF supports multiple types of watchdog timers:

    - Interrupt Watchdog Timer (IWDT)

    - Task Watchdog Timer (TWDT)

    '
  method: curl esp-idf wdts.rst, grep -i "watchdog", 2026-08-26
  note: Розділ 32 згадує про різні типи сторожів. Джерело підтверджує наявність IWDT та TWDT у ESP-IDF.
  sha:
  - 4b2c1726
  - 8bb6d694
  - fb634479
