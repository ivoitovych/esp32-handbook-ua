- nazva: ILI9341 — RGB565 формат пікселя, не ціль контролера
  zbih: ILI9341 уміє 262 тис\. кольорів.*COLMOD \(3Ah\)
  dzherelo: 'ILI Technology, ILI9341 a-Si TFT LCD Single Chip Driver, 240RGBx320 Resolution and 262K color,
    Specification V1.11, розділ 8.2.33 «COLMOD: Pixel Format Set (3Ah)»'
  cytata: '8.2.33. COLMOD: Pixel Format Set (3Ah)


    This command sets the pixel format for the RGB image data used by the

    interface. DPI [2:0] is the pixel format select of RGB interface and

    DBI [2:0] is the pixel format of MCU interface. If a particular interface,

    either RGB interface or MCU interface, is not used then the corresponding

    bits in the parameter are ignored. The pixel format is shown in the table below.


    DPI [2:0]  RGB Interface Format

    1 0 1      16 bits / pixel

    1 1 0      18 bits / pixel


    The ILI9341 supports several pixel formats that can be selected by DPI [2:0]

    bits of "Pixel Format Set (3Ah)".

    '
  sposib: PDF ILI Technology через cdn-shop.adafruit.com; pdftotext -layout, 2026-08-26
  notatka: Розділ 46 розрізняє RGB565 як один із доступних форматів пікселів — це не ціль (стеля) контролера,
    а один із режимів, який можна обрати командою COLMOD (3Ah). ILI9341 підтримує 16-бітний формат RGB565
    з дозвіл 65536 кольорів, але паралельно уміє 18-бітний формат з 262K кольорів. На практиці, бібліотеки
    TFT_eSPI і LovyanGFX типово використовують RGB565 (удвічі менше байтів на піксель — удвічі швидший
    кадр).
