  zbih: ADC дільника · (classic|C3) →|Ключ дільника \(вихід\) · (classic|C3) →|SPI `SCK` / `MOSI` / `MISO`
    · (classic|C3) →|SPI `CS` microSD · (classic|C3) →|Четвірка `18`/`23`/`19`/`5` на classic|ADC_CHANNEL_6   //
    GPIO34 = ADC1_6|ADC_CHANNEL_3   // GPIO3|Лишається рівно вісім безумовно вільних
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/soc/{esp32,esp32c3}/include/soc/adc_channel.h,
    .../components/soc/{esp32,esp32c3}/include/soc/spi_pins.h, .../components/soc/esp32c3/include/soc/soc_caps.h
  cytata: "(esp32/adc_channel.h)          (esp32c3/adc_channel.h)\n#define ADC1_GPIO34_CHANNEL 6  #define\
    \ ADC1_GPIO3_CHANNEL      3\n#define ADC1_CHANNEL_6_GPIO_NUM 34  #define ADC1_CHANNEL_3_GPIO_NUM 3\n\
    \n(esp32/spi_pins.h)             (esp32c3/spi_pins.h)\n#define VSPI_IOMUX_PIN_NUM_CLK  18   #define\
    \ SPI2_IOMUX_PIN_NUM_CLK  6\n#define VSPI_IOMUX_PIN_NUM_MOSI 23   #define SPI2_IOMUX_PIN_NUM_MOSI\
    \ 7\n#define VSPI_IOMUX_PIN_NUM_MISO 19   #define SPI2_IOMUX_PIN_NUM_MISO 2\n#define VSPI_IOMUX_PIN_NUM_CS\
    \    5   #define SPI2_IOMUX_PIN_NUM_CS  10\n#define SPI3_IOMUX_PIN_NUM_CLK  VSPI_IOMUX_PIN_NUM_CLK\n\
    \                                     #define MSPI_IOMUX_PIN_NUM_HD   12\n                       \
    \              #define MSPI_IOMUX_PIN_NUM_WP   13\n                                     #define MSPI_IOMUX_PIN_NUM_CS0\
    \  14\n                                     #define MSPI_IOMUX_PIN_NUM_CLK  15\n                 \
    \                    #define MSPI_IOMUX_PIN_NUM_MOSI 16\n                                     #define\
