- nazva: Таблиця розділів — 0xC00 і 95 записів; 0x7000 належить бутлоадерові
  zbih: не більше 95 записів|максимум \*\*95 записів\*\*|`0xC00`|too large for partition table offset|Простір
    бутлоадера — це проміжок
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/docs/en/api-guides/partition-tables.rst,
    .../docs/en/api-guides/bootloader.rst, .../components/partition_table/Kconfig.projbuild
  cytata: "(partition-tables.rst)\nThe partition table length is 0xC00 bytes, as we allow a maximum of\
    \ 95\nentries. An MD5 checksum, used for checking the integrity of the\npartition table at runtime,\
    \ is appended after the table data. Thus, the\npartition table occupies an entire flash sector, which\
    \ size is 0x1000\n(4 KB). As a result, any partition following it must be at least\nThe partition\
    \ table length is 0xC00 bytes, as we allow a maximum of 95 entries. An MD5 checksum, used for checking\
    \ the integrity of the partition table at runtime, is appended after the table data. Thus, the partition\
    \ table occupies an entire flash sector, which size is 0x1000 (4 KB). As a result, any partition following\
    \ it must be at least located at (:ref:`default offset <CONFIG_PARTITION_TABLE_OFFSET>`) + 0x1000.\n\
    \n(Kconfig.projbuild)\nconfig PARTITION_TABLE_OFFSET\n    hex \"Offset of partition table\"\n    default\
    \ 0x8000\n    help\n        The address of partition table (by default 0x8000).\n        Allows you\
    \ to move the partition table, it gives more space\n        for the bootloader.\n\n(bootloader.rst)\n\
    When using the default :ref:`CONFIG_PARTITION_TABLE_OFFSET` value 0x8000, the size limit is {IDF_TARGET_CONFIG_PARTITION_TABLE_OFFSET}\
    \ bytes.\nsize limit is … bytes.\nIf the bootloader binary is too large, then the bootloader build\
    \ will\nfail with an error \"Bootloader binary size [..] is too large for\npartition table offset\"\
    .\nOptions to work around this are:\n- Set bootloader compiler optimization back to \"Size\" …\n-\
    \ Reduce bootloader log level …\n- Set CONFIG_PARTITION_TABLE_OFFSET to a higher value than 0x8000\
    \ …\n- Set :ref:`CONFIG_PARTITION_TABLE_OFFSET` to a higher value than 0x8000, to place the partition\
    \ table later in the flash. This increases the space available for the bootloader. If the :doc:`partition\
    \ table </api-guides/partition-tables>` CSV file contains explicit partition offsets, they will need\
    \ changing so no partition has an offset lower than ``CONFIG_PARTITION_TABLE_OFFSET + 0x1000``. (This\
    \ includes the default partition CSV files supplied with ESP-IDF.)\n  + 0x1000.\n"
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Друга хибна причина, і цього разу вона мешкала в `docs/fakty.md`: «типовий ліміт розміру самої
    таблиці — `0x7000` (28 672 байти)».

    `0x7000` до таблиці не має стосунку. Це `0x8000 − 0x1000` — простір, який лишається **бутлоадерові**
    на classic. Власна довжина таблиці — `0xC00`, тобто 95 записів плюс MD5, і навіть вона займає цілий
    сектор лише тому, що флеш стирається секторами.

    Плутанина не безневинна: з неї випливає, ніби в таблицю влізає приблизно 900 розділів, і ніби вправа
    «зробити більше розділів» — безкоштовна. Насправді ліміт 95, а `0x7000` вичерпується не розділами,
    а Secure Boot і рівнем логу бутлоадера.

    Виправлено; обидва хибні формулювання заведено в реєстр спростованого і випробувано впровадженням
    у розділ 04 — знаходяться одразу.

    Заразом додано в книгу три речі, яких не було ніде: ліміт 95 записів (розділ 18), скінченність простору
    бутлоадера з дослівним рядком помилки збірання і ліками в порядку дешевизни (розділ 16), і асиметрія
    «зсув бутлоадера задає ROM, зсув таблиці — звичайний параметр» (розділ 16). Остання практично важлива:
    саме зсувом таблиці лікують нестачу місця під бутлоадер.'
  title: Таблиця розділів — 0xC00 і 95 записів; 0x7000 належить бутлоадерові
