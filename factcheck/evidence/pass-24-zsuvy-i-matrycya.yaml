- nazva: Зсув бутлоадера по сімействах — числа праві, причина хибна
  zbih: ESP32 classic, ESP32-S2 \| `0x1000`|ESP32-S3, C3, C6, H2 \| `0x0`|ESP32-P4, C5, H4 \| `0x2000`|Secure
    Boot v1\*\*; коли secure boot|менеджерові ключів апаратного шифрування
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/bootloader/Kconfig.projbuild
    та .../docs/en/api-guides/startup.rst; https://raw.githubusercontent.com/espressif/esptool/master/esptool/targets/esp32*.py
  cytata: "(Kconfig.projbuild)\nconfig BOOTLOADER_OFFSET_IN_FLASH\n    hex\n    default 0x1000 if IDF_TARGET_ESP32\
    \ || IDF_TARGET_ESP32S2\n    # the first 2 sectors are reserved for the key manager with AES-XTS\n\
    \    #   (flash encryption) purpose\n    default 0x2000 if IDF_TARGET_ESP32P4 || IDF_TARGET_ESP32C5\
    \ || IDF_TARGET_ESP32H4\n    default 0x0\n    help\n        Offset address that 2nd bootloader will\
    \ be flashed to.\n        The value is determined by the ROM bootloader.\n        It's not configurable\
    \ in ESP-IDF.\n\n(startup.rst)\n.. only:: esp32\n   … If :doc:`/security/secure-boot-v1` is in use\
    \ then the first 4 kB\n   sector of flash is used to store secure boot IV and digest of the\n   bootloader\
    \ image. Otherwise, this sector is unused.\n.. only:: esp32s2\n   … The 4 kB sector of flash before\
    \ this address is unused.\n.. only:: SOC_KEY_MANAGER_SUPPORTED\n   … The 8 kB sector of flash before\
    \ this address is reserved for the\n   key manager for use with flash encryption (AES-XTS).\n\n(esptool/targets/)\n\
    esp32.py:   BOOTLOADER_FLASH_OFFSET = 0x1000\nesp32s3.py: BOOTLOADER_FLASH_OFFSET = 0x0\nesp32c3.py:\
    \ BOOTLOADER_FLASH_OFFSET = 0x0\nesp32c6.py: BOOTLOADER_FLASH_OFFSET = 0x0\nesp32p4.py: BOOTLOADER_FLASH_OFFSET\
    \ = 0x2000  # First 2 sectors reserved for FE\nesp32c5.py: BOOTLOADER_FLASH_OFFSET = 0x2000\nesp32h4.py:\
    \ BOOTLOADER_FLASH_OFFSET = 0x2000\n(S2 успадковує 0x1000 від ESP32ROM; H2 — 0x0 від ESP32C6ROM;\n\
    \ C2 — 0x0 від ESP32C3ROM)\n"
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Три рядки таблиці зсувів звірено з двох незалежних боків — Kconfig ESP-IDF і розбір цілей
    esptool — і збіг дослівний, включно з успадкуванням для S2, H2 і C2. Твердження книги «значення задає
    ROM і в ESP-IDF не налаштовується» теж дослівне: воно є в довідці Kconfig.

    Хибною виявилася **причина**. Книга писала: «у classic і S2 проміжок від `0x0` до `0x1000` зарезервовано
    під потреби ROM». ROM-бутлоадер живе в кремнії й у флеші не займає нічого. Насправді на classic цей
    сектор належить IV і дайджестові Secure Boot v1 — а без secure boot просто не використовується; на
    S2 не використовується завжди.

    Виправлено у двох місцях (розділ 16 і `docs/fakty.md`), і формулювання заведено в `factcheck/SPROSTOVANE.md`.
    Заразом таблиця в `docs/fakty.md` була **неповна** — у ній бракувало рядка `0x2000` для P4, C5 і H4,
    який у розділі 16 є з проходу 6.'
