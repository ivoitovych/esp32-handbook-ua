- nazva: Матриця GPIO і SPI — 40 проти 80 МГц, і коли різниці немає
  zbih: межа — 80 МГц|межа 40 МГц замість 80|На 40 МГц і нижче різниці немає|достатньо однієї лінії поза\s*\n?рідними
    пінами|обмежений 40 МГц замість 80
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/docs/en/api-reference/peripherals/spi_master.rst
  cytata: "Most of ESP32's peripheral signals have a direct connection to their\ndedicated IO_MUX pins.\
    \ However, the signals can also be routed to any\nother available pins using the less direct GPIO\
    \ matrix. If at least one\nsignal is routed through the GPIO matrix, then all signals will be\nrouted\
    \ through it.\n\nThe GPIO matrix introduces flexibility of routing but also brings the\nfollowing\
    \ disadvantages:\n- Allows signals with clock frequencies only up to 40 MHz, as opposed\n  to 80 MHz\
    \ if IO_MUX pins are used.\n\nWhen an SPI Host is set to 40 MHz or lower frequencies, routing SPI\n\
    pins via the GPIO matrix will behave the same compared to routing them\nvia IOMUX.\n\n{IDF_TARGET_SPI2_IOMUX_PIN_MISO:\
    \ … esp32c3=\"2\" …}\n{IDF_TARGET_SPI2_IOMUX_PIN_CS:   … esp32c3=\"10\" …}\n"
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Книга писала «через матрицю межа знижується приблизно вдвічі». Число правильне (40 проти 80),
    але слово «приблизно» ховало те, що читачеві потрібне найбільше: **нижче 40 МГц різниці немає жодної**.

    Різниця між двома формулюваннями практична. Перше змушує підбирати рідні піни завжди — і платити за
    це розведенням плати. Друге каже прямо: для microSD, дисплеїв і датчиків, тобто для майже всього в
    цій книзі, питання рідних пінів не стоїть узагалі.

    Додано й правило «все або нічого»: досить однієї лінії поза рідними пінами, щоб через матрицю пішли
    всі. Проміжного стану немає, і «майже рідний» набір дає ту саму межу, що й довільний. Без цього читач
    природно вирішує, що виграє потроху за кожен рідний пін.

    Виправлено в розділах 36 (двічі: виклад і підсумок) і 04. Заразом підстановки документації підтвердили
    рідні піни C3 з другого боку: `MISO` = `GPIO2`, `CS` = `GPIO10` — те саме, що в `spi_pins.h`.'
