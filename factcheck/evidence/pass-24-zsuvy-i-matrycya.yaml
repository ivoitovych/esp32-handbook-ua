- nazva: JTAG-піни classic — усі чотири з таблиці IOMUX
  zbih: TMS \| `GPIO14`|TDI \| `GPIO12`|TCK \| `GPIO13`|TDO \| `GPIO15`
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/soc/esp32/register/soc/io_mux_reg.h
  cytata: '#define PERIPHS_IO_MUX_MTDI_U             (DR_REG_IO_MUX_BASE +0x34)

    #define IO_MUX_GPIO12_REG                    PERIPHS_IO_MUX_MTDI_U

    #define PERIPHS_IO_MUX_MTCK_U             (DR_REG_IO_MUX_BASE +0x38)

    #define IO_MUX_GPIO13_REG                    PERIPHS_IO_MUX_MTCK_U

    #define PERIPHS_IO_MUX_MTMS_U             (DR_REG_IO_MUX_BASE +0x30)

    #define IO_MUX_GPIO14_REG                    PERIPHS_IO_MUX_MTMS_U

    #define PERIPHS_IO_MUX_MTDO_U             (DR_REG_IO_MUX_BASE +0x3c)

    #define IO_MUX_GPIO15_REG                    PERIPHS_IO_MUX_MTDO_U

    #define FUNC_MTDI_MTDI                              0

    '
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Прохід 20 закрив два піни з чотирьох і два свідомо відправив у наряд, бо йшов від документації,
    де таблиця JTAG-пінів підставляється директивою і в сирому `.rst` не читається.

    Тут узято інше джерело, і воно однозначніше: у самому заголовку IOMUX ім''я регістра **є** іменем
    сигналу JTAG. `IO_MUX_GPIO12_REG` дорівнює `PERIPHS_IO_MUX_MTDI_U` — тобто GPIO12 і MTDI це один і
    той самий вивід, а `FUNC_MTDI_MTDI = 0` каже, що JTAG — функція нуль, тобто типова після скидання.

    Усі чотири рядки таблиці розділу 27 звірено: TMS `GPIO14`, TDI `GPIO12`, TCK `GPIO13`, TDO `GPIO15`.
    Розбіжностей немає. Два пункти наряду проходу 20 закрито.'
