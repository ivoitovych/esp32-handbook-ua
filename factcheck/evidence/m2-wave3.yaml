  method: factcheck/tools/layer3.py tekst_dzherela (відновлення рядків таблиці за координатами слів), 2026-08-27
  note: 'Взірець перебудовано 2026-08-27 під нове формулювання книги: М1 переписав рядок після зовнішньої рецензії, і старий взірець відірвався — саме так, як задумано. Цитата подає рядок tERR цілком, як він відновлюється за координатами слів: СХІДЦІВ ДВА, не три. У ревізії Maxim REV 042208 немає ані «−30», ані «±1» — перевірено пошуком по всьому документу. Отже рецензентове прочитання про три східці цей документ не підтверджує, і початкове «до 4 °C» для окропу було праве: 100 °C накриває рядок −55…+125 з ±2, два справні датчики можуть стояти на протилежних краях. Чи додали східець у пізнішій ревізії — звідси не встановити, analog.com блокує наш діапазон адрес. | Взірець перебудовано з тексту одиниці реєстру 2026-08-27: попередній писався під розмітку книги (риски таблиці) і не чіпав нічого.'
