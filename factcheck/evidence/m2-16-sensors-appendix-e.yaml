- nazva: MPU6050 — акселерометр і гіроскоп на одному кристалі
  zbih: MPU6050 · Що дає → акселерометр, гіроскоп
  dzherelo: TDK InvenSense, MPU-6000/MPU-6050 Register Map and Descriptions, Revision 4.0 (RM-MPU-6000A-00),
    розділ 2 «Purpose and Scope»
  cytata: '2   Purpose and Scope

    This document provides preliminary information regarding the register map and descriptions for the
    Motion

    Processing Units™ MPU-6000™ and MPU-6050™, collectively called the MPU-60X0™ or MPU™.

    The MPU devices provide the world''s first integrated 6-axis motion processor solution that eliminates
    the

    package-level gyroscope and accelerometer cross-axis misalignment associated with discrete solutions.
    The

    devices combine a 3-axis gyroscope and a 3-axis accelerometer on the same silicon die together with
    an

    onboard Digital Motion Processor™ (DMP™) capable of processing complex 9-axis sensor fusion algorithms

    using the field-proven and proprietary MotionFusion™ engine.

    '
  sposib: PDF TDK InvenSense (мзеркало cdn.sparkfun.com, оригінальний домен invensense.tdk.com віддає
    404 на всі перевірені шляхи документа), кеш `mpu6050.pdf`, реєстр `factcheck/DZHERELA-m2.md`, pdftotext
    -layout, 2026-08-26
  notatka: '«Акселерометр, гіроскоп» — точний опис: документ прямо називає MPU-6050 6-осьовим (3-осьовий
    гіроскоп + 3-осьовий акселерометр на одному кристалі). Побічне, вартого уваги: той самий абзац пояснює,
    чим MPU-6050 відрізняється від MPU-6000 — MPU-6050 має лише I²C, а MPU-6000 додає ще й SPI. Це узгоджено
    з тим, що книга ставить MPU6050 лише в I²C-таблицю додатка E, а не в SPI-таблицю поруч — рядка книга
    не помиляється, хоча цієї деталі й не проговорює.'
  title: MPU6050 — акселерометр і гіроскоп на одному кристалі
  match: MPU6050 · Що дає → акселерометр, гіроскоп
  status: verbatim
  source: TDK InvenSense, MPU-6000/MPU-6050 Register Map and Descriptions, Revision 4.0 (RM-MPU-6000A-00),
    розділ 2 «Purpose and Scope»
  quote: '2   Purpose and Scope

    This document provides preliminary information regarding the register map and descriptions for the
    Motion

    Processing Units™ MPU-6000™ and MPU-6050™, collectively called the MPU-60X0™ or MPU™.

    The MPU devices provide the world''s first integrated 6-axis motion processor solution that eliminates
