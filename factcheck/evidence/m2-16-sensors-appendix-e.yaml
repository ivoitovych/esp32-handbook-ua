- nazva: SHT3x / SHT4x — точна вологість, ±1–1.5 %RH
  zbih: SHT3x / SHT4x · Що дає → точна вологість
  dzherelo: Sensirion, Datasheet SHT3x-DIS (Humidity and Temperature Sensor) і Datasheet SHT4x (4th Gen.
    Relative Humidity and Temperature Sensor), розділи «Key features»/«Highlights» на титульній сторінці
    кожного
  cytata: "(SHT3x-DIS)\nDatasheet SHT3x-DIS\nHumidity and Temperature Sensor\n▪ Typical accuracy of ±1.5\
    \ %RH and ±0.1 °C for\n  SHT35\n\n(SHT4x)\nDatasheet – SHT4x\n4th Gen. Relative Humidity and Temperature\
    \ Sensor\nHighlights\n• Accuracies ΔRH = ±1.0 %RH, ΔT = ±0.1 °C\n"
  sposib: PDF Sensirion, кеш `sht3x.pdf` і `sht4x.pdf`, реєстр `factcheck/DZHERELA-m2.md`, pdftotext -layout,
    2026-08-26. У витягу з `sht3x.pdf` символ «±» pdftotext віддає як приватний гліф шрифту (байти `ef
    82 b1`, невидимі в терміналі) — відновлено як «±» після звірки з рештою документа, де той самий символ
    у слові «ΔT»/градусах передається коректно.
  notatka: '«Точна вологість» підтверджено дослівно числами точності — це не маркетингове прикметникове
    слово, а конкретний допуск: ±1.5 %RH у топовій лінійці SHT3x (SHT35) і ±1.0 %RH у SHT4x. Для контексту
    (не змінює висновок, книга цього рядка не деталізує): SHT4x у таблиці «Device Overview» власного datasheet
    показує третю можливу I²C-адресу `0x46` на додачу до `0x44`/`0x45`, які вже підтверджені класом A
    в pass-16-interfeysy — рядок книги називає лише дві з трьох, але це найпоширеніший варіант (SHT40-xD1B),
    тож не помилка, а неповнота, вартого уваги наступного проходу з адресами.'
