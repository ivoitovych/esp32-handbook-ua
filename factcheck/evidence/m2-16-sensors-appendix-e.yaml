- nazva: SHT3x / SHT4x — колонка «Бібліотека» це стан репозиторію, не факт про мікросхему
  zbih: SHT3x / SHT4x · Бібліотека → Sensirion
  dzherelo: —
  cytata: —
  sposib: Немає зовнішнього джерела для перевірки — назва «Sensirion» тут це вказівка «шукай офіційну
    бібліотеку виробника», а не характеристика самої мікросхеми. Datasheet SHT3x/SHT4x про існування чи
    назву бібліотеки для Arduino/ESP-IDF не пише і писати не повинен.
  notatka: 'Той самий випадок, що й «Бібліотека IDE» для інших рядків додатка E і «Ціна плати Arduino
    Uno» в m2-10: клас C (недосяжне джерело) тут невірний, бо джерело не недосяжне — воно просто не про
    це. Клас E, редакційна вказівка, а не факт із datasheet.'
