- nazva: BME280 — старший байт dig_H4 і dig_H5 знаковий
  zbih: старший байт H4 і H5 знаковий|розширення знака обов|int16_t\)\(int8_t\)h\[|Два зсуви
    в розборі калібрування
  dzherelo: https://raw.githubusercontent.com/boschsensortec/BME280_SensorAPI/master/bme280.c
  cytata: 'calib_data->dig_h2 = (int16_t)BME280_CONCAT_BYTES(reg_data[1], reg_data[0]);

    calib_data->dig_h3 = reg_data[2];

    dig_h4_msb = (int16_t)(int8_t)reg_data[3] * 16;

    dig_h4_lsb = (int16_t)(reg_data[4] & 0x0F);

    calib_data->dig_h4 = dig_h4_msb | dig_h4_lsb;

    dig_h5_msb = (int16_t)(int8_t)reg_data[5] * 16;

    dig_h5_lsb = (int16_t)(reg_data[4] >> 4);

    calib_data->dig_h5 = dig_h5_msb | dig_h5_lsb;

    calib_data->dig_h6 = (int8_t)reg_data[6];

    '
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Знахідка проходу, і вона в коді. Книга розбирала калібрування як `H4 = (h[3] <<
    4) | (h[4] & 0x0F)`, тобто **без розширення знака** старшого байта. Bosch явно приводить
    його до `int8_t` перед множенням: `dig_H4` і `dig_H5` — знакові величини. Розбіжність
    проявляється лише на екземплярах, де в старшому байті виставлено сьомий біт, і виглядає
    як стабільно неправильна вологість при правильних температурі й тиску — тобто як несправний
    датчик. Виправлено в проєкті 59, додано блок уваги з поясненням, чому два однакові на
    вигляд зсуви різні.'
