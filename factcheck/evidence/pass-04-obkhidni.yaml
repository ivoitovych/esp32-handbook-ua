# Прохід 4 — обхідні шляхи до недосяжних джерел.
#
# Ідея проходу: datasheet із домену виробника не дістається, але сам
# виробник часто публікує **той самий факт** у відкритому репозиторії —
# як референсний драйвер, як заголовок із константами, як SDK. Це
# першоджерело того самого автора, отримане й процитоване, отже клас A
# або B, а не C.
#
# Прохід перевів у клас B п'ять груп, які прохід 3 записав у наряд, і дав
# дві знахідки — одну в коді проєкту 59.









# ⚠ ВЗІРЕЦЬ БУВ ШИРОКИЙ — звужено в проході 37 за знахідкою М2 16:39Z.
#
# Було: `RP2040|264 КБ`. Альтернатива `RP2040` збігалася з **кожною**
# коміркою колонки RP2040 порівняльної таблиці — і позначала класом B
# наявність радіо, операційну систему, час старту, споживання уві сні й
# **ціну плати**, на підставі заголовка з адресами пам'яті.
#
# Дев'ять одиниць, які реєстр вважав закритими, у жодній черзі не були.
# Це рівно та вада, яку прохід 22 назвав головною: широкий взірець
# небезпечніший за відсутній, бо відсутній лишає одиницю в роботі.
#
# Тепер `sketch` друкує число збігів кожної альтернативи окремо
# (`⚠ альтернатив без жодного збігу` і перелік широких у `-v`), тож
# наступний такий випадок видно без чужих очей.





























































