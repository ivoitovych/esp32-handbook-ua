- nazva: RP2040 — обсяг SRAM 264 КБ
  zbih: RAM · RP2040 → 264 КБ|264 КБ
  dzherelo: https://raw.githubusercontent.com/raspberrypi/pico-sdk/master/src/rp2040/hardware_regs/include/hardware/regs/addressmap.h
  cytata: '#define SRAM_BASE _u(0x20000000)

    #define SRAM_STRIPED_BASE _u(0x20000000)

    #define SRAM_STRIPED_END _u(0x20040000)

    #define SRAM4_BASE _u(0x20040000)

    '
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: '0x20040000 − 0x20000000 = 0x40000 = 256 КБ основної смугованої пам''яті, плюс
    два окремі банки SRAM4 і SRAM5 по 4 КБ — разом 264 КБ, як у порівняльній таблиці розділу
    01.

    Окремо зафіксовано розбіжність, яка **не є** помилкою книги: SDK задає типову системну
    частоту 125 МГц (`SYS_CLK_HZ … default=125000000`), тоді як таблиця наводить 133 МГц —
    гранично специфіковану. Це узгоджено з тим, як у тій самій таблиці подано ESP32 (160–240
    МГц, теж межа). Підтвердження самої межі 133 МГц потребує datasheet RP2040 і лишається
    в наряді.'
