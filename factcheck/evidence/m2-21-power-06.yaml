- nazva: «USB-роз'єм... стабілізатор... 3.3 В» — топологія плати розробки, не факт із datasheet кристала
  zbih: 5 В іде на бортовий стабілізатор, той робить 3\.3 В
  dzherelo: —
  cytata: —
  sposib: Немає одного документа, що описує саме таку схему для «плати розробки» узагалі — це узагальнення
    поширеної топології (USB → бортовий LDO → 3.3 В), а не характеристика ESP32 чи модуля ESP32-WROOM-32E.
    Сам кристал і сам модуль до USB-роз'єму й бортового стабілізатора взагалі не мають відношення — це
    рівень конкретної плати розробки, яких безліч і всі різні.
  notatka: 'Цифри `5 В` і `3.3 В` тут — не вимірна характеристика датшита, а елемент типової схеми, яку
    книга описує як практику. Класифіковано механічно за правилом E було б неможливо (є цифри), але за
    змістом це редакційний опис поширеної топології, а не твердження, яке перевіряється конкретним джерелом.


    НЕ ТВЕРДЖЕННЯ: структура тексту (заголовок, рамка, перелік). Клас `E` правильний, але міряє дрібність
    витягача, а не книгу. | Переглянуто 2026-08-27 у розборі 36 надмірних E. Клас E правильний: твердження
    про прийом проєктування, кількість у переліку матеріалів або власне вимірювання проєкту — конкретної
    деталі чи стандарту не названо, отже документа, який відповів би, не існує. Число в назві є, але воно
    номінал у пораді, а не величина з паспорта.'
