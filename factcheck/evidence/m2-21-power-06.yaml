  zbih: Подати 5 В на пін `3V3` означає подати їх напряму в чип, минаючи\s+стабілізатор
  dzherelo: esp32-wroom-32e.pdf — ESP32-WROOM-32E & WROOM-32UE Datasheet v2.1, Table 3 «Pin Definitions»
    (с. 11) і Table 14 «Recommended Operating Conditions» (с. 28)
  cytata: 'Table 3: Pin Definitions

    Name   No.   Type   Function

    GND     1     P     Ground

    3V3     2     P     Power supply


    Table 14: Recommended Operating Conditions

    Symbol   Parameter                Min   Typ   Max   Unit

    VDD33    Power supply voltage     3.0   3.3   3.6    V

    '
  sposib: PDF з кешу `esp32-wroom-32e.pdf`, pdftotext -layout, 2026-08-26
  notatka: 'Датшит модуля не описує жодного стабілізатора всередині самого ESP32-WROOM-32E: пін 2, підписаний
    `3V3`, прямо названо «Power supply» і нормовано як `VDD33` — та сама напруга живлення кристала (Table
    14). Отже подане на плату-розробки пін `3V3` **не проходить через жоден внутрішній регулятор модуля**
    — воно є напругою `VDD33`. Книжкове «напряму в чип, минаючи стабілізатор» звідси випливає однозначно,
    хоча дослівно в датшиті так не написано (тому клас B, не A). Це той самий висновок, що потрібен і
    картці про пастку `5V`/`3V3` на гребінці.'
