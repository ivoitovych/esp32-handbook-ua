  sposib: 'Клас `C`, а **не** `A`, і це принципово. Дослівний рядок паспорта здобув М2 і навів
    у себе; я його лише прочитав у їхньому записі. Власну спробу зробив: `cdn-shop.adafruit.com`
    із цієї мережі не відповідає взагалі, `analog.com` закритий політикою егресу.

    Клас `A` означає «першоджерело отримано **в цій сесії** й процитовано дослівно». Поставити
    його тут означало б записати чужу роботу як свою — той самий дефект, який ми ловимо в
    помічників, і рівно та помилка, за яку в цьому реєстрі вже виправлено `pass-31` і `pass-17`.
    Цитату тому й не наводжу: за правилом класу `C` її не наводять.'
  notatka: '**Виправлено 2026-08-27 після зовнішньої рецензії, і це другий захід на те саме
    місце.**

    Перша редакція цього запису казала, що паспорт має **два** рядки: ±0.5 °C у −10…+85 °C
    і ±2 °C поза ним, — і книга виводила з цього «до 4 °C між двома справними в окропі».

    Рецензент вказав, що рядків **три**: −10…+85 °C ±0.5, −30…+100 °C ±1, −55…+125 °C ±2.
    Тоді при 100 °C граничне розходження двох справних — 2 °C, а не 4.

    Джерело, з якого я брав, — цитата М2 у `m2-04-ds18b20` — містить **два** рядки з трьох.
    Чи це вибірковий витяг, чи `pdftotext` загубив середній рядок, звідси не встановити: `analog.com`,
    `cdn-shop.adafruit.com` і `datasheets.maximintegrated.com` дають цій мережі `000`.

    **Тому книгу переписано так, щоб вона не залежала від спірного рядка.** Обидва прочитання
    збігаються в одному: у вузькому діапазоні ±0.5 °C, отже до 1 °C між двома справними, і
    міряти треба біля кімнатної температури. Число «4 °C» прибрано; конкретні східці поза
    вузьким діапазоном не називаються взагалі.

    Урок, який тут дорожчий за саме число: **виправлення — це теж твердження, і воно потребує
    того самого класу доказу, що й початкове.** Я взяв чужий витяг за повну таблицю й не перевірив,
    чи він повний.

    `tERR` — похибка **вимірювання одним приладом** відносно істини. Два прилади, кожен зі
    своєю незалежною похибкою, у робочому діапазоні можуть законно розійтися на суму — до
    1 °C. Поза діапазоном −10…+85 °C допуск ширший; на скільки саме — залежить від того, скільки
    в таблиці східців, і це відкрите питання вище.

    Звідси й друга половина виправлення: сто градусів лежать **поза** вузьким діапазоном,
    тому перевірка в окропі — найгірший можливий вибір умов. Книга радила саме склянку води,
    не уточнюючи яку.'
