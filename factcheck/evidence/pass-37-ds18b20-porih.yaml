# Прохід 37 — поріг відбраковування DS18B20.
#
# Знахідка М2, підтверджена їхнім же доказом `m2-04-ds18b20`, у якому
# дослівно наведено рядок паспорта. Книга при цьому лишалася невиправленою
# до цього проходу: знахідку надіслали, а текст не змінили — рівно той
# випадок, проти якого заведено `factcheck/SPROSTOVANE.md`.
#
# Суть помилки не в числі, а в тому, **чим воно є**. ±0.5 °C — похибка
# одного датчика, а книга вживала її як допустиму розбіжність **між
# двома**. Похибки незалежні, тож поріг занижений удвічі в робочому
# діапазоні й увосьмеро в окропі.
#
# Це шостий випадок того самого взірця за добу: число праве, а те, чим
# воно є, — ні. Взірець сформульовано в проході 24 і підтверджено М2.









