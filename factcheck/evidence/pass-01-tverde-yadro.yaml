# Прохід 1 — тверде ядро.
#
# Твердження, у яких помилка коштує плати, і для яких першоджерело
# ДІСТАЄТЬСЯ з цього середовища: дерево ESP-IDF на raw.githubusercontent.
# Тому переважна частина проходу — клас A: витяг отримано й процитовано.
#
# Формат опису — factcheck/SCHEMA.md. Прив'язка: `sha` (точний хеш тексту)
# або `zbih` (взірець на всі входження твердження в книзі).
#
# Правило, яке тут дотримано без винятків: у полі `cytata` стоїть лише те,
# що справді витягнуто в цій сесії командою, зазначеною в `sposib`.
























































































- nazva: Адреса другого бутлоадера задається ROM і має три значення
  zbih: бутлоадер.{0,40}(лежить за адресою|іде не на)|BOOTLOADER_OFFSET_IN_FLASH|«що новіше,
    то ближче до нуля»
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/bootloader/Kconfig.projbuild
  cytata: "config BOOTLOADER_OFFSET_IN_FLASH\n    hex\n    default 0x1000 if IDF_TARGET_ESP32\
    \ || IDF_TARGET_ESP32S2\n    # the first 2 sectors are reserved for the key manager with\
    \ AES-XTS (flash encryption) purpose\n    default 0x2000 if IDF_TARGET_ESP32P4 || IDF_TARGET_ESP32C5\
    \ || IDF_TARGET_ESP32H4\n    default 0x0\n    help\n        Offset address that 2nd bootloader\
    \ will be flashed to.\n        The value is determined by the ROM bootloader.\n      \
    \  It's not configurable in ESP-IDF.\n"
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Знахідка проходу. Перша редакція давала двовипадкове правило «classic і S2 → 0x1000,
    S3, C3 і новіші → 0x0». Третій випадок (P4, C5, H4 → 0x2000) робив формулювання «і новіші»
    хибним, причому саме для тих чипів, які найновіші. Виправлено в розділах 16, 17, 21, 29,
    картках К5 і К10, додатку C. Довідка Kconfig дала й формулювання для правила: значення
    визначає ROM, воно не налаштовується.'
