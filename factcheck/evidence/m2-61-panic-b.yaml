- nazva: 'T-D-183: rst: у першому рядку RTC Watchdog Timeout'
  zbih: \*\*`rst:` у першому рядку\.\*\*
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/master/docs/en/api-guides/fatal-errors.rst
    — ESP-IDF fatal-errors.rst, секція «RTC Watchdog Timeout»
  cytata: "The RTC watchdog is used in the startup code to keep track of execution time and\
    \ it also helps to prevent a lock-up caused by an unstable power source. It is enabled\
    \ by default (see :menuitem:`CONFIG_BOOTLOADER_WDT_ENABLE`). If the execution time is\
    \ exceeded, the RTC watchdog will restart the system. In this case, the first stage (ROM)\
    \ bootloader will print a message with the ``RTC Watchdog Timeout`` reason for the reboot.\n\
    \n.. code-block:: none\n\n    rst:0x10 ({IDF_TARGET_RTCWDT_RTC_RESET})\n"
  sposib: curl -sL -o /tmp/fatal.rst https://raw.githubusercontent.com/espressif/esp-idf/master/docs/en/api-guides/fatal-errors.rst
    — sed -n '300,313p'
  notatka: RTC Watchdog дає повідомлення виду "rst:0x10" у першому рядку log output від ROM
    bootloader. Це сигнал, що система перезавантажилась через timeout.
  title: 'T-D-183: rst: у першому рядку RTC Watchdog Timeout'
  match: \*\*`rst:` у першому рядку\.\*\*
  status: verbatim
  source: https://raw.githubusercontent.com/espressif/esp-idf/master/docs/en/api-guides/fatal-errors.rst
    — ESP-IDF fatal-errors.rst, секція «RTC Watchdog Timeout»
  quote: "The RTC watchdog is used in the startup code to keep track of execution time and\
    \ it also helps to prevent a lock-up caused by an unstable power source. It is enabled\
    \ by default (see :menuitem:`CONFIG_BOOTLOADER_WDT_ENABLE`). If the execution time is\
    \ exceeded, the RTC watchdog will restart the system. In this case, the first stage (ROM)\
    \ bootloader will print a message with the ``RTC Watchdog Timeout`` reason for the reboot.\n\
    \n.. code-block:: none\n\n    rst:0x10 ({IDF_TARGET_RTCWDT_RTC_RESET})\n"
  method: curl -sL -o /tmp/fatal.rst https://raw.githubusercontent.com/espressif/esp-idf/master/docs/en/api-guides/fatal-errors.rst
    — sed -n '300,313p'
  note: RTC Watchdog дає повідомлення виду "rst:0x10" у першому рядку log output від ROM bootloader.
    Це сигнал, що система перезавантажилась через timeout.
- nazva: 'T-D-184: Причина паніки і EXCVADDR'
  zbih: \*\*Причина паніки і `EXCVADDR`\.\*\*
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/master/docs/en/api-guides/fatal-errors.rst
    — ESP-IDF fatal-errors.rst, секція «LoadProhibited, StoreProhibited»
  cytata: 'If this address is zero, it usually means that the application has attempted to
    dereference a NULL pointer. If this address is close to zero, it usually means that the
    application has attempted to access a member of a structure, but the pointer to the structure
    is NULL. If this address is something else (garbage value, not in ``0x3fxxxxxx`` - ``0x6xxxxxxx``
    range), it likely means that the pointer used to access the data is either not initialized
    or has been corrupted.

    '
  sposib: curl -sL -o /tmp/fatal.rst https://raw.githubusercontent.com/espressif/esp-idf/master/docs/en/api-guides/fatal-errors.rst
    — sed -n '353,365p'
