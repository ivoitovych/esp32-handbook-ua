- nazva: 'I²C помилка: SCL розтягнутий, SDA чекає → clock stretching'
  zbih: clock stretching|SCL розтягнут|не встигає
  dzherelo: I²C протокол (UM10204) дозволяє ведених затримувати тактування утримуючи SCL в
    LOW
  cytata: 'Clock Stretching — це допоміжна функція I²C:

    - Ведений утримує SCL в LOW, щоб повідомити головному: "Почекай, я не встигаю"

    - Головний жде, доки ведений не відпустить SCL

    - Передача продовжується нормально


    На аналізаторі видно: SCL розтягнутий (тривалий LOW період),

    а після відпускання передача продовжується нормально.

    '
  sposib: I²C spec (i2c-um10204.pdf), Section 3.1.3, 2026-08-26
  notatka: Це валідна поведінка протоколу. Означає, що ведений занадто повільний або перевантажений.
    Обично не має помилки, але потребує оптимізації.
