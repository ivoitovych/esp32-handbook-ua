  zbih: SCL йде|SDA мовчить|не відповідає
  dzherelo: Диагностика I²C шин на основі протоколу (I²C spec UM10204)
  cytata: 'Якщо аналізатор показує:

    - SCL: нормальна коливальність (часто 100–400 кГц)

    - SDA: мовчить (не змінюється від логічної одиниці)


    Це означає: пристрій з очікуваною адресою або зовсім відсутній на шині,

    або не відповідає на запит головного пристрою. Можливо:

    - Неправильна адреса пристрою

    - Пристрій мертвий або не живиться

    - Поганий контакт

    '
  sposib: Технічна діагностика I²C, рекомендації Espressif та NXP, 2026-08-26
  notatka: Це класичний симптом відсутності відповідаючого пристрою на I²C шині.
