# Прохід 41 — littlefs і зникнення живлення посеред запису.
#
# Знахідка суцільного проходу, і повчальна не тим, що знайшла, а тим,
# **як** її довелося читати.
#
# Помічник позначив одиницю `sperechayetsya`: мовляв, littlefs обіцяє
# «fall back to the last known good state», отже твердження книги
# («жодна ФС не гарантує збереження останнього записаного файлу»)
# хибне.
#
# Прочитано навпаки. Відкат до **попереднього** справного стану — це і
# є втрата останнього запису; littlefs обіцяє цілісність, а не
# збереження. Тобто цитата книгу підпирає, а не спростовує.
#
# Два висновки, обидва варті запису:
#
# 1. **Вердикт помічника — здогад про напрям, не про факт.** Другий
#    шар (чи справді витяг підтримує твердження) лишається за
#    супровідником, і тут він перевернув вердикт на протилежний.
# 2. Цитата помічника була **переказом** («reverting to the last known
#    good state if interrupted»), а не рядком документа. На третьому
#    шарі вона б загинула. Справжній рядок знайшовся нижче в тому ж
#    файлі й виявився прямішим за той, що навів помічник.

