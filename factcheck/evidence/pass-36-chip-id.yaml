- nazva: Сімейство, ревізію, кристал і MAC друкує преамбула з'єднання
  zbih: преамбула з.єднання|Chip type:\s+ESP32-D0WD-V3|шапк[ауи] з.єднання|шапка `esptool`|друкує
    шапку з тим, що знайшов
  dzherelo: https://raw.githubusercontent.com/espressif/esptool/master/esptool/__init__.py
  cytata: "# 2) Print the chip info\n...\nelse:\n    log.print(f\"{'Chip type:':<20}{esp.get_chip_description()}\"\
    )\n    log.print(f\"{'Features:':<20}{', '.join(esp.get_chip_features())}\")\n    log.print(f\"\
    {'Crystal frequency:':<20}{esp.get_crystal_freq()}MHz\")\n    usb_mode = esp.get_usb_mode()\n\
    \    if usb_mode is not None:\n        log.print(f\"{'USB mode:':<20}{usb_mode}\")\n \
    \   read_mac(esp)\n"
  sposib: curl raw.githubusercontent, перевірено М1, 2026-08-26
  notatka: 'Цей блок виконується **до** виклику підкоманди й не залежить від того, яка вона.
    Тому будь-яка команда, що взагалі під''єдналася, уже назвала сімейство, ревізію, частоту
    кристала й MAC.

    Практичний наслідок для книги виявився ширшим за виправлення: правило «перша команда для
    незнайомої плати» тепер `flash-id` не тому, що вона краще ідентифікує чип, а тому, що
    вона додає до безкоштовної шапки те єдине, чого в шапці немає, — обсяг флешу.

    Виправлено в одинадцяти місцях: розділи 08, 17, 20, 21, 23, картки К1 і К10, додаток C,
    дві вкладки. Формулювання заведено в `factcheck/SPROSTOVANE.md`, взірець випробувано вставкою
    старої фрази в розділ 23 — знаходиться.

    Виняток у взірці на `manual/17-esptool.md` навмисний: розділ 17 тепер **пояснює**, чому
    команди краще не вживати, і мусить цитувати її назву.'
