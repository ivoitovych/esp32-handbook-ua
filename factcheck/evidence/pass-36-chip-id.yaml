# Прохід 36 — шматок 8 пулу: `chip-id` не є командою для ESP32.
#
# Агент шматка 8 сам поставив цю знахідку першою за шкодою серед
# сорока трьох перевірених. Оцінка правильна, але не з тієї причини,
# яку він назвав: команда не «не працює». Вона працює й друкує MAC.
# Хибне в книзі — **приписування**: сімейство і ревізію називає не
# вона, а преамбула з'єднання, спільна для всіх підкоманд.
#
# Тобто читач, що виконав книжкову команду, отримував правильну
# відповідь — плюс попередження, якого книга не пояснювала. Це та сама
# четверта категорія з проходу 26: не число і не пояснення, а
# **напрямок висновку**.
















