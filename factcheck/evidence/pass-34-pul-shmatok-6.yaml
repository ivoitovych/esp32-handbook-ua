# Прохід 34 — шматок 6 пулу: esptool і завантаження.
#
# 15 одиниць, розбіжностей нуль. Прохід цінний не новими фактами, а
# двома чесними «не підтверджується» — і обидва варті окремого рядка.













- nazva: Асиметрія двох зсувів і те, що esptool не перевіряє адресу
  zbih: 'адреса бутлоадера задана ROM і не\s*\n?налаштовується|`idf\.py flash` знає її сам|не
    має підстав скаржитися: він робить рівно те, що просили|покласти бутлоадер у порожнє місце|адреса
    бутлоадера набирається з голови'
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/bootloader/Kconfig.projbuild,
    .../components/partition_table/Kconfig.projbuild, https://raw.githubusercontent.com/espressif/esptool/master/docs/en/esptool/basic-commands.rst
  cytata: "config BOOTLOADER_OFFSET_IN_FLASH\n    …\n    help\n        Offset address that\
    \ 2nd bootloader will be flashed to.\n        The value is determined by the ROM bootloader.\n\
    \        It's not configurable in ESP-IDF.\n\nconfig PARTITION_TABLE_OFFSET\n    hex \"\
    Offset of partition table\"\n    default 0x8000\n    help\n        The address of partition\
    \ table (by default 0x8000).\n        Allows you to move the partition table, it gives\
    \ more space\n        for the bootloader.\n\n(basic-commands.rst)\nThe next arguments\
    \ to ``write-flash`` are one or more pairs of offset\n(address) and file name. Consult\
    \ your SDK documentation to determine\nthe files to flash at which offsets.\n"
  sposib: curl raw.githubusercontent через агента пулу (шматок 6), 2026-08-26; взірець і клас
    — М1
  notatka: 'Асиметрія, додана в проході 24, підтверджена дослівно з двох файлів Kconfig поспіль:
    один каже «визначається ROM, не налаштовується», другий — «дозволяє пересунути».

    Друга половина сильніша й пояснює найдорожчу помилку розділу 17: `write-flash` бере **пари
    «адреса — файл»** і відсилає читача до документації SDK. Тобто інструмент не має і не
    може мати уявлення, чи правильна адреса, — він робить рівно те, що просили, і мовчить.'
