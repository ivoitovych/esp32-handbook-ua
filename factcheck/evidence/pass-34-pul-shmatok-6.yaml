- nazva: Автоскидання не працює — перелік причин, крім однієї
  zbih: схема, що смикає `GPIO0` і `EN` сигналами `DTR`/`RTS`|плата без такої схеми взагалі|живлення
    просідає під час скидання
  dzherelo: https://raw.githubusercontent.com/espressif/esptool/master/docs/en/advanced-topics/boot-mode-selection.rst
    та .../docs/en/troubleshooting.rst
  cytata: "esptool is not able to reset your hardware automatically in the\nfollowing cases:\n\
    - Your hardware does not have the ``DTR`` and ``RTS`` lines connected\n  to ``{IDF_TARGET_STRAP_BOOT_GPIO}``\
    \ and ``EN`` (``CHIP_PU``)\n- The ``DTR`` and ``RTS`` lines are configured differently\n\
    - There are no such serial control lines at all\n\n(troubleshooting.rst)\nIf you have\
    \ connected other devices to GPIO pins, try removing them\nand see if esptool starts working.\n\
    Check the chip is receiving 3.3V from a stable power source.\n"
  sposib: curl raw.githubusercontent через агента пулу (шматок 6), 2026-08-26; взірець і клас
    — М1
  notatka: 'Чотири з п''яти причин книги підтверджено дослівно. **П''ята — ні**, і це варте
    запису: «драйвер мосту не керує `DTR`/`RTS` (трапляється на CH9102 у Windows)».

    Агент шукав `CH9102` у `troubleshooting.rst`, `boot-mode-selection.rst` і `reset.py` —
    немає ніде. Твердження не спростоване, воно **непідтверджене**: поведінка драйвера під
    Windows у документації esptool не описана й описана бути не може.

    Лишаю в книзі як є, але позначаю тут: якщо колись знадобиться клас `A` на цей рядок, джерелом
    буде не esptool, а сам драйвер WCH або відтворення на живій машині. Це не наряд для М2
    — це чесна межа того, що взагалі можна процитувати.

    Побічно варте уваги: `troubleshooting.rst` радить те саме, що книга, у двох інших рядках
    — зняти сторонні пристрої з GPIO і перевірити стабільність 3.3 В. Тобто перелік книги
    не лише правильний, а й впорядкований так само, як у джерелі.'
