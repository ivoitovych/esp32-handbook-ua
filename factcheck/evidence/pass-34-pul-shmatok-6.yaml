- nazva: erase-flash, flash-id і коли стирання справді потрібне
  zbih: '`erase-flash` знищує \*\*весь\*\* флеш|`flash-id` показує те, що каже сама мікросхема|залишки
    старої розбивки заважають новій таблиці|Перевірити версію `esptool` \*\*перш ніж\*\*'
  dzherelo: https://raw.githubusercontent.com/espressif/esptool/master/docs/en/esptool/basic-commands.rst,
    .../docs/en/migration-guide.rst, https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/docs/en/api-reference/storage/nvs_flash.rst
  cytata: "(basic-commands.rst)\nRead SPI Flash ID: ``flash-id``\nExample output:\n    Manufacturer:\
    \ e0\n    Device: 4016\n    Detected flash size: 4MB\n\nTo erase the entire flash chip\
    \ (all data replaced with 0xFF bytes):\n    esptool erase-flash\n\n(nvs_flash.rst)\nif\
    \ an NVS partition is truncated (for example, when the partition\ntable layout is changed),\
    \ its contents should be erased.\n\n(migration-guide.rst)\nAll the commands and options\
    \ have been renamed to use ``-`` instead\nof ``_`` as a separator (e.g., ``write_flash``\
    \ -> ``write-flash``).\nOld command and option names are **deprecated**.\n"
  sposib: curl raw.githubusercontent через агента пулу (шматок 6), 2026-08-26; взірець і клас
    — М1
  notatka: 'Найцінніше — перший пункт переліку «коли `erase-flash` справді потрібен». Книга
    називала його з досвіду; `nvs_flash.rst` каже те саме прямо: обрізаний при зміні розбивки
    розділ NVS **треба** стерти. Порада з практики збіглася з вимогою документації.'
