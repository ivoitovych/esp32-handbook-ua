# М2 — розпіновка JTAG classic, друге незалежне джерело.
#
# Пункт наряду закрив М1 у проході 24 з `io_mux_reg.h`, де ім'я регістра
# є іменем сигналу JTAG. Цей запис не закриває нічого нового: він
# підтверджує той самий факт документом іншого роду — не кодом, який
# компілюють, а таблицею, яку друкують.
#
# Оновлене завдання просить саме цього: «Два незалежні джерела різного
# класу — код і datasheet — на той самий факт є найдешевшим способом
# переконатися, що правило класу A працює однаково для обох із нас.
# Розбіжність тут була б цікавішою за будь-яке підтвердження».
#
# Розбіжності немає. Звірено всі чотири піни, не лише два.





- nazva: Розпіновка JTAG classic — datasheet як друге джерело до io_mux_reg.h
  zbih: \| TMS \| `GPIO14` \||\| TCK \| `GPIO13` \|
  dzherelo: https://www.espressif.com/sites/default/files/documentation/esp32_datasheet_en.pdf
    — ESP32 Series Datasheet v5.3, розділ 2.2 «Pin Overview», Table 2-1 «Pin Overview», с.
    14-15
  cytata: "Name    No.   Type   Function\nMTMS    17    I/O    GPIO14, ADC2_CH6, RTC_GPIO16,\
    \ TOUCH6, EMAC_TXD2, HSPICLK, HS2_CLK, SD_CLK, MTMS\nMTDI    18    I/O    GPIO12, ADC2_CH5,\
    \ RTC_GPIO15, TOUCH5, EMAC_TXD3, HSPIQ, HS2_DATA2, SD_DATA2, MTDI\nMTCK    20    I/O \
    \   GPIO13, ADC2_CH4, RTC_GPIO14, TOUCH4, EMAC_RX_ER, HSPID, HS2_DATA3, SD_DATA3, MTCK\n\
    MTDO    21    I/O    GPIO15, ADC2_CH3, RTC_GPIO13, TOUCH3, EMAC_RXD3, HSPICS0, HS2_CMD,\
    \ SD_CMD, MTDO\n\nNotes for Table 2-1 Pin Overview:\n1. Function names:\n   MTMS\n   MTDI\n\
    \   MTCK    JTAG interface signals\n   MTDO\n"
  sposib: curl PDF з espressif.com, pdftotext -layout, 2026-08-26
  notatka: 'Звірка, яку просить оновлене завдання. Таблиця друкованого datasheet збігається
    з `io_mux_reg.h` по всіх чотирьох пінах JTAG, а не лише по двох, що були в наряді: `MTDI`
    — `GPIO12` (вивід 18), `MTCK` — `GPIO13` (вивід 20), `MTMS` — `GPIO14` (вивід 17), `MTDO`
    — `GPIO15` (вивід 21). Таблиця розділу 27 звірена повністю, двома джерелами різного роду.

    Джерело дає дві речі понад те, про що просили. Примітка 1 до таблиці називає `MTMS`/`MTDI`/`MTCK`/`MTDO`
    саме «JTAG interface signals» — тобто зв''язок сигналу з іменем виводу стверджує сам datasheet,
    а не читач таблиці альтернативних функцій. Розділ 2.3.1 «Restrictions for GPIOs and RTC_GPIOs»
    ставить інтерфейс JTAG в один перелік зі strapping-пінами як «important functions» — це
    та сама думка, з якої починається попередження розділу 27.

    Про спосіб. Перша редакція завдання вказувала на додаток A.4 (таблиця IO_MUX). Рядки там
    є, але додаток верстається повернутим на 90°, і pdftotext втрачає в ньому цифри: «GPIO»
    без номера, «VDD P» замість «VDD3P3». Витяг наведено з Table 2-1 того самого документа,
    де ті самі відомості видобуваються без утрат. Це не обхід правила, а вибір читабельної
    таблиці в тому самому документі.

    Взірець навмисно лишено вузьким — на два рядки книги, що були в наряді. Підтвердження
    `TDI`/`TDO` описано тут, але покривати ними рядки, уже закриті проходом 20, сенсу немає:
    широкий взірець небезпечніший за відсутній.'
