- nazva: PSRAM вимкнена типово, а винесення в неї — навпаки, ввімкнене
  zbih: '`CONFIG_SPIRAM` типово вимкнена|менше 16 КБ \| внутрішня SRAM|SPIRAM_MALLOC_ALWAYSINTERNAL|malloc
    виносить у PSRAM усе від\s*\n?16 КБ|уже сам виносить у PSRAM усе від 16 КБ'
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/esp_psram/Kconfig.spiram.common
    та .../components/esp_psram/{esp32,esp32s3}/Kconfig.spiram
  cytata: "(esp32/Kconfig.spiram і esp32s3/Kconfig.spiram)\nconfig SPIRAM\n    bool \"Support\
    \ for external, SPI-connected RAM\"\n    default \"n\"\n\n(Kconfig.spiram.common)\nchoice\
    \ SPIRAM_USE\n    prompt \"SPI RAM access method\"\n    default SPIRAM_USE_MALLOC\n  \
    \  config SPIRAM_USE_MEMMAP\n        bool \"Integrate RAM into memory map\"\n    config\
    \ SPIRAM_USE_CAPS_ALLOC\n        bool \"Add RAM to heap_caps allocator (malloc() stays\
    \ internal by default)\"\n    config SPIRAM_USE_MALLOC\n        bool \"Make RAM allocatable\
    \ using malloc() as well\"\nendchoice\n\nconfig SPIRAM_MALLOC_ALWAYSINTERNAL\n    int\
    \ \"Maximum malloc() size, in bytes, to always put in internal memory\"\n    depends on\
    \ SPIRAM_USE_MALLOC\n    default 16384\n    range 0 131072\n    help\n        If malloc()\
    \ is capable of also allocating SPI-connected ram, its\n        allocation strategy will\
    \ prefer to allocate chunks less than this\n        size in internal memory, while allocations\
    \ larger than this will be\n        done from external RAM. If allocation from the preferred\
    \ region\n        fails, an attempt is made to allocate from the non-preferred region\n\
    \        instead, so malloc() will not suddenly fail when either internal or\n       \
    \ external memory is full.\n"
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Головна знахідка проходу, і вона поведінкова.

    Книга писала в двох місцях (розділи 03 і 30): «щоб великі буфери йшли в PSRAM, це треба
    ввімкнути й попросити явно». Половина вірна — `CONFIG_SPIRAM` справді типово `n`, і плата
    з розпаяною мікросхемою без цього її не бачить.

    Друга половина хибна, і саме її читач застосовує. Коли PSRAM увімкнено, `SPIRAM_USE` типово
    `SPIRAM_USE_MALLOC`, а `SPIRAM_MALLOC_ALWAYSINTERNAL` типово `16384`. Тобто **виділення
    від 16 КБ ідуть у PSRAM самі**, без жодного `MALLOC_CAP_SPIRAM`.

    Ціна помилки не в тому, що читач шукатиме в менюконфігу перемикач, який уже стоїть. Вона
    в тому, що його буфер на 64 КБ **уже** в зовнішній пам''яті — повільнішій і не завжди
    придатній для DMA, — а він упевнений, що у внутрішній. Помилку такого роду не видно доти,
    доки не почнеш міряти.

    Виправлено в обох місцях. У розділі 30 замість абзацу — таблиця порогу, згадка про м''якість
    переваги (якщо в бажаній області немає місця, береться інша, тож `malloc` не почне раптово
    віддавати `NULL`) і другий бік `heap_caps_malloc`: `MALLOC_CAP_INTERNAL`, щоб лишити буфер
    у SRAM свідомо. Формулювання заведено в `factcheck/SPROSTOVANE.md`, випробувано впровадженням
    у розділ 04 — обидва варіанти знаходяться.'
