- nazva: Octal PSRAM треба зазначити — типово стоїть Quad
  zbih: Octal PSRAM треба зазначити|типово стоїть\s*\n?\*\*Quad|SPIRAM_MODE_QUAD|Mode \(QUAD/OCT\)
    of SPI RAM chip
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/esp_psram/esp32s3/Kconfig.spiram
  cytata: "choice SPIRAM_MODE\n    prompt \"Mode (QUAD/OCT) of SPI RAM chip in use\"\n   \
    \ default SPIRAM_MODE_QUAD\n\n    config SPIRAM_MODE_QUAD\n        bool \"Quad Mode PSRAM\"\
    \n\n    config SPIRAM_MODE_OCT\n        bool \"Octal Mode PSRAM\"\nendchoice\n"
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Не виправлення, а прогалина: книга називала `N16R8` і згадувала, що октальна PSRAM
    з''їдає піни, але ніде не казала, що **режим треба обрати руками**.

    Пастка чиста: типове значення `SPIRAM_MODE_QUAD` на всіх сімействах, тож модуль з восьмилінійною
    PSRAM без правки менюконфігу поводиться як плата без PSRAM узагалі. Симптом — `heap_caps_get_free_size(MALLOC_CAP_SPIRAM)`
    повертає нуль на платі, за яку заплачено саме через ті 8 МБ, — виглядає як несправність,
    а не як налаштування.

    Додано в розділ 23 (тріаж модуля) блоком «увага», зі шляхом у менюконфігу, звіреним у
    проході 11.'
