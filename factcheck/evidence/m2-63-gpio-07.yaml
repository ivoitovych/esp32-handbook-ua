  cytata: 10 touch sensors
  notatka: 'Touch сенсори це функція, притаманна лише деяким варіантам чипів.

    2026-08-28. Було двоє негараздів, обидва мовчазні.

    ПЕРШЕ: клас стояв verbatim, а джерелом була проза без URL («ESP32 / ESP32-S2 / ESP32-S3
    Series Datasheet, Touch Sensor section»). Шар 3 такий запис перевірити не міг.

    ДРУГЕ, гірше: цитата казала «ESP32-S2: 13 touch sensor GPIOs». Даташит каже **14**, і
    книга каже 14. Тобто клас A тримався на числі, якого в жодному документі немає.

    ТРЕТЄ: взірець чіпляв 24 одиниці через голе слово Touch — усе, де воно трапилося. Звужено
    до двох одиниць, які твердження справді містять.'
