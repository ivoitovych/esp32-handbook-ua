- nazva: Безсвинцевий потребує на 30-40 °C більше
  zbih: Безсвинцевий — на 30–40 градусів більше\.
  dzherelo: 'Kester (ITW), Alloy Temperature Chart — рядки `Sn63Pb37` і сімейство `LEAD-FREE` (кеш: source-cache/kester-alloys.pdf)'
  cytata: 'Sn63Pb37             183

    Sn96.5Ag3Cu0.5       217-220

    Sn96.5Ag3.5          221

    Sn99.3Cu0.7          227

    '
  sposib: PDF Kester, кеш `kester-alloys.pdf`, pdftotext -layout, 2026-08-26
  notatka: 'Клас `B`: книга говорить про температуру **жала**, а таблиця дає температуру **плавлення сплаву**.
    Це різні величини — жало ставлять вище за точку плавлення.

    Але різниця між ними переноситься: 217-227 проти 183 дає 34-44 °C, і книжкове «на 30-40 градусів більше»
    лягає в цей інтервал. Тобто підтверджено саме **різницю**, а не абсолютні 300-320 °C.

    Абсолютна температура жала лишається незвіреною: її не буває в таблиці сплавів, вона належить до практики
    паяння й документів на паяльні станції. Це окреме джерело, і його я не брав.'
  title: Безсвинцевий потребує на 30-40 °C більше
