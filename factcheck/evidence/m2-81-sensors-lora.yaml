  dzherelo: DS18B20 Datasheet, Table «Temperature Conversion Time»
  cytata: 'Temperature Conversion Time — максимум 750 мс

    Типово 94 мс для 12-бітного розрізнення (за замовчуванням)

    '
  sposib: DS18B20 datasheet, практика
  notatka: 750 мс — це максимальний час перетворення температури в DS18B20. Це стандартне значення, на
    яке спираються більшість бібліотек. Arduino бібліотеки часто використовують 750 мс для безпеки.
