- nazva: Дамп Task WDT — два різні переліки
  zbih: The following tasks/users|did not reset the watchdog in time|Tasks currently running|Переліків
    тут \*\*два|перший перелік|не встиг(ли)? погодувати
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/esp_system/task_wdt/task_wdt.c
  cytata: "const char *caption = \"Task watchdog got triggered. \"\n                     \
    \ \"The following tasks/users did not reset the watchdog in time:\";\n…\n    ESP_EARLY_LOGE(TAG,\
    \ \" - %s%s\", name, cpu);\n…\nESP_EARLY_LOGE(TAG, \"%s\", DRAM_STR(\"Tasks currently\
    \ running:\"));\nESP_EARLY_LOGE(TAG, \"CPU %d: %s\", x, pcTaskGetName(...));\n"
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Виправлення. Книга обрізала перший рядок на «Task watchdog got triggered.» — а
    обрізане саме те речення, яке пояснює різницю між двома переліками в дампі.

    Перший перелік — ті, хто **не встиг погодувати** watchdog; у типовому випадку це `IDLE0`,
    тобто потерпілий. Другий, `Tasks currently running:`, — те, що виконувалося в цю мить,
    і саме там винуватець.

    Книга цю різницю знала («рядок `Tasks currently running` називає винуватця»), але друкувала
    лог, з якого її не видно. Тепер надруковано повний рядок, а тлумачення винесено в блок
    уваги — у розділі 26 і додатку D.

    Заразом виправлено відступ: формат `" - %s%s"` дає два пробіли після двокрапки тега, а
    книга друкувала один.'
