- nazva: Розбіжність обсягу флешу — два різні рядки й різні наслідки
  zbih: Detected size|smaller than the size in the binary image header|Probe failed|Using
    the size in the binary image header|Реальний флеш \*\*менший\*\*
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/spi_flash/esp_flash_spi_init.c
  cytata: "ESP_EARLY_LOGE(TAG, \"Detected size(%dk) smaller than the size in the binary image\
    \ \"\n                    \"header(%dk). Probe failed.\", default_chip.size/1024, legacy_chip->chip_size/1024);\n\
    ESP_EARLY_LOGW(TAG, \"Detected size(%dk) larger than the size in the binary image \"\n\
    \                    \"header(%dk). Using the size in the binary image header.\", …);\n"
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Виправлення. Книга друкувала `Flash chip size mismatch` — рядка з такою назвою
    в ESP-IDF немає ніде.

    Справжні рядки не лише інші, а ще й **два**, з протилежними наслідками. Реальний флеш
    менший за налаштований — фатально, проба зупиняється (`ESP_LOGE`). Більший — лише попередження
    (`ESP_LOGW`), система працює, надлишок не використовується.

    Друге — типова доля клонів, що продаються як 16 МБ. Книга подавала обидва випадки одним
    рядком і одним наслідком; тепер вони розділені.'
