- nazva: Повідомлення бутлоадера про образ і розділи
  zbih: has invalid magic byte|Factory app partition is not bootable|invalid magic number|Failed
    to verify partition table|ota data partition invalid|Image hash failed
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/bootloader_support/src/{esp_image_format,bootloader_utility,flash_partitions}.c
  cytata: 'FAIL_LOAD("image at 0x%"PRIx32" has invalid magic byte (nothing flashed here?)",
    src_addr);

    ESP_LOGE(TAG, "Image hash failed - image is corrupt");

    ESP_LOGE(TAG, "Factory app partition%s", not_bootable);   // " is not bootable"

    ESP_LOGE(TAG, "partition %d invalid magic number 0x%x", num_parts, part->magic);

    ESP_LOGE(TAG, "Failed to verify partition table");

    ESP_LOGE(TAG, "ota data partition invalid, falling back to factory");

    '
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Виправлення. П''ять із шести рядків книга подавала правильно, шостий — `image
    has invalid SHA256` — не існує взагалі. Насправді ESP-IDF друкує `Image hash failed -
    image is corrupt`.

    Це саме той випадок, заради якого прохід і робився: читач із пошкодженим образом шукав
    у логу рядок, якого там ніколи не буде.

    Заразом рядки в таблиці додатка D доповнено до повного вигляду — з `(nothing flashed here?)`
    і `falling back to factory`, — бо саме хвіст рядка каже, що бутлоадер зробив далі.'
