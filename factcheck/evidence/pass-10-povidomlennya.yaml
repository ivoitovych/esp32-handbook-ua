- nazva: Помилки купи розрізняють бік переповнення
  zbih: CORRUPT HEAP|Bad tail|Bad head|канарки|stack overflow in task X has been detected
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/heap/multi_heap_poisoning.c
    та .../freertos/FreeRTOS-Kernel/portable/xtensa/port.c
  cytata: 'MULTI_HEAP_STDERR_PRINTF("CORRUPT HEAP: Bad head at %p. Expected 0x%08x got 0x%08x\n",
    …);

    MULTI_HEAP_STDERR_PRINTF("CORRUPT HEAP: Bad tail at %p. Expected 0x%08x got 0x%08x\n",
    …);


    #define ERR_STR1 "***ERROR*** A stack overflow in task "

    #define ERR_STR2 " has been detected."

    '
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Доповнення, і практично корисне. Книга мала один рядок `CORRUPT HEAP`, тоді як
    купа каже, **з якого боку** писали повз: `Bad tail` — за кінець блоку (класичне переповнення
    буфера), `Bad head` — перед початком (від''ємний індекс, арифметика покажчиків).

    Це звужує пошук удвічі й не коштує нічого. Додано в додаток D блоком уваги разом із поясненням,
    що адреса в рядку — це адреса канарки, тобто край блоку.

    Рядок про переповнення стека доповнено до повного: `… has been detected.`'
