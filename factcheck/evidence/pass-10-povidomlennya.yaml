- nazva: Тексти помилок esptool змінилися між версіями
  zbih: No serial data received|Failed to start stub flasher|This chip is ESP32-S3, not ESP32|Wrong
    chip argument|MD5 of file does not match|Stub flasher has been disabled
  dzherelo: https://raw.githubusercontent.com/espressif/esptool/master/esptool/{loader,cmds}.py
    та https://raw.githubusercontent.com/espressif/esptool/v4.8.1/esptool/loader.py
  cytata: "(v5 loader.py)\nraise FatalError(f\"Failed to connect to {self.CHIP_NAME}: {last_error}\"\
    \ …)\nmsg = (\"Serial data stream stopped: Possible serial noise or corruption.\"\n  \
    \     if successful_slip else \"No serial data received.\")\nraise FatalError(f\"This\
    \ chip is {chip_type}, not {self.CHIP_NAME}. Wrong chip argument?\")\nraise FatalError(\"\
    Failed to start stub flasher. There was no response.\\n\" …)\nlog.warn(\"Stub flasher\
    \ has been disabled for compatibility, \"\n         \"set --no-stub to suppress this warning.\"\
    )\n\n(cmds.py)\nraise FatalError(\"MD5 of file does not match data in flash!\")\n\n(v4.8.1\
    \ loader.py — для порівняння)\n\"This chip is %s not %s. Wrong --chip argument?\"\n\"\
    Failed to start stub. There was no response.\"\n"
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Чотири виправлення разом, і всі однакової природи: книга наводила тексти esptool
    3.x, які застаріли на дві мажорні версії.

    `Timed out waiting for packet header` → `No serial data received.` Це найчастіша помилка
    взагалі, і книга сама називає її найчастішою.

    `This chip is X not Y` → `This chip is X, not Y. Wrong chip argument?` — з комою, якої
    не було, і без дефісів у `--chip` (у v4 було `Wrong --chip argument?`).

    `Stub is disabled` / `Failed to run stub` → таких рядків немає зовсім; є `Failed to start
    stub flasher.` і окреме попередження `Stub flasher has been disabled for compatibility…`,
    яке взагалі не помилка.

    `MD5 does not match` — теж не існує як рядок: у тексті `MD5 of file does not match data
    in flash!` немає підрядка `MD5 does not match`. Тобто пошук у логу давав порожньо. Виправлено
    в п''яти місцях книги.

    Висновок ширший за самі рядки: книга вже розрізняє синтаксис v4 і v5 у командах, але тексти
    помилок лишалися від старішої версії. Тепер там, де формулювання розійшлися помітно, названо
    обидва.'
