# Прохід 10 — суцільна звірка повідомлень у консолі.
#
# Найважливіший прохід для книги такого жанру. Довідник обіцяє читачеві:
# «побачиш такий рядок — роби те». Якщо рядок надрукований неточно,
# читач шукає його у своєму логу дослівно й не знаходить — і порада
# зникає разом із рядком.
#
# Тому критерій тут суворіший за звичайний: збігатися має не зміст, а
# **текст**. Джерело — не документація, а самі рядки у вихідному коді,
# який ці повідомлення друкує.
#
# Прохід дав шість виправлень.


















































































- nazva: Формат паніки Guru Meditation і назви винятків
  zbih: 'Guru Meditation Error: Core|LoadProhibited|StoreProhibited|InstrFetchProhibited|IllegalInstruction|LoadStoreAlignment|IntegerDivideByZero|Exception
    was unhandled|Cache disabled but cached memory region accessed'
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/esp_system/panic.c
    та .../esp_system/port/arch/xtensa/panic_arch.c
  cytata: "(panic.c)\npanic_print_str(\"Guru Meditation Error: Core \");\npanic_print_dec(info->core);\n\
    panic_print_str(\" panic'ed (\");\npanic_print_str(info->reason);\npanic_print_str(\"\
    ). \");\n\n(panic_arch.c)\nstatic const char *reason[] = {\n    \"IllegalInstruction\"\
    , \"Syscall\", \"InstructionFetchError\", \"LoadStoreError\",\n    \"Level1Interrupt\"\
    , \"Alloca\", \"IntegerDivideByZero\", \"PCValue\",\n    \"Privileged\", \"LoadStoreAlignment\"\
    , …\n    \"InstrFetchProhibited\", …\n    \"LoadProhibited\", \"StoreProhibited\", …\n\
    };\ninfo->description = \"Exception was unhandled.\";\n\nstatic const char *pseudo_reason[]\
    \ = { …\n    \"Interrupt wdt timeout on CPU0\",\n    \"Interrupt wdt timeout on CPU1\"\
    ,\n    \"Cache error\", };\ninfo->description = NULL;\n\npanic_print_str(\"Cache disabled\
    \ but cached memory region accessed\");\n"
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Нуль розбіжностей, і в тонкому місці. Книга друкує `Guru Meditation Error: Core
    0 panic''ed (LoadProhibited). Exception was unhandled.` — з крапкою й реченням у кінці,
    а `… (Interrupt wdt timeout on CPU0)` — **без** нього. Саме так і поводиться код: для
    звичайних винятків `description` виставлено, для псевдопричин він `NULL`.

    Усі вісім назв винятків із таблиці додатка D є в масиві `reason` дослівно. Повідомлення
    про кеш теж дослівне.'
