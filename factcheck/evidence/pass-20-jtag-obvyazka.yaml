- nazva: Кольорова обв'язка прикладів — classic і тільки classic
  zbih: GPIO\d+\s+→ (?:синій|зелений|жовтий|білий|червоний|чорний)|→ датчик DS18B20, лінія
    DATA|→ дисплей SSD1306
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/soc/esp32/include/soc/soc_caps.h
    (маски дійсних пінів) + `tools/pins.py`
  cytata: "esp32: SOC_GPIO_PIN_COUNT 40\n       SOC_GPIO_VALID_GPIO_MASK (0xFFFFFFFFFFULL\
    \ & ~(BIT24|BIT28…BIT31))\n\nУсі піни прикладів (0, 4, 21, 22) дійсні для classic;\nGPIO22\
    \ недійсний для S3 і C3, GPIO21 — граничний для C3.\n"
  sposib: python3 tools/pins.py, 2026-08-26
  notatka: 'Схеми в розділах 22 і 56 — приклади «як підписати дроти перед втручанням», а не
    BOM проєкту. Сімейства вони не оголошують, тож `tools/pins.py` їх не перевіряв.

    Перевірено вручну: всі чотири піни дійсні для classic, і жоден із розділів не обіцяє іншого
    сімейства. Розбіжності немає.

    Але записано окремо, бо випадок межовий: якби хтось додав до цих розділів рядок «або S3»,
    `GPIO22` став би помилкою мовчки. Це та сама пастка, що зі проєктами 59 і 60 — просто
    тут її ще немає.

    Практичний висновок для процесу: перевірка `pins.py` спирається на те, що файл сам себе
    оголошує. Розділ без такого оголошення з-під неї випадає — і це прийнятно лише доти, доки
    в ньому немає обіцянки про сімейство.'
  title: Кольорова обв'язка прикладів — classic і тільки classic
