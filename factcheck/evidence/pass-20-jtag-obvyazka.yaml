- nazva: TCK і TMS на classic — GPIO13 і GPIO14
  zbih: \| TMS \| `GPIO14` \||\| TCK \| `GPIO13` \|
  dzherelo: ESP32 Series Datasheet, розділ «Pin Definitions» (таблиця альтернативних функцій
    IO_MUX). Звідси недосяжний — політика egress
  shukaty: 'у таблиці IO_MUX знайти рядки GPIO13 і GPIO14 і звірити альтернативну функцію:
    очікується MTCK для GPIO13 і MTMS для GPIO14'
  notatka: 'Друга половина таблиці лишається незакритою, і це записано, а не приховано.

    Мапінг `MTCK`/`MTMS` на `GPIO13`/`GPIO14` не трапився в жодному з досяжних звідси джерел:
    ані в заголовках `soc/`, ані в документації esptool, ані в посібнику з JTAG-налагодження
    ESP-IDF, ані в описі ESP-Prog. Він живе в таблиці IO_MUX самого datasheet.

    Спокуса поставити тут клас `A` була найбільшою за всі двадцять проходів: мапінг відомий
    кожному, хто хоч раз чіпав JTAG на ESP32, і жоден читач не засумнівався б. Саме для таких
    моментів і написане правило: клас `A` лише тоді, коли текст джерела справді отримано.

    Практична вага помилки тут, до речі, невелика: переплутані `TCK` і `TMS` дають непрацюючий
    JTAG, а не спалену плату. Але реєстр не сортує чесність за ціною помилки.

    ЗАКРИТО В ПРОХОДІ 24. Запис лишається як він був — і саме тому, що висновок «джерело недосяжне»
    виявився передчасним. Мапінг знайшовся у файлі, у який я тут не заглянув: `components/soc/esp32/register/soc/io_mux_reg.h`,
    де `IO_MUX_GPIO13_REG` дорівнює `PERIPHS_IO_MUX_MTCK_U`. Тобто джерело було досяжне весь
    час, а недосяжним був той конкретний документ, у якому я звик шукати.

    Різниця між «недосяжне» і «я не знайшов» — головне, що варто винести з цієї пари записів.
    Клас `C` тут був чесний, але надто впевнений у другій половині свого визначення.'
