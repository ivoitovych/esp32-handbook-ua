# Прохід 39 — перші відпрацьовані сліди класу `E`.
#
# Сліди (`ideya`) — це здогади помічників про те, де шукати. Раніше вони
# лежали у звітах і нікуди не вели. `tools/leads.py` зібрав 154, відібрав
# 56 досяжних, і п'ять помічників пішли по них.
#
# Заявлено 10 `znayshov`, третій шар витримали 8. Тобто **дослівність**
# доведено машиною для восьми.
#
# Далі — шар 2, і його роблю я, бо машина його зробити не може. Питання
# М2, точніше за моє власне формулювання: **джерело підпирає це
# твердження — чи лише містить це число?**
#
# З восьми дослівних:
#   3 підпирають повністю     → A
#   4 підпирають половину     → B, з названою неперевіреною половиною
#   1 не підпирає взагалі     → відхилено, див. кінець файлу
#
# Тобто третій шар пропустив запис, який доводить не те. Це не його
# вада: він порівнює рядки, а не смисли, і саме тому шар 2 не можна
# віддати ані скриптові, ані помічникові.

# ── Підпирають повністю ────────────────────────────────────────────────



# ── Підпирають половину ────────────────────────────────────────────────
#
# Клас `B`, а не `A`, і в кожному записі названо, **яка саме половина
# лишилася без джерела**. Мовчазне `A` тут було б тим самим дефектом, що
# `pass-28`: назва в переліку доводить існування речі й нічого більше.

















