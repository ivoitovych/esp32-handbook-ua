- nazva: GPIO22 на S3 не існує; запит повертає ESP_ERR_INVALID_ARG без ESP_ERROR_CHECK
  zbih: GPIO22 на S3 не існує|i2c_new_master_bus.*ESP_ERR_INVALID_ARG|без ESP_ERROR_CHECK
  dzherelo: 'ВНУТРІШНЯ ЗВІРКА (книга проти себе): manual/59-proj-monitor.md, рядки 54–65'
  cytata: '**`GPIO22` на S3 не існує.** У S3 немає пінів 22–25 узагалі — це

    видно прямо в ESP-IDF, де маска дійсних пінів їх вирізає. Схема з

    `GPIO22`, перенесена з classic, не запрацює: `i2c_new_master_bus`

    поверне `ESP_ERR_INVALID_ARG`, і шина лишиться німою.


    Драйвер при цьому **називає причину в консолі** — типово, без жодного

    налаштування:

    E (315) i2c.master: i2c_new_master_bus(1049): invalid SDA/SCL pin number


    Мовчазним воно стає лише тоді, коли код повернення не перевіряють, а лог

    гортають повз: без `ESP_ERROR_CHECK` програма спокійно йде далі до першої

    транзакції з дескриптором, якого немає.

    '
  sposib: дослівна цитата про критичну помилку розпіновки
  notatka: 'Шар 3 цього не перевіряє: джерело — сама книга. Потрібен окремий інструмент внутрішньої несуперечності.'
