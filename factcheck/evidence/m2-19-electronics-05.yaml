- nazva: I²C — внутрішнє підтягування ESP32 (45 кОм) заслабке, потрібні зовнішні резистори
  zbih: 'Зовнішнє підтягування для I²C — окрема історія: там вбудованого замало, потрібні справжні резистори
    4\.7 кОм \(розділ 35\)\.'
  dzherelo: ESP32 Series Datasheet, Table 5-3 (RPU — Resistance of internal pull-up resistor, Typ. 45
    кОм) і NXP UM10204 I²C-bus specification and user manual, §7.1 Pull-up resistor sizing
  cytata: '[ESP32 Table 5-3]

    RPU   Resistance of internal pull-up resistor   —   45   —   kΩ


    [UM10204 §7.1]

    The bus capacitance is the total capacitance of wire, connections

    and pins. This capacitance limits the maximum value of Rp due to

    the specified rise time.

    ...with a supply voltage of VDD = 5 V ± 10 % and VOL(max) = 0.4 V

    at 3 mA, Rp(min) = (5.5 - 0.4) / 0.003 = 1.7 kΩ.

    '
  sposib: PDF Espressif, кеш `esp32-datasheet.pdf`, і PDF NXP, кеш `i2c-um10204.pdf` (з попереднього кроку),
    pdftotext -layout, 2026-08-26
  notatka: 'Клас `B`, складене з двох джерел: внутрішнє підтягування ESP32 типово `45 кОм` — на порядок
    вище за те, що допускає I²C-шина (за формулою UM10204 з VDD≈3.3 В і типовою ємністю шини 100–400 пФ
    вихідний `Rp` виходить одиниці кОм, не десятки), звідси «вбудованого замало». Число «4.7 кОм» саме
    по собі в UM10204 не написане — це практичне значення посередині діапазону, який задають формули специфікації,
    а не цитата. `[розділ 35]` — посилання книги на інший розділ, не перевіряю тут повторно.'
  title: I²C — внутрішнє підтягування ESP32 (45 кОм) заслабке, потрібні зовнішні резистори
  match: 'Зовнішнє підтягування для I²C — окрема історія: там вбудованого замало, потрібні справжні резистори
    4\.7 кОм \(розділ 35\)\.'
  status: derived
  source: ESP32 Series Datasheet, Table 5-3 (RPU — Resistance of internal pull-up resistor, Typ. 45 кОм)
    і NXP UM10204 I²C-bus specification and user manual, §7.1 Pull-up resistor sizing
  quote: '[ESP32 Table 5-3]

    RPU   Resistance of internal pull-up resistor   —   45   —   kΩ


    [UM10204 §7.1]

    The bus capacitance is the total capacitance of wire, connections

    and pins. This capacitance limits the maximum value of Rp due to

    the specified rise time.

    ...with a supply voltage of VDD = 5 V ± 10 % and VOL(max) = 0.4 V

    at 3 mA, Rp(min) = (5.5 - 0.4) / 0.003 = 1.7 kΩ.

    '
  method: PDF Espressif, кеш `esp32-datasheet.pdf`, і PDF NXP, кеш `i2c-um10204.pdf` (з попереднього кроку),
    pdftotext -layout, 2026-08-26
  note: 'Клас `B`, складене з двох джерел: внутрішнє підтягування ESP32 типово `45 кОм` — на порядок вище
    за те, що допускає I²C-шина (за формулою UM10204 з VDD≈3.3 В і типовою ємністю шини 100–400 пФ вихідний
    `Rp` виходить одиниці кОм, не десятки), звідси «вбудованого замало». Число «4.7 кОм» саме по собі
    в UM10204 не написане — це практичне значення посередині діапазону, який задають формули специфікації,
