- nazva: Логічні рівні ESP32 — близько 0 В / близько 3.3 В
  zbih: 'Для ESP32: близько 0 В — логічний нуль, близько 3\.3 В — логічна одиниця\.'
  dzherelo: ESP32 Series Datasheet — Table 5-3. DC Characteristics (3.3 V, 25 °C)
  cytata: 'VIH   High-level input voltage    0.75 × VDD  —  VDD + 0.3   V

    VIL   Low-level input voltage     –0.3  —  0.25 × VDD         V

    VOH   High-level output voltage   0.8 × VDD  —  —             V

    VOL   Low-level output voltage    —  —  0.1 × VDD             V

    '
  sposib: PDF Espressif, кеш `esp32-datasheet.pdf` (з попереднього кроку), pdftotext -layout, 2026-08-26
  notatka: 'Клас `B`: книга каже «близько 0 В» і «близько 3.3 В» — розмовне спрощення. Таблиця дає не
    точку, а порогові зони: логічний нуль — усе нижче `0.25×VDD` (0.825 В при VDD=3.3 В), одиниця — усе
    вище `0.75×VDD` (2.475 В). Формально «0 В» і «3.3 В» — це не самі пороги, а типові усталені рівні
    (`VOL`, `VOH`), які книга наближує словом «близько». Висновок однозначний, цитата не дослівна щодо
    самого формулювання.'
  title: Логічні рівні ESP32 — близько 0 В / близько 3.3 В
