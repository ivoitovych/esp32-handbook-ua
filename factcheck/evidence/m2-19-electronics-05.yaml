- nazva: Резистор 220–330 Ом для червоного LED — арифметика закону Ома
  zbih: Резистор 220–330 Ом підходить майже завжди\.
  dzherelo: Закон Ома, застосований до `T-05-019` (падіння `1.9–2.3 В`, датшит Kingbright WP7113ID) і
    живлення `3.3 В`
  cytata: "R = (Vсупply - Vf) / I\n\nПри Vf = 2.0 В (типове з datasheet), Vсупply = 3.3 В:\n  R = 220\
    \ Ом → I = (3.3 - 2.0) / 220 = 5.9 мА\n  R = 330 Ом → I = (3.3 - 2.0) / 330 = 3.9 мА\n"
  sposib: обчислення, 2026-08-26
  notatka: 'Чесна розбіжність, а не збіг один-в-один: заявлений струм у книзі — «5–10 мА» (T-05-019),
    а резистори 220–330 Ом за законом Ома дають 3.9–5.9 мА — нижній край діапазону, не середину. Це не
    помилка: консервативніший струм означає довший ресурс LED і менший нагрів резистора, і «майже завжди
    підходить» лишається правдою (світить помітно на будь-якому зі значень). Але хто підставить формулу
    буквально під «5–10 мА», отримає інший резистор (130–260 Ом).'
  title: Резистор 220–330 Ом для червоного LED — арифметика закону Ома
  match: Резистор 220–330 Ом підходить майже завжди\.
  status: arithmetic
  source: Закон Ома, застосований до `T-05-019` (падіння `1.9–2.3 В`, датшит Kingbright WP7113ID) і живлення
    `3.3 В`
  quote: "R = (Vсупply - Vf) / I\n\nПри Vf = 2.0 В (типове з datasheet), Vсупply = 3.3 В:\n  R = 220 Ом\
    \ → I = (3.3 - 2.0) / 220 = 5.9 мА\n  R = 330 Ом → I = (3.3 - 2.0) / 330 = 3.9 мА\n"
  method: обчислення, 2026-08-26
  note: 'Чесна розбіжність, а не збіг один-в-один: заявлений струм у книзі — «5–10 мА» (T-05-019), а резистори
    220–330 Ом за законом Ома дають 3.9–5.9 мА — нижній край діапазону, не середину. Це не помилка: консервативніший
    струм означає довший ресурс LED і менший нагрів резистора, і «майже завжди підходить» лишається правдою
    (світить помітно на будь-якому зі значень). Але хто підставить формулу буквально під «5–10 мА», отримає
    інший резистор (130–260 Ом).'
  calculation: R = (U_живлення − U_світлодіода) / I;  (3.3 − 2.0) / 220 = 5.9 мА;  (3.3 − 2.0) / 330 =
    3.9 мА
- nazva: Синій/білий LED — падіння близько 3 В
  zbih: Синій і білий світлодіоди мають більше падіння \(близько 3 В\), тому від 3\.3 В світять слабко
    — це нормально\.
  dzherelo: Kingbright WP7113QBC/D (Blue, InGaN), datasheet — таблиця «Electro-Optical Characteristics»
  cytata: 'Forward Voltage IF = 20mA   VF   Blue   Typ. 3.3   Max. 4.0   V

    '
  sposib: PDF Kingbright, кеш `led-blue-wp7113qbc.pdf`, pdftotext -layout, 2026-08-26
  notatka: 'Клас `B`, не `A`: перша половина речення («близько 3 В») — дослівний збіг із `Typ. 3.3 В`
    (при `IF=20 мА`, іншому струмі випробування, ніж у червоного). Друга половина («тому... світять слабко»)
    — вже висновок, а не цитата: якщо `3.3 В` живлення ледь вище за `Vf=3.3 В` типове (і нижче за `Max.
    4.0 В` — тобто гірші екземпляри в розкиді виробництва можуть не запалитися взагалі), струм через резистор
    виходить малий, звідси тьмяне світіння. Datasheet цього логічного кроку не робить, я — так.'
  title: Синій/білий LED — падіння близько 3 В
  match: Синій і білий світлодіоди мають більше падіння \(близько 3 В\), тому від 3\.3 В світять слабко
