- nazva: Знижувати 5 В обов'язково — абсолютний максимум входу 3.6 В
  zbih: \*\*Пристрій на 5 В → ESP32\.\*\* Потрібне зниження \*\*обов'язково\*\*\.
  dzherelo: ESP32 Series Datasheet — Table 5-1. Absolute Maximum Ratings
  cytata: "VDDA, VDD3P3, VDD3P3_RTC, VDD3P3_CPU, VDD_SDIO\n  Allowed input voltage   Min –0.3   Max 3.6\
    \   V\n\nStresses above those listed in Table 5-1 Absolute Maximum Ratings\nmay cause permanent damage\
    \ to the device.\n"
  sposib: PDF Espressif, кеш `esp32-datasheet.pdf`, pdftotext -layout, 2026-08-26
  notatka: 5 В перевищує `3.6 В` абсолютного максимуму — це і є причина, чому зниження «обов'язкове»,
    а не просто бажане. Datasheet не пише прямо «5 В подавати не можна», але з абсолютного максимуму це
    випливає однозначно — звідси `B`, не `A`.
