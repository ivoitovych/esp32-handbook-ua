- nazva: WROOM-32E — 100 нФ близько до виводів живлення в референсній схемі
  zbih: \*\*Керамічний 100 нФ\*\* біля кожної мікросхеми, якомога ближче до її ніжок живлення\.
  dzherelo: ESP32-WROOM-32E/32UE Datasheet, Espressif — Figure 9, «Peripheral Schematics» (типова схема
    застосування модуля)
  cytata: "9 Peripheral Schematics\nThis is the typical application circuit of the module connected\n\
    with peripheral components (for example, power supply, antenna,\nreset button, JTAG interface, and\
    \ UART interface).\n  VDD33 ... C1 22uF   C2 0.1uF ... EN ... 3V3\n"
  sposib: PDF Espressif, кеш `esp32-wroom-32e.pdf` (з попереднього кроку), pdftotext -layout, 2026-08-26
  notatka: 'Клас `B`: референсна схема Espressif ставить `0.1 мкФ` (= 100 нФ) саме на вивід живлення `VDD33`
    модуля — конкретний, задокументований приклад тієї самої практики. Але це один приклад (живлення самого
    модуля), а не загальна вимога «біля кожної мікросхеми» на платі користувача — книжкове узагальнення
    на «кожну мікросхему» ширше за те, що показує це джерело.'
