- nazva: 3.3 В — практична межа GPIO, консервативніша за паспортну 3.6 В
  zbih: 3\.3 В — межа для GPIO\. 5 В можна тільки на `VIN`\.
  dzherelo: ESP32 Series Datasheet — Table 5-1 (Allowed input voltage, Max 3.6 В) і Table 5-3 (VIH Max
    = VDD + 0.3 В)
  cytata: 'Allowed input voltage: Min –0.3, Max 3.6 V

    VIH High-level input voltage: 0.75 × VDD — VDD + 0.3 V

    '
  sposib: PDF Espressif, кеш `esp32-datasheet.pdf`, pdftotext -layout, 2026-08-26
  notatka: 'Паспортна межа насправді `3.6 В` (VDD 3.3 В + 0.3 В запасу), не рівно `3.3 В`. Книжкове «3.3
    В — межа» — свідомо консервативніше округлення для читача-практика: правило «не вище 3.3» ніколи не
    виведе за паспортну межу, тоді як буквальне «можна до 3.6» — це вже запас виробника на шум і допуск,
    а не робочий орієнтир. Це узгоджено з рештою розділу (`nezvorotne`-блок про 5 В на GPIO), не суперечність.'
