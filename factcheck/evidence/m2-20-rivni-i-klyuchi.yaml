- nazva: LV/HV-конвертер — маркування модуля, не характеристика транзистора
  zbih: '`LV` до 3\.3 В, `HV` до 5 В, землі з.єднані\.'
  klas: E
  dzherelo: —
  cytata: —
  sposib: 'Перевірено `bss138.pdf` (Diodes Inc, BSS138) — датащит польового транзистора не
    містить схеми застосування з підписами `LV`/`HV` чи слова «bidirectional»: пошук за обома
    словами й «level shift» не дав збігів.'
  notatka: 'Маркування виводів `LV`/`HV` належить конкретним комерційним платам-перетворювачам
    рівня (на кшталт відомого дизайну на BSS138, що його продають під різними брендами), а
    не голому транзистору — датащит самого BSS138 такої схеми застосування не описує. Підтвердити
    саме цей напис можна тільки документацією конкретної плати, якої немає серед джерел цього
    кроку. Побічно датащит BSS138 підтверджує лише те, що механізм у принципі можливий: поріг
    відкриття `VGS(TH)` — 0.5–1.5 В (типово 1.2 В), і графік нормованого опору канала при
    VGS 3.25–4.5 В показує транзистор уже впевнено відкритим при напругах, близьких до 3.3
    В — тобто затвор, підключений до 3.3-вольтової сторони, справді може керувати каналом.
    Але це підтверджує механізм, а не саме формулювання «LV/HV» — тому клас лишається E.'
