- nazva: 74HC на 5 В — вихід близький до напруги живлення, вище за абсолютний максимум ESP32
  zbih: \| Логіка 74HC при живленні 5 В \| усі виходи \|
  klas: B
  dzherelo: Texas Instruments, SN74HC04 Hex Inverter datasheet, розділ 6.5 «Electrical Characteristics»,
    параметр `VOH`
  cytata: "Operating free-air temperature (TA)\nPARAMETER                TEST CONDITIONS \
    \                   VCC                25°C                      -40°C to 85°C       \
    \   UNIT\n                                                              MIN       TYP\
    \         MAX       MIN        TYP    MAX\nHigh-level        VI = VIH\nVOH           \
    \                                                4.5 V              4.4      4.499   \
    \                4.4                       V\noutput voltage    or VIL               \
    \           IOH = -20 µA\n"
  sposib: PDF з кешу `sn74hc04.pdf`, завантажено `vzyaty.sh` з ti.com, pdftotext -layout,
    2026-08-26
  notatka: 'Таблиця в datasheet не має окремого рядка рівно для VCC = 5 В (кроки виміру —
    2 В, 4.5 В, 6 В), тому це клас B, а не A: при 4.5 В вихід у режимі легкого навантаження
    (`IOH = -20 µA`) уже 4.4–4.499 В, майже впритул до живлення; при живленні 5 В вихід так
    само близький до 5 В за тим самим механізмом КМОП-виходу (rail-to-rail при малому струмі).
    Це виразно вище за абсолютний максимум входу ESP32 (3.6 В, `m2-06-napruga-mezhi.yaml`)
    — висновок «усі виходи» небезпечні для прямого з''єднання підтверджується. SN74HC04 —
    один вентиль родини 74HC; електричні характеристики виходу однакові в межах родини (та
    сама технологія КМОП-виходу), тому представницьке значення для «логіки 74HC» узагалі,
    а не лише для однієї мікросхеми.'
