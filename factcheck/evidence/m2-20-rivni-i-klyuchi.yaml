    \ — а для примірника з порогом 4.0 В вона нижча за поріг, — і жодного значення RDS(on)\
    \ паспорт для 3.3 В не дає взагалі. Частково відкритий канал має великий опір, а розсіяна\
    \ потужність — це I²R.\nПротилежний бік підтверджує IRLZ44 (dzherela-kesh/8a533279-irlz44.pdf):\
