- nazva: Перегрів звичайного MOSFET від 3.3 В — не звірено цим набором джерел
  zbih: Від 3\.3 В він відкривається \*\*частково\*\*, має підвищений опір, гріється і згорає
    — не одразу, а через хвилини або години роботи\.
  klas: B
  dzherelo: https://www.vishay.com/docs/91021/irf540.pdf
  cytata: Gate-source threshold voltage
  sposib: "Даташит IRF540 (Vishay) з кешу, 2026-08-28. Виведення, не цитата:\n  поріг затвора\
