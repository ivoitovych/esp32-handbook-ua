- nazva: 5 В на GPIO — понад абсолютний максимум входу ESP32
  zbih: '\*\*5 В на GPIO вбивають пін, іноді чип\.\*\* Єдиний виняток — пін `5V`/`VIN`: це
    вхід стабілізатора, а не вхід у чип\.'
  klas: A
  dzherelo: 'Espressif Systems, ESP32 Series Datasheet v5.3, Table 5-1 «Absolute Maximum Ratings»,
    с. 51 (кеш: dzherela-kesh/esp32_datasheet_en.pdf)'
  cytata: "Stresses above those listed in Table 5-1 Absolute Maximum Ratings may cause permanent\
    \ damage to the\ndevice.\n\n                                             Table 5-1. Absolute\
    \ Maximum Ratings\n\n        Parameter                                         Description\
    \                          Min         Max            Unit\n        VDDA, VDD3P3, VDD3P3_RTC,\n\
    \                                                          Allowed input voltage     \
    \               –0.3         3.6        V\n        VDD3P3_CPU, VDD_SDIO\n"
  sposib: PDF з кешу `esp32-datasheet.pdf`, pdftotext -layout, 2026-08-26
  notatka: 'Той самий факт, що вже доведений у `m2-06-napruga-mezhi.yaml` (5 В перевищує абсолютний
    максимум 3.6 В), але тут — інше формулювання книги («5 В на GPIO вбивають пін, іноді чип»,
    картка К14), яке взірці m2-06 не покривають. Друга половина речення — що `5V`/`VIN` веде
    на вхід **стабілізатора**, а не в сам чип, — це властивість типової плати розробки (розводка),
    а не кристала: ESP32 Series Datasheet описує лише вимоги до виводів живлення самого чипа
    (Table 5-2, вхід стабілізатора на платі там не фігурує). Ця частина твердження лишається
    на рівні загальновідомої практики плат розробки, не підтвердженої тут окремим джерелом.'
  title: 5 В на GPIO — понад абсолютний максимум входу ESP32
  match: '\*\*5 В на GPIO вбивають пін, іноді чип\.\*\* Єдиний виняток — пін `5V`/`VIN`: це
    вхід стабілізатора, а не вхід у чип\.'
  status: verbatim
  source: 'Espressif Systems, ESP32 Series Datasheet v5.3, Table 5-1 «Absolute Maximum Ratings»,
    с. 51 (кеш: dzherela-kesh/esp32_datasheet_en.pdf)'
  quote: "Stresses above those listed in Table 5-1 Absolute Maximum Ratings may cause permanent\
    \ damage to the\ndevice.\n\n                                             Table 5-1. Absolute\
    \ Maximum Ratings\n\n        Parameter                                         Description\
    \                          Min         Max            Unit\n        VDDA, VDD3P3, VDD3P3_RTC,\n\
    \                                                          Allowed input voltage     \
    \               –0.3         3.6        V\n        VDD3P3_CPU, VDD_SDIO\n"
  method: PDF з кешу `esp32-datasheet.pdf`, pdftotext -layout, 2026-08-26
  note: 'Той самий факт, що вже доведений у `m2-06-napruga-mezhi.yaml` (5 В перевищує абсолютний
    максимум 3.6 В), але тут — інше формулювання книги («5 В на GPIO вбивають пін, іноді чип»,
    картка К14), яке взірці m2-06 не покривають. Друга половина речення — що `5V`/`VIN` веде
    на вхід **стабілізатора**, а не в сам чип, — це властивість типової плати розробки (розводка),
    а не кристала: ESP32 Series Datasheet описує лише вимоги до виводів живлення самого чипа
