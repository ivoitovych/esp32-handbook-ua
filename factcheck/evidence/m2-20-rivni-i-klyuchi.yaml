- nazva: Резистор 100–220 Ом — межа кидка струму в межах можливостей піна ESP32
  zbih: \*\*100–220 Ом послідовно з затвором\*\* обмежує кидок струму в момент перемикання\.
  klas: D
  dzherelo: закон Ома, застосований до заявлених номіналів і напруги логіки ESP32
  rozrakhunok: 'Пікова напруга на резисторі в момент перемикання (незаряджений

    затвор ≈ 0 В, GPIO видає логічну одиницю ESP32 ≈ 3.3 В):


    I = U / R


    R = 100 Ом:  I = 3.3 В / 100 Ом  = 33 мА

    R = 220 Ом:  I = 3.3 В / 220 Ом  ≈ 15 мА


    Порівняння з IOH ESP32 (Table 5-3, `m2-06`/цей файл): типове

    значення на максимальній силі драйвера — 40 мА. Обидва кінці

    діапазону 100–220 Ом лишаються під цією межею (33 мА і 15 мА

    проти 40 мА), тобто резистор справді утримує кидок струму в межах

    того, що пін здатен віддати, а не лише «на око».

    '
  sposib: Розрахунок на основі номіналів із книги і IOH з `esp32-datasheet.pdf` (Table 5-3),
    pdftotext -layout, 2026-08-26
  notatka: 'Причина, яку називає книга («затвор — це ємність, і без резистора вона заряджається
    струмом, що перевищує можливості піна»), — стандартна електроніка: без обмежувального
    резистора початковий струм заряду ємності обмежений лише вихідним опором драйвера й індуктивністю
    дротів, а не законом Ома по заданому резистору, і справді може короткочасно перевищити
    паспортні 40 мА. З резистором 100–220 Ом пікове значення розрахунково нижче за IOH.'
  title: Резистор 100–220 Ом — межа кидка струму в межах можливостей піна ESP32
