- nazva: MOSFET логічного рівня IRLZ44N — характеризований і при 4–5 В, не лише 10 В
  zbih: 'Ключове слово — «логічного рівня»: такий повністю відкривається від 3\.3 В\.'
  klas: B
  dzherelo: International Rectifier / Infineon, IRLZ44NPbF HEXFET Power MOSFET datasheet (PD-94831),
    «Electrical Characteristics», параметр `RDS(on)`
  cytata: 'l Logic-Level Gate Drive

    0.022               V GS = 10V, ID = 25A

    RDS(on)         Static Drain-to-Source On-Resistance          0.025  Ω           V GS
    = 5.0V, ID = 25A

    0.035              V GS = 4.0V, ID = 21A

    VGS(th)         Gate Threshold Voltage                    1.0   2.0     V           V
    DS = V GS, ID = 250µA

    '
  sposib: PDF IRLZ44N з кешу `irlz44n2.pdf` (дзеркало octopart.com; основний infineon.com
    із цієї мережі не віддав файл), pdftotext -layout, 2026-08-26
  notatka: 'Датащит явно позиціонує деталь як «Logic-Level Gate Drive» і наводить `RDS(on)`
    не лише при звичних 10 В, а й при 5.0 В (0.025 Ом) і 4.0 В (0.035 Ом) — тобто транзистор
    і справді впевнено відкритий задовго до 10 В, а поріг відкриття `VGS(th)` — лише 1.0–2.0
    В.

    Важливий нюанс, який варто занести окремою поміткою: **наймолодша точка вимірювання в
    цьому конкретному датащиті — 4.0 В, не 3.3 В**. Формулювання книги «повністю відкривається
    від 3.3 В» екстраполює за межу того, що датащит буквально гарантує числом. При 3.3 В (між
    `VGS(th)`max = 2.0 В і виміряними 4.0 В) транзистор інженерно точно вже провідний, але
    точного `RDS(on)` саме для 3.3 В у цьому документі немає. Тому клас B, а не A, і причина
    цього — не помилка книги, а точність формулювання «повністю».'
  title: MOSFET логічного рівня IRLZ44N — характеризований і при 4–5 В, не лише 10 В
