- nazva: Джерело мусить давати щонайменше 0.5 А за datasheet
  zbih: джерело для ESP32 з Wi-Fi має тягнути щонайменше\s+1 А
  klas: B
  dzherelo: ESP32 Series Datasheet v5.3, Table 5-2, параметр IVDD; разом із Table 5-4 «Current Consumption
    Depending on RF Modes»
  cytata: 'Table 5-2. Recommended Power Supply Characteristics

    IVDD   Current delivered by external power supply    Min 0.5   —   —   A


    Table 5-4 (пік передачі):

    Transmit 802.11b, DSSS 1 Mbps, POUT = +19.5 dBm     Typ 240 mA

    '
  sposib: PDF Espressif, кеш `esp32-datasheet.pdf`, pdftotext -layout, 2026-08-26
  notatka: 'Клас `B`, а не `A`, і це важливо розрізнити. Джерело нормує мінімум **0.5 А**, а книга радить
    **1 А**. Числа різні, і суперечності немає лише тому, що книга подає своє як «практичний висновок»
    і називає причину — джерело мусить тримати напругу під короткими піками, а не покривати середнє.

    Datasheet цю причину підтверджує з іншого боку: пік передачі 240 мА при середньому споживанні близько
    сотні. Тобто вимога джерела визначається не середнім струмом, а здатністю не просісти на короткому
    сплеску — саме те, що книга й каже.

    Але формулювання «блок на 500 мА не годиться» варте нагляду: 0.5 А — це рівно паспортний мінімум Espressif.
    Книга має рацію практично (дешеві блоки просідають), проте читач, який звірить із datasheet, побачить
    розбіжність. Винесено окремою знахідкою.'
