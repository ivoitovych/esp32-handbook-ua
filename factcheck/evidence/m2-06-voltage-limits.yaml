- nazva: Робоча напруга живлення — 3.0–3.6 В, типова 3.3 В
  zbih: не нижче 3\.0 В
  klas: A
  dzherelo: ESP32 Series Datasheet v5.3, Table 5-2 «Recommended Power Supply Characteristics», с. 51,
    разом із приміткою 2
  cytata: "Table 5-2. Recommended Power Supply Characteristics\nParameter                          Description\
    \                     Min       Typ   Max  Unit\nVDDA, VDD3P3_RTC, VDD3P3,     Voltage applied to\
    \ power\nVDD_SDIO (3.3 V mode)         supply pins per power domain   2.3/3.0 [2]     3.3   3.6  \
    \ V\n\n[2] • Chips with a 3.3 V flash or PSRAM in-package: this minimum voltage is 3.0 V;\n    • Chips\
    \ with no flash or PSRAM in-package: this minimum voltage is 2.3 V.\n"
  sposib: PDF Espressif, кеш `esp32-datasheet.pdf`, pdftotext -layout, 2026-08-26
  notatka: 'Поріг «не нижче 3.0 В» у картці К13 збігається з нижньою межею джерела для чипів із флешем
    у корпусі — тобто саме для того випадку, який тримає в руках читач: модуль із флешем.

    Примітка 2 додає те, чого в книзі немає й що варте рядка: для чипів **без** флешу в корпусі нижня
    межа 2.3 В. Різниця не академічна — вона пояснює, чому та сама просадка на одній платі валить завантаження,
    а на іншій ні.'
