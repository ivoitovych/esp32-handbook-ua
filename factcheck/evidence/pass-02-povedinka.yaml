  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/docs/en/api-reference/peripherals/adc_oneshot.rst
  cytata: ':esp32c3: - ADC2 oneshot mode is no longer supported, due to hardware limitations.

    The results are not stable. This issue can be found in `ESP32-C3 Series SoC Errata`.

    For compatibility, you can enable :ref:`CONFIG_ADC_ONESHOT_FORCE_USE_ADC2_ON_C3` to force
    use ADC2.

    '
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Знахідка проходу, і серйозніша за попередню. Картка К9 і додаток A подавали `GPIO5`
    на C3 як звичайний аналоговий вхід. Насправді разовий режим ADC2 на C3 в ESP-IDF вимкнено
    через ваду кремнію, і ввімкнути його можна лише примусовим перемикачем. Читач, який заклав
    цей пін в аналогову частину плати, отримав би нестабільні показання без жодного повідомлення.
