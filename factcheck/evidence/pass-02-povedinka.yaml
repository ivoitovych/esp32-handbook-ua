- nazva: ESP32 у ролі веденого I²C не вміє розтягувати SCL
  zbih: сам ESP32 у ролі веденого|розтягувати `SCL` не вміє
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/docs/en/api-reference/peripherals/i2c.rst
  cytata: 'The ESP32 I2C controller does not support clock stretching when operating as a
    slave.

    Therefore, in addition to driver configuration, the application layer should pay attention

    to speed matching and synchronization between master and slave devices: if the master

    processes too fast while the slave responds slowly, communication errors or data loss
    may occur.

    '
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Прогалина, знайдена проходом. Розділ 35 описував розтягування лише з боку ведучого
    — і це було правильно, але однобоко. Зворотний бік важливий для companion-схеми (розділ
    57), де ESP32 саме й прикидається веденим для чужої системи. Додано блок уваги з практичним
    наслідком: синхронізацію доводиться робити рівнем вище.'
