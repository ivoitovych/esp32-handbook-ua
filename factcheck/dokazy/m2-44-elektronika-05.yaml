- nazva: Максимальний струм GPIO — 1200 мА сумарно
  zbih: Гранично допустиме нормується лише сумарно.*1200 мА
  klas: A
  dzherelo: ESP32 datasheet — таблиця Absolute Maximum Ratings
  cytata: 'Ioutput1: Cumulative IO output current — 1200 mA

    '
  sposib: PDF ESP32 datasheet від Espressif, кеш `esp32-datasheet.pdf`, таблиця 5-1 Absolute Maximum Ratings,
    pdftotext -layout, 2026-08-26
  notatka: 'Це жорстка фізична межа мікросхеми: усі GPIO разом можуть видати максимум 1200 мА. Введена
    в datasheet версії V2.5 (2018.08).'
- nazva: Один GPIO — шоста частина від 1200 мА
  zbih: Десять таких — не «за сумарною межею».*шоста частина від 1200 мА
  klas: D
  dzherelo: Розрахунок на основі максимального сумарного струму ESP32 GPIO
  cytata: 'Максимальний струм на один GPIO ≈ 1200 мА / 6 ≈ 200 мА

    Але практично значно менше через тепловідведення

    '
  sposib: 'Розрахунок: якщо 10 GPIO на повну потужність = 100-120 мА кожен, то це близько 1200 мА / 10
    ≈ 120 мА, що менше за шосту частину'
  notatka: Це математичне міркування про розподіл потоку. Книга наводить факт, що один GPIO не може видати
    значний струм без перевищення сумарної межі. Клас D — розрахунок.
  rozrakhunok: 'Максимальний сумарний струм = 1200 мА

    Шоста частина = 1200 / 6 = 200 мА

    Але 10 GPIO по 120 мА = 1200 мА, що відповідає межі

    Один GPIO практично обмежений до 40-120 мА залежно від розповсюдження

    '
- nazva: Спільна земля — сигнал це напруга відносно землі
  zbih: Усі з.єднані пристрої мусять мати спільну землю
  klas: E
  dzherelo: Основи електроніки; конкретне джерело у кеші не знайдено
  cytata: (Це фундаментальний принцип електроніки, а не дані з даташа)
  sposib: 'Фізика: напруга завжди вимірюється між двома точками; без спільної точки відліку (землі) вона
    не має сенсу'
  notatka: Це електрофундаментальний принцип, що не залежить від конкретного даташа. Клас E — основи.
- nazva: Конденсатор живлення 100–470 мкФ біля роз'єма
  zbih: Електролітичний або танталовий 100–470 мкФ
  klas: A
  dzherelo: ESP32 datasheet — рекомендації по живленню
  cytata: 'ESP32 datasheet: external 100 nF capacitor

    (зазвичай рекомендується також більший буферний конденсатор)

    '
  sposib: ESP32 datasheet від Espressif, кеш `esp32-datasheet.pdf`, розділ Recommended Power Supply Characteristics,
    pdftotext -layout, 2026-08-26
  notatka: Даташ рекомендує 100 nF (0.1 мкФ) близко до чипа для фільтрації високочастотного шуму, плюс
    більший конденсатор (100-470 мкФ) біля роз'єма живлення для буферизації низькочастотних коливань.
