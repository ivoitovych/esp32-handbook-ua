# М2, проект 2 — логер: 8 тверджень класу F

- nazva: "ESP32 classic або C3 — одиниця в проєкті логера"
  zbih: 'ESP32 classic або C3.*Кількість → 1'
  klas: A
  dzherelo: "manual/60-proj-loger.md, рядок 28"
  cytata: |
    | ESP32 classic або C3 | 1 | **не плата розробки** для фінальної версії |
  sposib: "дослівна цитата з таблиці компонентів"

- nazva: "Таблиця розпіновки: Сигнал | classic | C3"
  zbih: '\| Сигнал \| classic \| C3 \|'
  klas: A
  dzherelo: "manual/60-proj-loger.md, рядок 45"
  cytata: |
    | Сигнал | classic | C3 |
  sposib: "дослівна цитата з таблиці розпіновки"

- nazva: "На C3 рідним для MISO залишився тільки GPIO2, який уже інакше використовується"
  zbih: 'На C3 рідними лишилися тільки.*рідний.*GPIO2'
  klas: B
  dzherelo: "manual/60-proj-loger.md, рядок 54"
  cytata: |
    На C3 рідними лишилися тільки `SCK` і `MOSI`: рідний `MISO` там `GPIO2`, 
    а він уже пішов під ключ дільника.
  sposib: "випливає з того, що в таблиці GPIO2 вже використовується для ключа дільника"

- nazva: "GPIO2 використовується як strapping-пін для дільника, чинний лише як вихід"
  zbih: 'GPIO2.*strapping-пін.*виключно як вихід'
  klas: B
  dzherelo: "manual/60-proj-loger.md, рядок 86"
  cytata: |
    Тому ключ дільника доводиться вішати на strapping-пін `GPIO2` — це припустимо 
    лише тому, що він працює тут **виключно як вихід** і лише після старту 
    (розділ 07), а зовнішньої обв'язки на ньому немає.
  sposib: "випливає з документації про strapping-піни та логіки використання GPIO2"

- nazva: "Для C3 піни слід взяти з таблиці розпіновки"
  zbih: 'Для C3 підставте піни з таблиці'
  klas: A
  dzherelo: "manual/60-proj-loger.md, рядок 99"
  cytata: |
    Для C3 підставте піни з таблиці вище.
  sposib: "дослівна цитата"

- nazva: "GPIO2 як strapping-пін на C3 — свідомий компроміс"
  zbih: 'C3.*свідомий компроміс.*strapping-пін'
  klas: A
  dzherelo: "manual/60-proj-loger.md, рядок 166"
  cytata: |
    Рядок `PIN_DILNYK_EN` на C3 — свідомий компроміс і єдине місце, 
    де довелося взяти strapping-пін.
  sposib: "дослівна цитата"

- nazva: "Лог при розрядженому акумуляторі (< 3.2 В)"
  zbih: 'ESP_LOGE.*акумулятор.*засинаємо назавжди'
  klas: A
  dzherelo: "manual/60-proj-loger.md, рядок 200"
  cytata: |
    ESP_LOGE(TAG, "акумулятор %.2f В — засинаємо назавжди", napruga);
  sposib: "дослівна цитата з коду"

- nazva: "Лог про недоступність карти microSD"
  zbih: 'ESP_LOGW.*картка недоступна.*буфері'
  klas: A
  dzherelo: "manual/60-proj-loger.md, рядок 211"
  cytata: |
    ESP_LOGW(TAG, "картка недоступна, у буфері %u", u_buferi);
  sposib: "дослівна цитата з коду"

