- nazva: 'T-02-105: Але зроблене без збереження `sdkconfig.defaults` доведеться налаштовувати
    заново.'
  zbih: Але\s+зроблене\s+без\s+збереження
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/master/docs/en/api-guides/build-system.rst
  cytata: 'For example projects or other projects where you dont want to specify a full sdkconfig
    configuration, but you do want to override some key values from the ESP-IDF defaults,
    it is possible to create a file sdkconfig.defaults in the project directory. This file
    will be used when creating a new config from scratch, or when any new config value hasnt
    yet been set in the sdkconfig file.

    '
  sposib: 'Суцільний прохід 2026-08-27. Документ отримано в сесії, витяг звірено з ним підрядком
