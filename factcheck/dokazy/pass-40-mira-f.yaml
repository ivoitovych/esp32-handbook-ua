# Прохід 40 — те, що вціліло з міри класу `F`.
#
# Три хвилі по 250 одиниць. Перші дві провалилися через мої наряди
# (див. `factcheck/POMICHNYKY.md`), третя дала 196 придатних відповідей.
#
# Далі — два механічні фільтри й один людський:
#
#   196 відповідей
#   → 113 із цитатою
#   →  58 цитата дослівна (шар 3)
#   →   ? цитата доводить саме це (шар 2, нижче)
#
# Шар 2 роблю сам. Він відкинув чверть того, що витримало шар 3, — і
# найцікавіший випадок опинився серед відкинутих не тому, що книга
# помиляється, а тому, що **так довести не можна**.

# ── Доведене однозначно ────────────────────────────────────────────────
#
# Порожня таблиця можливостей чипів: одна одиниця = одна комірка = один
# рядок `soc_caps.h` того самого сімейства. Найчистіший вид доказу, який
# у нас буває.


# ── Відкинуто шаром 2: цитата дослівна, але доводить не те ─────────────
#
# `T-02-055`. Книга каже: «BLE · S2 → **ні**».
# Помічник навів із `esp32s2/include/soc/soc_caps.h`:
#
#     #define SOC_WIFI_SUPPORTED              1
#
# Рядок **дослівний** — шар 3 його пропустив, і правильно. Але це макрос
# **Wi-Fi**, а твердження про **BLE**. Доводить він щось інше про той
# самий чип.
#
# **Твердження книги при цьому правильне.** Перевірив сам: у заголовку
# S2 рядка `SOC_BLE_SUPPORTED` **немає взагалі** — жодного входження.
# Саме ця відсутність і доводить, що BLE в S2 немає.
#
# І ось у чому річ: **відсутність не можна процитувати.** Поле `cytata`
# перевіряється як підрядок, а в порожнечі підрядка немає. Наш формат
# доказу не вміє висловити найпоширеніший вид негативного твердження —
# «цього в документі немає».
#
# Це не помилка помічника. Йому дали формат, у якому правильну відповідь
# висловити нічим, — і він підставив найближчий рядок із потрібного
# файлу. Так само вчинив би будь-хто, кому обов'язково треба заповнити
# поле.
#
# Одиниця лишається незвіреною до появи способу. Пропозиція — у
# `factcheck/SCHEMA.md`, розділ «Доказ відсутністю».

# ── Відкинуто шаром 2: цитата не про те ────────────────────────────────
#
# `T-11-061`. Книга: «`sdkconfig.defaults` застосовується при кожному
# збиранні». Цитата: `include($ENV{IDF_PATH}/tools/cmake/project.cmake)`
# — рядок із `CMakeLists.txt` прикладу. Про `sdkconfig.defaults` не
# каже нічого.
#
# `T-12-013`. Книга: практична порада, коли переходити з Arduino на
# ESP-IDF. Цитата: рядок змісту з посиланням на сторінку документації.
# Наявність сторінки не підпирає поради.
#
# Обидва — той самий взірець, що й `T-46-039` (U8g2) у проході 39:
# **джерело містить щось поруч, але не стверджує цього.**

# ── Частково: клас B з названою недоведеною половиною ──────────────────


























