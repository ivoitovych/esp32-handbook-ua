# М2, крок 16 — рядки датчиків у додатку E (dodatky/e-interfeysy.md).
#
# Найщільніший файл книги: реєстр ділить кожен рядок таблиці I²C на
# окремі комірки виду «Пристрій · Колонка → Значення». Адреси в цих
# рядках уже закриті класом A в pass-16-interfeysy («Адреси I²C у
# додатку E — усі тринадцять рядків») — тут їх не чіпаю. Мета цього
# кроку — колонка «Що дає» (призначення мікросхеми) там, де вона ще не
# звірена, плюс дві клітинки «Бібліотека», які варто чесно позначити
# класом E замість тримати в стані «не звірено».
#
# Джерела в кеші: `sht3x.pdf`, `sht4x.pdf` (Sensirion), `mpu6050.pdf`
# (TDK InvenSense, register map RM-MPU-6000A). `bme280.pdf` і
# `bmp280.pdf` (Bosch) також завантажено — потрібні не для нової
# клітинки, а для звірки вже наявного класу C (див. нотатку нижче: там
# знайдено проблему самого запису, а не книги). `bh1750.pdf` довантажено
# для повноти кешу, але «Що дає»/«Бібліотека» для BH1750 уже закриті
# класом D в реєстрі — нового запису тут не заводжу. VL53L0X пропущено:
# st.com не береться curl-ом із цієї мережі. ADS1115 і PCA9685 у книзі
# не згадуються — таблиця в додатку E не містить жодного з двох рядків;
# перевіряти нічого.

- nazva: SHT3x / SHT4x — точна вологість, ±1–1.5 %RH
  zbih: 'SHT3x / SHT4x · Що дає → точна вологість'
  klas: A
  dzherelo: >-
    Sensirion, Datasheet SHT3x-DIS (Humidity and Temperature Sensor) і
    Datasheet SHT4x (4th Gen. Relative Humidity and Temperature Sensor),
    розділи «Key features»/«Highlights» на титульній сторінці кожного
  cytata: |
    (SHT3x-DIS)
    Datasheet SHT3x-DIS
    Humidity and Temperature Sensor
    ▪ Typical accuracy of ±1.5 %RH and ±0.1 °C for
      SHT35

    (SHT4x)
    Datasheet – SHT4x
    4th Gen. Relative Humidity and Temperature Sensor
    Highlights
    • Accuracies ΔRH = ±1.0 %RH, ΔT = ±0.1 °C
  sposib: >-
    PDF Sensirion, кеш `sht3x.pdf` і `sht4x.pdf`, реєстр
    `factcheck/DZHERELA-m2.md`, pdftotext -layout, 2026-08-26. У витягу
    з `sht3x.pdf` символ «±» pdftotext віддає як приватний гліф шрифту
    (байти `ef 82 b1`, невидимі в терміналі) — відновлено як «±» після
    звірки з рештою документа, де той самий символ у слові «ΔT»/градусах
    передається коректно.
  notatka: >-
    «Точна вологість» підтверджено дослівно числами точності — це не
    маркетингове прикметникове слово, а конкретний допуск: ±1.5 %RH у
    топовій лінійці SHT3x (SHT35) і ±1.0 %RH у SHT4x. Для контексту
    (не змінює висновок, книга цього рядка не деталізує): SHT4x у
    таблиці «Device Overview» власного datasheet показує третю можливу
    I²C-адресу `0x46` на додачу до `0x44`/`0x45`, які вже підтверджені
    класом A в pass-16-interfeysy — рядок книги називає лише дві з
    трьох, але це найпоширеніший варіант (SHT40-xD1B), тож не помилка,
    а неповнота, вартого уваги наступного проходу з адресами.

- nazva: MPU6050 — акселерометр і гіроскоп на одному кристалі
  zbih: 'MPU6050 · Що дає → акселерометр, гіроскоп'
  klas: A
  dzherelo: >-
    TDK InvenSense, MPU-6000/MPU-6050 Register Map and Descriptions,
    Revision 4.0 (RM-MPU-6000A-00), розділ 2 «Purpose and Scope»
  cytata: |
    2   Purpose and Scope
    This document provides preliminary information regarding the register map and descriptions for the Motion
    Processing Units™ MPU-6000™ and MPU-6050™, collectively called the MPU-60X0™ or MPU™.
    The MPU devices provide the world's first integrated 6-axis motion processor solution that eliminates the
    package-level gyroscope and accelerometer cross-axis misalignment associated with discrete solutions. The
    devices combine a 3-axis gyroscope and a 3-axis accelerometer on the same silicon die together with an
    onboard Digital Motion Processor™ (DMP™) capable of processing complex 9-axis sensor fusion algorithms
    using the field-proven and proprietary MotionFusion™ engine.
  sposib: >-
    PDF TDK InvenSense (мзеркало cdn.sparkfun.com, оригінальний домен
    invensense.tdk.com віддає 404 на всі перевірені шляхи документа),
    кеш `mpu6050.pdf`, реєстр `factcheck/DZHERELA-m2.md`, pdftotext
    -layout, 2026-08-26
  notatka: >-
    «Акселерометр, гіроскоп» — точний опис: документ прямо називає
    MPU-6050 6-осьовим (3-осьовий гіроскоп + 3-осьовий акселерометр на
    одному кристалі). Побічне, вартого уваги: той самий абзац пояснює,
    чим MPU-6050 відрізняється від MPU-6000 — MPU-6050 має лише I²C, а
    MPU-6000 додає ще й SPI. Це узгоджено з тим, що книга ставить
    MPU6050 лише в I²C-таблицю додатка E, а не в SPI-таблицю поруч —
    рядка книга не помиляється, хоча цієї деталі й не проговорює.

- nazva: SHT3x / SHT4x — колонка «Бібліотека» це стан репозиторію, не факт про мікросхему
  zbih: 'SHT3x / SHT4x · Бібліотека → Sensirion'
  klas: E
  dzherelo: —
  cytata: —
  sposib: >-
    Немає зовнішнього джерела для перевірки — назва «Sensirion» тут це
    вказівка «шукай офіційну бібліотеку виробника», а не характеристика
    самої мікросхеми. Datasheet SHT3x/SHT4x про існування чи назву
    бібліотеки для Arduino/ESP-IDF не пише і писати не повинен.
  notatka: >-
    Той самий випадок, що й «Бібліотека IDE» для інших рядків додатка E
    і «Ціна плати Arduino Uno» в m2-10: клас C (недосяжне джерело)
    тут невірний, бо джерело не недосяжне — воно просто не про це.
    Клас E, редакційна вказівка, а не факт із datasheet.

