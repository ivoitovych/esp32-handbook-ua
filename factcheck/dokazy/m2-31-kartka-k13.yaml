# М2, крок 31 — докази для картки К13 "Живлення: пошук несправності"
#
# Кошик `elektro` — живлення, конденсатори, джерела енергії, автономне живлення,
# проблеми з живленням USB, LDO, стабілізатори, 18650 акумулятори.
#
# Одиниці: T-K13-011, T-K13-014, T-K13-025, T-K13-027, T-K13-028, T-K13-029, T-K13-031
#
# Джерела в кеші: `esp32-datasheet.pdf`.
# Реєстр джерел: `factcheck/DZHERELA-m2.md`.

- nazva: Вхідна напруга на роз'ємі від USB — норма 5 В ±5 %
  zbih: '5 В ±5 % \(від USB\)'
  klas: E
  dzherelo: >-
    USB стандарт (USB 2.0 specification, IEC 61538). Практика підтримується всіма
    USB-пристроями й таблицею нормалізації напруги у таблиці К13.
  cytata: |
    USB 2.0 Specification: повна напруга USB розчеплюючи з чипа живлення має бути 5.0 V ± 5%.
    На практиці: якщо вхідна напруга на роз'ємі далеко від 5 В (наприклад, 4.5 В або вище 5.5 В),
    це перший знак проблеми зі кабелем, розеткою чи USB-портом.
  sposib: >-
    Практична спостереження, USB стандарт (не в кеші, клас E).
  notatka: >-
    Напруга 5 В ±5% це стандартна норма для USB живлення. Вона служить як точка відліку
    для діагностики проблем з живленням. Якщо вхідна напруга далеко від цієї норми,
    то проблема в зовнішньому джерелі, кабелі чи роз'ємі, а не в самій ESP32.

- nazva: "3.3 В на холостому ході — норма 3.2–3.4 В"
  zbih: '3\.2–3\.4 В'
  klas: B
  dzherelo: >-
    ESP32 Series Datasheet v5.3, Table 5-2 «Recommended Power Supply Characteristics»
    (мін. 3.0 В для чипів із флешем), плюс допуск LDO-стабілізатора (~±0.1–0.2 В).
  cytata: |
    Table 5-2. Recommended Power Supply Characteristics
    Parameter: VDDA, VDD3P3_RTC, VDD3P3, VDD_SDIO (3.3 V mode)
    Min: 2.3/3.0 [2]    Typ: 3.3    Max: 3.6    Unit: V

    Note 2: Chips with a 3.3 V flash or PSRAM in-package: this minimum voltage is 3.0 V

    Section 2.5.2 Notes on power supply:
    "The operating voltage of ESP32 ranges from 2.3 V to 3.6 V. When using a single-power supply,
    the recommended voltage of the power supply is 3.3 V"
  sposib: >-
    PDF Espressif, кеш `esp32-datasheet.pdf`, pdftotext -layout, 2026-08-26.
    Допуск LDO — практична константа (±5% від 3.3 В ≈ ±0.165 В).
  notatka: >-
    Горатимо верхня межа 3.2–3.4 В це не паспортна межа, а практична норма, яка враховує
    допуски лінійного регулятора на платі розробки. Паспортна межа — 3.0–3.6 В для чипів
    із флешем. Дiагностична рекомендація книги (3.2–3.4 В) вже краща: якщо на холостому ході
    напруга вже вище 3.4 В або нижче 3.2 В, це перший знак проблеми з регулятором.

- nazva: "Конденсатор 470 мкФ між 3V3 і GND поруч із модулем"
  zbih: 'Конденсатор 470 мкФ.*між.*3V3.*і.*GND'
  klas: E
  dzherelo: >-
    Практика проектування, модулі ESP32-WROOM-32 документація, поради в спільноті Espressif.
    Не знайдено у даташирі ESP32 як вимога, але згадується як рекомендація у додатках
    до модулів та в практичних прикладах схем.
  cytata: |
    ESP32 Series Datasheet, Section 2.5.2 Notes on power supply:
    "In scenarios where ESP32 is powered up and down repeatedly by switching the power rails,
    while there is a large capacitor on the VDD33 rail and CHIP_PU and VDD33 are connected,
    simply switching off the CHIP_PU power rail and immediately switching it back on may cause
    an incomplete power discharge cycle and failure to reset the chip adequately."

    Напруга 470 мкФ для згладжування живлення — це практична рекомендація,
    яка виявилася настільки популярною, що стала стандартною в більшості схем ESP32.
  sposib: >-
    Практична порада, підтримана посиланнями на конденсатори на VDD33 в datasheet,
    але конкретна номіналу 470 мкФ не є паспортною вимогою.
  notatka: >-
    Клас E тому що це порада про схему, а не факт про чип. Проте, роль великого конденсатора
    на VDD33 та РТК згадується у datasheet. Номіналу 470 мкФ вибрано емпірично як компроміс
    між розмі-ром, ціною й ефективністю. Більше конденсаторів не гірше, менше може бути
    недостатньо для гасіння пульсацій під час пікового споживання Wi-Fi.

- nazva: "Керамічний 100 нФ біля кожної мікросхеми"
  zbih: 'Керамічний.*100 нФ.*біля.*кожної'
  klas: E
  dzherelo: >-
    Практика проектування електроніки. ESP32 Series Datasheet згадує зовнішні конденсатори,
    але не дає конкретного номіналу для біля-чипових конденсаторів.
  cytata: |
    ESP32 Series Datasheet, Pin Descriptions (наприклад, для CAP1 та CAP2):
    "Connects to a 3.3 nF (10%) capacitor and 20 kΩ resistor in parallel to CAP1"
    "Connects to a 10 nF series capacitor to ground"

    GPIO Connector:
    "external 100 nF capacitor; DC signal input"

    Керамічні конденсатори 100 нФ біля мікросхеми — це стандартна практика
    для придушення високочастотних шумів на живленні.
  sposib: >-
    Практична порада на основі електронних конвенцій. Деякі конденсатори згадуються
    у datasheet, але конкретна номіналу 100 нФ для кожної мікросхеми не є паспортною вимогою.
  notatka: >-
    Клас E — це порада про схему. Проте, роль біля-чипових конденсаторів згадується у datasheet
    у контексті придушення шумів. 100 нФ — стандартна номіналу для ВЧ-бачення на вольтажних шинах.

- nazva: "Окреме джерело від 1 А — не 500 мА, тому що платити треба за піки"
  zbih: 'Окреме джерело від 1 А.*[Нн]е 500 мА'
  klas: B
  dzherelo: >-
    ESP32 Series Datasheet v5.3, Table 5-2 «Recommended Power Supply Characteristics»
    (IVDD мін. 0.5 А), Table 5-4 «Current Consumption Depending on RF Modes»
    (передача 240 мА максимум під 50% duty cycle).
  cytata: |
    Table 5-2. Recommended Power Supply Characteristics
    Parameter: IVDD (Current delivered by external power supply)
    Min: 0.5    —    —    A

    Table 5-4. Current Consumption Depending on RF Modes
    Transmit 802.11b, DSSS 1 Mbps, POUT = +19.5 dBm    Typ: 240    mA
    Transmit 802.11g, OFDM 54 Mbps, POUT = +16 dBm     Typ: 190    mA
    Transmit 802.11n, OFDM MCS7, POUT = +14 dBm        Typ: 180    mA
    Receive 802.11b/g/n                                 Typ: 95-100 mA
  sposib: >-
    PDF Espressif, кеш `esp32-datasheet.pdf`, pdftotext -layout, 2026-08-26.
  notatka: >-
    Клас B — синтез з таблиці. Datasheet нормує мінімум 0.5 А для джерела, але практична
    рекомендація книги — 1 А — вироблена з таблиці 5-4: пік передачі 240 мА означає,
    що джерело мусить тримати напругу під цим пік-сплеськом, а не покривати лишень середнє.
    240 мА пік під 50% duty cycle ≈ 120 мА середнього, але джерело чутливе до
    короткого сплеску в 240 мА. Будь-яке джерело менше 500 мА нерідко не витримує цю вимогу.
    1 А — це практичний компроміс за допомогою чергування й деякої маржі на деградацію.

- nazva: "Живлення 3.3 В напряму, мимо бортовий LDO — коли він слабкий на клоне"
  zbih: 'Живлення 3\.3 В напряму.*мин[а|ує]ючи.*бортовий'
  klas: E
  dzherelo: >-
    Практика розробки. На деяких клонах плат розробки LDO-регулятор занадто слабкий
    або з великим падінням напруги. Прямої рекомендації у datasheet немає,
    але у розділі 2.5.2 згадується можливість користування зовнішнім живленням.
  cytata: |
    ESP32 Series Datasheet, Section 2.5.2 Power Scheme:
    "VDD3P3_RTC can be powered from an external power supply separately"
    "PSRAM and flash both are powered by VDD_SDIO. If the chip has an in-package flash,
    the voltage of VDD_SDIO is determined by the operating voltage of the in-package flash."

    На практиці: якщо вбудований LDO на платі розробки розраховано на меньше ніж 1 А,
    то під навантаженням (Wi-Fi + датчики) напруга просідає нижче 3.0 В й потрібен
    зовнішній нестабілізований БЖ подано напряму на 3V3, мимо LDO.
  sposib: >-
    Практична рекомендація на основі діагностики на платах розробки з слабким LDO.
  notatka: >-
    Клас E — це порада про припинення тестування. Базується на практиці, коли обслідування
    LDO на клоні показує малу ємність (наприклад, 200–300 мА замість очікуваних 500 мА).
    Ця лікування — крайня міра, коли жодне інше не допомагає.

- nazva: "Джерело для ESP32 з Wi-Fi — щонайменше 1 А, навіть якщо середнє споживання сто міліампер"
  zbih: 'Джерело для ESP32 з Wi-Fi.*щонайменше 1 А'
  klas: B
  dzherelo: >-
    ESP32 Series Datasheet v5.3, Table 5-2 (IVDD 0.5 А рекомендована) і
    Table 5-4 «Current Consumption Depending on RF Modes» (пік 240 мА).
  cytata: |
    Table 5-2. Recommended Power Supply Characteristics
    IVDD (Current delivered by external power supply)    Min: 0.5 A

    Table 5-4. Current Consumption Depending on RF Modes
    Transmit 802.11b, DSSS 1 Mbps, POUT = +19.5 dBm    Typ: 240 mA
    (50% duty cycle, інші режими: 190 мА, 180 мА передачі; 95-100 мА приймання)

    Section 2.5.2 Notes on power supply:
    "When using a single-power supply, the recommended voltage of the power supply is 3.3 V,
    and its recommended output current is 500 mA or more."
  sposib: >-
    PDF Espressif, кеш `esp32-datasheet.pdf`, pdftotext -layout, 2026-08-26.
  notatka: >-
    Клас B — синтез з таблиці. Datasheet рекомендує 500 мА мінімум, але практична вимога
    1 А вироблена з таблиці 5-4: пік передачі Wi-Fi 240 мА означає, що джерело мусить
    витримати цей імпульс без просідання напруги нижче 3.0 В. На практиці, дешеві блоки
    на 500 мА нерідко мають зовнішнє опір або погану фільтрацію й не витримують пік.
    1 А забезпечує маржу для надійної роботи під піками й під цикличним навантаженням
    (Wi-Fi передає імпульсами, не постійно).
