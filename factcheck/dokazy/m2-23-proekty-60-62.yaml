# М2 — проєктні розділи 60 (автономний логер) і 62 (керування насосом),
# 32 одиниці з поділу: 60 — 13 `elektro` + 4 `detali`, 62 — 15 `elektro`.
#
# Тема обох розділів — електрика на практиці: коло керування реле на
# окремих 5 В, дільник напруги акумулятора, бюджет енергії сну. У 62
# додатково — безпека: чи справді резистор і схема захищають від того,
# від чого книга каже, що захищають. Обидва «nezvorotne»-блоки про
# заварені контакти реле вже виправлені попереднім проходом і не
# входять у цей наряд.
#
# Джерела в кеші: `esp32-datasheet.pdf` (ESP32 Series Datasheet v5.3,
# Table 6-1 «Notes on ESP32 Pin Lists», Appendix A, с. 60 — раніше цей
# файл читався лише через Table 4-2/5-1/5-3), `ds18b20.pdf` (Maxim,
# розділ «Hardware Configuration»). DS3231 — за прямою вказівкою наряду
# одразу клас `C`: analog.com і всі перевірені раніше дзеркала
# (m2-09-hc-sr04.yaml) цій мережі не дістаються, і повторна спроба
# нічого не змінить.
#
# Взірці перевірено не текстовим пошуком по файлу, а напряму через
# `tools/factcheck.rozbyty()` на чинному тексті М1 (база
# `origin/<гілка М1>`): для кожного взірця
# підтверджено, що він влучає в ту саму одиницю твердження, яку
# розбиває сам інструмент, а не в сусідню.

- nazva: DS3231 має власну батарейку — джерело недосяжне з цієї мережі
  zbih: 'RTC DS3231 із власною батарейкою|DS3231 модуль RTC · Примітка → I.C, з батарейкою CR2032|він має власну батарейку й лишається живим сам'
  klas: C
  dzherelo: >-
    DS3231 Extremely Accurate I2C-Integrated RTC/TCXO/Crystal, datasheet
    Maxim Integrated (нині Analog Devices) —
    https://www.analog.com/en/products/ds3231.html
  shukaty: >-
    Наявність виводу VBAT і резервного живлення від батареї при зникненні
    основного (звідки випливає «лишається живим сам»); струм від VBAT у
    режимі підтримки; діапазон напруги VBAT (сумісність із CR2032, 3 В);
    підтвердження інтерфейсу I²C і адреси `0x68`.
  notatka: >-
    Той самий висновок, що вже зафіксований у `m2-09-hc-sr04.yaml`:
    `analog.com` відмовляє цій мережі на рівні Akamai, і чотири
    перевірені тоді дзеркала (Mouser, DigiKey, SparkFun, rcscomponents)
    PDF не віддали. Тут — та сама мікросхема, інша цитата книги
    (розділ 60, а не додаток E), тому новий запис, а не дублювання.

    Межа та сама, що вже названа раніше й варта повторення: «з
    батарейкою CR2032» — властивість **модуля-брейкборда**, а не
    DS3231. Сам кристал вимагає лише напругу на `VBAT` у певному
    діапазоні; тип елемента (CR2032, таблетка, суперконденсатор) —
    рішення виробника плати. Навіть якби datasheet відкрився, цю
    частину речення він не підтвердить і не спростує.

