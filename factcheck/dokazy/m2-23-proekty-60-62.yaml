- nazva: Резистори 4.7 кОм для I²C і 1-Wire — номінал, який справді рекомендують обидва джерела
  zbih: 'Резистори 4\.7 кОм · Примітка → I.C і 1-Wire'
  klas: A
  dzherelo: >-
    DS18B20 Programmable Resolution 1-Wire Digital Thermometer, datasheet
    Maxim Integrated — «Hardware Configuration», Figure 10; разом із NXP
    UM10204, розділ 7.1 (доказ `m2-05-i2c-pidtyaguvannya.yaml`)
  cytata: |
    The 1-Wire bus requires an external pullup resistor of approximately
    5kΩ; thus, the idle state for the 1-Wire bus is high.

    Figure 10. Hardware Configuration
                                            VPU
                                                  4.7k          DQ PIN
  sposib: >-
    PDF Maxim, кеш `ds18b20.pdf`, pdftotext -layout, 2026-08-26
  notatka: >-
    Твердження книги вузьке — воно лише називає, для чого стоять ці три
    резистори (I²C і 1-Wire), і в цьому вигляді підтверджене напряму:
    DS18B20 datasheet і сам дає орієнтир «~5 кОм» для 1-Wire, і малює
    типову схему саме з `4.7k`. Для I²C той самий номінал уже виведено
    з формули NXP UM10204 у проході `m2-05` — там показано, що 4.7 кОм
    проходить для 100 кГц. Разом обидва застосування підтверджені
    незалежно.

- nazva: Звичайний LDO й buck-boost — межі роботи без конкретної мікросхеми
  zbih: 'Звичайний LDO перестає давати 3\.3 В, коли акумулятор просів до 3\.8 В|Buck-boost працює до 3\.0 В'
  klas: E
  dzherelo: —
  cytata: —
  sposib: >-
    Автор не називає конкретну мікросхему LDO чи buck-boost — «звичайний
    LDO» узагальнює клас деталей, а не одну деталь. Дропаут і нижня межа
    входу відрізняються в рази між моделями (0.3–1.3 В для LDO), тому
    жоден кешований datasheet цього не підтвердить і не спростує:
    підтвердження було б випадковим збігом з однією конкретною
    мікросхемою, а не перевіркою твердження.
  notatka: >-
    «Відсікає приблизно половину ємності» так само не перевірити з
    наявних PDF: криві розряду 18650 у кеші (`ncr18650b.pdf` та інші) —
    графіки, а не таблиці; текстового витягу мАг-на-вольт немає.
    Порядок величини правдоподібний (перегин кривої розряду 18650 біля
    3.7–3.8 В — загальновідома форма кривої), але це не те саме, що
    підтверджене число.

- nazva: Дільник напруги на 200 кОм — арифметика верна, але «на порядок» перебільшує
  zbih: >-
    Постійно під.єднаний дільник із двох резисторів по 100 кОм бере на
    порядок більше, ніж чип уві сні
  klas: D
  rozrakhunok: |
    Дільник: два резистори по 100 кОм послідовно між VBAT і GND —
    сумарно 200 кОм. Струм I = U / R.

      при 3.6 В (паспортна номінальна напруга 18650, доказ
      `m2-15-element-18650.yaml`):  I = 3.6 / 200 000 = 18 мкА
      при 3.2 В (поріг «заснути назавжди» з коду цього ж розділу,
      рядок 191): I = 3.2 / 200 000 = 16 мкА
      при 4.2 В (повний заряд):     I = 4.2 / 200 000 = 21 мкА

    Тобто постійно під'єднаний дільник бере 16–21 мкА залежно від
    заряду — число, яке саме розділ 33 цієї ж книги вже наводить
    («200 кОм … при 3.7 В вони постійно беруть 18 мкА»).

    «Чип уві сні»: цей проєкт зберігає лічильники й буфер у
    `RTC_DATA_ATTR` (RTC RAM), тобто потребує режим deep-sleep із
    увімкненою RTC-пам'яттю, а не найглибший «Hibernation». За ESP32
    Series Datasheet v5.3, Table 4-2 (доказ
    `m2-02-esp32-datasheet.yaml`), саме цей режим —
    «RTC timer + RTC memory» — дає 10 мкА.

    Порівняння: 18 мкА / 10 мкА ≈ 1.8 рази. Це майже вдвічі, а не «на
    порядок» (тобто ×10).
  dzherelo: >-
    ESP32 Series Datasheet v5.3, Table 4-2 «Power Consumption by Power
    Modes» (доказ `m2-02-esp32-datasheet.yaml`); власний код і власна
    таблиця розділу 60 (`if (napruga < 3.2f)`, `RTC_DATA_ATTR`)
  notatka: >-
    Розбіжність, а не помилка в цифрах: обидва числа (18 мкА дільника,
    10 мкА чипа) правильні кожне окремо й уже підтверджені в інших
    проходах. Але «на порядок більше» — це стале означає приблизно
    десятикратну різницю, а вийшло вдвічі. Якби порівнювати з
    найглибшим `Hibernation` (5 мкА) чи `Power off` (1 мкА) — вийшло б
    ближче до «порядку», але жоден із цих режимів не годиться для
    цього проєкту: `Hibernation` втрачає RTC-пам'ять, а `Power off`
    не прокидається по таймеру. З режимом, який проєкт справді
    використовує, множник — не десять, а менш ніж два.

    Висновок розділу («дільник стає головним споживачем усього
    пристрою», «потрібен ключ») лишається правильним по суті: 18 мкА
    справді порівнянні з 10 мкА чипа й справді істотно збільшують
    сон. Перебільшено саме формулювання масштабу, не напрямок
    поради.

- nazva: Бюджет енергії логера — множення часу на струм
  zbih: 'Пробудження й ініціалізація · Заряд → 12 мА·с|Запис на картку · Заряд → 32 мА·с|Сон · Заряд → 27 мА·с'
  klas: D
  rozrakhunok: |
    Пробудження: 300 мс × 40 мА = 0.300 с × 40 мА = 12.0 мА·с — збігається.
    Запис на картку: 400 мс × 80 мА = 0.400 с × 80 мА = 32.0 мА·с — збігається.
    Сон: 899 с × 30 мкА = 899 × 0.030 мА = 26.97 мА·с ≈ 27 мА·с
    (округлення до цілого) — збігається.
  dzherelo: —
  sposib: Пряма арифметика, зовнішнє джерело не потрібне.
  notatka: >-
    Усі три множення виходять точно на заявлені числа таблиці; заряд
    сну округлено правильно (26.97 → 27). Заразом перевірено підсумок
    рядка «Разом за цикл» (12+36+32+27=107 мА·с, де 36 мА·с —
    вимірювання, не в нашому переліку) — теж сходиться, хоч ця клітинка
    не входить у наряд.

- nazva: Струм на фазах бюджету — оцінні величини системи, не паспортні числа однієї деталі
  zbih: 'Запис на картку · Струм → 80 мА|Сон · Струм → 30 мкА'
  klas: E
  dzherelo: —
  cytata: —
  sposib: >-
    Жодна конкретна модель картки microSD чи повна розкладка струму сну
    периферії (buck-boost quiescent, витік ключа, DS3231 на власній
    батарейці) у тексті не названа — це орієнтовні цифри автора для
    прикладу, а не паспортне значення однієї мікросхеми.
  notatka: >-
    Внутрішня узгодженість не порушена: 30 мкА сну всього пристрою
    вище за 10 мкА самого чипа в потрібному режимі (Table 4-2, доказ
    `m2-02-esp32-datasheet.yaml`) — різниця правдоподібно йде на
    периферію під ключем і власний струм перетворювача, а дільник у цей
    час вимкнений транзистором. 80 мА на запис лежить у звичному для
    карток microSD діапазоні (десятки–сотні мА при записі), хоча жодна
    конкретна картка в тексті не названа.

- nazva: Тест на 3.1 В — узгоджено з порогом коду й нижньою межею buck-boost
  zbih: 'Знизити напругу живлення лабораторним джерелом до 3\.1 В'
  klas: B
  dzherelo: >-
    Власний код розділу 60 (`if (napruga < 3.2f) { … esp_deep_sleep_start(); }`,
    без таймера пробудження) і власне твердження цього ж розділу
    «Buck-boost працює до 3.0 В»
  cytata: |
    float napruga = zmiryaty_akumulyator();      // з ключем, див. нижче
    if (napruga < 3.2f) {
        ESP_LOGE(TAG, "акумулятор %.2f В — засинаємо назавжди", napruga);
        esp_deep_sleep_start();                  // без таймера: не прокинеться
    }
  sposib: Логічний висновок із двох тверджень того самого розділу, не цитата.
  notatka: >-
    Клас `B`, не `A`: книга ніде не пише «на 3.1 В спрацює», це
    перевірка з розділу «Перевірка». Висновок однозначний із двох
    фактів, названих раніше в тому самому розділі: 3.1 В < 3.2 В —
    поріг коду спрацьовує; і 3.1 В > 3.0 В — нижня межа buck-boost, тож
    перетворювач ще тримає 3.3 В і чип встигає виміряти напругу та
    піти в сон, перш ніж живлення просяде нижче робочого мінімуму
    ESP32. Обидва боки нерівності потрібні: без другого чип міг би не
    встигнути прочитати ADC й записати лог до провалу живлення.

- nazva: Модуль реле — коло котушки на окремих 5 В, а не 3V3 (без конкретної мікросхеми)
  zbih: >-
    Модуль реле з оптопарою · Примітка → живлення котушки 5 В, розділ
    47|Коло керування реле — окреме, від 5 В, а не від 3V3|Більшість
    готових модулів розраховані на \*\*5 В\*\*|Від 3\.3 В реле або не
    спрацює, або спрацьовуватиме через раз|Тому `VCC` модуля йде на 5
    В, а не на 3V3
  klas: E
  dzherelo: —
  cytata: —
  sposib: >-
    «Модуль реле з оптопарою» — узагальнена назва класу готових плат
    (SRD-05VDC та подібні), не одна деталь із конкретним datasheet.
    Твердження — практика вибору автора, а не паспортне число.
  notatka: >-
    Узгоджено з рештою розділу: п'ять окремих згадок цього самого факту
    (BOM, схема, два абзаци тексту) кажуть те саме одними словами —
    внутрішньої суперечності немає.

- nazva: Оптопара не гарантує сумісності з 3.3 В — падіння струму світлодіода
  zbih: >-
    Наявність оптопари цього \*\*не гарантує\*\*|Світлодіод оптопари
    живиться від того самого `VCC` через резистор, підібраний під 5 В
  klas: E
  dzherelo: —
  cytata: —
  sposib: >-
    Правильна фізика (струм через резистор із фіксованим номіналом
    падає пропорційно напрузі керування) без конкретного номіналу
    резистора чи моделі оптопари в тексті — порахувати точний струм чи
    звірити з конкретним CTR нема з чим.
  notatka: >-
    Напрям вірний і не суперечить нічому перевіреному раніше: менша
    напруга керування — менший струм через той самий резистор, менший
    струм через світлодіод — менший CTR-відгук. Без конкретного
    резистора й datasheet оптопари це залишається якісним, а не
    числовим твердженням.

