- nazva: Резистор утримує керувальний GPIO при завантаженні — усі піни output-disabled під час reset
  zbih: >-
    Під час завантаження GPIO перебуває у високоімпедансному
    стані|високим рівнем · Підтяжка 10 кОм → \*\*на GND\*\*|низьким
    рівнем \(інверсний\) · Підтяжка 10 кОм → \*\*на 3V3\*\*
  klas: A
  dzherelo: >-
    ESP32 Series Datasheet v5.3, Appendix A, Table 6-1 «Notes on ESP32
    Pin Lists», примітка 9, с. 60
  cytata: |
    Column "At Reset" in Table IO_MUX lists the status of each pin
    during reset, including input-enable (ie=1), internal pull-up
    (wpu) and internal pull-down (wpd). During reset, all pins are
    output-disabled.
  sposib: >-
    PDF Espressif, кеш `esp32-datasheet.pdf`, pdftotext -layout,
    2026-08-26
  notatka: >-
    Це найважливіший знайдений збіг у розділі 62 з погляду безпеки:
    твердження «GPIO перебуває у високоімпедансному стані під час
    завантаження, тому реле може ввімкнутися саме в момент старту» — і
    рекомендація ставити зовнішній резистор під конкретний рівень
    вмикання модуля — прямо випливають із рядка datasheet «During
    reset, all pins are output-disabled»: поки пін output-disabled, він
    не тримає жодного рівня сам, і те, що на ньому буде, визначає
    зовнішнє коло (або внутрішній `wpu`/`wpd`, якщо він для цього пінa
    ввімкнений за замовчуванням — але покладатися на це для довільного
    вибору GPIO25 не можна, тому й потрібен зовнішній резистор).

    Клас `A`, не `B`: сама фраза документа — про output-disabled стан
    під час reset, а не буквально «high impedance», але це той самий
    факт двома словами (немає драйвера — немає визначеного рівня без
    зовнішнього кола), і напрямок підтяжки з таблиці розділу 62 (на
    GND для активного високим, на 3V3 для інверсного) — пряме й
    очевидне інженерне застосування цього факту, тому лишено в тому ж
    записі, а не винесено окремим `B`.

- nazva: GPIO34 — input-only, без внутрішнього підтягування; зовнішній резистор для поплавкового вимикача
  zbih: >-
    Поплавковий вимикач · Примітка → \+ зовнішня підтяжка 10
    кОм|тільки вхід і \*\*без вбудованого підтягування\*\*|Поплавковому
    вимикачу потрібен зовнішній резистор 10 кОм до 3\.3 В, інакше вхід
    бовтається й насос вмикається від наводок
  klas: A
  dzherelo: >-
    ESP32 Series Datasheet v5.3, Appendix A, Table 6-1 «Notes on ESP32
    Pin Lists», примітка 2, с. 60
  cytata: |
    GPIO pins 34-39 are input-only. These pins do not feature an output
    driver or internal pull-up/pull-down circuitry. The pin names are:
    SENSOR_VP (GPIO36), SENSOR_CAPP (GPIO37), SENSOR_CAPN (GPIO38),
    SENSOR_VN (GPIO39), VDET_1 (GPIO34), VDET_2 (GPIO35).
  sposib: >-
    PDF Espressif, кеш `esp32-datasheet.pdf`, pdftotext -layout,
    2026-08-26
  notatka: >-
    Дослівне влучання: джерело прямо називає `GPIO34` серед пінів без
    жодного внутрішнього pull-up/pull-down. Це друга знахідка розділу
    62, варта безпеки: без зовнішнього резистора вхід поплавкового
    вимикача справді «бовтається», і немає резервного внутрішнього
    підтягування, яке б це пом'якшило (на відміну від GPIO26/27 для
    кнопок, де книга сама називає внутрішню підтяжку — рядок 116
    схеми). Вибір саме зовнішнього резистора тут не перестраховка, а
    єдиний спосіб.
