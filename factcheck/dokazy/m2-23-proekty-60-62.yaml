- nazva: Buck-boost і резистори 4.7 кОм — кількість і службова примітка в BOM
  zbih: 'Перетворювач buck-boost на 3\.3 В · Кількість → 1|Перетворювач buck-boost на 3\.3 В · Примітка → ключове рішення, див\. нижче|Резистори 4\.7 кОм · Кількість → 3'
  klas: E
  dzherelo: —
  cytata: —
  sposib: >-
    Немає зовнішнього джерела: кількість деталей і посилання «див.
    нижче» — не електричні величини, а організація BOM і тексту.
  notatka: >-
