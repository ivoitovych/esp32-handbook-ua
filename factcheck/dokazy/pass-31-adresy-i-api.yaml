- nazva: ESP_ERROR_CHECK — це assert, а не обробка помилок
  zbih: '`ESP_ERROR_CHECK` — це `assert`|викликає паніку й перезавантажує чип|`ESP_ERROR_CHECK`
    навколо|`ESP_ERROR_CHECK` доречний там|Замінити `ESP_ERROR_CHECK` на явну обробку|повертає
    `esp_err_t` — код помилки, де `ESP_OK` дорівнює нулю'
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/esp_common/include/esp_err.h
  cytata: "typedef int esp_err_t;\n#define ESP_OK          0    /*!< esp_err_t value indicating\
    \ success */\n#define ESP_FAIL        -1   /*!< Generic esp_err_t code indicating failure\
    \ */\n\n/**\n * Macro which can be used to check the error code…\n * Disabled if assertions\
    \ are disabled.\n */\n#ifdef NDEBUG\n#define ESP_ERROR_CHECK(x) do {                 \\\
    \n        esp_err_t err_rc_ = (x);                \\\n        (void) sizeof(err_rc_);\
    \                 \\\n    } while(0)\n#elif defined(CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_SILENT)\n\
    #define ESP_ERROR_CHECK(x) do {                 \\\n        esp_err_t err_rc_ = (x); \
    \               \\\n        if (unlikely(err_rc_ != ESP_OK)) {      \\\n            abort();\
    \                            \\\n        }                                       \\\n\
    \    } while(0)\n#else\n… _esp_error_check_failed(err_rc_, __FILE__, __LINE__, …)\n#endif\n\
    \n/**\n * … In comparison with ESP_ERROR_CHECK(), this prints the same error\n * message\
    \ but isn't terminating the program.\n */\n"
  sposib: Retrieved with `curl` from raw.githubusercontent.com, 2026-08-26; quote verified
    by substring match.
  notatka: 'Твердження розділу 32 звірено на рівні реалізації, а не опису, і воно виявилося
    точнішим, ніж я очікував: «`ESP_ERROR_CHECK` — це `assert`» буквально так і є. Перша гілка
    макроса — `#ifdef NDEBUG`, і в ній перевірка **зникає цілком**, лишаючи `(void) sizeof(err_rc_)`.

    Тобто книга має рацію двічі. Вона правильно каже, що макрос перезавантажує чип замість
    обробляти помилку, — і правильно радить прибирати його звідти, де помилка можлива в роботі,
    бо з вимкненими assert він не обробить її й поготів.

    `esp_err_t` = `int`, `ESP_OK` = 0 — обидва дослівно.'
