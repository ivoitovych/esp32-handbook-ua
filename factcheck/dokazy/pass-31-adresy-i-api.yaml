# Прохід 31 — кошики `adresy` й `api` за поділом; кінець частки М1.
#
# Останні два кошики з тих 327, що поділ віддав М1. Після цього
# незвіреного з досяжним звідси джерелом у книзі не лишається — крім
# одиниць зі слабким сигналом, які поділ свідомо не чіпає.



















# ⚠ ЦИТАТА БУЛА ХИБНА — виправлено в проході 39 третім шаром.
#
# Записано було `+0x02` і `+0x04`; насправді `+0x01` і `+0x03`. Тобто
# я не скопіював заголовок, а **відтворив його з пам'яті** й помилився
# у двох числах із двох. Клас при цьому стояв `A`.
#
# Книга від цього не постраждала: вона називає ці помилки **іменами**, а
# не числами, і жодного зсуву не друкує. Тобто помилка сиділа рівно там,
# де її ніхто не шукав, — у доказі, а не у тексті.
#
# Знайшов це помічник на Haiku, звіряючи цитату з файлом. Ані сильніша
# модель, ані я сам за п'ять проходів цього не побачили: цитата
# виглядала правильно, бо була правдоподібна.



























































































































