- nazva: ESP_LOGD не коштує нічого при рівні збирання Info
  zbih: '`ESP_LOGD` у гарячому циклі не коштує нічого|рядки `ESP_LOGD` лишаються у флеші|Логувати
    переходи станів|`ESP_LOGI\(TAG, "тут"\)` не каже нічого'
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/log/include/esp_log.h
    та .../docs/en/api-reference/system/log.html.rst
  cytata: "/**\n * @brief Compile-time log level.\n * … Logging calls with a level higher\
    \ than the compile-time level are\n * removed by the preprocessor and take no space in\
    \ the binary and no\n * time at runtime.\n */\n#define ESP_LOGD(tag, format, ...) ESP_LOG_LEVEL_LOCAL(ESP_LOG_DEBUG,\
    \ tag, format, ##__VA_ARGS__)\n\n(log.html.rst)\nThe maximum verbosity level which is\
    \ compiled into the binary is set\nby CONFIG_LOG_MAXIMUM_LEVEL. The runtime level can\
    \ be lowered further\nwith esp_log_level_set().\n"
  sposib: Retrieved with `curl` from raw.githubusercontent.com, 2026-08-26; quote verified
    by substring match.
  notatka: 'Пара тверджень розділу 25, які легко сплутати між собою, і книга їх розводить
    правильно.

    Виклик **вище** рівня збирання прибирає препроцесор — саме тому `ESP_LOGD` у гарячому
    циклі не коштує нічого, коли зібрано з `Info`. А коли рівень збирання піднято, щоб мати
    змогу ввімкнути налагодження в полі, рядки лишаються у флеші — і це вже питання розміру
    образу, а не швидкості.

    Дві поради про **зміст** запису («логувати переходи станів, а не факт виконання рядка»)
    зовнішнього джерела не мають і не потребують: це редакційна порада, і в реєстрі вона тримається
    на цьому ж записі лише тому, що стоїть у тих самих реченнях. Клас одиниці від того не
    зростає — доказ покриває технічну половину.'
