- nazva: esp_timer — мікросекундна роздільність, обробники в одній задачі
  zbih: '`esp_timer`\*\* — програмні таймери з мікросекундною|Обробники всіх `esp_timer` виконуються
    в одній задачі'
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/docs/en/api-reference/system/esp_timer.rst
  cytata: "- Time resolution: one microsecond\n\n- Dispatches timer callbacks from a single\
    \ high-priority ESP Timer\n  task (esp_timer task (notified by ISR) > callback).\n\nThe\
    \ execution of callbacks in the ESP Timer task is serialized. Thus,\nwhen multiple timeouts\
    \ occur simultaneously, the execution time of one\ncallback will delay the execution of\
    \ subsequent callbacks. For this\nreason, it is recommended to keep the callbacks short.\n"
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Обидва твердження розділу 33 дослівні, і друге навіть сильніше в джерелі, ніж
    у книзі: не просто «довгий обробник затримує решту», а виконання серіалізоване, тобто
    затримка гарантована, а не ймовірна.

    Джерело додає й пораду, якої в книзі немає: довгу роботу з обробника виносити в задачу
    нижчого пріоритету через чергу чи семафор. Книга цю саму думку проводить у розділі 31
    щодо ISR, тож окремо не дублюю — але зв''язок варто мати на увазі при наступній редакції.'
  title: esp_timer — мікросекундна роздільність, обробники в одній задачі
  match: '`esp_timer`\*\* — програмні таймери з мікросекундною|Обробники всіх `esp_timer`
