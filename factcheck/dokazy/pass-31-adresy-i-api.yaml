- nazva: Коди помилок OTA і NVS, які книга називає поіменно
  zbih: '`ESP_ERR_OTA_VALIDATE_FAILED`|`ESP_ERR_OTA_PARTITION_CONFLICT`|`ESP_ERR_INVALID_ARG`
    при налаштуванні|`wear_levelling`|`esp_vfs_fat`'
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/app_update/include/esp_ota_ops.h,
    .../components/esp_common/include/esp_err.h, .../docs/en/api-reference/storage/{wear-levelling,fatfs}.rst
  cytata: '(esp_ota_ops.h)

    #define ESP_ERR_OTA_BASE                         0x1500                     /*!< Base
    error code for ota_ops api */

    #define ESP_ERR_OTA_PARTITION_CONFLICT           (ESP_ERR_OTA_BASE + 0x01)  /*!< Error
    if request was to write or erase the current running partition */

    #define ESP_ERR_OTA_VALIDATE_FAILED              (ESP_ERR_OTA_BASE + 0x03)  /*!< Error
    if OTA app image is invalid */


    (esp_err.h)

    #define ESP_ERR_INVALID_ARG         0x102


    (wear-levelling.rst)

    The wear levelling component … distributes wear across the whole

    partition, and is used together with the FAT filesystem via

    esp_vfs_fat_spiflash_mount_rw_wl.

    '
  sposib: Retrieved with `curl` from raw.githubusercontent.com, 2026-08-26; quote verified
    by substring match.
  notatka: 'Усі названі книгою константи існують дослівно. Прохід 7 звіряв виклики; ці — коди
    повернення, і вони живуть у тих самих заголовках.

    Твердження розділу 18 про `wear_levelling` підтверджується від протилежного: у документації
    FAT монтується через `esp_vfs_fat_spiflash_mount_rw_wl`, тобто саме через шар вирівнювання
    зносу, — отже сама FAT його не робить, як книга й пише.'
