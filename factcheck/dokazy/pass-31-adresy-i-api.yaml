  status: verbatim
  source: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/esp_common/include/esp_err.h
  quote: "typedef int esp_err_t;\n#define ESP_OK          0    /*!< esp_err_t value indicating\
    \ success */\n#define ESP_FAIL        -1   /*!< Generic esp_err_t code indicating failure\
    \ */\n\n/**\n * Macro which can be used to check the error code…\n * Disabled if assertions\
    \ are disabled.\n */\n#ifdef NDEBUG\n#define ESP_ERROR_CHECK(x) do {                 \\\
    \n        esp_err_t err_rc_ = (x);                \\\n        (void) sizeof(err_rc_);\
    \                 \\\n    } while(0)\n#elif defined(CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_SILENT)\n\
    #define ESP_ERROR_CHECK(x) do {                 \\\n        esp_err_t err_rc_ = (x); \
    \               \\\n        if (unlikely(err_rc_ != ESP_OK)) {      \\\n            abort();\
    \                            \\\n        }                                       \\\n\
    \    } while(0)\n#else\n… _esp_error_check_failed(err_rc_, __FILE__, __LINE__, …)\n#endif\n\
    \n/**\n * … In comparison with ESP_ERROR_CHECK(), this prints the same error\n * message\
