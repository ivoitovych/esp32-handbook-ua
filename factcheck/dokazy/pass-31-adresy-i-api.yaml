# Прохід 31 — кошики `adresy` й `api` за поділом; кінець частки М1.
#
# Останні два кошики з тих 327, що поділ віддав М1. Після цього
# незвіреного з досяжним звідси джерелом у книзі не лишається — крім
# одиниць зі слабким сигналом, які поділ свідомо не чіпає.

- nazva: Таблиці адрес прошивки — три рядки на три сімейства
  zbih: 'bootloader · [^→]+→ `0x[12]000`|`bootloader\.bin` · [^→]+→ `0x[12]000`|partition table · [^→]+→ `0x8000`|`partition-table\.bin` · [^→]+→ `0x8000`|застосунок[^→]*· [^→]+→ `0x10000`|`nvs` \(типово\) · [^→]+→ `0x9000`|кладе бутлоадер S3 на `0x1000`|стоїть `0x1000` — адреса \*\*classic і S2\*\*|`0x1000` classic / `0x0` S3'
  klas: A
  dzherelo: >-
    https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/bootloader/Kconfig.projbuild,
    .../components/partition_table/Kconfig.projbuild,
    .../docs/en/api-guides/partition-tables.rst
  cytata: |
    config BOOTLOADER_OFFSET_IN_FLASH
        default 0x1000 if IDF_TARGET_ESP32 || IDF_TARGET_ESP32S2
        default 0x2000 if IDF_TARGET_ESP32P4 || IDF_TARGET_ESP32C5 || IDF_TARGET_ESP32H4
        default 0x0

    config PARTITION_TABLE_OFFSET
        hex "Offset of partition table"
        default 0x8000

    (partition-tables.rst)
    * At a 0x10000 (64 KB) offset in the flash is the app labelled
      "factory". The bootloader runs this app by default.
    nvs,      data, nvs,     0x9000,  0x6000,
  sposib: curl raw.githubusercontent (повторно, прохід 24), 2026-08-26
  notatka: >-
    Прохід 24 звірив ці адреси в розділі 16; тут вони стають видимими в
    таблицях картки К5, картки К10 і додатка C, де кожна комірка — окрема
    одиниця, а таблиць три однакові в трьох місцях.

    Саме тут видно, навіщо розбивка на комірки: три рядки «застосунок ·
    classic, S2 → `0x10000`», «S3, C3, C6, H2 → `0x10000`», «P4, C5, H4 →
    `0x10000`» виглядають надлишковими — і не є ними. Сусідня таблиця для
    бутлоадера має в тих самих трьох рядках **три різні адреси**, і
    читач, який побачив одну однакову колонку, мусить бачити й другу,
    різну, поруч.

    `nvs` на `0x9000` розміром `0x6000` — з типової розбивки самого
    ESP-IDF; арифметика (`0x9000` + `0x6000` = початок `phy_init`)
    перевіряється окремо в `tools/arytmetyka.py`.

- nazva: ESP_ERROR_CHECK — це assert, а не обробка помилок
  zbih: '`ESP_ERROR_CHECK` — це `assert`|викликає паніку й перезавантажує чип|`ESP_ERROR_CHECK` навколо|`ESP_ERROR_CHECK` доречний там|Замінити `ESP_ERROR_CHECK` на явну обробку|повертає `esp_err_t` — код помилки, де `ESP_OK` дорівнює нулю'
  klas: A
  dzherelo: >-
    https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/esp_common/include/esp_err.h
  cytata: |
    typedef int esp_err_t;
    #define ESP_OK          0    /*!< esp_err_t value indicating success */
    #define ESP_FAIL        -1   /*!< Generic esp_err_t code indicating failure */

    /**
     * Macro which can be used to check the error code…
     * Disabled if assertions are disabled.
     */
    #ifdef NDEBUG
    #define ESP_ERROR_CHECK(x) do {                 \
            esp_err_t err_rc_ = (x);                \
            (void) sizeof(err_rc_);                 \
        } while(0)
    #elif defined(CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_SILENT)
    #define ESP_ERROR_CHECK(x) do {                 \
            esp_err_t err_rc_ = (x);                \
            if (unlikely(err_rc_ != ESP_OK)) {      \
                abort();                            \
            }                                       \
        } while(0)
    #else
    … _esp_error_check_failed(err_rc_, __FILE__, __LINE__, …)
    #endif

    /**
     * … In comparison with ESP_ERROR_CHECK(), this prints the same error
     * message but isn't terminating the program.
     */
  sposib: curl raw.githubusercontent (повторно, прохід 7), 2026-08-26
  notatka: >-
    Твердження розділу 32 звірено на рівні реалізації, а не опису, і воно
    виявилося точнішим, ніж я очікував: «`ESP_ERROR_CHECK` — це `assert`»
    буквально так і є. Перша гілка макроса — `#ifdef NDEBUG`, і в ній
    перевірка **зникає цілком**, лишаючи `(void) sizeof(err_rc_)`.

    Тобто книга має рацію двічі. Вона правильно каже, що макрос
    перезавантажує чип замість обробляти помилку, — і правильно радить
    прибирати його звідти, де помилка можлива в роботі, бо з вимкненими
    assert він не обробить її й поготів.

    `esp_err_t` = `int`, `ESP_OK` = 0 — обидва дослівно.

- nazva: esp_timer — мікросекундна роздільність, обробники в одній задачі
  zbih: '`esp_timer`\*\* — програмні таймери з мікросекундною|Обробники всіх `esp_timer` виконуються в одній задачі'
  klas: A
  dzherelo: >-
    https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/docs/en/api-reference/system/esp_timer.rst
  cytata: |
    - Time resolution: one microsecond

    - Dispatches timer callbacks from a single high-priority ESP Timer
      task (esp_timer task (notified by ISR) > callback).

    The execution of callbacks in the ESP Timer task is serialized. Thus,
    when multiple timeouts occur simultaneously, the execution time of one
    callback will delay the execution of subsequent callbacks. For this
    reason, it is recommended to keep the callbacks short.
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: >-
    Обидва твердження розділу 33 дослівні, і друге навіть сильніше в
    джерелі, ніж у книзі: не просто «довгий обробник затримує решту», а
    виконання серіалізоване, тобто затримка гарантована, а не ймовірна.

    Джерело додає й пораду, якої в книзі немає: довгу роботу з обробника
    виносити в задачу нижчого пріоритету через чергу чи семафор. Книга
    цю саму думку проводить у розділі 31 щодо ISR, тож окремо не
    дублюю — але зв'язок варто мати на увазі при наступній редакції.

- nazva: ESP_LOGD не коштує нічого при рівні збирання Info
  zbih: '`ESP_LOGD` у гарячому циклі не коштує нічого|рядки `ESP_LOGD` лишаються у флеші|Логувати переходи станів|`ESP_LOGI\(TAG, "тут"\)` не каже нічого'
  klas: A
  dzherelo: >-
    https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/log/include/esp_log.h
    та .../docs/en/api-reference/system/log.html.rst
  cytata: |
    /**
     * @brief Compile-time log level.
     * … Logging calls with a level higher than the compile-time level are
     * removed by the preprocessor and take no space in the binary and no
     * time at runtime.
     */
    #define ESP_LOGD(tag, format, ...) ESP_LOG_LEVEL_LOCAL(ESP_LOG_DEBUG, tag, format, ##__VA_ARGS__)

    (log.html.rst)
    The maximum verbosity level which is compiled into the binary is set
    by CONFIG_LOG_MAXIMUM_LEVEL. The runtime level can be lowered further
    with esp_log_level_set().
  sposib: curl raw.githubusercontent (повторно, прохід 25 щодо `Maximum log verbosity`), 2026-08-26
  notatka: >-
    Пара тверджень розділу 25, які легко сплутати між собою, і книга їх
    розводить правильно.

    Виклик **вище** рівня збирання прибирає препроцесор — саме тому
    `ESP_LOGD` у гарячому циклі не коштує нічого, коли зібрано з `Info`.
    А коли рівень збирання піднято, щоб мати змогу ввімкнути налагодження
    в полі, рядки лишаються у флеші — і це вже питання розміру образу, а
    не швидкості.

    Дві поради про **зміст** запису («логувати переходи станів, а не факт
    виконання рядка») зовнішнього джерела не мають і не потребують: це
    редакційна порада, і в реєстрі вона тримається на цьому ж записі лише
    тому, що стоїть у тих самих реченнях. Клас одиниці від того не
    зростає — доказ покриває технічну половину.

