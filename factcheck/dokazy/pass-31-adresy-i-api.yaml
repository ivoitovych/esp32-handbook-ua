  sposib: curl raw.githubusercontent (повторно, прохід 7), 2026-08-26
  notatka: >-
    Усі названі книгою константи існують дослівно. Прохід 7 звіряв
    виклики; ці — коди повернення, і вони живуть у тих самих заголовках.

    Твердження розділу 18 про `wear_levelling` підтверджується від
    протилежного: у документації FAT монтується через
