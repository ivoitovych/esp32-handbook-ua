- nazva: Внутрішнє підтягування strapping — 45 кОм, кнопці треба 10 кОм
  zbih: Внутрішнє підтягування тут — 45 кОм|45 кОм — це слабко|сильна підтяжка вниз, 10 кОм
    на землю
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esptool/master/docs/en/advanced-topics/boot-mode-selection.rst
  cytata: ".. warning::\n\n   The {IDF_TARGET_NAME} has a 45k ohm internal pull-up/pull-down\n\
    \   resistor at {IDF_TARGET_STRAP_BOOT_GPIO} (and other pins). If you\n   want to connect\
    \ a switch button to enter the boot mode, this has to\n   be a strong pull-down. For example\
    \ a 10k resistor to GND.\n"
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Доповнення, і саме те, якого бракувало найбільше. Книга багато разів каже «пін
    має внутрішнє підтягування», але **номінала не називала ніде** — а без номінала порада
    безкорисна для того, хто розводить власну плату.

    45 кОм — слабко. Кнопка `BOOT`, зроблена простим перемикачем на землю, конкурує з цим
    підтягуванням і на довгій доріжці або при наводці може не пересилити його надійно. Документація
    дає й номінал ліків: 10 кОм на землю.

    Це не «запас про всяк випадок», а пряма рекомендація джерела, і в книзі вона тепер стоїть
    як така. Додано в розділ 07 після правила «strapping-піни — лише як виходи».'
