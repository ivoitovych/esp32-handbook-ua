  note: 'Твердження книги про `GPIO15` («має внутрішнє підтягування вгору, тому не під''єднаний
    = високий») звірене дослівно — воно збігається з джерелом слово в слово.

    А от про `GPIO12` книга напрямку підтягування **не називала**, хоча присвятила пінові
    цілий блок «незворотне». Це прогалина з наслідком: без неї виходить, ніби пін небезпечний
