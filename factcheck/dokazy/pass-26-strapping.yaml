- nazva: Маска GPIO_STRAP — усі шість бітів classic і два біти решти
  zbih: '`0x0[1248]`=`GPIO|`0x[12]0`=`GPIO|\| `0x0[1248]` \| `GPIO|\| `0x[12]0` \| `GPIO|Найцінніший
    біт — `0x20`|На решті сімейств маска коротша|обрано непідтримуваний режим|DOWNLOAD_BOOT\(UART0|DOWNLOAD\(USB/UART0\)|SPI_FAST_FLASH_BOOT`
    \| звичайний старт|другий strapping-пін високий, коли головний низький|бітова маска регістра
    `GPIO_STRAP`'
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esptool/master/docs/en/advanced-topics/boot-mode-selection.rst
  cytata: "``boot:0xNN (DESCRIPTION)`` is the hex value of the strapping pins, as\nrepresented\
    \ in the GPIO_STRAP register.\n\n.. only:: esp32\n   -  ``0x01`` - GPIO5\n   -  ``0x02``\
    \ - MTDO (GPIO15)\n   -  ``0x04`` - GPIO4\n   -  ``0x08`` - GPIO2\n   -  ``0x10`` - GPIO0\n\
    \   -  ``0x20`` - MTDI (GPIO12)\n\n.. only:: not esp32\n   - ``0x04`` - {IDF_TARGET_STRAP_BOOT_2_GPIO}\n\
    \   - ``0x08`` - {IDF_TARGET_STRAP_BOOT_GPIO}\n\nIf the pin was high on reset, the bit\
    \ value will be set. If it was low\non reset, the bit will be cleared.\n\n-  ``DOWNLOAD_BOOT(UART0/UART1/SDIO_REI_REO_V2)``\
    \ or\n   ``DOWNLOAD(USB/UART0)`` — … download flashing mode\n-  ``SPI_FAST_FLASH_BOOT``\
    \ - This is the normal SPI flash boot mode.\n-  Other modes (including ``SPI_FLASH_BOOT``,\
    \ ``SDIO_REI_FEO_V1_BOOT``,\n   ``ATE_BOOT``) may be shown here. This indicates an unsupported\
    \ boot\n   mode has been selected. Consult the strapping pins shown above (in\n   most\
    \ cases, one of these modes is selected if {STRAP_BOOT_2_GPIO}\n   has been pulled high\
    \ when {STRAP_BOOT_GPIO} is low).\n"
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Шість бітів classic звірено поштучно — у картці К6 й у додатку D вони названі
    однаково і збігаються з джерелом усі. Разом із ними підтвердився і розбір двох найчастіших
    значень: `0x13` = `0x01` + `0x02` + `0x10` (норма), `0x3` = те саме без `GPIO0` (download
    mode).

    Два доповнення.

    **Непідтримувані режими.** `SPI_FLASH_BOOT`, `SDIO_REI_FEO_V1_BOOT`, `ATE_BOOT` — рядки,
    яких у таблиці додатка D не було, тож читач, що їх побачив, не знаходив у книзі нічого.
    Джерело називає й причину: у переважній більшості випадків другий strapping-пін високий,
    коли головний низький.

    **Маска на решті сімейств.** Книга давала біти лише для classic, хоча S3 і C3 — фокусні
    чипи. Додано таблицю двох бітів і, головне, впізнавання `boot:0x0` на C3: обидва піни
    низькі, тобто та сама недійсна комбінація — видима в логу, без осцилографа.'
