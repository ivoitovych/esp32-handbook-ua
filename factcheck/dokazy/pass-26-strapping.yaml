  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esptool/master/docs/en/advanced-topics/boot-mode-selection.rst
  cytata: "{IDF_TARGET_STRAP_BOOT_GPIO:default=\"GPIO9\", esp32=\"GPIO0\",\n esp32s2=\"GPIO0\"\
    , esp32s3=\"GPIO0\", …}\n{IDF_TARGET_STRAP_BOOT_2_GPIO:default=\"GPIO8\", esp32=\"GPIO2\"\
    ,\n esp32s2=\"GPIO46\", esp32s3=\"GPIO46\", …}\n\n.. only:: esp32 or esp32s2 or esp32s3\n\
    \   {STRAP_BOOT_2_GPIO} must also be either left unconnected/floating,\n   or driven Low,\
    \ in order to enter the serial bootloader.\n\n.. only:: esp32c3 or esp32c2 or esp32h2\
    \ or esp32c6 or …\n   {STRAP_BOOT_2_GPIO} must also be driven High, in order to enter\
    \ the\n   serial bootloader reliably. The strapping combination of\n   {STRAP_BOOT_2_GPIO}\
    \ = 0 and {STRAP_BOOT_GPIO} = 0 is invalid and\n   will trigger unexpected behavior.\n\
    \nIn normal boot mode ({STRAP_BOOT_GPIO} high), {STRAP_BOOT_2_GPIO}\nis ignored.\n\n{STRAP_BOOT_GPIO}\
    \ has an internal pullup resistor, so if it is left\nunconnected then it will pull high.\n"
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Таблиця розділу 07 «Другий strapping-пін працює на S3 і C3 у протилежні боки»
    звірена цілком, рядок за рядком, і збіглася вся — включно з найтоншим: поняття «недійсна
    комбінація» існує лише для RISC-V сімейств, а на classic і S3 неправильний рівень другого
    піна просто не пускає в download mode.

    Директиви `.. only::` тут кращі за будь-який переказ: вони прямо перелічують, до яких
    чипів яке правило належить, і книга поділила сімейства саме так.

    Підтверджено й твердження «у звичайному режимі другий пін ігнорується взагалі — на всіх
    сімействах»: у джерелі це окреме речення, поза обома `.. only::`.'
