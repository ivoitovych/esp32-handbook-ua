- nazva: GPIO12 має внутрішнє підтягування вниз — безпечний за замовчуванням
  zbih: сам пін має внутрішнє підтягування вниз|не під.єднаний `GPIO12` = низький = 3.3 В|високим
    його робить \*\*тільки те, що
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esptool/master/docs/en/advanced-topics/boot-mode-selection.rst
  cytata: "| 12 (MTDI) | If driven High, flash voltage (VDD_SDIO) is 1.8V not\n  default 3.3V.\
    \ Has internal pull-down, so unconnected = Low = 3.3V.\n  May prevent flashing and/or\
    \ booting if 3.3V flash is used and this\n  pin is pulled high, causing the flash to brownout.\
    \ …\n| 15 (MTDO) | If driven Low, silences boot messages printed by the ROM\n  bootloader.\
    \ Has an internal pull-up, so unconnected = High = normal\n  output.\n"
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Твердження книги про `GPIO15` («має внутрішнє підтягування вгору, тому не під''єднаний
    = високий») звірене дослівно — воно збігається з джерелом слово в слово.

    А от про `GPIO12` книга напрямку підтягування **не називала**, хоча присвятила пінові
    цілий блок «незворотне». Це прогалина з наслідком: без неї виходить, ніби пін небезпечний
    сам собою, і незрозуміло, чому порада «зняти обв''язку» взагалі має спрацювати.

    Насправді підтягування вниз, тобто **чип безпечний за замовчуванням**, а високим `GPIO12`
    робить лише те, що причепили ззовні. Додано — і саме цим замикається логіка всього блоку.'
  title: GPIO12 має внутрішнє підтягування вниз — безпечний за замовчуванням
