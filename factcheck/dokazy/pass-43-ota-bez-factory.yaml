# Прохід 43 — схема OTA без розділу `factory`.
#
# Заявлено як **суперечність**, виявилося підтвердженням. Помічник
# прочитав готові пресети таблиці розділів («Single factory app, no
# OTA» і «Factory app, two OTA definitions»), побачив, що в обох є
# `factory`, і виснував, що книга суперечить документації.
#
# Він не дійшов до рядка 137, де сказано протилежне прямо.
#
# Це третій випадок за дві сесії, коли `sperechayetsya` виявився
# підтвердженням (перед тим littlefs і перепід'єднання Wi-Fi). Спільне
# в усіх трьох: **помічник знайшов правильний документ і зупинився на
# першому місці, що виглядало відповіддю.**
#
# Звідси правило, дешевше за будь-яку заборону: заявлена суперечність
# перевіряється супровідником **у повному документі**, а не в наведеному
# уривку. Досі жодна не пережила такої перевірки.



