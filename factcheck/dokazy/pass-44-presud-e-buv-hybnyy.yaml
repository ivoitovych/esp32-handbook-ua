# Прохід 44 — два присуди «джерела не існує», обидва хибні.
#
# ## Як їх знайшли
#
# У дереві **152 докази присуджують клас `E`** — тобто стверджують, що
# зовнішнього джерела немає. Це не механічне присвоєння за браком
# сигналу, а **судження**, і воно закриває одиницю назавжди.
#
# З них **247 одиниць** мають у тексті число з одиницею виміру. Число
# зазвичай звідкись береться, тож присуд «джерела немає» саме тут
# найпідозріліший.
#
# ## Вимір, а не враження
#
# Випадкова вибірка **12 із 247**, насіння **20260827** записане, щоб
# витяжку можна було повторити. Судив супровідник, поодинці:
#
#     хибний присуд, факт задокументовано     3
#     сумнівний, імовірно задокументовано     2
#     присуд виправданий (порада, ринок,
#       конструктивне рішення)                7
#
# **Троє з дванадцяти — чверть.** У перерахунку на 247 це приблизно
# 60 одиниць, закритих присудом там, де джерело є. Довірчий проміжок
# широкий (три з дванадцяти), тож це оцінка, не вимір; але навіть її
# нижній край — десятки одиниць.
#
# Двоє з трьох доведено нижче дослівно. Третій — `T-16-041`, зсув
# бутлоадера S3 — лишається на наступний прохід.
#
# ## Урок
#
# > Присуд «зовнішнього джерела не існує» коштує рівно стільки ж, як
# > і будь-яке інше твердження про світ, і потребує того самого класу
# > доказу. Різниця в тому, що хибне підтвердження ловить третій шар,
# > а хибний присуд **не ловить ніхто**: одиниця просто зникає з черги.

