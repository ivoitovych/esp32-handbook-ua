  cytata: |
    a partition table is flashed to (:menuitem:`default offset <CONFIG_PARTITION_TABLE_OFFSET>`) 0x8000 in the flash
  sposib: >-
    `curl` на `raw.githubusercontent.com`, гілка `master`, рядок 9.
    Документ отримано в цій сесії, витяг наведено дослівно. Другий шар
