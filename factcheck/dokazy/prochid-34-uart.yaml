- nazva: 'T-34-041: Перемкнути напрямок відразу після нього означає обрізати власну'
  zbih: Перемкнути\s+напрямок\s+відразу\s+після\s+нього\s+означає\s+обрізати\s+власну\s+посилку\s+посередині\.
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/master/docs/en/api-reference/peripherals/uart.rst
  cytata: 'The DTR line is automatically controlled by the hardware directly under RS485 half-duplex
    mode, while the RTS line is software-controlled by the UART driver. Once the host starts
    writing data to the TX FIFO buffer, the UART driver automatically asserts the RTS pin
    (logic 1); once the last bit of the data has been transmitted, the driver de-asserts the
    RTS pin (logic 0)

    '
  sposib: 'Суцільний прохід 2026-08-27. Документ отримано в сесії, витяг звірено з ним підрядком
    машинно (`tools/prochid_zvid.py`). Клас `A` тут означає «документ отримано, цитата дослівна»,
    а **не** «супровідник прочитав і згоден»: змістовий шар лишається окремою роботою.'
  notatka: тут описано, як контролюється напрямок і можна обрізати посилку
