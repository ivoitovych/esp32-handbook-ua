  cytata: 'The DTR line is automatically controlled by the hardware directly under RS485 half-duplex
    mode, while the RTS line is software-controlled by the UART driver. Once the host starts
    writing data to the TX FIFO buffer, the UART driver automatically asserts the RTS pin
    (logic 1); once the last bit of the data has been transmitted, the driver de-asserts the
    RTS pin (logic 0)

    '
