# Прохід 6 — командний рядок esptool і механізм strapping.
#
# Дві найбільші групи, що лишалися незакритими після п'яти проходів.
# Обидві виявилися досяжними: esptool має відкриті репозиторій і
# документацію, а механізм MTDI описаний у Kconfig самого бутлоадера.
#
# Прохід дав дві знахідки: одне перебільшення й одне спрощення, обидва в
# місцях, де читач діє за текстом.











- nazva: Синтаксис esptool v5 — дефіси замість підкреслень, без .py
  zbih: esptool v5|write_flash|write-flash|синтаксис\w* v5|--flash_size|`esptool\.py`
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esptool/master/docs/en/migration-guide.rst
  cytata: 'The preferred way to invoke esptool command-line tools has changed. Instead of
    running

    the scripts with `.py` suffix, you should now use the console scripts without the `.py`
    suffix.

    - ``esptool.py`` → ``esptool``

    - ``espefuse.py`` → ``espefuse``

    …

    All the commands and options have been renamed to use ``-`` instead of ``_`` as a separator

    (e.g., ``write_flash`` -> ``write-flash``).


    Old command and option names are **deprecated**, meaning they will work for now with a

    warning, but will be removed in the next major release.


    This change affects most of the commands and the following options: ``--flash_size``,

    ``--flash_mode``, ``--flash_freq``, ``--use_segments``.

    …

    1. Replace all underscores in the ``--before`` and ``--after`` options with ``-`` in your
    scripts.

    '
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Знахідка проходу. Книга стверджувала, що команди v4 «дослівно на v5 не працюють,
    і навпаки» — симетрично. Насправді напрямки різні: старе ім''я на v5 **працює** з попередженням
    про застарілість, а нове ім''я на v4 не працює зовсім. Різниця практична: читач, який
    скопіював `write_flash` і побачив результат, вирішить, що все гаразд, — і зламається на
    наступному major-релізі. Виправлено в розділі 17, заразом додано те, чого бракувало: перейменування
    торкнулося й опцій (`--flash_size`, `--flash_mode`, `--flash_freq`) та значень `--before`
    і `--after`, які книга вже вживає в новій формі в додатку C.'
  title: Синтаксис esptool v5 — дефіси замість підкреслень, без .py
  match: esptool v5|write_flash|write-flash|синтаксис\w* v5|--flash_size|`esptool\.py`
  status: verbatim
  source: https://raw.githubusercontent.com/espressif/esptool/master/docs/en/migration-guide.rst
