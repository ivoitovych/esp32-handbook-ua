- nazva: INA219 — вимірювання струму й напруги по I²C
  zbih: \*\*INA219, INA226\*\*.*вимірювання.*по I²C.*вбудованим шунтом
  klas: A
  dzherelo: Texas Instruments, INA219 Zerø-Drift, Bidirectional Current/Power Monitor With I2C Interface,
    SBOS448G, розділ Features та Description
  cytata: 'INA219 Zerø-Drift, Bidirectional Current/Power Monitor With I2C Interface


    Features:

    • Senses Bus Voltages from 0 to 26 V

    • Reports Current, Voltage, and Power

    • I2C- or SMBUS-compatible interface features 16 programmable addresses

    • High Accuracy: 0.5% (Maximum) Over Temperature (INA219B)

    • Calibration Registers

    '
  sposib: PDF Texas Instruments, кеш `ina219.pdf`, pdftotext -layout, 2026-08-26
  notatka: INA219 офіційно вимірює струм по внутрішньому шунту (0.1Ω) і напругу шини, з вбудованим I²C
    інтерфейсом. Це підходить для вимірювання живлення в ESP32 проектах.
  title: INA219 — вимірювання струму й напруги по I²C
