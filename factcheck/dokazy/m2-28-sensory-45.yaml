- nazva: HC-SR04 — 5 В на виводі ECHO
  zbih: HC-SR04 живиться від 5 В і видає.*5 В на виводі.*ECHO
  klas: A
  dzherelo: Elecfreaks, Ultrasonic Ranging Module HC-SR04, Wire Connection Diagram та Electric Parameters
  cytata: 'Wire connecting direct as follows:

    - 5V Supply (Vcc)

    - Trigger Pulse Input (Trig)

    - Echo Pulse Output (Echo)

    - 0V Ground (GND)


    Working Voltage: DC 5V

    Echo Output Signal: Input TTL lever signal and the range in proportion

    '
  sposib: PDF Elecfreaks, кеш `hc-sr04.pdf`, pdftotext -layout, 2026-08-26
  notatka: HC-SR04 живиться від 5 В і видає TTL-рівневий сигнал на echo. Оскільки модуль на 5 В, то echo
    видає 5 В логічної одиниці. Для ESP32 (3.3 В) потребує дільника напруги.
