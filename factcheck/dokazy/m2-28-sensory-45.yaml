  klas: E
  dzherelo: null
  cytata: null
  sposib: null
  notatka: 'Це архітектурна порада про інтеграцію HC-SR04 з ESP32. Розрахунок дільника (10кОм + 20кОм
    виділяє 5В → 1.67В) є практичним рішенням, а не фактом про контролер HC-SR04. | Переглянуто 2026-08-27
    у розборі 36 надмірних E. Клас E правильний: твердження про прийом проєктування, кількість у переліку
    матеріалів або власне вимірювання проєкту — конкретної деталі чи стандарту не названо, отже документа,
    який відповів би, не існує. Число в назві є, але воно номінал у пораді, а не величина з паспорта.'
