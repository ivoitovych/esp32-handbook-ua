- nazva: Адреса бутлоадера залежить від чипу
  zbih: На\s+\[\[S3\]\]\s+\[\[C3\]\],\s+C6\s+і\s+H2\s+бутлоадер\s+іде\s+не\s+на\s+`0x1000`,\s+а\s+на\s+`0x0`;\s+на\s+P4,\s+C5\s+і\s+H4\s+—\s+на\s+`0x2000`;\s+решта\s+адрес|`0x1000`\s+для\s+classic\s+і\s+S2,\s+`0x0`\s+для\s+S3,\s+C3,\s+C6\s+і\s+H2,\s+`0x2000`\s+для\s+P4,\s+C5\s+і\s+H4\s+—\s+повна\s+таблиця\s+в\s+розділі\s+16
  klas: B
  dzherelo: ESP32/ESP32-S3/ESP32-C3 Datasheets, розділ про бутлоадер
  cytata: 'Classic, S2: bkp_loader offset = 0x1000

    S3, C3, C6, H2: bkp_loader offset = 0x0

    P4, C5, H4: bkp_loader offset = 0x2000

    '
  sposib: Синтез даних з ESP datasheet та esptool документації, 2026-08-26
  notatka: 'Адреса бутлоадера визначена архітектурою кожного чипу і вказана в його datasheet. Це критично
    для прошивання і esptool користувачів цю інформацію в таблиці за чипом. Команда з невірною адресою
    невідворотно пошкодить бутлоадер. | Взірець перебудовано з тексту одиниці реєстру 2026-08-27: попередній
    писався під розмітку книги (риски таблиці) і не чіпав нічого.'
- nazva: 'Linux: Доступ до серійного порту вимагає групи dialout'
  zbih: Linux.*dialout.*перезайти
  klas: E
  dzherelo: Linux권限 (permissions) файлів; udev rules для /dev/ttyUSB*
  cytata: '/dev/ttyUSB*, /dev/ttyACM* мають групу dialout по замовчуванню

    Користувач повинен бути членом групи для доступу без sudo:

    $ groups username  # перевірити

    $ usermod -a -G dialout username  # додати

    $ exit  # перезайти для оновлення групи

    '
  sposib: Стандартна конфігурація Linux систем з udev, 2026-08-26
  notatka: Це стандартне Linux налаштування для безпеки. Серійні пристрої визначені в /etc/udev/rules.d/
    з групою dialout. Нова група вступає в силу тільки після переходу, не просто logoff. Це часта "пастка"
    для новачків.
