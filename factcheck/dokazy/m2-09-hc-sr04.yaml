- nazva: DS3231 і BH1750 — джерела недосяжні з цієї мережі
  zbih: DS3231 · Що дає → RTC з батарейкою
  klas: C
  dzherelo: DS3231 Extremely Accurate I2C-Integrated RTC/TCXO/Crystal, datasheet Maxim Integrated
    (нині Analog Devices) — https://www.analog.com/en/products/ds3231.html
  shukaty: 'точність ходу (± ppm за температурою), струм від резервної батареї в режимі підтримки,
    діапазон живлення VBAT і адреса на шині I²C (очікується 0x68). Окремо — чи є в datasheet
    згадка про тип батареї: у книзі стоїть CR2032, але це властивість **модуля**, а не мікросхеми'
  notatka: 'Чесний `C`. `analog.com` відмовляє **цій мережі** на рівні Akamai — «Access Denied»
    із посиланням `errors.edgesuite.net`, і не лише `curl`, а й справжньому Chrome. Це не
    фільтр на інструмент, а рішення видавця; обійти його я не можу й не пробував.

    Перевірено чотири дзеркала (Mouser, DigiKey, SparkFun, rcscomponents) — жодне не віддало
    PDF. Те саме з BH1750 (ROHM).

    Межа, що повторюється з кроку 4: `CR2032` у книзі — властивість модуля, а не DS3231. Datasheet
    мікросхеми її не підтвердить ніколи, хоч би він і відкрився.'
  title: DS3231 і BH1750 — джерела недосяжні з цієї мережі
