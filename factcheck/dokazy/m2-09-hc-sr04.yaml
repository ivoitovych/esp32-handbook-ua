- nazva: HC-SR04 живиться від 5 В, тому ECHO дає 5 В
  zbih: HC-SR04 живиться від 5 В і видає \*\*5 В на виводі `ECHO`|HC-SR04 видає 5 В на `ECHO`
    — дільник обов.язковий
  klas: B
  dzherelo: Ultrasonic Ranging Module HC-SR04, datasheet ElecFreaks — «Electric Parameter»
    і «Wire connecting»
  cytata: "Wire connecting direct as following:\n  5V Supply\n  Trigger Pulse Input\n  Echo\
    \ Pulse Output\n  0V Ground\n\nElectric Parameter\n  Working Voltage        DC 5 V\n \
    \ Echo Output Signal     Input TTL lever signal and the range in proportion\n"
  sposib: PDF ElecFreaks, кеш `hc-sr04.pdf`, pdftotext -layout, 2026-08-26
  notatka: 'Клас `B`, а не `A`, і різницю варто назвати чесно: datasheet **не пише** «5 В
    на ECHO» дослівно. Він пише два факти — живлення `DC 5 V` і що `ECHO` є `TTL lever signal`.
    Логіка TTL від п''ятивольтового живлення дає високий рівень близько 5 В; висновок однозначний,
    але це висновок.

    Для книги різниці немає: дільник потрібен у будь-якому разі, бо абсолютний максимум входу
    ESP32 — 3.6 В (доказ `m2-06-napruga-mezhi`). Але реєстр має показувати `B`, а не вдавати
    цитату, якої немає.'
  title: HC-SR04 живиться від 5 В, тому ECHO дає 5 В
