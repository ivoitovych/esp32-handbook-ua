- nazva: ILI9341 — SPI Mode 0 (CPHA=0, зразок на першому фронті)
  zbih: 'ILI9341 · Режим → 0'
  klas: A
  dzherelo: >-
    ILI Technology, ILI9341 Datasheet V1.11, розділ 6 «Pin Description»
    (SDI/SDA) і розділ 7.1.9 «Write Cycle Sequence»
  cytata: |
    SDI/SDA    I/O    The data is applied on the rising edge of the SCL signal.

    7.1.9. Write Cycle Sequence
    Host processor drives the CSX pin to low and starts by setting the D/CX bit on SDA. The bit is read by ILI9341
    on the first rising edge of SCL signal. On the next falling edge of SCL, the MSB data bit (D7) is set on SDA by
    the host.
  sposib: >-
    PDF ILI Technology, кеш `ili9341.pdf`, реєстр
    `factcheck/DZHERELA-m2.md`, pdftotext -layout, 2026-08-26
  notatka: >-
    Хост змінює біт на падаючому фронті SCL, ILI9341 читає його на
    наступному висхідному — зразок на першому (провідному) фронті при
    клоку, що в стані очікування низький: це і є SPI Mode 0
    (CPOL=0, CPHA=0), як і каже книга. Той самий висновок про «номер
    фронту, а не напрямок», що вже встановлений в pass-16-interfeysy
    для інших рядків додатка E.

