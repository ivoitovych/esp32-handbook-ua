# М2, крок 18 — решта додатка E (dodatky/e-interfeysy.md), 21 одиниця
# з поділу М1: рядки DS3231, INA219/INA226, PCF8574 і MCP23017
# (клітинки «Бібліотека», бо «Що дає» вже клас A з m2-08), ST7789,
# ILI9341, MCP2515, MAX31855/MAX6675, HC-SR04.
#
# T-E-034 (PCF8574 · Що дає) і T-E-037 (MCP23017 · Що дає) уже клас A
# з m2-08-dyspleyi-rozshyryuvachi.yaml — тут не чіпаю.
#
# Джерела в кеші: `ina219.pdf`, `ina226.pdf` (TI), `st7789.pdf`
# (Sitronix), `ili9341.pdf` (ILI Technology), `mcp2515.pdf`
# (Microchip), `max31855.pdf`, `max6675.pdf` (Maxim/Analog, обидва —
# через дзеркало cdn-shop.adafruit.com; analog.com блокує з цієї
# мережі), `hc-sr04.pdf` (Elecfreaks). DS3231 пропущено за прямою
# вказівкою: analog.com не береться, одразу клас C.
#
# Урок з попереднього чанку (BMP280): для кожного подвійного рядка
# «X / Y» окремо перевірено, чи спільна клітинка справедлива для ОБОХ
# деталей, а не лише для однієї. Знахідка — MAX31855/MAX6675: «Що дає»
# і «Режим» правдиві для обох, а «Бібліотека → Adafruit MAX31855» — ні
# (див. нотатку останнього запису).

