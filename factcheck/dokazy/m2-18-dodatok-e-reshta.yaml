- nazva: INA219 / INA226 — обидва повідомляють струм і напругу
  zbih: 'INA219 / INA226 · Що дає → струм і напруга'
  klas: A
  dzherelo: >-
    Texas Instruments, INA219 (SBOS448G) і INA226 (SBOS547C) Datasheet,
    розділ 1 «Features» кожного
  cytata: |
    (INA219)
    INA219 Zerø-Drift, Bidirectional Current/Power Monitor With I2C Interface
    1 Features
    • Senses Bus Voltages from 0 to 26 V
    • Reports Current, Voltage, and Power

    (INA226)
    INA226 36V, 16-Bit, Ultra-Precise I2C Output Current, Voltage, and Power Monitor With Alert
    1 Features
    • Senses bus voltages from 0V to 36V
    • Reports current, voltage, and power
  sposib: >-
    PDF TI, кеш `ina219.pdf` і `ina226.pdf`, реєстр
    `factcheck/DZHERELA-m2.md`, pdftotext -layout, 2026-08-26
  notatka: >-
    «Струм і напруга» правдиве для обох мікросхем окремо — перевірено
    саме так, як просили: не лише «Що дає» в цілому, а що кожна з двох
    деталей у рядку справді це вміє. Обидві також повідомляють
    потужність (Power/Watts) — книга цього не згадує, це неповнота, а
    не помилка. Числова різниця, вартого уваги: межа шинної напруги —
    0…26 В в INA219 проти 0…36 В в INA226; рядок додатка E жодного
    числа не називає, тож книга нічого не наплутала, але читач, що
    обирає деталь під конкретну напругу, цієї різниці з таблиці не
    побачить.

