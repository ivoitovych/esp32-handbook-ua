- nazva: MCP2515 — окремий CAN-контролер по SPI, Mode 0 підтримується
  zbih: 'MCP2515 · Режим → 0'
  klas: A
  dzherelo: >-
    Microchip, MCP2515 Stand-Alone CAN Controller with SPI Interface
    (DS20001801J), розділ «Features»
  cytata: |
    MCP2515
    Stand-Alone CAN Controller with SPI Interface
    Features
    • High-Speed SPI Interface (10 MHz):
      - SPI modes 0,0 and 1,1
  sposib: >-
    PDF Microchip, кеш `mcp2515.pdf`, реєстр `factcheck/DZHERELA-m2.md`,
    pdftotext -layout, 2026-08-26
  notatka: >-
    Datasheet прямо називає підтримувані режими нотацією (CPOL,CPHA):
    «0,0» — це SPI Mode 0, «1,1» — Mode 3. Книга називає лише 0 (як і
    для рядка ST7789/SSD1306, де вказано «0 або 3»), що є підмножиною,
    не помилкою: узгоджено з рештою рядків книги, де завжди вказано
    робочий, а не вичерпний перелік режимів.

- nazva: MCP2515 — стендалон CAN-контролер із SPI
  zbih: 'MCP2515 · Що дає → зовнішній CAN'
  klas: A
  dzherelo: >-
    Microchip, MCP2515 Datasheet (DS20001801J), титульна сторінка й
    розділ «Description»
  cytata: |
    MCP2515
    Stand-Alone CAN Controller with SPI Interface
    Microchip Technology's MCP2515 is a stand-alone Controller Area Network (CAN) controller that implements
    the CAN specification, Version 2.0B. […] The MCP2515 interfaces with microcontrollers (MCUs) via an
    industry standard Serial Peripheral Interface (SPI).
  sposib: >-
    PDF Microchip, кеш `mcp2515.pdf`, реєстр `factcheck/DZHERELA-m2.md`,
    pdftotext -layout, 2026-08-26
  notatka: >-
    «Зовнішній» — точне слово: MCP2515 підключається до MCU через SPI
    саме тому, що сам MCU (у книзі — ESP32) власного CAN-контролера не
    має; для ESP32, що має вбудований TWAI, MCP2515 потрібен лише для
    другої шини чи гальванічної розв'язки — це вже редакційна колонка
    «Бібліотека» цього рядка й нижче.

- nazva: MCP2515 — «Бібліотека → —» це посилання на вбудований контролер ESP32, не факт про MCP2515
  zbih: 'MCP2515 · Бібліотека → — \(у ESP32 є свій, розділ 38\)'
  klas: E
  dzherelo: —
  cytata: —
  sposib: >-
    Немає зовнішнього джерела для перевірки — MCP2515 datasheet нічого
    не каже про периферію ESP32. Твердження «в ESP32 є свій [CAN-
    контролер]» — про TWAI ESP32, а не про мікросхему цього рядка;
    воно закривається окремо в фактчекінгу розділу 38 (де й
    розгорнуто), не тут.
  notatka: >-
    Клас E за формою (не факт про MCP2515), хоча підстава для «—»
    зрозуміла й правильна: TWAI — справді вбудований периферійний блок
    ESP32, задокументований в ESP-IDF. Повторна звірка цього факту
    належить розділу 38, не додатку E.

- nazva: MAX31855 / MAX6675 — обидва термопарні перетворювачі
  zbih: 'MAX31855 / MAX6675 · Що дає → термопара'
  klas: A
  dzherelo: >-
    Maxim/Analog Devices, MAX31855 (19-5793) і MAX6675 (19-2235)
    Datasheet, титульна сторінка кожного
  cytata: |
    (MAX31855)
    MAX31855
    Cold-Junction Compensated
    Thermocouple-to-Digital Converter

    (MAX6675)
    Cold-Junction-Compensated K-Thermocouple-
    to-Digital Converter (0°C to +1024°C)
  sposib: >-
    PDF Maxim/Analog Devices (через дзеркало cdn-shop.adafruit.com —
    analog.com блокує з цієї мережі), кеш `max31855.pdf` і
    `max6675.pdf`, реєстр `factcheck/DZHERELA-m2.md`, pdftotext -layout,
    2026-08-26
  notatka: >-
    «Термопара» правдиве для обох окремо — перевірено кожну деталь
    подвійного рядка окремо, як і просили. Різниця, вартого уваги:
    MAX31855 підтримує сім типів термопар (K, J, N, T, S, R, E),
    MAX6675 — лише тип K («Direct Digital Conversion of Type -K
    Thermocouple Output»). Книга типу термопари не називає, тож
    помилки немає — але хто побудує деталь під MAX6675, обмежений
    типом K, а рядок цього не показує.

- nazva: MAX31855 / MAX6675 — SPI Mode 0 в обох референсних бібліотеках
  zbih: 'MAX31855 / MAX6675 · Режим → 0'
  klas: A
  dzherelo: >-
    adafruit/Adafruit-MAX31855-library, `Adafruit_MAX31855.cpp`;
    RobTillaart/MAX6675, `MAX6675.cpp`
  cytata: |
    (Adafruit_MAX31855.cpp)
    Adafruit_MAX31855::Adafruit_MAX31855(int8_t _cs, SPIClass *_spi)
        : spi_dev(_cs, 1000000, SPI_BITORDER_MSBFIRST, SPI_MODE0, _spi) {}

    (RobTillaart/MAX6675/MAX6675.cpp)
    void MAX6675::setSPIspeed(uint32_t speed)
    {
      _SPIspeed = speed;
      _spi_settings = SPISettings(_SPIspeed, MSBFIRST, SPI_MODE0);
    }
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: >-
    Перевірено окремо для кожної з двох деталей рядка — саме тому, що
    попередній чанк показав, як легко невірно приписати спільній
    клітинці властивість лише однієї з пари. Обидва посилання явно
    задають `SPI_MODE0`. Datasheet-текст сам по собі («D31…D0
    presented to SO within tDO of the falling edge of SCK») без
    бібліотечного підтвердження можна прочитати неоднозначно (зміна
    даних на падаючому фронті наводить на думку про Mode 1), тому як
    первинне джерело для класу A взято сам робочий драйвер, а не власна
    інтерпретація часової діаграми — це надійніший шлях, ніж
    самостійний розбір таймінгів. Офіційна бібліотека Adafruit для
    MAX6675 (`adafruit/MAX6675-library`) для порівняння: програмний
    бітбенг без апаратного SPI, тому в ній самої константи `SPI_MODE0`
    немає — використано альтернативну, широко вживану апаратну
    бібліотеку `RobTillaart/MAX6675`.

- nazva: MAX31855 / MAX6675 — «Бібліотека → Adafruit MAX31855» не працює з MAX6675
  zbih: 'MAX31855 / MAX6675 · Бібліотека → Adafruit MAX31855'
  klas: E
  dzherelo: —
  cytata: —
  sposib: >-
    Немає зовнішнього джерела для перевірки самої назви бібліотеки —
    але перевірено (curl raw.githubusercontent, 2026-08-26), що
    `adafruit/Adafruit-MAX31855-library` і `adafruit/MAX6675-library`
    — два різні репозиторії Adafruit, кожен під свою мікросхему.
  notatka: >-
    Клас E за правилом («Бібліотека» — не факт про кристал), але це
    саме той різновид помилки, який просили шукати в подвійних рядках:
    рядок «MAX31855 / MAX6675» називає в колонці «Бібліотека» лише
    `Adafruit MAX31855` — а ця бібліотека працює тільки з MAX31855.
    Читач, що зібрав термопару на MAX6675 (дешевший, без підтримки
    інших типів термопар, лише K) і встановив бібліотеку за підказкою
    цього рядка, отримає код, який не компілюється для його деталі:
    для MAX6675 потрібна окрема `MAX6675` (Adafruit) чи `RobTillaart/
    MAX6675`. На відміну від BMP280/вологості, це не суперечність між
    частинами книги (розділ 45 такого протиріччя не містить — MAX6675
    там не згадується), а прогалина лише в цьому рядку додатка E.

- nazva: HC-SR04 — тригер і ECHO, 5 В TTL
  zbih: 'HC-SR04 · Як → тригер \+ вимір `ECHO` \(⛔ 5 В!\)'
  klas: A
  dzherelo: Elecfreaks, Ultrasonic Ranging Module HC-SR04 (product datasheet)
  cytata: |
    Wire connecting direct as following:
       5V Supply
       Trigger Pulse Input
       Echo Pulse Output
       0V Ground

    Electric Parameter
    Working Voltage                DC 5 V
    Trigger Input Signal           10uS TTL pulse
    Echo Output Signal             Input TTL lever signal and the range in proportion
  sposib: >-
    PDF Elecfreaks, кеш `hc-sr04.pdf`, реєстр `factcheck/DZHERELA-m2.md`,
    pdftotext -layout, 2026-08-26
  notatka: >-
    Обидві половини твердження дослівні: окремі піни тригера й ECHO, і
    робоча напруга модуля — 5 В, тобто ECHO — це 5-вольтовий TTL-рівень.
    Попередження «⛔ 5 В!» у книзі влучне: пряме підключення ECHO до
    GPIO ESP32 (толерантність 3.3 В) без дільника напруги ризиковане.
    Datasheet цього попередження сам не формулює (виробники таких
    попереджень про сумісність із конкретним MCU зазвичай не пишуть) —
    це книжковий, а не джерельний висновок, але числа, з яких він
    випливає (5 В проти 3.3 В ESP32), дослівні.

