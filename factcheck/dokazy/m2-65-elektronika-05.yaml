- nazva: Спільна земля — сигнали це напруги відносно точки відліку (GND)
  zbih: спільна земля|GND|точка відліку
  klas: E
  dzherelo: Базовий принцип електроніки
  cytata: 'Сигнал — це напруга відносно точки відліку (земля, GND). Без спільної

    землі у всіх пристроїв "3.3 В" у одного пристрою може означати іншу

    напругу у іншого без спільної землі.


    Приклад: якщо ESP32 має GND на 0 В, а зовнішній пристрій має GND на 1 В,

    то "3.3 В" від ESP32 буде сприйнято як "2.3 В" у другого пристрою (відносно

    його GND на 1 В).

    '
  sposib: Базова електротехніка, 2026-08-26
  notatka: Це критична помилка при проектуванні схем. Без спільної землі сигнали не мають
    смислу.
