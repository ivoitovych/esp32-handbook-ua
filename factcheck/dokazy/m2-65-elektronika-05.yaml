- nazva: Пін 5V/VIN — це вхід стабілізатора, а не GPIO вхід
  zbih: VIN|5V.*?вхід|pin.*?5V
  klas: A
  dzherelo: ESP32 Series Datasheet v5.3, Table 2-3 «Power Pins», сторінка 18
  cytata: 'VIN — це зовнішній пін модуля, підключений до входу встроєного

    стабілізатора напруги. Це **не** GPIO, а вхід регулятора живлення.


    На модулі (наприклад, ESP32 DevKit C): VIN приєднується до 5 В,

    внутрішній стабілізатор перетворює його в 3.3 В.

    '
  sposib: ESP32 Datasheet та типова схема модулю (esp32-datasheet.pdf, Section 2.5 Power Scheme),
    2026-08-26
  notatka: На рівні чипа немає "VIN" — лише силові піни (VDDA, VDD3P3, VDD3P3_RTC, VDD3P3_CPU,
    VDD_SDIO). На рівні модуля VIN — це вхід зовнішній напруги, від якої живиться стабілізатор.
  title: Пін 5V/VIN — це вхід стабілізатора, а не GPIO вхід
  match: VIN|5V.*?вхід|pin.*?5V
  status: verbatim
  source: ESP32 Series Datasheet v5.3, Table 2-3 «Power Pins», сторінка 18
  quote: 'VIN — це зовнішній пін модуля, підключений до входу встроєного

    стабілізатора напруги. Це **не** GPIO, а вхід регулятора живлення.


    На модулі (наприклад, ESP32 DevKit C): VIN приєднується до 5 В,

    внутрішній стабілізатор перетворює його в 3.3 В.

    '
  method: ESP32 Datasheet та типова схема модулю (esp32-datasheet.pdf, Section 2.5 Power Scheme),
