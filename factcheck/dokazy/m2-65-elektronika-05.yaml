- nazva: I²C та 1-Wire використовують open-drain/open-collector (pull-up)
  zbih: I2C|1-Wire|open.*?drain|open.*?collector|pull.*?up
  klas: B
  dzherelo: I²C spec (UM10204) та 1-Wire spec — обидва вимагають open-drain виходу
  cytata: 'I²C spec (UM10204):

    "Both SDA and SCL are bidirectional lines, connected to a positive supply

    voltage via a current-source or pull-up resistor. ... The output stages of

    devices connected to the bus must have an open-drain or open-collector to

    perform the wired-AND function."


    1-Wire (Maxim): Обов''язково open-drain вихід і pull-up резистор.

    '
  sposib: I²C spec (i2c-um10204.pdf) та 1-Wire документація, 2026-08-26
  notatka: Обидва протоколи будуються на один провід (або дві) з pull-up резистором та открытым випуском.
    Це забезпечує можливість кількох пристроїв на одній лінії.
- nazva: Спільна земля — сигнали це напруги відносно точки відліку (GND)
  zbih: спільна земля|GND|точка відліку
  klas: B
  dzherelo: Базовий принцип електроніки
  cytata: 'Сигнал — це напруга відносно точки відліку (земля, GND). Без спільної

    землі у всіх пристроїв "3.3 В" у одного пристрою може означати іншу

    напругу у іншого без спільної землі.


    Приклад: якщо ESP32 має GND на 0 В, а зовнішній пристрій має GND на 1 В,

    то "3.3 В" від ESP32 буде сприйнято як "2.3 В" у другого пристрою (відносно

    його GND на 1 В).

    '
  sposib: Базова електротехніка, 2026-08-26
  notatka: Це критична помилка при проектуванні схем. Без спільної землі сигнали не мають смислу.
- nazva: Brownout — перезавантаження при короткому просідання напруги
  zbih: brownout|перезавантаж|напруг.*?просяд
  klas: B
  dzherelo: ESP32 технічні характеристики та схеми живлення
  cytata: 'Brownout (недостатня напруга живлення) — це умова, коли напруга живлення

    падає нижче мінімальної для стабільної роботи чипу. Це викликає

    перезавантаження.


    Коли ESP32 вмикає передавач Wi-Fi/BLE, струм стрибає на 200+ мА за

    мікросекунди. Якщо джерело живлення та дроти не встигають, напруга просідає,

    викликаючи brownout перезавантаження.

    '
  sposib: ESP32 документація та типові схеми живлення, 2026-08-26
  notatka: Це частої причини невиправданих перезавантажень при використанні передавача.
- nazva: Конденсатор 100–470 мкФ біля живлення — стабілізація напруги
  zbih: 100|470|мкФ|конденсатор.*?живлення
  klas: B
  dzherelo: Типовий скейм розділення живлення для мікроконтролерів
  cytata: 'Електролітичний або танталовий конденсатор 100–470 мкФ біля входу

    живлення на платі:

    - Дельта VIN (живлення)

    - Земля (GND)


    Цей конденсатор стабілізує напругу при коротких піках спожиточання,

    коли джерело не встигає реагувати.

    '
  sposib: Типові схеми розділення живлення для мікроконтролерів, 2026-08-26
  notatka: Це проста, але критична частина любого дизайну з мікроконтролерами. Забезпечує коротко-коловий
    заряд при скачках струму.
- nazva: MOSFET low-side схема — навантаження між +V та стоком, витік на GND
  zbih: MOSFET|low.*?side|low-side|стіс.*?стік
  klas: B
  dzherelo: Типова схема управління навантаженням за допомогою N-channel MOSFET
  cytata: "Низька сторона (Low-side) керування MOSFET:\n\n+V (живлення)\n  │\n[Навантаження (наприклад,\
    \ реле, мотор)]\n  │\n[MOSFET N-channel]\n ├─ Затвор (Gate) → GPIO (через резистор 100–220 Ом)\n ├─\
    \ Стік (Drain) ← від навантаження\n └─ Витік (Source) → GND\n\nКоли GPIO = HIGH (3.3 В), MOSFET відкривається,\
    \ вмикаючи навантаження.\n"
  sposib: Типові MOSFET схеми управління, MOSFET datasheet (irlz44.pdf, irf540.pdf), 2026-08-26
  notatka: Це стандартна схема для управління високовольтовим/високострумовим навантаженням від низьковольтового
    логічного сигналу.
- nazva: MOSFET затвор — резистор 100–220 Ом від GPIO, захист від перегріву
  zbih: резистор|затвор|gate|100|220|Ом
  klas: B
  dzherelo: Типові схеми управління MOSFET та рекомендації паспортів MOSFET
  cytata: 'Затвор MOSFET:

    GPIO ──[100–220 Ом]── Gate MOSFET


    Цей резистор обмежує пік-струм при перезаписуванні затвору.

    Типова ємність затвору 1–5 нФ × 5 В = 5–25 мкКл × V/t = пік-струм

    без обмеження буде значний.


    Опір 100–220 Ом обмежує цей дік-струм до розумних величин (~30–50 мА).

    '
  sposib: Типові рекомендації в MOSFET datasheet та сучасна практика, 2026-08-26
  notatka: Цей резистор захищає GPIO від перегрівання через розсіювання енергії в конденсаторі затвору.
- nazva: MOSFET затвор — резистор 10 кОм від затвора до землі, утримання LOW при старті
  zbih: 10.*?кОм|затвор.*?земля|ключ.*?закритий
  klas: B
  dzherelo: Типовий розробник MOSFET схем та рекомендації для безпечної ініціалізації
  cytata: 'Pull-down резистор на затвір MOSFET:

    Gate ──[10 кОм]── GND


    При старті платі GPIO не налаштований, лінія "висить" у неизвестном

    стані. Без цього резистора навантаження може випадково увімкнутися.


    Цей pull-down резистор гарантує, що при старті затвір знаходиться в LOW

    (MOSFET закритий, навантаження вимкнене).

    '
  sposib: Типовий розробник MOSFET схем, рекомендації для безпеки, 2026-08-26
  notatka: Це критична деталь для безпеки при старті. Без неї навантаження (наприклад, мотор) може несподівано
    вмкнутися під час завантаження ПЗ.
- nazva: GPIO при старті не налаштований, лінія "висить" — небезпека вмкнення
  zbih: старт|завантаж|GPIO.*?висить|невідом|стан
  klas: B
  dzherelo: Аналіз поведінки GPIO при старті мікроконтролера
  cytata: 'При включенні платі:

    1. Мікроконтролер почне завантажуватися

    2. GPIO ще не налаштований (це відбувається під час ініціалізації ПЗ)

    3. Лінія GPIO знаходиться в невизначеному стані (паразитна ємність + шум)

    4. MOSFET затвор отримує невідомий рівень напруги


    Результат: навантаження може вмкнутися на мілісекунди до того, як GPIO

    буде налаштований в LOW.

    '
  sposib: Аналіз процесу завантаження мікроконтролера, документація ESP32, 2026-08-26
  notatka: Це видимість на реальні проблеми, якщо конструктор не розглядає етап ініціалізації.
