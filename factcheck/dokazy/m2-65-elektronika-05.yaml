    '
  method: 'Логічний висновок з Закону Ома. Технічна база: ESP32 Datasheet (esp32-datasheet.pdf),
    Table 5-4 «Current Consumption», 2026-08-26'
  note: Проблема дешевих USB-кабелів — велика довжина + малий переріз провідника = великий
    опір. Це звичайна проблема при живленні ESP32 з тонких USB-кабелів.
- nazva: Формула резистора для світлодіода — R = (U_живлення − U_світлодіода) / I_бажаний
  zbih: 'резистор.*?світлодіод|R = '
  klas: D
  dzherelo: Класична формула для обмеження струму світлодіода, випливає з Закону Ома та його
    застосування
  cytata: 'Резистор обирається за формулою: R = (U_живлення − U_світлодіода) / I_бажаний

    Приклад: живлення 3.3 В, світлодіод червоний (2 В), бажаний струм 10 мА:

    R = (3.3 − 2) / 0.01 = 130 Ом

    '
  sposib: Класична електротехніка. LED Datasheet (led-red-wp7113id.pdf, led-blue-wp7113qbc.pdf),
    типовий струм 10-20 мА. 2026-08-26
  notatka: Формула широко використовується у практиці та описана у всіх посібниках по світлодіодам.
    Напруга світлодіода береться з його паспорту.
  title: Формула резистора для світлодіода — R = (U_живлення − U_світлодіода) / I_бажаний
  match: 'резистор.*?світлодіод|R = '
  status: arithmetic
  source: Класична формула для обмеження струму світлодіода, випливає з Закону Ома та його
    застосування
  quote: 'Резистор обирається за формулою: R = (U_живлення − U_світлодіода) / I_бажаний

