    \ resistor\nRPD          Resistance of internal         —    45   —    kΩ\n             pull-down\
    \ resistor\n\nВбудовані резистори (~45 кОм) активуються програмно через ESP-IDF:\ngpio_config_t cfg\
    \ = {\n    .mode = GPIO_MODE_INPUT,\n    .pull_up_en = GPIO_PULLUP_ENABLE,\n};\n"
