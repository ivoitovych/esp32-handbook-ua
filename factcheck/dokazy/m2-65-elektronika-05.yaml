    (MOSFET закритий, навантаження вимкнене).

    '
  method: Типовий розробник MOSFET схем, рекомендації для безпеки, 2026-08-26
  note: 'Це критична деталь для безпеки при старті. Без неї навантаження (наприклад, мотор)
    може несподівано вмкнутися під час завантаження ПЗ. | Переглянуто 2026-08-27 у розборі
