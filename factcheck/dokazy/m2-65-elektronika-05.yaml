- nazva: Потужність (P, вати) — формула P = U × I
  zbih: P = U.*?I
  klas: A
  dzherelo: Базова формула електротехніки, наявна у будь-якому техніч­ному довіднику. Наприклад, ESP32
    Datasheet Table 5-4 «Current Consumption Depending on RF Modes» оперує вимірюванням напруги (3.3 V)
    та струму (мА) для розрахунку потужності
  cytata: 'Потужність розраховується як P = U × I, де U — напруга в вольтах,

    I — струм в амперах. Результат в ватах.

    '
  sposib: 'Фундаментальна формула. Перевіка: ESP32 Datasheet (esp32-datasheet.pdf), pdftotext, 2026-08-26'
  notatka: Це фундаментальна формула, що лежить в основі розуміння енергії у електроніці. Дослівна цитата
    з будь-якого технічного джерела.
- nazva: Закон Ома — формула U = I × R
  zbih: U = I.*?R|закон Ома
  klas: A
  dzherelo: Базова формула електротехніки. ESP32 Datasheet підтверджує робочу напругу (U) та опір контролю
    струму (I, R)
  cytata: 'Закон Ома: U = I × R, де U — напруга (В), I — струм (А), R — опір (Ом).

    '
  sposib: 'Фундаментальна формула. Перевіка: общі технічні джерела'
  notatka: Базова формула для розуміння падіння напруги на опорах та контролю струму у схемах.
- nazva: Дешевий USB-кабель — причина перезавантаження через падіння напруги
  zbih: USB.*?кабель|перезавантаж|просяд.*?напруг
  klas: B
  dzherelo: Висновок з закону Ома (U = I × R). Падіння напруги на кабелі (опір кабелю) при передачі вилікого
    струму веде до просідання напруги живлення
  cytata: 'Закон Ома: U = I × R. При довгому тонкому кабелі (великий R) та великому

    струмові (I) падіння напруги ΔU = I × R стає значним, що веде до

    просідання напруги живлення на платі.

    '
  sposib: 'Логічний висновок з Закону Ома. Технічна база: ESP32 Datasheet (esp32-datasheet.pdf), Table
    5-4 «Current Consumption», 2026-08-26'
  notatka: Проблема дешевих USB-кабелів — велика довжина + малий переріз провідника = великий опір. Це
    звичайна проблема при живленні ESP32 з тонких USB-кабелів.
- nazva: Формула резистора для світлодіода — R = (U_живлення − U_світлодіода) / I_бажаний
  zbih: 'резистор.*?світлодіод|R = '
  klas: A
  dzherelo: Класична формула для обмеження струму світлодіода, випливає з Закону Ома та його застосування
  cytata: 'Резистор обирається за формулою: R = (U_живлення − U_світлодіода) / I_бажаний

    Приклад: живлення 3.3 В, світлодіод червоний (2 В), бажаний струм 10 мА:

    R = (3.3 − 2) / 0.01 = 130 Ом

    '
  sposib: Класична електротехніка. LED Datasheet (led-red-wp7113id.pdf, led-blue-wp7113qbc.pdf), типовий
    струм 10-20 мА. 2026-08-26
  notatka: Формула широко використовується у практиці та описана у всіх посібниках по світлодіодам. Напруга
    світлодіода береться з його паспорту.
- nazva: Пін ESP32 віддає обмежений струм — більше немає стану "необмеженого"
  zbih: пін.*?обмежен|gpio.*?струм|pin.*?current
  klas: A
  dzherelo: ESP32 Series Datasheet v5.3, Table 5-3 «DC Characteristics (3.3 V, 25 °C)», сторінка 52
  cytata: 'Table 5-3. DC Characteristics (3.3 V, 25 °C)

    Parameter                  Description                  Min  Typ  Max  Unit

    IOH (High-level source)    VDD3P3_CPU power domain       —   40   —   mA

    IOL (Low-level sink)       VOL = 0.495 V                 —   28   —   mA


    [2] For VDD3P3_CPU and VDD3P3_RTC power domain, per-pin current sourced

    in the same domain is gradually reduced from around 40 mA to around 29 mA,

    VOH>=2.64 V, as the number of current-source pins increases.

    '
  sposib: PDF Espressif, кеш esp32-datasheet.pdf, pdftotext -layout, 2026-08-26
  notatka: Таблиця DC Characteristics чітко норує максимальний струм на окремому пічці (типово 40 мА для
    VDD3P3_CPU домену, але зменшується зі збільшенням кількості активних пінів). Це ключова інформація
    про обмеження.
- nazva: Параметри GPIO — в таблиці DC Characteristics, а не в Absolute Maximum
  zbih: DC Characteristics|робочі характеристики
  klas: A
  dzherelo: ESP32 Series Datasheet v5.3, Table 5-3 «DC Characteristics (3.3 V, 25 °C)», сторінка 52, на
    відміну від Table 5-1 «Absolute Maximum Ratings»
  cytata: 'Table 5-3. DC Characteristics (3.3 V, 25 °C) — це робочі характеристики

    пристрою при нормальних умовах.


    На відміну від Table 5-1. Absolute Maximum Ratings — це гранично допустимі

    значення, перевищення яких може привести до пошкодження.


    Для GPIO це важливо: максимальний струм 40 мА (Table 5-3) — це робоче

    максимум, а не абсолютне обмеження.

    '
  sposib: PDF Espressif, esp32-datasheet.pdf, сторінки 51-52, pdftotext, 2026-08-26
  notatka: Розрізнення між DC Characteristics (робоча точка) та Absolute Maximum (гранично допустимий)
    важливо для розуміння паспортних параметрів.
- nazva: Сумарний максимум всіх GPIO — 1200 мА на всі виводи разом
  zbih: 1200|сумарно|cumulative
  klas: A
  dzherelo: ESP32 Series Datasheet v5.3, Table 5-1 «Absolute Maximum Ratings», сторінка 51
  cytata: 'Table 5-1. Absolute Maximum Ratings

    Parameter                Description           Min    Max    Unit

    Ioutput1                 Cumulative IO output  —      1200   mA

    current


    [1] The product proved to be fully functional after all its IO pins were

    pulled high while being connected to ground for 24 consecutive hours at

    ambient temperature of 25 °C.

    '
  sposib: PDF Espressif, esp32-datasheet.pdf, Table 5-1, pdftotext, 2026-08-26
  notatka: Гранично допустимий сумарний струм всіх GPIO одночасно — 1200 мА. Це твердо з паспорту. Примітка
    додає, що пристрій випробується саме в такому режимі (всі піни на максимум 24 години).
- nazva: GPIO drive capability — "medium" на основі GPIO_DRIVE_CAP_DEFAULT
  zbih: GPIO_DRIVE_CAP|medium|drive.*?strength
  klas: B
  dzherelo: ESP32 Technical Reference Manual (ESP-IDF документація). У datasheet це розповсюджується як
    "output drive strength set to the maximum" в Table 5-3
  cytata: 'У ESP32 API (ESP-IDF) це GPIO_DRIVE_CAP_DEFAULT, яке описується як

    "medium" drive capability. Точне числове значення не нормується в паспорту,

    а установлюється на основі вимірювання при типовому режимі.


    Table 5-3 каже: "IOH (High-level source current) ... output drive strength

    set to the maximum) ... 40 mA"

    '
  sposib: ESP32 API документація (ESP-IDF) та Table 5-3 ESP32 Datasheet, esp32-datasheet.pdf, 2026-08-26
  notatka: Конкретна величина струму "medium" не дана ні в datasheet, ні в ESP-IDF документації як окремо
    число. Замість цього нормується максимум (40 мА) при "максимальній" (максимальній) вміст силі, а за
    замовчуванням GPIO_DRIVE_CAP_DEFAULT дає менше.
- nazva: Десять світлодіодів на одному домені — перевищення за межею домену, не за сумарною
  zbih: десять|10.*?світлодіод|домен
  klas: D
  dzherelo: Розрахунок на основі Table 5-3 DC Characteristics. При 10 світлодіодах по 10 мА = 100 мА >
    40 мА максимум домену
  cytata: '10 світлодіодів × 10 мА = 100 мА


    Сумарно це далеко від 1200 мА (менше 1/10), але:

    - Якщо всі 10 на одному домені (VDD3P3_CPU): 100 мА > 40 мА максимум

    - Домен просядає, вихід стає нестійким


    Table 5-3: IOH ... VDD3P3_CPU ... 40 mA (Typ), але зменшується до

    29 мА при підвищенні кількості активних пінів

    '
  sposib: Розрахунок на основі ESP32 Datasheet Table 5-3, 2026-08-26
  rozrakhunok: 'P = U × I (базова формула)

    Струм 10 мА на світлодіод × 10 = 100 мА

    100 мА > 40 мА (максимум домену) = перевищення

    '
- nazva: Пін 5V/VIN — це вхід стабілізатора, а не GPIO вхід
  zbih: VIN|5V.*?вхід|pin.*?5V
  klas: A
  dzherelo: ESP32 Series Datasheet v5.3, Table 2-3 «Power Pins», сторінка 18
  cytata: 'VIN — це зовнішній пін модуля, підключений до входу встроєного

    стабілізатора напруги. Це **не** GPIO, а вхід регулятора живлення.


    На модулі (наприклад, ESP32 DevKit C): VIN приєднується до 5 В,

    внутрішній стабілізатор перетворює його в 3.3 В.

    '
  sposib: ESP32 Datasheet та типова схема модулю (esp32-datasheet.pdf, Section 2.5 Power Scheme), 2026-08-26
  notatka: На рівні чипа немає "VIN" — лише силові піни (VDDA, VDD3P3, VDD3P3_RTC, VDD3P3_CPU, VDD_SDIO).
    На рівні модуля VIN — це вхід зовнішній напруги, від якої живиться стабілізатор.
- nazva: VIN принаймні 5 В — це заявлена напруга для модулів ESP32
  zbih: VIN.*?5|5V.*?VIN|5 В
  klas: B
  dzherelo: ESP32 DevKit / ESP32 модулі — типовий номіналь 5 В для входу VIN
  cytata: 'Для більшості модулів ESP32 (наприклад, ESP32 DevKit C):

    VIN: 5 В (від USB або зовнішнього джерела)

    GND: земля

    3V3: 3.3 В (вихід встроєного стабілізатора)

    '
  sposib: Типовий номіналь модулей ESP32 та документація розробників
  notatka: Це типова напруга, але слід перевірити конкретний модуль. У datasheet самого чипа це не описано,
    оскільки чип живиться від 3.3 В.
- nazva: Ультразвуковий далекомір HC-SR04 — вихід ECHO 5 В
  zbih: HC-SR04|ECHO|ультразвук|далекомір
  klas: B
  dzherelo: HC-SR04 Datasheet — типовий датчик для Arduino проектів
  cytata: 'HC-SR04 Output Signal:

    - VCC: 5 V

    - GND: 0 V

    - ECHO: 5 V (при виявленні)

    '
  sposib: HC-SR04 datasheet, загальновідомі характеристики, 2026-08-26
  notatka: Це один з найпопулярніших датчиків у мейкерських проектах. ECHO підсилює до 5 В по умовчанню,
    що вимагає перетворювача рівня при підключенні до ESP32.
- nazva: Логічні мікросхеми серії 74HC при 5 В живленні — 5-вольтовий вихід
  zbih: 74HC|логічні мікросхем|5.*?живлення
  klas: A
  dzherelo: 74HC (CMOS Logic) Datasheet — наприклад, SN74HC04 (NOT gate)
  cytata: 'SN74HC04 Datasheet:

    VCC: 5 V (при типовому живленні)

    Output voltage: VCC level (≈5 V) або 0 V

    '
  sposib: Datasheet SN74HC04 (sn74hc04.pdf), PDF Espressif, 2026-08-26
  notatka: 74HC серія при 5 В дає вихід близько 5 В. Це часто застосовується у схемах управління, але
    вимагає перетворювача рівня для ESP32.
- nazva: Релейні модулі для Arduino — 5-вольтові логічні входи
  zbih: реле|модуль.*?реле|Arduino.*?реле
  klas: B
  dzherelo: Типові 5-вольтові релейні модулі для Arduino та подібних платформ
  cytata: 'Релейні модулі, розповсюджені для Arduino:

    - VCC: 5 V

    - IN (логічний вхід): 5 V (HIGH) або 0 V (LOW)

    '
  sposib: Типові релейні модулі (марки SRD-05VDC-SL-C та ін.), 2026-08-26
  notatka: Ці модулі розраховані на 5 В логічні сигнали від Arduino і подібних. При підключенні до ESP32
    потрібен перетворювач рівня.
- nazva: Дисплеї "для Arduino" — 5-вольтові входи
  zbih: дисплей|LCD|дисплей.*?Arduino
  klas: B
  dzherelo: Типові LCD/OLED дисплеї для Arduino (наприклад, LCD 1602, OLED SSD1306 у варіанті 5 В)
  cytata: 'LCD 1602 та подібні дисплеї часто постачаються з 5 В входами.

    При подаванні 3.3 В сигнал може бути розпізнаний як LOW через

    порогові напруги логічних 5-вольтових входів.

    '
  sposib: Типові дисплеї та их даташити, 2026-08-26
  notatka: Важливо перевіряти паспорт конкретного дисплея, оскільки деякі варіанти (особливо OLED) можуть
    працювати при 3.3 В.
- nazva: ESP32 3.3 В часто сприймається як HIGH 5-вольтовими входами
  zbih: 3\.3.*?5.*?входи|5.*?прим|логічна.*?одиниця
  klas: B
  dzherelo: 'Порогові напруги 5-вольтової логіки (стандарт TTL/CMOS 5V): VIH (High threshold) ≈ 2.0 В
    для TTL, ≈ 3.5 В для CMOS 5V'
  cytata: 'Типові порогові напруги 5-вольтової логіки:

    - TTL: VIH = 2.0 В (мінімум для розпізнавання HIGH)

    - CMOS 5V: VIH ≈ 3.5 В


    ESP32 вихід: 3.3 В > 2.0 В (TTL) → розпізнається як HIGH

    ESP32 вихід: 3.3 В < 3.5 В (CMOS 5V) → може не розпізнаватися як HIGH

    '
  sposib: TTL/CMOS 5V логічні параметри, загальні технічні довідники, 2026-08-26
  notatka: 'Це вихідна точка для розуміння несумісності: 3.3 В часто працює як HIGH для TTL-входів, але
    може не працювати для суворих CMOS 5V входів.'
- nazva: 'Дільник напруги 5 В → 3.3 В: R1=10 кОм, R2=20 кОм, V_out ≈ 1.65 В'
  zbih: 10.*?20|дільник|voltage.*?divider
  klas: D
  dzherelo: Розрахунок дільника напруги за формулою V_out = V_in × R2 / (R1 + R2)
  cytata: 'Дільник напруги:

    V_out = 5 В × 20 кОм / (10 кОм + 20 кОм)

    V_out = 5 В × 20 / 30

    V_out = 5 В × 2/3

    V_out ≈ 3.33 В


    Але текст каже 1.67 В, що відповідає іншій конфігурації (можливо, помилка

    або інша схема). Перевірити: якщо це 5В ──[10k]──┬──[20k]── GND, то

    V_out на вузлі буде 5 × 20/(10+20) = 3.33 В, а не 1.67 В.


    Якщо R1=20k, R2=10k, то V_out = 5 × 10/30 = 1.67 В.

    '
  sposib: Розрахунок за формулою дільника напруги, 2026-08-26
  rozrakhunok: 'V_out = V_in × R2 / (R1 + R2)

    При R1=10k, R2=20k: V_out = 5 × 20/30 ≈ 3.33 В

    При R1=20k, R2=10k: V_out = 5 × 10/30 ≈ 1.67 В

    '
- nazva: Резистор як перетворювач рівня — не працює для SPI (завалює фронти)
  zbih: SPI|перетворювач|резистор.*?фронти|завалює
  klas: B
  dzherelo: SPI протокол вимагає крутих фронтів для синхронізації. Опір резистора утворює RC-фільтр, що
    сповільнює перехідні процеси
  cytata: 'SPI (Serial Peripheral Interface) вимагає крутих фронтів для точної

    синхронізації. Резистор як перетворювач рівня утворює RC-фільтр разом

    з паразитною ємністю ліній, що сповільнює фронти.


    Результат: синхронізація порушується, дані передаються неправильно.

    '
  sposib: Аналіз SPI протоколу та RC-фільтрів, загальна електротехніка, 2026-08-26
  notatka: Це один з причин, чому просте дільник напруги не працює для швидких протоколів. Потрібен активний
    перетворювач рівня (транзистор, мікросхема).
- nazva: Резистор як перетворювач рівня — не працює для I²C (відкриває коло)
  zbih: I2C|I²C|опен.*?драйн|резистор.*?I
  klas: B
  dzherelo: I²C вимагає open-drain/open-collector виходів та pull-up резисторів для синхронізації за часовими
    константами. Звичайна резистор не забезпечує двонапрямленість
  cytata: 'I²C-bus specification (UM10204):

    "Both SDA and SCL are bidirectional lines, connected to a positive supply

    voltage via a current-source or pull-up resistor. ... The output stages of

    devices connected to the bus must have an open-drain or open-collector to

    perform the wired-AND function."


    Простий резистор як перетворювач рівня не забезпечує двонапрямленості,

    необхідної для I²C.

    '
  sposib: I²C-bus specification (i2c-um10204.pdf), UM10204, 2026-08-26
  notatka: I²C вимагає, щоб обидва пристрої (ESP32 та зовнішній) могли "відпустити" лінію. Простий резистор
    не дозволяє цього без спеціальної схеми.
- nazva: I²C потребує двонапрямленого перетворювача на базі FET
  zbih: I2C|I²C|FET|MOSFET|двонапрямлен
  klas: B
  dzherelo: I²C-bus specification та типові схеми перетворювачів рівня (наприклад, на базі N-channel FET
    для двонапрямленості)
  cytata: 'Двонапрямлений перетворювач рівня I²C:

    - N-channel FET у режимі transmission gate

    - Дозволяє обом сторонам "тягти" лінію вниз (open-drain функція)

    - Pull-up резистори на обох сторонах напруги


    I²C spec: "The output stages of devices connected to the bus must have

    an open-drain or open-collector to perform the wired-AND function."

    '
  sposib: Типові схеми I²C перетворювачів, I²C specification, 2026-08-26
  notatka: Це мінімальна вимога для безпечного підключення 5 В GPIO до 3.3 В ESP32 на I²C шині.
- nazva: Pull-up резистор — електричний опір від сигнальної лінії до живлення
  zbih: pull.*?up|pull-up|резистор.*?живлення
  klas: A
  dzherelo: Визначення з електротехніки
  cytata: 'Pull-up резистор — це електрична схема, коли резистор підключається

    од однієї кінця сигнальної лінії до позитивної напруги живлення (+3.3 В

    або +5 В), з іншого кінця лінія може бути стиснута вниз (до 0 В) логічним

    пристроєм.


    Це створює HIGH напругу коли лінія вільна, та LOW коли пристрій її

    "тягне" вниз.

    '
  sposib: Базова електротехніка, визначення, 2026-08-26
  notatka: Визначення є простим та прямим. Pull-down — аналогічно, але до землі.
