- nazva: GPIO drive capability — "medium" на основі GPIO_DRIVE_CAP_DEFAULT
  zbih: GPIO_DRIVE_CAP|medium|drive.*?strength
  klas: B
  dzherelo: ESP32 Technical Reference Manual (ESP-IDF документація). У datasheet це розповсюджується
    як "output drive strength set to the maximum" в Table 5-3
  cytata: 'У ESP32 API (ESP-IDF) це GPIO_DRIVE_CAP_DEFAULT, яке описується як

    "medium" drive capability. Точне числове значення не нормується в паспорту,

    а установлюється на основі вимірювання при типовому режимі.


    Table 5-3 каже: "IOH (High-level source current) ... output drive strength

    set to the maximum) ... 40 mA"

    '
  sposib: ESP32 API документація (ESP-IDF) та Table 5-3 ESP32 Datasheet, esp32-datasheet.pdf,
    2026-08-26
  notatka: Конкретна величина струму "medium" не дана ні в datasheet, ні в ESP-IDF документації
    як окремо число. Замість цього нормується максимум (40 мА) при "максимальній" (максимальній)
    вміст силі, а за замовчуванням GPIO_DRIVE_CAP_DEFAULT дає менше.
  title: GPIO drive capability — "medium" на основі GPIO_DRIVE_CAP_DEFAULT
  match: GPIO_DRIVE_CAP|medium|drive.*?strength
  status: derived
  source: ESP32 Technical Reference Manual (ESP-IDF документація). У datasheet це розповсюджується
    як "output drive strength set to the maximum" в Table 5-3
  quote: 'У ESP32 API (ESP-IDF) це GPIO_DRIVE_CAP_DEFAULT, яке описується як

