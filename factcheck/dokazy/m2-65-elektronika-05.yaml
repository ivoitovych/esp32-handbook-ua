- nazva: MOSFET затвор — резистор 10 кОм від затвора до землі, утримання LOW при старті
  zbih: 10.*?кОм|затвор.*?земля|ключ.*?закритий
  klas: E
  dzherelo: Типовий розробник MOSFET схем та рекомендації для безпечної ініціалізації
  cytata: 'Pull-down резистор на затвір MOSFET:

    Gate ──[10 кОм]── GND


    При старті платі GPIO не налаштований, лінія "висить" у неизвестном

    стані. Без цього резистора навантаження може випадково увімкнутися.


    Цей pull-down резистор гарантує, що при старті затвір знаходиться в LOW

    (MOSFET закритий, навантаження вимкнене).

    '
  sposib: Типовий розробник MOSFET схем, рекомендації для безпеки, 2026-08-26
