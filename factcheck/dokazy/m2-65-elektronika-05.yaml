- nazva: Дешевий USB-кабель — причина перезавантаження через падіння напруги
  zbih: USB.*?кабель|перезавантаж|просяд.*?напруг
  klas: D
  dzherelo: Висновок з закону Ома (U = I × R). Падіння напруги на кабелі (опір кабелю) при
    передачі вилікого струму веде до просідання напруги живлення
  cytata: 'Закон Ома: U = I × R. При довгому тонкому кабелі (великий R) та великому

    струмові (I) падіння напруги ΔU = I × R стає значним, що веде до

    просідання напруги живлення на платі.

    '
  sposib: 'Логічний висновок з Закону Ома. Технічна база: ESP32 Datasheet (esp32-datasheet.pdf),
    Table 5-4 «Current Consumption», 2026-08-26'
  notatka: Проблема дешевих USB-кабелів — велика довжина + малий переріз провідника = великий
    опір. Це звичайна проблема при живленні ESP32 з тонких USB-кабелів.
  title: Дешевий USB-кабель — причина перезавантаження через падіння напруги
  match: USB.*?кабель|перезавантаж|просяд.*?напруг
  status: arithmetic
