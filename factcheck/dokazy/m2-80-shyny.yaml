  zbih: SPI.*десятки мегагерц
  klas: C
  dzherelo: шукати
  cytata: ''
  sposib: Типова характеристика SPI шини
  notatka: '"Десятки мегагерц" — типовий діапазон для SPI. Без конкретного модуля або чипа
