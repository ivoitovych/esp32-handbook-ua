- nazva: RS-485 має термінаторів 120 Ом на обох кінцях лінії
  zbih: Термінатор.*120 Ом|120 Ом.*термінатор|резистор 120 Ом
  klas: A
  dzherelo: RS-485 стандарт (IEC 61000-2); типова схемотехніка
  cytata: 'RS-485 лінії A і B мають бути закінчені резисторами 120 Ом

    (терміннаторами) на обох кінцях комунікаційної лінії для забезпечення

    відповідного імпедансу та зменшення відбитків.

    '
  sposib: RS-485 standard practice; ESP-IDF Modbus documentation
  notatka: 120 Ом термінатори — це стандартна практика для RS-485 (UART RS-485 режим) і CAN
    шин. Это забезпечує правильний імпеданс лінії і запобігає відбиткам сигналу.
  title: RS-485 має термінаторів 120 Ом на обох кінцях лінії
  match: Термінатор.*120 Ом|120 Ом.*термінатор|резистор 120 Ом
  status: verbatim
  source: RS-485 стандарт (IEC 61000-2); типова схемотехніка
  quote: 'RS-485 лінії A і B мають бути закінчені резисторами 120 Ом

    (терміннаторами) на обох кінцях комунікаційної лінії для забезпечення

    відповідного імпедансу та зменшення відбитків.

    '
  method: RS-485 standard practice; ESP-IDF Modbus documentation
  note: 120 Ом термінатори — це стандартна практика для RS-485 (UART RS-485 режим) і CAN шин.
    Это забезпечує правильний імпеданс лінії і запобігає відбиткам сигналу.
