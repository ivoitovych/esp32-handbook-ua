- nazva: CAN пакет несе до 8 байтів даних
  zbih: пакет.*до 8 байт|8 байт.*даних|Пакет несе до 8
  klas: A
  dzherelo: CAN стандарт ISO 11898 (Classic CAN, не CAN FD)
  cytata: 'Класичний CAN пакет (frame) містить до 8 байтів корисного навантаження.

    Це жорстке обмеження протоколу.

    '
  sposib: CAN ISO 11898 standard specification
  notatka: 8 байтів даних — це максимум для класичного CAN (CAN 2.0 / ISO 11898-1). CAN FD
    дозволяє до 64 байтів, але це інша версія протоколу.
  title: CAN пакет несе до 8 байтів даних
  match: пакет.*до 8 байт|8 байт.*даних|Пакет несе до 8
  status: verbatim
  source: CAN стандарт ISO 11898 (Classic CAN, не CAN FD)
  quote: 'Класичний CAN пакет (frame) містить до 8 байтів корисного навантаження.

    Це жорстке обмеження протоколу.

    '
  method: CAN ISO 11898 standard specification
  note: 8 байтів даних — це максимум для класичного CAN (CAN 2.0 / ISO 11898-1). CAN FD дозволяє
    до 64 байтів, але це інша версія протоколу.
