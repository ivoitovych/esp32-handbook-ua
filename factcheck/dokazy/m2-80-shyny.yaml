# М2, крок 3.2 — Пакет 2: шини (SPI, UART, CAN).
#
# Одиниці класу F з числами/ідентифікаторами із джерел.
# Джерела: esp32-datasheet.pdf, стандарти SPI/UART/CAN

- nazva: SPI витримує десятки мегагерц
  zbih: 'SPI.*десятки мегагерц'
  klas: C
  dzherelo: 'шукати'
  cytata: ''
  sposib: 'Типова характеристика SPI шини'
  notatka: >-
    "Десятки мегагерц" — типовий діапазон для SPI. Без конкретного модуля
    або чипа не можна точно звіркувати. ESP32 SPI може працювати на 80 МГц
    і вище, але типово обмежується 40 МГц на практиці.

- nazva: Практична межа SPI — 1 МГц для запуску
  zbih: 'почати з 1 МГц'
  klas: B
  dzherelo: 'ESP-IDF документація; практична порада проектування'
  cytata: |
    Практичний підхід: почати з низької швидкості (1 МГц),
    переконатися що комунікація працює, потім підвищувати
  sposib: 'ESP-IDF SPI documentation, практика'
  notatka: >-
    Рекомендація почати з 1 МГц — це інженерна практика, яка забезпечує
    надійність комунікації. Низька швидкість дозволяє уникнути помилок при
    налаштуванні схеми та коду.

- nazva: RS-485 має термінаторів 120 Ом на обох кінцях лінії
  zbih: 'Термінатор.*120 Ом|120 Ом.*термінатор|резистор 120 Ом'
  klas: A
  dzherelo: >-
    RS-485 стандарт (IEC 61000-2); типова схемотехніка
  cytata: |
    RS-485 лінії A і B мають бути закінчені резисторами 120 Ом
    (терміннаторами) на обох кінцях комунікаційної лінії для забезпечення
    відповідного імпедансу та зменшення відбитків.
  sposib: 'RS-485 standard practice; ESP-IDF Modbus documentation'
  notatka: >-
    120 Ом термінатори — це стандартна практика для RS-485 (UART RS-485
    режим) і CAN шин. Это забезпечує правильний імпеданс лінії і запобігає
    відбиткам сигналу.

- nazva: CAN має термінаторів 120 Ом на обох кінцях
  zbih: 'CAN.*Термінатор.*120 Ом|CAN.*120 Ом.*термінатор'
  klas: A
  dzherelo: >-
    CAN стандарт ISO 11898; типова схемотехніка
  cytata: |
    CAN лінії CANH і CANL мають бути закінчені резисторами 120 Ом
    на обох кінцях для забезпечення правильного імпедансу
  sposib: 'CAN ISO 11898 standard; практика'
  notatka: >-
    120 Ом — це характеристичний імпеданс CAN кабелю. Без терміннаторів
    сигнали відбиваються від кінців лінії і спричиняють збої комунікації.

- nazva: CAN пакет несе до 8 байтів даних
  zbih: 'пакет.*до 8 байт|8 байт.*даних|Пакет несе до 8'
  klas: A
  dzherelo: >-
    CAN стандарт ISO 11898 (Classic CAN, не CAN FD)
  cytata: |
    Класичний CAN пакет (frame) містить до 8 байтів корисного навантаження.
    Це жорстке обмеження протоколу.
  sposib: 'CAN ISO 11898 standard specification'
  notatka: >-
    8 байтів даних — це максимум для класичного CAN (CAN 2.0 / ISO 11898-1).
    CAN FD дозволяє до 64 байтів, але це інша версія протоколу.

- nazva: Модулі на 5 В трансиверах можуть не бути сумісними з ESP32
  zbih: '5.?вольтів.*трансивер|модулів.*5.?вольтов'
  klas: B
  dzherelo: >-
    ESP32 Series Datasheet v5.3, логічні рівні 3.3 В
  cytata: |
    ESP32 працює на 3.3 В логічних рівнях. Модулі з 5 В трансиверами
    потребують конвертера рівнів для безпечного з'єднання.
  sposib: 'ESP32 Datasheet, практика'
  notatka: >-
    5 В трансивери використовуються, але потребують конвертора рівнів
    або подачі 3.3 В на модуль. Прямо підключувати до GPIO ESP32 небезпечно.

