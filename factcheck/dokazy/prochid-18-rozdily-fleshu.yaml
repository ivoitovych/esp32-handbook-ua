- nazva: 'T-18-038: У проєкті ESP-IDF розбивка задається текстовим файлом:'
  zbih: У\s+проєкті\s+ESP\-IDF\s+розбивка
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/master/docs/en/api-guides/partition-tables.rst
  cytata: 'If you configure the partition table CSV name in the project configuration (idf.py
    menuconfig) and then build the project

    '
  sposib: 'Суцільний прохід 2026-08-27. Документ отримано в сесії, витяг звірено з ним підрядком
    машинно (`tools/prochid_zvid.py`). Клас `A` тут означає «документ отримано, цитата дослівна»,
    а **не** «супровідник прочитав і згоден»: змістовий шар лишається окремою роботою.'
  notatka: підтверджує, що розбивка задається текстовим CSV файлом
