- nazva: RFM69 — сусіднє сімейство для вузькосмугового FSK без дальності LoRa
  zbih: RFM69.*сусіднє сімейство.*FSK.*без дальності LoRa
  klas: A
  dzherelo: RFM69HCW ISM Transceiver Module v1.1 (HopeRF), розділи 3.3 «FSK Modulation» та
    «Key Product Features»
  cytata: '3.3.3. FSK Modulation

    FSK modulation is performed inside the PLL bandwidth, by changing the

    fractional divider ratio in the feedback loop of the PLL. The large

    resolution of the sigma-delta modulator, allows for very narrow frequency

    deviation.


    KEY PRODUCT FEATURES

    FSK, GFSK, MSK, GMSK and OOK modulations

    '
  sposib: PDF HopeRF через cdn-shop.adafruit.com; pdftotext -layout, 2026-08-26
  notatka: 'Документація RFM69 підтверджує, що це модуль для FSK-модуляції, а не LoRa. Модуль
    підтримує FSK, GFSK, MSK, GMSK та OOK, але не LoRa. Це пояснює проблему розділу: RFM69
    часто плутають з RFM95 за назвою і ціною, але це зовсім інше радіо, без дальності LoRa.'
