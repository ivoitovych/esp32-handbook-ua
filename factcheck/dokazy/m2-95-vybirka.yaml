- nazva: Код 0x08 на ESP32-C3 відповідає GPIO9 (strapping pin)
  zbih: 0x08.*C3.*GPIO9
  klas: B
  dzherelo: https://github.com/espressif/esp-idf/blob/release/v5.2/docs/en/advanced-topics/boot-mode-selection.rst
    — boot mode selection documentation, strapping pins definitions
  cytata: '{IDF_TARGET_STRAP_BOOT_GPIO:default="GPIO9", esp8266="GPIO0", esp32="GPIO0",

    esp32s2="GPIO0", esp32s3="GPIO0", esp32p4="GPIO35", esp32c5="GPIO28"}


    {IDF_TARGET_STRAP_BOOT_2_GPIO:default="GPIO8", esp32="GPIO2", esp32s2="GPIO46",

    esp32s3="GPIO46", esp32p4="GPIO36", esp32c5="GPIO27"}


