    вартість на одиницю ємності. Це економічне спостереження, не технічна специфікація. Конкретного
    документа з цінами не існує (ціни змінюються). Клас E: джерела немає. | Переглянуто 2026-08-27
    у розборі 36 надмірних E. Клас E правильний: твердження про прийом проєктування, кількість
