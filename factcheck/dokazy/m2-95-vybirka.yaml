- nazva: Діод послідовно для захисту від переполюсовки, падіння 0.3–0.7 В
  zbih: Діод послідовно.*найпростіше.*падіння.*0\.3.0\.7
  klas: C
  dzherelo: Даташити 1N4007 (кремній, ~0.7 В) і 1N5819 (Шотткі, ~0.3 В) — рядок Forward Voltage
  cytata: ''
  sposib: Загальна електронна практика. Типова вольтова характеристика кремнієвого діода в
    режимі провідності.
  notatka: 'Твердження описує стандартну поведінку кремнієвого діода з прямим напруженням
    0.3–0.7 В — це фізична властивість p-n переходу, відома з теорії напівпровідників. Конкретного
    документа як джерела цієї ц | Було E — «зовнішнього джерела не існує». Названо конкретну
    деталь чи стандарт, отже документ існує, і його просто немає в кеші. Це визначення класу
    C. Різниця не формальна: E ховає одиницю з наряду назавжди, C лишає її в наряді з полем
    shukaty.'
  shukaty: '1n4007 і 1n5819 datasheet: Vf при робочому струмі'
