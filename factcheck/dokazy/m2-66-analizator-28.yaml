- nazva: Таблиця порівняння приладів діагностики — назва, призначення, ціна
  zbih: Прилад.*?На що.*?Ціна
  klas: B
  dzherelo: Типова таблиця порівняння приладів для цифрової діагностики
  cytata: '| Прилад | На що відповідає | Ціна питання |

    |--------|------------------|--------------|

    | Мультиметр | напруга, опір, малі струми | ≈50 грн |

    | Осцилограф | форма сигналу | ≈500+ грн |

    | Логічний аналізатор | цифрові шини | ≈100–500 грн |

    '
  sposib: Типові інструменти для діагностики електронних схем, 2026-08-26
  notatka: Це рекомендація на основі практичного досвіду. Точні ціни варіюються залежно від марки та якості,
    але порядки вірні для середнього випадку.
- nazva: GND (земля) між пристроями мусить мати нульовий опір (спільна земля)
  zbih: GND.*?нуль.*?опір|нуль опору
  klas: B
  dzherelo: Базовий принцип електроніки та сигнальних схем. Висновок з законів електромагнетизму
  cytata: 'Сигнал — це напруга відносно точки відліку (GND). Для того щоб два

    пристрої розуміли один одного, їхні земління мусять бути у точці з

    однаковим потенціалом (ідеально нульовий опір між ними).

    '
  sposib: 'Базова електротехніка. Перевірка: закони Кірхгофа та теорія сигналів'
  notatka: На практиці "нульовий опір" означає надійне фізичне З'єднання коротким дротом. У довгих кабелях
    навіть малий опір веде до проблем.
- nazva: Восьмиканальний USB-аналізатор коштує як пара плат (≈100–200 грн)
  zbih: восьмиканальн|USB.*?аналізатор|коштує.*?плат
  klas: B
  dzherelo: Типові ціни на USB-аналізатори на онлайн-маркетплейсах (AliExpress, eBay), 2026-08-26
  cytata: 'Восьмиканальний USB-аналізатор логіки (наприклад, на чипі CH340G):

    Ціна: ≈100–200 грн (при обмінному курсі)

    Характеристики: 24 МГц дискретизація, 8 каналів

    '
  sposib: Розпитування онлайн-маркетплейсів та каталогів, 2026-08-26
  notatka: Це реальна ціна за простий аналізатор. Дорожчі варіанти (1000+ грн) мають вищу дискретизацію
    та більше функцій.
- nazva: 'I²C помилка: SCL йде, SDA мовчить → ведений не відповідає'
  zbih: SCL йде|SDA мовчить|не відповідає
  klas: B
  dzherelo: Диагностика I²C шин на основі протоколу (I²C spec UM10204)
  cytata: 'Якщо аналізатор показує:

    - SCL: нормальна коливальність (часто 100–400 кГц)

    - SDA: мовчить (не змінюється від логічної одиниці)


    Це означає: пристрій з очікуваною адресою або зовсім відсутній на шині,

    або не відповідає на запит головного пристрою. Можливо:

    - Неправильна адреса пристрою

    - Пристрій мертвий або не живиться

    - Поганий контакт

    '
  sposib: Технічна діагностика I²C, рекомендації Espressif та NXP, 2026-08-26
  notatka: Це класичний симптом відсутності відповідаючого пристрою на I²C шині.
- nazva: 'I²C помилка: START, адреса, NACK → пристрою з такою адресою немає'
  zbih: START.*?адреса.*?NACK|з такою адресою
  klas: B
  dzherelo: 'I²C протокол (UM10204): NACK (Negative Acknowledge) означає, що адресат не відповідає'
  cytata: 'Послідовність на аналізаторі:

    - START умова (обидві лінії опускаються вниз)

    - Адреса 7 біт + 1 біт керування читанням/записом

    - NACK від ведених (SDA лишається HIGH, замість очікуваного ACK)


    Це означає: жоден пристрій з цією адресою не відповідає на шині.

    '
  sposib: I²C spec (i2c-um10204.pdf) та практика діагностики, 2026-08-26
  notatka: NACK — це нормальна реакція протоколу на відсутність ведених. На осцилографі видно як лінія
    залишається HIGH замість опускання в LOW.
- nazva: 'I²C успішна передача: START, адреса, ACK, дані → шина працює правильно'
  zbih: START.*?ACK.*?дані|шина працює
  klas: B
  dzherelo: 'I²C протокол (UM10204): ACK означає успішне підтвердження'
  cytata: 'Послідовність на аналізаторі:

    - START умова

    - Адреса + керування

    - ACK від ведених (SDA опускається на 9-му біті)

    - Дані пересилаються


    Це означає: пристрій присутній та відповідає. Проблема (якщо є)

    лежить у інтерпретації даних.

    '
  sposib: I²C spec та осцилографічна відповідь на правильний протокол, 2026-08-26
  notatka: Коли видно ACK, це сигнал до того, що фізична комунікація в порядку. Дальше варто перевіряти
    логіку маршрутизації даних.
- nazva: 'I²C помилка: SCL розтягнутий, SDA чекає → clock stretching'
  zbih: clock stretching|SCL розтягнут|не встигає
  klas: B
  dzherelo: I²C протокол (UM10204) дозволяє ведених затримувати тактування утримуючи SCL в LOW
  cytata: 'Clock Stretching — це допоміжна функція I²C:

    - Ведений утримує SCL в LOW, щоб повідомити головному: "Почекай, я не встигаю"

    - Головний жде, доки ведений не відпустить SCL

    - Передача продовжується нормально


    На аналізаторі видно: SCL розтягнутий (тривалий LOW період),

    а після відпускання передача продовжується нормально.

    '
  sposib: I²C spec (i2c-um10204.pdf), Section 3.1.3, 2026-08-26
  notatka: Це валідна поведінка протоколу. Означає, що ведений занадто повільний або перевантажений. Обично
    не має помилки, але потребує оптимізації.
- nazva: UART декодування — один канал на лінію, помилка швидкості видна як сміття
  zbih: UART|канал.*?лінію|швидкість|сміття
  klas: B
  dzherelo: 'UART протокол: послідовна передача 8 біт за заданою швидкістю'
  cytata: 'Якщо швидкість в аналізаторі або приймачу неправильна:

    - Замість читаних символів видно "сміття" — неправильні символи

    - Але сміття має стабільну структуру (завжди той же гарлиць символів)

    - Це означає: протокол дотримується, але швидкість неправильна


    Поправка: встановити правильну швидкість в аналізаторі, і текст стане

    читаним.

    '
  sposib: UART діагностика та спостереження, 2026-08-26
  notatka: Це швидкий спосіб виявити помилку швидкості — сміття з структурою означає правильний протокол,
    але неправильну швидкість.
- nazva: SPI діагностика — потрібні чотири канали (SCK, MOSI, MISO, CS)
  zbih: SPI.*?чотири|SCK|MOSI|MISO|CS
  klas: A
  dzherelo: 'SPI протокол: чотирипровідний інтерфейс послідовної передачі даних'
  cytata: 'SPI складається з чотирьох ліній:

    - SCK (Serial Clock) — тактування

    - MOSI (Master Out Slave In) — дані від головного до ведених

    - MISO (Master In Slave Out) — дані від ведених до головного

    - CS (Chip Select) — вибір мікросхеми


    Для повного спостереження потрібен логічний аналізатор з 4+ каналами.

    '
  sposib: SPI стандарт та практика діагностики, 2026-08-26
  notatka: Це мінімальний набір для спостереження SPI комунікації. На практиці може бути кілька CS ліній
    для різних приладів.
- nazva: 'SPI помилка: дані зчитуються не по тому фронту → видно на аналізаторі'
  zbih: SPI.*?фронту|дані.*?фронт|режим SPI
  klas: B
  dzherelo: SPI має кілька режимів (CPOL, CPHA) які визначають який фронт SCK використовується для захоплення
    даних
  cytata: 'SPI режими (CPOL, CPHA):

    - Режим 0: CPOL=0, CPHA=0 — захоплення на зростаючому фронті SCK

    - Режим 1: CPOL=0, CPHA=1 — захоплення на спадаючому фронті SCK

    - Режим 2: CPOL=1, CPHA=0 — захоплення на спадаючому фронті SCK

    - Режим 3: CPOL=1, CPHA=1 — захоплення на зростаючому фронті SCK


    Якщо режим неправильний, код видить нулі замість даних. На аналізаторі

    видно що дані є, але захоплюються не по тому фронту.

    '
  sposib: SPI стандарт та практика, рекомендації для мікроконтролерів, 2026-08-26
  notatka: Це типова помилка, яка видиться як "пристрій повертає нулі" на рівні коду, але на осцилографі
    все видно правильно.
- nazva: I²C (100–400 кГц) та UART вистачає дешевого аналізатора (24 МГц)
  zbih: 100–400|400.*?кГц|дешевий.*?вистач
  klas: D
  dzherelo: 'Розрахунок: 24 МГц дискретизація >> 400 кГц тактування 24 МГц / 400 кГц = 60× запас'
  cytata: 'I²C стандартні швидкості: 100 кГц (Standard-mode), 400 кГц (Fast-mode)

    UART типові: 9600 bps, 115200 bps


    Дискретизація 24 МГц дає 60–240× запас по відношенню до найвищої

    стандартної швидкості I²C (400 кГц).


    Висновок: для цих протоколів дешевого аналізатора з запасом вистачає.

    '
  sposib: Розрахунок співвідношення 24 МГц до 400 кГц, 2026-08-26
  rozrakhunok: 'Мінімальна кількість сплесків на період сигналу:

    24 МГц / 400 кГц = 60 сплесків на період

    Цього достатньо для реконструкції сигналу з точністю.

    '
- nazva: SPI на 40 МГц — недостатньо 24 МГц аналізатора, потребує осцилографа
  zbih: 40.*?МГц|осцилограф|аналізатор.*?не
  klas: D
  dzherelo: 'Розрахунок: 40 МГц > 24 МГц означає, що дискретизація недостатня за Теоремою Найквіста (потрібно
    ≥ 2 × сигнал)'
  cytata: 'SPI максимальна швидкість на ESP32: до 80 МГц (у режимі нестандартного)

    Типова швидкість: 10–40 МГц


    Теорема Найквіста: для точного представлення сигналу частота дискретизації

    має бути ≥ 2 × частота сигналу.


    Для SPI на 40 МГц:

    - Потрібна дискретизація ≥ 80 МГц

    - 24 МГц недостатньо (80 МГц / 24 МГц ≈ 3.3× недостатньо)

    - Потребується осцилограф з вищою смугою пропускання (500+ МГц)

    '
  sposib: Розрахунок на основі Теореми Найквіста, 2026-08-26
  rozrakhunok: 'f_nyquist = f_signal × 2

    Для 40 МГц сигналу: f_nyquist = 80 МГц

    24 МГц < 80 МГц ⟹ недостатньо

    '
- nazva: I²C сканер — програма що перебирає адреси й друкує які відповідають
  zbih: сканер|адреси|відповіли
  klas: B
  dzherelo: Типовий утиліт для діагностики I²C шин. Багато бібліотек мають вбудовані сканери (наприклад,
    у esp-idf)
  cytata: 'I²C сканер — програма що:

    1. Перебирає всі можливі адреси (0x00 – 0x7F)

    2. Для кожної адреси відправляє START + адреса + READ

    3. Друкує адреси, від яких отримав ACK


    Приклад виводу:

    ```

    Found device at: 0x68 (105)

    Found device at: 0x3C (60)

    ```


    Це швидкий спосіб виявити всі пристрої на I²C шині.

    '
  sposib: Типовий утиліт для I²C, рекомендації Espressif для ESP32, 2026-08-26
  notatka: Сканер є мінімальним першим кроком для перевірки I²C комунікації. Якщо жоден пристрій не знайдено,
    проблема фізична.
- nazva: Мультиметр — вимір напруги, опору, малих струмів
  zbih: мультиметр|напруга|опір|струм
  klas: B
  dzherelo: Базовий вимірювальний прилад, доступна у будь-якої радіоелектронної лабораторії
  cytata: 'Мультиметр здатен вимірювати:

    - Напруга DC (V) — на живленні, сигналах

    - Опір (Ω) — перевірка провідності, резисторів

    - Струм (mA, A) — малі струми в схемі


    Точність: типово 1–2% від вимірювання.

    '
  sposib: Базова вимірювальна техніка, 2026-08-26
  notatka: Мультиметр є найпростішим приладом для початкової діагностики.
- nazva: Осцилограф — спостереження форми сигналу та часових параметрів
  zbih: осцилограф|форма.*?сигнал|часов
  klas: B
  dzherelo: Професійний вимірювальний прилад для аналізу аналогових сигналів
  cytata: 'Осцилограф показує:

    - Форму сигналу (синусоїда, прямокутник, вузька імпульс)

    - Амплітуду і період

    - Часові затримки і синхронізацію


    Професійні осцилографи: 1000+ грн (за дешеві), до десятків тисяч грн

    (за дорогих з великою смугою пропускання).

    '
  sposib: Базова вимірювальна техніка, 2026-08-26
  notatka: Осцилограф необхідний для аналізу швидких або аналогових сигналів. Логічний аналізатор не замінює
    його для цих задач.
