# М2, крок 3 — мости USB-UART: виробники й драйвери.
#
# Джерело нетипове й навмисно: не datasheet, а **вихідний код ядра
# Linux**. Твердження книги — «драйвер у ядрі» — це твердження про ядро,
# і datasheet виробника його не доводить. Доводить таблиця пристроїв
# драйвера.
#
# Перевірено суцільно: із 52 драйверів `drivers/usb/serial/` вендорський
# код WCH `0x1a86` трапляється рівно в одному — `ch341.c`.






