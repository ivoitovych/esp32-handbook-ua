- nazva: CH9102 у ядрі є, але через cdc_acm, а не ch341
  zbih: '`CH9102`, `CH9102F` · ((Виробник|Міст) → WCH|Linux → у ядрі)'
  klas: A
  dzherelo: Linux, `drivers/usb/class/cdc-acm.c` (гілка master), таблиця `acm_ids`; для порівняння
    — `drivers/usb/serial/ch341.c`
  cytata: "drivers/usb/class/cdc-acm.c:\n  { USB_DEVICE(0x1a86, 0x55d3), .driver_info = MISSING_CAP_BRK,\
    \ },\n  …\n  { USB_INTERFACE_INFO(USB_CLASS_COMM, USB_CDC_SUBCLASS_ACM,\n            \
    \           USB_CDC_ACM_PROTO_AT_V25TER) },\n\ndrivers/usb/serial/ch341.c — ідентифікаторів\
    \ 0x55d3 / 0x55d4 немає\n"
  sposib: raw.githubusercontent.com/torvalds/linux/master, суцільна перевірка 52 драйверів
    `drivers/usb/serial/`, 2026-08-26
  notatka: '«У ядрі» для CH9102 правда, але не тим драйвером, який очікує читач. Сімейство
    CH343/CH9102 підхоплює **клас-драйвер `cdc_acm`**: `55d3` названо в його таблиці поіменно,
    а `CH9102F` (`55d4`) потрапляє під загальний запис `USB_CLASS_COMM`.

    Наслідок, якого в книзі немає й який суперечить її ж правилу: порт з''являється як **`/dev/ttyACM*`**,
    а не `/dev/ttyUSB*`. Розділ 09 навчає, що `ttyACM` означає native USB (S3, C3). Читач
    із classic-платою на CH9102 побачить `ttyACM0` і зробить хибний висновок про сам чип.
    Винесено окремою знахідкою.'
  title: CH9102 у ядрі є, але через cdc_acm, а не ch341
  match: '`CH9102`, `CH9102F` · ((Виробник|Міст) → WCH|Linux → у ядрі)'
  status: verbatim
  source: Linux, `drivers/usb/class/cdc-acm.c` (гілка master), таблиця `acm_ids`; для порівняння
    — `drivers/usb/serial/ch341.c`
  quote: "drivers/usb/class/cdc-acm.c:\n  { USB_DEVICE(0x1a86, 0x55d3), .driver_info = MISSING_CAP_BRK,\
    \ },\n  …\n  { USB_INTERFACE_INFO(USB_CLASS_COMM, USB_CDC_SUBCLASS_ACM,\n            \
    \           USB_CDC_ACM_PROTO_AT_V25TER) },\n\ndrivers/usb/serial/ch341.c — ідентифікаторів\
    \ 0x55d3 / 0x55d4 немає\n"
  method: raw.githubusercontent.com/torvalds/linux/master, суцільна перевірка 52 драйверів
    `drivers/usb/serial/`, 2026-08-26
  note: '«У ядрі» для CH9102 правда, але не тим драйвером, який очікує читач. Сімейство CH343/CH9102
    підхоплює **клас-драйвер `cdc_acm`**: `55d3` названо в його таблиці поіменно, а `CH9102F`
    (`55d4`) потрапляє під загальний запис `USB_CLASS_COMM`.

    Наслідок, якого в книзі немає й який суперечить її ж правилу: порт з''являється як **`/dev/ttyACM*`**,
    а не `/dev/ttyUSB*`. Розділ 09 навчає, що `ttyACM` означає native USB (S3, C3). Читач
    із classic-платою на CH9102 побачить `ttyACM0` і зробить хибний висновок про сам чип.
    Винесено окремою знахідкою.'
