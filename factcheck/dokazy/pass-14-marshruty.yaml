# Прохід 14 — внутрішні маршрути книги.
#
# Єдиний прохід, де джерело — сама книга. Це не послаблення критерію, а
# інша його форма: тут перевіряється не факт про світ, а те, чи веде
# кудись обіцяний маршрут.
#
# Підстава винести це в окремий прохід: довідник для поля побудований на
# маршрутах картка → розділ → додаток. Обірваний маршрут дорівнює
# відсутньому матеріалу, навіть якщо матеріал написано.
#
# `tools/linkcheck.py` перевіряв лише клікабельні посилання `[…](#слаг)`
# — їх 66. Згадок словами («розділ 32», «картка К7») виявилося **689**, і
# вони не перевірялися ніколи.



















