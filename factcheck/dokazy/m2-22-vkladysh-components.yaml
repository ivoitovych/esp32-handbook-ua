- nazva: DHT11, DHT22 — власний протокол і паспортна точність
  zbih: DHT11, DHT22 · Чому → власний протокол, нестабільна точність
  klas: B
  dzherelo: Aosong AM2303 (=DHT22) datasheet, розділ «Technical Specification» і «Communication and signal»;
    Aosong DHT11 datasheet (кит.), таблиця замовлення
  cytata: '[AM2303 / DHT22]

    Output signal               digital signal via single-bus

    Sensing element              Polymer humidity capacitor & DS18B20 for detecting temperature

    Accuracy                humidity +-2%RH(Max +-5%RH);         temperature +-0.2Celsius

    Repeatability               humidity +-1%RH;                           temperature +-0.2Celsius

    Humidity hysteresis         +-0.3%RH


    Single-bus data is used for communication between MCU and AM2303,

    it costs 5mS for single time communication.


    [DHT11, таблиця замовлення]

    型号       测量范围         测湿精度    测温精度   分辨力

    DHT11 20－90％RH 0－50℃   ±5％RH    ±2℃    1

    '
  sposib: PDF Aosong, кеш `dht22.pdf` і `dht11.pdf` (dzherela-cache, vzyaty.sh, UA браузера), pdftotext
    -layout, 2026-08-26
  notatka: '«Власний протокол» підтверджено дослівно — «digital signal via single-bus», не I²C/SPI і не
    стандартний Dallas 1-Wire, а фірмовий бітбенгінг із жорсткими таймінгами (одне повідомлення — 5 мс).
    Це, а не сама точність, і є головна причина нестабільних зчитувань на практиці: пропущений біт через
    перерваний таймінг дає обрив пакета чи неправильну контрольну суму, незалежно від того, наскільки
    справний сенсор.

    «Нестабільна точність» — слабша половина твердження, і для DHT11 і DHT22 вона означає різне. DHT11
    справді груба: ±5 %RH (Max) і ±2 °C за таблицею замовлення виробника, точність гірша за межами 25
    °C. DHT22/AM2303 натомість дає ±2 %RH (Max ±5 %RH) і ±0.2 °C — це зіставно з BME280, а не гірше. Групувати
    обидва чипи під одним «чому» покриває їх нерівномірно: для DHT11 «нестабільна точність» точна, для
    DHT22 точніше «повільний» (2 с цикл) і «крихкий протокол», а не «неточний». Не помилка книги — вона
    й так радить альтернативу для обох, — але варта уточнення, якщо вкладиш колись розділить рядок.'
- nazva: HC-SR04 — 5 В на ECHO підтверджено, «м'які поверхні» — ні
  zbih: HC-SR04 · Чому → ⛔ 5 В на `ECHO`; не бачить м'які поверхні
  klas: B
  dzherelo: Ultrasonic Ranging Module HC-SR04, datasheet ElecFreaks — розділи «Electric Parameter» і «Attention»
  cytata: 'Working Voltage      DC 5 V

    Echo Output Signal   Input TTL lever signal and the range in proportion


    Attention:

    When tested objects, the range of area is not less than 0.5 square

    meters and the plane requests as smooth as possible, otherwise, it

    will affect the results of measuring.

    '
  sposib: PDF ElecFreaks, кеш `hc-sr04.pdf`, pdftotext -layout, 2026-08-26 (той самий файл, що й доказ
    `m2-09-hc-sr04`)
  notatka: 'Перша половина — та сама, що вже закрита в `m2-09-hc-sr04` класом B: живлення `DC 5 V`, `ECHO`
    — TTL-рівень від цього ж живлення, отже дільник обов''язковий. Друга половина, «не бачить м''які поверхні»,
    у цьому datasheet **не звірена**: він попереджає про гладкість площини і мінімальну площу 0.5 м²,
    а не про звукопоглинальні матеріали. Твердження про м''які поверхні — поширене й правдоподібне знання
    про ультразвук (тканина й поролон розсіюють/поглинають хвилю), але не з цього джерела; не суперечність,
    а прогалина покриття.'
- nazva: не L298N — застарів і втрачає ~2 В на собі
  zbih: \*\*не\*\* L298N · Замінники → застарів, втрачає ~2 В на собі
  klas: A
  dzherelo: STMicroelectronics L298 — Dual Full-Bridge Driver, datasheet (дзеркало SparkFun), таблиця
    «Electrical Characteristics»
  cytata: 'VCEsat (H)   Source Saturation Voltage   IL = 1A     Typ 0.95   Max 1.7   V

    VCEsat (L)   Sink Saturation Voltage     IL = 1A     Typ 0.85   Max 1.6   V

    VCEsat       Total Drop                  IL = 1A     Typ 1.80   Max 3.2   V

    '
  sposib: PDF, кеш `l298n.pdf` (дзеркало SparkFun; st.com не працює з цієї мережі), pdftotext -layout,
    2026-08-26
  notatka: '«~2 В на собі» — типове падіння 1.8 В (гірший випадок — до 3.2 В) при 1 А, збігається з точністю
    до заокруглення. Причина падіння видно в назві самого параметра: `VCEsat` — це насичення біполярного
    транзистора, а не MOSFET, звідси й «застарів»: сучасні драйвери (DRV8833, TB6612FNG — обидва вже в
    цьому ж вкладиші) на MOSFET втрачають десяті вольта, а не цілі. «Застарів» саме по собі — редакційна
    оцінка віку схемотехніки, не паспортне число, але число, яке її пояснює, підтверджено дослівно.'
- nazva: Релейний модуль з оптопарою — 5 В і інверсна логіка не паспортні
  zbih: 'Релейний модуль з оптопарою · Замінники → перевіряти: 5 В і часто інверсна логіка'
  klas: E
  notatka: «Релейний модуль» тут — не мікросхема з одним datasheet, а готова плата (реле + оптопара +
    транзистор + резистори) від довільного складальника; напруга керування і полярність (активний нуль
    чи одиниця) відрізняються від виробника до виробника. Саме слово «перевіряти» в тексті вкладиша визнає
    цю мінливість — це порада читачеві, а не факт про конкретний чип, тому зовнішньої звірки не існує
    за побудовою.
- nazva: Конвертер рівнів на польових — призначення 3.3↔5 В
  zbih: Конвертер рівнів на польових · Для чого → 3\.3 ↔ 5 В
  klas: E
  dzherelo: BSS138 datasheet (Diodes Incorporated) — перевірено й не підтверджує
  sposib: PDF Diodes Inc., кеш `bss138.pdf`, pdftotext -layout, 2026-08-26
  notatka: BSS138 — типовий транзистор цієї схеми (SparkFun BOB-12009 та аналоги), тож джерело перевірено.
    Datasheet дає лише електричні параметри самого MOSFET (`BVDSS` 50 В, `RDS(ON)` 3.5 Ω) і жодного слова
    про застосування як двонапрямлений конвертер рівнів — ця схема (одна лінія, підтягнута резистором
    з кожного боку до свого живлення) описана в застосунковій ноті виробників плат, не в datasheet кристала.
    Призначення лишається редакційним поясненням типової схеми, не паспортним фактом одного чипа.
- nazva: Buck-boost 3.3 В — призначення «автономний пристрій»
  zbih: Buck-boost 3\.3 В · Для чого → автономний пристрій
  klas: E
  notatka: 'Маршрут використання, а не технічна характеристика перетворювача: buck-boost годиться і для
    мережевого живлення, «автономний пристрій» — це порада, коли саме він виправданий (від батареї, де
    вхідна напруга гуляє по обидва боки від 3.3 В).'
- nazva: Buck-boost проти LDO — використання ємності батареї
  zbih: Buck-boost 3\.3 В · Застереження → дає майже всю ємність, LDO — половину
  klas: B
  dzherelo: Samsung SDI INR18650-30Q, «Specification» (Nominal Voltage, End voltage); те саме поле в NCR18650B
    і DS18B20-класу елементів
  cytata: 'Nominal Voltage (V)     3.60

    Discharge  End voltage (V)     2.5

    '
  sposib: PDF Samsung SDI, кеш `samsung30q.pdf`, pdftotext -layout, 2026-08-26
  notatka: 'Дослівне число — тільки межі напруги розряду: номінал 3.60 В, кінець розряду 2.5 В. Висновок
    про ємність — похідний, з елементарної електроніки регуляторів, а не з datasheet елемента: LDO працює,
    поки вхід перевищує вихід (3.3 В) на падіння регулятора (десяті вольта), тобто перестає тримати 3.3
    В десь біля 3.5–3.6 В — майже відразу після номіналу, — тоді як buck-boost продовжує піднімати напругу
    аж до кінця розряду 2.5 В. «Майже всю» і «половину» — якісні, не точні 50 %: жодне з двох джерел не
    дає таблиці напруга/залишкова ємність, тому конкретну частку (не 50, а, скажімо, 40 чи 65 %) ця пара
    доказів не підтверджує і не спростовує — тільки напрямок і порядок величини.'
- nazva: ACS712 — «беріть INA219/INA226» — редакційна порада
