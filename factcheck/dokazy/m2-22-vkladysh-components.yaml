- nazva: 120 Ом термінаторів RS-485/CAN — стандарт, недосяжний з мережі
  zbih: \| 120 Ом \| термінатори RS-485 і CAN \|
  klas: C
  dzherelo: TIA/EIA-485-A (характеристичний імпеданс кручений пари RS-485) та ISO 11898-2 (термінація
    шини CAN High-Speed) — обидва стандарти платні й недосяжні з цієї мережі; трансивери, де номінал зазвичай
    повторюється в «Application Information» (SN65HVD230, MAX485), самі вже в наряді класом C через блокування
    ti.com/analog.com
  shukaty: номінальний характеристичний імпеданс шини (120 Ом, ±10%) у розділі термінації кожного стандарту,
    або та сама цифра в застосунковому розділі datasheet трансивера
  notatka: 'Число саме по собі широковідоме й використовується книгою ще раз (розрахунок «120 / 2 = 60
    Ом, два термінатори» вже закріплено в `pass-05-obchyslennya`), але жодне з наявних у кеші джерел його
    не документує — ні `mcp2515.pdf` (контролер, не трансивер і не рівень шини), ні щось інше. Чесний
    C, не B: «широковідомо» — не те саме, що «отримано в цій сесії».'
- nazva: 100 нФ біля кожної мікросхеми — загальна практика, не паспорт
  zbih: \| \*\*100 нФ\*\* \| біля кожної мікросхеми \|
  klas: C
  notatka: Розв'язувальний конденсатор — універсальна практика для будь-якої цифрової мікросхеми, а не
