- nazva: Фейковий CP2102/FT232 — ознака без паспортного числа
  zbih: \| Фейковий CP2102 / FT232 \| нестабільно, зникає після оновлення драйвера \|
  klas: E
  notatka: «Нестабільно, зникає після оновлення драйвера» — поведінкова ознака підробки на боці Windows/драйвера,
    не електрична характеристика CP2102 чи FT232; жоден datasheet такого не пише й не міг би — підробки
    не документуються виробником оригіналу. Той самий клас, що й сусідні ознаки підробок (перемаркування,
    менша флеш) в тому ж розділі.
- nazva: 220–330 Ом резистора світлодіода — узгоджується з реальним VF
  zbih: \| 220–330 Ом \| резистор світлодіода \|
  klas: D
  dzherelo: Kingbright WP7113ID (High Efficiency Red), datasheet, таблиця «Electro-Optical Characteristics»
  cytata: 'Forward Voltage IF = 10mA   VF   High Efficiency Red   Typ 1.9   Max 2.3   V

    '
  rozrakhunok: "R = (U − VF) / I, VF = 1.9 В (typ, 10 мА, датащит Kingbright)\n\nПри 5 В (типова окрема\
    \ лінія живлення для індикаторів):\n  (5.0 − 1.9) / 0.010 = 310 Ом    — усередині 220–330 Ом\n\nПри\
    \ 3.3 В напряму з GPIO ESP32, той самий діапазон опору:\n  (3.3 − 1.9) / 220 = 6.4 мА\n  (3.3 − 1.9)\
    \ / 330 = 4.2 мА       — прийнятний струм індикатора,\n                                      у межах\
    \ штатного відпирання GPIO\n"
  sposib: PDF Kingbright, кеш `led-red-wp7113id.pdf`, pdftotext -layout, 2026-08-26; формула резистора
    — загальновідома, arithmetic
  notatka: 'Книга не називає ні колір світлодіода, ні напругу живлення — це узагальнений «типовий номінал».
    Розрахунок з реальним VF показує, що діапазон не довільний: він узгоджується і з 5-вольтовою лінією
    на ~10 мА (майже точно 310 Ом), і з прямим підключенням до GPIO на 3.3 В при трохи меншому струмі.
    Синій/білий світлодіод (VF 3.3–4.0 В за `led-blue-wp7113qbc.pdf`) з 3.3 В GPIO цей розрахунок не проходить
    узагалі — падіння на резисторі виходить від''ємним, отже для синіх/білих індикаторів потрібна лінія
    5 В, а не GPIO напряму; вкладиш цього нюансу не називає, але й не стверджує зворотного.'
- nazva: 4.7 кОм — підтягування 1-Wire підтверджено, I²C — похідне
  zbih: \| \*\*4\.7 кОм\*\* \| підтягування I²C і 1-Wire \|
  klas: B
  dzherelo: Maxim DS18B20, datasheet — розділ «1-Wire Bus System», Figure 10 «Hardware Configuration»;
    для I²C — той самий висновок, що й у доказі `m2-05-i2c-pidtyaguvannya` (NXP UM10204, формула Rp(max))
  cytata: 'The 1-Wire bus requires an external pullup resistor of

    approximately 5kΩ; thus, the idle state for the 1-Wire bus is high.


    [Figure 10, номінал на схемі]  4.7k

    '
  sposib: PDF Maxim, кеш `ds18b20.pdf`, pdftotext -layout, 2026-08-26
  notatka: '1-Wire: текст дає «approximately 5 kΩ», а типова схема на тій самій сторінці показує саме
    стандартний номінал 4.7 кОм — узгоджується. I²C: тут не повторюю розрахунок — він уже зроблений і
    закритий класом A в `m2-05-i2c-pidtyaguvannya` («Чому 4.7 кОм годиться для 100 кГц»), формула з NXP
    UM10204 дає до ~11.8 кОм на 100 пФ і 100 кГц, 4.7 кОм проходить із запасом. Клас цього запису — B,
    а не A, бо об''єднує дослівне (1-Wire) з похідним (I²C) в одній комірці; жоден із двох рядків книги
    вкладиша окремо не сильніший за свою слабшу половину.'
- nazva: 10 кОм — підтягування входів і затвор MOSFET на землю — практика без чипа
  zbih: \| 10 кОм \| підтягування входів, затвор MOSFET на землю \|
  klas: E
  dzherelo: IRLZ44, IRLZ44N2 datasheet — перевірено й не дає такого номіналу
  sposib: PDF Vishay/Infineon, кеш `irlz44.pdf`, `irlz44n2.pdf`, pdftotext -layout, 2026-08-26
  notatka: Обидва datasheet логічного MOSFET дають електричні межі затвора (`VGS(th)`, ємності), але не
    рекомендують конкретний номінал підтягувального резистора на землю — це схемотехнічна практика (щоб
    затвор не «висів» у стані Hi-Z при відключеному керуючому піні), спільна для будь-якого MOSFET, а
    не паспорт одного чипа.
