    вході живлення.'
- nazva: DS18B20 — ±0.5 °C на один датчик, звідси розбіжність до 1 °C у двох справних
  zbih: Datasheet дає ±0\.5 °C \*\*на один датчик\*\* у діапазоні −10…\+85 °C, тож два\s+справні можуть
    відхилитися в різні боки й розійтися на цілий градус,\s+лишаючись обидва в межах норми
  klas: A
  dzherelo: Maxim DS18B20 datasheet, розділ «Features» і таблиця «Electrical Characteristics» (Thermometer
    Error)
  cytata: '±0.5°C Accuracy from -10°C to +85°C


    Thermometer  -10°C to +85°C   tERR  ±0.5  °C

    Error        -55°C to +125°C        ±2    °C

    '
  rozrakhunok: 'Два справні датчики, кожен у межах ±0.5 °C: один може показувати

    справжню температуру мінус 0.5 °C, інший — плюс 0.5 °C. Різниця

