- nazva: 470 мкФ біля роз'єму живлення — загальна практика, не паспорт
  zbih: \| \*\*470 мкФ\*\* \| біля роз'єму живлення \|
  klas: E
  notatka: 'Об''ємний конденсатор проти піків струму Wi-Fi — та сама категорія, що й 100 нФ вище: рекомендація
    дизайну плати, а не число з конкретного datasheet. `esp32-datasheet.pdf` і `esp32-wroom-32e.pdf` перевірено
