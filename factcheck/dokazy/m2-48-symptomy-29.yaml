- nazva: 'Wi-Fi відвалюється: подивитися RSSI гірше за −80 дБм'
  zbih: Подивитися RSSI.*гірше за −80 дБм
  klas: E
  dzherelo: Розділ 29 «Wi-Fi мовчить» — про слабкий сигнал
  cytata: '**Під''єднується і відвалюється.** Живлення (див. вище) або слабкий

    сигнал. Подивитися RSSI: гірше за −80 дБм — робота на межі.

    '
  sposib: Текст розділу 29 manual/29-symptomy.md, рядки 102-103
  notatka: 'RSSI (Received Signal Strength Indicator) — показатель мощности сигнала. Значение
    хуже −80 дБм означает, что устройство работает на пределе возможностей. | Переглянуто
    2026-08-27 у розборі 36 надмірних E. Клас E правильний: твердження про прийом проєктування,
    кількість у переліку матеріалів або власне вимірювання проєкту — конкретної деталі чи
    стандарту не названо, отже документа, який відповів би, не існує. Число в назві є, але
    воно номінал у пораді, а не величина з паспорта.'
  title: 'Wi-Fi відвалюється: подивитися RSSI гірше за −80 дБм'
  match: Подивитися RSSI.*гірше за −80 дБм
  status: no-external-signal
  source: Розділ 29 «Wi-Fi мовчить» — про слабкий сигнал
  quote: '**Під''єднується і відвалюється.** Живлення (див. вище) або слабкий

    сигнал. Подивитися RSSI: гірше за −80 дБм — робота на межі.

    '
  method: Текст розділу 29 manual/29-symptomy.md, рядки 102-103
  note: 'RSSI (Received Signal Strength Indicator) — показатель мощности сигнала. Значение
    хуже −80 дБм означает, что устройство работает на пределе возможностей. | Переглянуто
    2026-08-27 у розборі 36 надмірних E. Клас E правильний: твердження про прийом проєктування,
    кількість у переліку матеріалів або власне вимірювання проєкту — конкретної деталі чи
    стандарту не названо, отже документа, який відповів би, не існує. Число в назві є, але
    воно номінал у пораді, а не величина з паспорта.'
