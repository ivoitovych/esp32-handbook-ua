- nazva: CH9102 потрібен не той самий драйвер, що CH340
  zbih: Для CH9102 потрібен.*не той самий.*драйвер
  klas: E
  dzherelo: Розділ 29 «Не бачить плату, немає порту» — про драйвери USB-мостів
  cytata: '**USB-міст і драйвер.** Подивитися маркування меншого чипа біля роз''єма

    і поставити правильний драйвер. Для CH9102 потрібен **не той самий**

    драйвер, що для CH340 — це окрема пастка (розділ 09, картка

    [К3](#k-pidkl)).

    '
  sposib: Текст розділу 29 manual/29-symptomy.md, рядки 27-30
  notatka: 'Частая ошибка: исползование драйвера CH340 для микросхемы CH9102, что приводит к неспособности
    найти USB-порт.'
- nazva: rst:0xf brownout — зміряти напругу під навантаженням
  zbih: зміряти напругу.*під навантаженням
  klas: E
  dzherelo: Розділ 29 «`rst:0xf` — brownout»
  cytata: 'Що робити: зміряти напругу **під навантаженням**, з увімкненим Wi-Fi

    (розділ 28); поставити 470 мкФ по живленню поруч із модулем; коротший і

    товщий кабель; окреме джерело від 1 А (розділ 06).

    '
  sposib: Текст розділу 29 manual/29-symptomy.md, рядки 92-94
  notatka: 'Важное уточнение: напряжение нужно измерять при активной работе Wi-Fi, а не просто на холостом
    ходу, так как именно в этот момент потребление максимально.'
- nazva: 'Wi-Fi відвалюється: подивитися RSSI гірше за −80 дБм'
  zbih: Подивитися RSSI.*гірше за −80 дБм
  klas: E
  dzherelo: Розділ 29 «Wi-Fi мовчить» — про слабкий сигнал
  cytata: '**Під''єднується і відвалюється.** Живлення (див. вище) або слабкий

    сигнал. Подивитися RSSI: гірше за −80 дБм — робота на межі.

    '
  sposib: Текст розділу 29 manual/29-symptomy.md, рядки 102-103
  notatka: RSSI (Received Signal Strength Indicator) — показатель мощности сигнала. Значение хуже −80
    дБм означает, что устройство работает на пределе возможностей.
