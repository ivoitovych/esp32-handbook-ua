# Прохід 28 — суцільне закриття кошика `komandy` за поділом.
#
# Прохід не поштучний, а **за кошиком**: узято всі 89 одиниць, які
# `tools/podil.py` відніс до М1 як «командний рядок esptool та idf.py», і
# закрито їх трьома джерелами одразу.
#
# Більшість із них — не нова звірка, а **досяжність уже зробленої**:
# команди перевірено в проходах 9 і 15, але взірці писалися під блоки
# коду й не діставали до згадок у прозі, комірках і чеклістах. Це той
# самий важіль, що в проході 22, тільки застосований суцільно.

- nazva: Іменування й версії esptool — version, esptool.py, дефіси проти підкреслень
  zbih: 'esptool version`|esptool\.py version`|виклик · v[45] →|Версія `esptool` залежить не від вашого вибору|у v4 інакшого імені немає'
  klas: A
  dzherelo: >-
    https://raw.githubusercontent.com/espressif/esptool/master/docs/en/esptool/basic-options.rst
    та .../docs/en/migration-guide.rst; перелік команд у esptool/__init__.py
  cytata: |
    (перехід на v5)
    The `esptool.py` name is kept as an alias; the recommended entry point
    is `esptool`. Command names use dashes: `write-flash`, `read-flash`,
    `erase-flash`, `merge-bin`. The underscore forms are deprecated and
    print a warning.
  sposib: curl raw.githubusercontent (повторно, проходи 9 і 15), 2026-08-26
  notatka: >-
    Не нова звірка. Іменування перевірено в проході 9, несиметричність
    міграції — у проході 6 (і записана в реєстр спростованого). Тут лише
    розширено досяжність на прозу й таблиці: «Перевірити своє: `esptool
    version`» у картках К5, К10 і додатку C, рядки таблиці «виклик · v4 /
    v5», а також попередження, що в v4 імені `esptool` без `.py` немає.

# ⚠ ПОМИЛКА ЦЬОГО ДОКАЗУ — виявлена в проході 36, лишена як зразок.
#
# Доказ класу A, який засвідчив хибне твердження. Джерело — перелік
# команд `esptool` — каже «chip-id: Read Chip ID». Це правда про
# **існування** команди. Книга ж стверджувала, що команда **називає
# сімейство і ревізію**, і цього рядок джерела не підтверджує ніяк.
#
# Перевіряти треба було реалізацію, а не покажчик команд:
# `ESPLoader.chip_id()` кидає `NotSupportedError` на всьому сімействі
# ESP32. Див. `pass-36-chip-id.yaml`.
#
# Урок: назва команди в переліку — доказ того, що команда є, і більше
# нічого. Твердження про те, **що вона друкує**, вимагає коду або
# зразка виводу.
#
# Взірець звужено до `flash-id` — половини, яка лишилася правдивою.
- nazva: flash-id як засіб упізнати перемаркований модуль
  zbih: '`flash-id` називає обсяг|`flash-id` показує 2 МБ'
  klas: A
  dzherelo: >-
    https://raw.githubusercontent.com/espressif/esptool/master/docs/en/esptool/basic-commands.rst
    та .../advanced-commands.rst
  cytata: |
    chip-id     Read Chip ID
    flash-id    Read SPI flash manufacturer and device ID

    The flash-id command outputs the manufacturer and device ID of the
    flash chip, together with the detected flash size.
  sposib: curl raw.githubusercontent (повторно, прохід 9), 2026-08-26
  notatka: >-
    `flash-id` існує і робить те, що книга обіцяє: друкує виробника,
    ідентифікатор і **виявлений обсяг** флешу. Розширення досяжності на
    розділ 08 («`flash-id` показує 2 МБ там, де за написом має бути 4»)
    і на картку К1, де це крок тріажу.

    Друга половина доказу — про `chip-id` — виявилася хибною; див.
    примітку над записом і `pass-36-chip-id.yaml`.

- nazva: idf.py monitor — вихід Ctrl+], скидання через Ctrl+T
  zbih: 'idf\.py monitor` · Вихід → `Ctrl\+\]`|розшифровує backtrace; скидання `Ctrl\+T`, `Ctrl\+R`|вийти — `Ctrl\+\]`|робить це автоматично, якщо запущений'
  klas: A
  dzherelo: >-
    https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/docs/en/api-guides/tools/idf-monitor.rst
  cytata: |
    * - Ctrl + ]
      - Exit the program
    * - Ctrl + T
      - Menu escape key
      - Press and follow it by one of the keys given below.
    * - * Ctrl + R
      - Reset target board via RTS
      - Reset the target board and re-starts the application via the RTS
        line (if connected).
    * - * Ctrl + P
      - Reset target into bootloader to pause app via RTS and DTR lines

    If an ESP-IDF app crashes and panics, a register dump and backtrace
    are produced… IDF Monitor … looks up each address in the ELF file.
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: >-
    Звірено дослівно, розбіжностей немає — включно з тонкістю, яку легко
    записати неправильно: `Ctrl+R` не самостійна комбінація, а **друга**
    клавіша після `Ctrl+T`. Книга пише саме «`Ctrl+T`, `Ctrl+R`», через
    кому, і це відповідає джерелу (`Ctrl+T` — menu escape key).

    Підтверджено й твердження картки К7: монітор розшифровує backtrace
    автоматично, якщо запущений із каталогу того самого проєкту — у
    джерелі це прив'язка до `.elf` того збирання.

- nazva: espefuse палить в один бік; остання перепона — слово BURN
  zbih: 'записує біти лише в один бік|назад ніколи|espefuse burn-\*`|набрати слово `BURN`|--do-not-confirm'
  klas: A
  dzherelo: >-
    https://raw.githubusercontent.com/espressif/esptool/master/docs/en/espefuse/index.rst
  cytata: |
    ``espefuse`` is a tool for communicating with Espressif chips for the
    purpose of reading/writing ("burning") the one-time-programmable
    eFuses. Burning occurs only in one direction from 0 to 1 (never
    cleared 1->0).

    .. warning::
        Because eFuse is one-time-programmable, it is possible to
        permanently damage or "brick" your {IDF_TARGET_NAME} using this
        tool. Use it with great care.

    - ``--do-not-confirm`` - Do not pause for confirmation before
      permanently writing eFuses. Use with caution. If this option is not
      used, a manual confirmation step is required, you need to enter the
      word ``BURN`` to continue burning.
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: >-
    Твердження картки К11 звірено, і формулювання уточнено за джерелом:
    не просто «не скидаються назад», а «лише в один бік, з 0 у 1» — так
    видно механізм, а не лише наслідок.

    Доповнення, якого не було ніде: **остання перепона — набрати слово
    `BURN`**. Це важливо у двох напрямках. Читач, що злякався картки,
    знає, що випадковим натисканням нічого не спалить. І він же знає, що
    `--do-not-confirm` у чужому скрипті означає плату, яка згорить без
    питання, — а саме чужі скрипти в цій книзі розбираються окремо.

- nazva: erase-flash стирає весь чип, включно з NVS і калібруванням
  zbih: '`erase-flash` знищує NVS|Після `erase-flash` або перепрошивки|Після `erase-flash` нічого немає|`erase-flash` — тільки після дампа|За адресою `0x8000` порожньо'
  klas: A
  dzherelo: >-
    https://raw.githubusercontent.com/espressif/esptool/master/docs/en/esptool/basic-commands.rst
  cytata: |
    Erase Flash: ``erase-flash`` & ``erase-region``

    To erase the entire flash chip (all data replaced with 0xFF bytes):

        esptool erase-flash

    To erase a region of the flash, starting at address 0x20000 with
    length 16 kB (0x4000 bytes):

        esptool erase-region 0x20000 0x4000
  sposib: curl raw.githubusercontent (повторно, прохід 9), 2026-08-26
  notatka: >-
    «Весь чип, усе замінюється на `0xFF`» — цього досить, щоб твердження
    книги випливало однозначно: NVS, `phy_init` і таблиця розділів лежать
    у тому самому флеші, отже зникають разом з усім.

    Звідси ж і симптом розділу 16 «за адресою `0x8000` порожньо після
    `erase-flash` без наступної повної прошивки»: `0xFF` — це і є
    порожньо, і бутлоадер не знаходить таблиці.

    Розширення досяжності на картки К2, К8, К11, К15 і розділ 20, де те
    саме твердження живе в різних формах.

- nazva: merge-bin дає один образ на адресу 0x0 незалежно від сімейства
  zbih: 'зібраний `merge-bin` · [^→]+→ `0x0`|адреса завжди `0x0`, незалежно від сімейства|Зібрано \*\*один образ\*\* через `merge-bin`|Є лише `\.bin`-файли — `esptool --chip … merge-bin`'
  klas: A
  dzherelo: >-
    https://raw.githubusercontent.com/espressif/esptool/master/docs/en/esptool/basic-commands.rst
    (merge-bin) та .../esp-idf/docs/en/api-guides/tools/idf-py.rst
  cytata: |
    The merge-bin command will merge multiple binary files (of any kind)
    into a single file that can be flashed to a device later. Any gaps
    between the input files are padded with 0xFF bytes (or 0x00 in
    --format hex).

    (idf-py.rst)
    …create a single binary file ``merged-binary.[bin|hex]`` in the build
    folder, which can then be flashed later.
  sposib: curl raw.githubusercontent (повторно, прохід 9), 2026-08-26
  notatka: >-
    Твердження книги випливає з механіки прямо: якщо злиття доповнює
    проміжки до суцільного образу від нуля, то зсуви вже всередині файлу,
    і прошивати його треба на `0x0` — на будь-якому чипі.

    Саме тому три рядки таблиці «зібраний `merge-bin` · classic, S2 →
    `0x0`», «S3, C3, C6, H2 → `0x0`», «P4, C5, H4 → `0x0`» однакові, хоча
    сусідня таблиця для окремих файлів має три різні адреси. Ця пара
    таблиць — головне, що картка К10 і додаток C мусять донести, і тепер
    вона звірена в обох.
