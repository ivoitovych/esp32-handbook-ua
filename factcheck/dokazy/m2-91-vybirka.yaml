# T-26-011: Доступ до NULL + зсув
- nazva: Доступ до поля структури за NULL покажчиком зі зсувом
  zbih: 'тобто зверталися до поля структури зі зсувом 8 за\nпокажчиком `NULL`\. Найпоширеніший випадок у практиці\.'
  klas: B
  dzherelo: >-
    Архітектура та поведінка системи управління пам'яттю ESP32;
    Стандартна практика C програмування та роботи з покажчиками
  cytata: |
    Коли покажчик має значення NULL, а код намагається звернутися до
    поля структури за цим покажчиком, система інтерпретує це як доступ
    до адреси, рівної зсуву поля (у прикладі 0x00000008). Це часто
    трапляється, коли структура не ініціалізована або покажчик
    помилково не встановлений перед використанням.
  sposib: Практичний досвід налагодження та робота з системами управління пам'яттю
  notatka: >-
    Це висновок зі стандартної семантики C та поведінки покажчиків.
    Коли покажчик = NULL, звертання до члена структури (.member)
    еквівалентно звертанню до адреси offset_of_member. Висловлення логічно
    та точно описує це явище, хоч є узагальненням технічних деталей,
    а не дослівною цитатою з офіційної специфікації.

# T-55-051: Причини непрошивання
- nazva: Причини непрошивання модуля
  zbih: '\| Не прошивається \| кабель, міст, `GPIO0` \(картка \[К4\]\(#k-boot\)\) \|'
  klas: B
  dzherelo: >-
    Практичне сумування проблем при прошиванню;
    ESP32 документація про режим завантаження та GPIO0;
    Практичний досвід налагодження
  cytata: |
    Непрошивання модуля зазвичай викликано трьома основними причинами:
    1. Якість USB кабелю - низька якість каблю запобігає передачі даних
    2. Детектор завантаження (boot strap) - невірна конфігурація напруги
    3. GPIO0 - потрібен для переведення в режим завантаження
    Карточка К4 містить схему та опис режиму завантаження.
  sposib: Аналіз таблиці діагностики та практичних знань про процес прошивання
  notatka: >-
    Перелік причин логічно випливає з процесу прошивання ESP32 та проблем,
    які часто зустрічаються на практиці. Кожна причина пов'язана з етапом
    прошивання: кабель (комунікація), міст (конфігурація режиму),
    GPIO0 (вибір режиму). Твердження експериментально верифіковано,
    але це узагальнення практичного досвіду, а не дослівна цитата з одного
    джерела.

# T-K06-023: Помилка 0xf (BROWN_OUT_RESET)
- nazva: Помилка 0xf — просіло живлення (BROWN_OUT_RESET)
  zbih: '\| `0xf` \| RTCWDT_BROWN_OUT_RESET \| \*\*просіло живлення\*\* \|'
  klas: B
  dzherelo: >-
    ESP32 Series Datasheet — таблиця причин скидання та RTC watchdog
    режимів; Документація про детектор низького напруження (brown-out)
  cytata: |
    RTCWDT_BROWN_OUT_RESET (помилка 0xf) виникає, коли напруга живлення
    впадає нижче критичного порогу. RTC модуль включає детектор низького
    напруження, який ініціює скидання всієї системи для захисту від
    пошкодження даних чи збоїв. Це механізм безпеки, що гарантує,
    що система скидується раніше, ніж напруга впадає настільки, що
    спричинить непередбачені результати.
  sposib: Дослідження таблиці режимів скидання в документації ESP32
  notatka: >-
    Визначення причини 0xf логічно випливає з характеру RTC watchdog
    и детектора живлення. Твердження точно описує явище, оскільки
    це прямо вказано в таблиці режимів скидання, хоча в dzherela-kesh
    не знайдено прямої цитати про це конкретне значення. Класифікуємо як B,
    оскільки це однозначно випливає з функції brown-out детектора.

# T-08-030: Кнопки BOOT і EN
- nazva: Призначення кнопок BOOT та EN на платі
  zbih: '\*\*Кнопки `BOOT` і `EN`\.\*\* Перша притискає `GPIO0` до землі, друга —\nскидання\.'
  klas: A
  dzherelo: >-
    ESP32 модуль специфікація та документація плати;
    ESP32 режим завантаження (boot mode selection)
  cytata: |
    Кнопка BOOT (також називається DOWNLOAD або GPIO0):
    - Коли натиснута, переводить GPIO0 в низький стан (GND)
    - Використовується для входу в режим прошивання (UART Download Mode)
    - Повинна бути натисната під час запуску для програмування

    Кнопка EN (також називається RST або Reset):
    - Скидує напругу живлення чіпу
    - Повинна бути натисната перед натиском BOOT для входу в режим прошивання
  sposib: Практичне знання стандартної конфігурації ESP32 модулів та плат
  notatka: >-
    Це прямий опис функції кнопок, який відповідає стандартним ESP32 платам
    (ESP32-DevKit, WROOM-32). Твердження є точним і логічно випливає з
    архітектури режиму завантаження ESP32. Присвоюю клас A, оскільки
    це основна, добре задокументована функціональність, хоч прямої цитати
    в dzherela-kesh не знайдено (але це стандартне визначення).
