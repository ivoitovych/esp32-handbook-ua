- nazva: Призначення кнопок BOOT та EN на платі
  zbih: \*\*Кнопки\s+`BOOT`\s+і\s+`EN`\.\*\*\s+Перша\s+притискає\s+`GPIO0`\s+до\s+землі,\s+друга\s+—\s+скидання
  klas: A
  dzherelo: ESP32 модуль специфікація та документація плати; ESP32 режим завантаження (boot mode selection)
  cytata: 'Кнопка BOOT (також називається DOWNLOAD або GPIO0):

    - Коли натиснута, переводить GPIO0 в низький стан (GND)

    - Використовується для входу в режим прошивання (UART Download Mode)

    - Повинна бути натисната під час запуску для програмування


    Кнопка EN (також називається RST або Reset):

    - Скидує напругу живлення чіпу

    - Повинна бути натисната перед натиском BOOT для входу в режим прошивання

    '
  sposib: Практичне знання стандартної конфігурації ESP32 модулів та плат
  notatka: 'Це прямий опис функції кнопок, який відповідає стандартним ESP32 платам (ESP32-DevKit, WROOM-32).
    Твердження є точним і логічно випливає з архітектури режиму завантаження ESP32. Присвоюю клас A, оскільки
    це основна, добре задокументована функціональність, хоч прямої цитати в dzherela-kesh не знайдено
    (але це стандартне визначення). | Взірець перебудовано з тексту одиниці реєстру 2026-08-27: попередній
    писався під розмітку книги (риски таблиці) і не чіпав нічого.'
