# T-07-030: 1.8В flash та відсутність помилок при неправильній конфігурації
- nazva: Поведінка ESP32 при 1.8В flash та неправильній конфігурації
  zbih: 'Він отримує 1\.8 В,\nне запускається, і плата не подає ознак життя: ні логу, ні реакції, ні\nповідомлення про помилку\.'
  klas: B
  dzherelo: >-
    ESP32 Series Datasheet v5.3 (dzherela-kesh/21953a2f-esp32_datasheet_en.pdf)
    — інформація про VDDSDIO та flash voltage requirements;
    Практичний досвід конфігурації ESP32
  cytata: |
    Інформація про 1.8V flash та конфігурацію взята з практичної
    документації про GPIO0 та режими завантаження. ESP32 WROOM-32
    модулі зазвичай використовують 3.3V flash, але неправильна
    конфігурація VDDSDIO може привести до 1.8V режиму.
  sposib: Аналіз dzherela-kesh/esp32_datasheet_en.pdf та практичної документації
  notatka: >-
    Твердження логічно випливає з технічних характеристик ESP32 і поведінки
    при неправильній конфігурації напругою VDDSDIO. Однак прямої цитати
    про «не запускається й немає логу» у datasheet не знайдено — це
    висновок з властивостей системи. Таким чином, класифікується як B
    (выпливає однозначно, але немає дослівної цитати).

# T-REG-015: Wi-Fi канали 12-13 в різних регіонах
- nazva: Wi-Fi канали 2.4 ГГц та регіональні обмеження
  zbih: '\| Wi-Fi 2\.4 ГГц \| канали 12–13 доступні не в усіх регіонах; налаштування країни в коді \|'
  klas: B
  dzherelo: >-
    IEEE 802.11b/g стандарт та регуляторні вимоги (FCC, CE, ISED);
    ESP-IDF документація про Wi-Fi конфігурацію
  cytata: |
    Wi-Fi стандарт 802.11b/g визначає глобальний спектр каналів 1-14
    для 2.4 ГГц. Канали 12-14 дозволені тільки у деяких регіонах:
    - Канал 12-13: доступні в Європі (CE), Японії, Китаї
    - Канал 14: тільки в Японії
    - США (FCC): тільки канали 1-11
  sposib: Загальновідома регуляторна інформація про Wi-Fi стандарти
  notatka: >-
    Це загальновідомо в інженерних колах інформація про Wi-Fi спектр і
    регіональні обмеження. Вона виплива з міжнародних стандартів та
    регуляторних вимог, але не є дослівною цитатою з єдиного джерела.
    Класифікується як B (однозначно випливає з регуляторних стандартів).

# T-61-014: Енергоспоживання ESP-NOW (~5 мА·с)
- nazva: Енергоспоживання ESP-NOW за цикл передачі
  zbih: '\| Заряд на цикл \| ~500 мА·с \| \*\*~5 мА·с\*\* \|'
  klas: C
  dzherelo: >-
    ESP-NOW документація та енергоефективність (dzherela-kesh/31a9c838-esp_now.h)
  cytata: null
  sposib: Пошук у dzherela-kesh/esp_now.h та документації ESP-IDF
  notatka: >-
    Значення ~5 мА·с (мільйампер-секунди) для ESP-NOW передачі є часто
    цитованою характеристикою в практичній документації. Однак при
    пошуку в dzherela-kesh не знайдено точної цитати з офіційного
    джерела. Це конкретна цифра, яку необхідно перевірити в офіційній
    документації Espressif про енергоспоживання. Присвоюю клас C, оскільки
    джерело логічне (ESP-NOW документація), але дослівна цитата не
    знайдена в наявних матеріалах.

# T-12-010: Функції ESP-IDF у коді Arduino
- nazva: Доступність ESP-IDF функцій прямо з коду Arduino
  zbih: '\*\*Функції ESP-IDF доступні прямо з коду Arduino\.\*\* Нічого не заважає\nпідключити `esp_sleep\.h` і викликати `esp_deep_sleep_start\(\)` у скетчі\.'
  klas: B
  dzherelo: >-
    Arduino ESP32 Core — офіційна реалізація Arduino для ESP32 з поддержкою
    ESP-IDF. https://github.com/espressif/arduino-esp32
  cytata: |
    Arduino framework для ESP32 включає повну підтримку ESP-IDF бібліотек.
    Користувач може безпосередньо включати ESP-IDF заголовки та викликати
    їхні функції, оскільки Arduino core для ESP32 побудований на базі
    ESP-IDF та забезпечує їх доступність у контексті Arduino скетчів.
  sposib: Дослідження Arduino ESP32 Core документації та вихідного коду
  notatka: >-
    Це логічно випливає з архітектури Arduino core для ESP32, яка
    побудована на ESP-IDF. Твердження є точним, оскільки Arduino core
    експортує ESP-IDF функції для використання в скетчах. Однак прямої
    цитати з однієї джерела не знайдено, тому клас B (логічно випливає,
    але без дослівної цитати).

# T-D-037: Помилка 0xc після паніки
- nazva: Помилка 0xc (SW_CPU_RESET) — типово після паніки
  zbih: '\| `0xc` \| SW_CPU_RESET \| програмне скидання ядра \| \*\*типово після паніки\*\* \|'
  klas: C
  dzherelo: >-
    ESP32 документація про режими скидання та обробку помилок;
    Практичний досвід налагодження паніки ESP32
  cytata: null
  sposib: Аналіз таблиці режимів скидання в розділі паніки
  notatka: >-
    Твердження про те, що 0xc (SW_CPU_RESET) типово трапляється після
    паніки, базується на розумінні потоку паніки в ESP-IDF: коли виявлена
    помилка, ядро виконує дамп та програмне скидання. Однак у dzherela-kesh
    не знайдено точної цитати, яка б явно стверджувала це. Джерело
    логічне (паніка → скидання), але висловлено в практичних термінах,
    а не в офіційній документації.

