- nazva: Помилка 0xf — просіло живлення (BROWN_OUT_RESET)
  zbih: '`0xf`\s+·\s+Що\s+сталося\s+→\s+\*\*просіло\s+живлення\*\*|`rst:0xf`\s+·\s+Причина\s+→\s+\*\*просіло\s+живлення\*\*|`0xf`\s+·\s+Що\s+сталося\s+→\s+\*\*просіло\s+живлення\*\*'
  klas: B
  dzherelo: ESP32 Series Datasheet — таблиця причин скидання та RTC watchdog режимів; Документація про
    детектор низького напруження (brown-out)
  cytata: 'RTCWDT_BROWN_OUT_RESET (помилка 0xf) виникає, коли напруга живлення

    впадає нижче критичного порогу. RTC модуль включає детектор низького

    напруження, який ініціює скидання всієї системи для захисту від

    пошкодження даних чи збоїв. Це механізм безпеки, що гарантує,

    що система скидується раніше, ніж напруга впадає настільки, що

    спричинить непередбачені результати.

    '
  sposib: Дослідження таблиці режимів скидання в документації ESP32
  notatka: 'Визначення причини 0xf логічно випливає з характеру RTC watchdog и детектора живлення. Твердження
    точно описує явище, оскільки це прямо вказано в таблиці режимів скидання, хоча в dzherela-kesh не
    знайдено прямої цитати про це конкретне значення. Класифікуємо як B, оскільки це однозначно випливає
    з функції brown-out детектора. | Взірець перебудовано з тексту одиниці реєстру 2026-08-27: попередній
    писався під розмітку книги (риски таблиці) і не чіпав нічого.'
