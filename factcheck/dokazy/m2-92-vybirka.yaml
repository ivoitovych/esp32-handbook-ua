- nazva: 'T-39-093: ESP32 не бачить 5 ГГц мережі'
  zbih: ESP32 не бачить 5 ГГц — найчастіша причина «мережі немає в списку».
  klas: A
  dzherelo: 'Espressif Systems, ESP32 Series Datasheet — розділ 1 «Features», Wi-Fi (кеш: dzherela-kesh/21953a2f-esp32_datasheet_en.pdf)'
  cytata: 'ESP32 is a single 2.4 GHz Wi-Fi-and-Bluetooth combo chip designed with the TSMC low-power 40
    nm

    • 802.11n (2.4 GHz), up to 150 Mbps

    '
  sposib: tools/citaty.py tekst_dzherela по кешованому PDF, 2026-08-27
  notatka: 'Було E — «зовнішнього джерела не існує». Існує, і воно найпряміше з можливих: даташит називає
    чип 2.4-гігагерцовим у першому ж рядку опису й перелічує лише b/g/n у діапазоні 2.4 ГГц. Твердження
    «ESP32 не бачить 5 ГГц мереж» доводиться відсутністю 5 ГГц у переліку підтримуваних стандартів, а
    не окремою заявою виробника — тому цитата подає обидва рядки.'
- nazva: 'T-36-120: SPI діагностика — знизити швидкість до 1 МГц'
  zbih: Спробувати\s+вручну\s+\(картка\s+\[К4\]\(\#k\-boot\)\),\s+знизити\s+швидкість,\s+перевірити,\s+що\s+порт\s+не\s+зайнятий\s+відкритим\s+монітор|\*\*Знизити\s+швидкість\*\*:\s+`\-\-baud\s+115200`,\s+далі\s+`\-\-no\-stub`\.\s+3|Знизити\s+швидкість:\s+`\-\-baud\s+115200`,\s+далі\s+`\-\-no\-stub`\.\s+3|\*\*Скоротити\s+проводи\*\*,\s+знизити\s+швидкість\s+до\s+100\s+кГц\.\s+6
  klas: E
  dzherelo: ''
  cytata: ''
  sposib: Практична рекомендація діагностики. Пошук у ESP-IDF SPI документації та датащиті не знайшов
    офіційного джерела для цієї конкретної методики діагностики
  notatka: 'Метод діагностики: 1 МГц — достатньо низька для надійної передачі SPI даних. Це практичне
    спостереження, а не офіційна рекомендація з документації. Жодного зовнішнього джерела не знайдено.
    Клас E. | Переглянуто 2026-08-27 у розборі 36 надмірних E. Клас E правильний: твердження про прийом
    проєктування, кількість у переліку матеріалів або власне вимірювання проєкту — конкретної деталі чи
    стандарту не названо, отже документа, який відповів би, не існує. Число в назві є, але воно номінал
    у пораді, а не величина з паспорта. | Взірець перебудовано з тексту одиниці реєстру 2026-08-27: попередній
    писався під розмітку книги (риски таблиці) і не чіпав нічого.'
