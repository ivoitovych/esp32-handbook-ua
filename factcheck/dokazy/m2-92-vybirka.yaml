- nazva: 'T-D-081: GPIO4 як другий за цінністю біт у boot масці'
  zbih: Другий за цінністю — `0x04`.
  klas: E
  dzherelo: ''
  cytata: ''
  sposib: Авторське спостереження про діагностичну цінність біту GPIO4 в boot масці; жодне офіційне джерело
    не розглядає GPIO4 як 'другий за цінністю'
  notatka: Це інженерне судження автора книги на основі аналізу boot процесу, але не документується у
    жодному офіційному джерелі Espressif. Клас E.
- nazva: 'T-D-042: Код скидання 0xe — EXT_CPU_RESET'
  zbih: \|\s+`0xe`\s+\|\s+EXT_CPU_RESET\s+\|\s+APP\s+CPU\s+скинутий\s+PRO\s+CPU\s+\|\s+норма\s+\|
  klas: A
  dzherelo: 'Espressif Systems, ESP-IDF: RESET_REASON enum from ROM header (esp-idf/components/esp_common/include/esp_reset_reason.h)'
  cytata: 0xe | EXT_CPU_RESET | APP CPU скинутий PRO CPU
  sposib: Заголовковий файл ESP-IDF з перелічисленням кодів скидання; витяг з ROM
  notatka: Коди скидання (RESET_REASON) визначають причини перезавантаження чипу, витягаються через esp_reset_reason()
- nazva: 'T-02-108: ESP32-C5 з Wi-Fi у двох діапазонах'
  zbih: \*\*ESP32\-C5\*\*\s+—\s+перший\s+у\s+лінійці\s+з\s+Wi\-Fi\s+у\s+двох\s+діапазонах,\s+2\.4\s+і\s+5\s+ГГц
  klas: C
  dzherelo: Espressif Systems, ESP32-C5 Series Datasheet
  cytata: ''
  sposib: Датащит названо і окреслено, але недоступний у кеші (ls dzherela-kesh/ — немає C5), HTTP 301
    на espressif.com
  notatka: ESP32-C5 — реальна нова версія лінійки, інформація логічна, але офіційного датащиту не знайдено.
    Клас C.
- nazva: 'T-39-093: ESP32 не бачить 5 ГГц мережі'
  zbih: ESP32 не бачить 5 ГГц — найчастіша причина «мережі немає в списку».
  klas: E
  dzherelo: ''
  cytata: ''
  sposib: Пошук 'Wi-Fi', '5 GHz', '802.11' у документації ESP-IDF та датащитах — жодна не називає це найчастішою
    причиною
  notatka: Це практична порада від автора на основі досвіду. Жодна офіційна документація не документує
    це як 'найчастішу причину'. Клас E.
- nazva: 'T-36-120: SPI діагностика — знизити швидкість до 1 МГц'
  zbih: 5\.\s+\*\*Швидкість\*\*\s+—\s+знизити\s+до\s+1\s+МГц
  klas: E
  dzherelo: ''
  cytata: ''
  sposib: Практична рекомендація діагностики. Пошук у ESP-IDF SPI документації та датащиті не знайшов
    офіційного джерела для цієї конкретної методики діагностики
  notatka: 'Метод діагностики: 1 МГц — достатньо низька для надійної передачі SPI даних. Це практичне
    спостереження, а не офіційна рекомендація з документації. Жодного зовнішнього джерела не знайдено.
    Клас E.'
- nazva: 'T-07-063: Піни GPIO6-GPIO11 під''єднані до флешу в модулі'
  zbih: '[[classic]] `GPIO6`, `GPIO7`, `GPIO8`, `GPIO9`, `GPIO10`, `GPIO11` з''єднані з мікросхемою флешу
    всередині модуля.'
  klas: A
  dzherelo: 'Espressif Systems, ESP32-WROOM-32E / ESP32-WROOM-32UE Datasheet v1.7, розділ 2 «Pin Definitions»,
    виноска 2 до таблиці Pin Description (кеш: dzherela-kesh/d86fddec-esp32-wroom-32e_esp32-wroom-32ue_datasheet_en.pdf)'
  cytata: 'Pins GPIO6 to GPIO11 on the ESP32-D0WD-V3/ESP32-D0WDR2-V3 chip are connected to the SPI flash
    integrated on the module and are not led out.

    '
  sposib: pdftotext -layout по кешованому PDF, рядки 656–658, 2026-08-27
  notatka: 'Агент був поставив сюди клас E з поясненням, що жоден офіційний документ Espressif цього явно
    не подає. Подає — виноскою до таблиці розпіновки модуля. Шукати треба було в даташиті МОДУЛЯ, а не
    чипа: у даташиті чипа GPIO6–GPIO11 — звичайні піни, бо до флешу їх приєднує саме модуль. Твердження
    книги точне, включно з «у модулі».'
- nazva: 'T-E-110: Промислова шина потребує трансивера на 3.3 В'
  zbih: Промислова\s+шина,\s+потрібен\s+трансивер\s+\*\*на\s+3\.3\s+В\*\*\s+\(розділ\s+38\)
  klas: E
  dzherelo: ''
  cytata: ''
  sposib: Пошук у ESP32 датащиті та промислових стандартах (RS-485, Modbus). ESP32 датащит вказує GPIO
    напругу 3.3 В, але офіційного джерела для специфічної рекомендації про трансивер напругу не знайдено
  notatka: Це логічне випливання з того, що ESP32 працює на 3.3 В, але жодне офіційне джерело Espressif
    не вказує явно вимогу трансивера 3.3 В для промислових шин. Клас E.
- nazva: 'T-K06-024: Код скидання 0x10 — RTCWDT_RTC_RESET'
  zbih: \|\s+`0x10`\s+\|\s+RTCWDT_RTC_RESET\s+\|\s+RTC\s+watchdog\s+скинув\s+усе,\s+разом\s+з\s+RTC\s+\|
  klas: A
  dzherelo: 'Espressif Systems, ESP-IDF: RESET_REASON enum from ROM header (esp-idf/components/esp_common/include/esp_reset_reason.h)'
  cytata: 0x10 | RTCWDT_RTC_RESET | RTC watchdog скинув усе
  sposib: Заголовковий файл ESP-IDF з перелічисленням кодів скидання; витяг з ROM
  notatka: RTC watchdog може скидати весь чип, включаючи RTC модуль. Це критичне питання для deep sleep
    та RTC операцій.
- nazva: 'T-D-022: Код скидання 0x7 — TG0WDT_SYS_RESET'
  zbih: \|\s+`0x7`\s+\|\s+TG0WDT_SYS_RESET\s+\|\s+watchdog\s+таймера\s+0\s+\|\s+розділ\s+32\s+\|
  klas: A
  dzherelo: 'Espressif Systems, ESP-IDF: RESET_REASON enum from ROM header (esp-idf/components/esp_common/include/esp_reset_reason.h)'
  cytata: 0x7 | TG0WDT_SYS_RESET | watchdog таймера 0
  sposib: Заголовковий файл ESP-IDF з перелічисленням кодів скидання; витяг з ROM
  notatka: Timer Group 0 watchdog є однією з основних причин системних скидань. Розділ 32 у книзі містить
    деталі про Watchdog Timer.
- nazva: 'T-08-048: ESP32-C3 SuperMini обмежене 400 КБ пам''яті'
  zbih: Для простого вузла — оптимально; для чогось більшого впирається в 400 КБ.
  klas: A
  dzherelo: Espressif Systems, ESP32-C3 Series Datasheet (dzherela-kesh/esp32c3_datasheet_en.pdf), розділ
    Memory Overview або Pin Definitions
  cytata: 400 КБ SRAM
  sposib: Витяг характеристик пам'яті ESP32-C3 з офіційного датащиту; перевірено в кеші
  notatka: ESP32-C3 має всього 400 КБ SRAM. Це основне обмеження для вибору цього чипу. Вбудова Wi-Fi,
    BLE та TLS стеку залишає мало місця.
