# Прохід 38 — межі швидкості esptool.
#
# Знахідка помічника з хвилі на 19 розбіжних цитат, і **перша
# підтверджена суперечність за дві хвилі**: попередні 50 записів дали
# 50 відповідей і жодного спростування.
#
# Помічник помилився в адресі (`docs/en/esptool_py_usage/` замість
# `docs/en/esptool/` — 404), але текст навів дослівно. Перевірив сам:
# рядок стоїть у документі буквально, і книга йому суперечила.
#
# Взірець той самий, що ловимо весь вечір, у ще одному вигляді: число
# праве (460800 справді працює на багатьох мостах), а те, **чим воно
# є**, — ні. Книга називала його типовим максимумом; джерело каже, що
# типовий — 230400, а 460800 тримають лише деякі.

- nazva: Межі --baud — 230400 у більшості, 460800 лише в деяких
  # Третя альтернатива (`«деякі»`) була холостою: у книзі це слово
  # виділене жирним, а не взяте в лапки. Прибрано одразу — саме такий
  # мертвий варіант усередині **живого** доказу і є сліпа пляма, яку
  # знайшов М2: запис виглядає здоровим, бо спрацювала перша
  # альтернатива, а решта не перевіряється ніколи.
  zbih: 'розумна перша спроба, але \*\*не\*\* та швидкість|з `230400`\nпрацює \*\*більшість\*\* конфігурацій'
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esptool/master/docs/en/esptool/basic-options.rst
  cytata: |
    Most hardware configurations will work with ``-b 230400``, some with ``-b 460800``, ``-b 921600`` and/or ``-b 1500000`` or higher.
  sposib: >-
    `curl` на `raw.githubusercontent.com`, гілка `master`, рядок 53.
    Документ отримано в цій сесії, витяг наведено дослівно — звідси
    клас `A`.
  notatka: >-
    Команди в книзі лишено на `460800`: як перша спроба це чесне
    значення, і поруч стоїть указівка знижувати. Виправлено саме
    **твердження** про те, що це типовий максимум.

- nazva: З'єднання завжди на 115200 — --baud стосується лише передавання
  zbih: 'саме з.єднання завжди встановлюється на `115200`|вмикається лише для передавання'
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esptool/master/docs/en/esptool/basic-options.rst
  cytata: |
    The baud rate is limited to 115200 when esptool establishes the initial connection, higher speeds are only used for data transfers.
  sposib: >-
    Той самий документ, рядок 51. Знайдено при перевірці попереднього
    твердження — сусідній рядок пояснював те, чого книга не казала.
  notatka: >-
    Практичний наслідок, якого в книзі бракувало: збій **на етапі
    з'єднання** зниженням `--baud` не лікується, бо з'єднання й так іде
    на 115200. Порада «знижуй швидкість» доречна лише для обривів під
    час передавання.
