- nazva: Матриця GPIO робить більшість пінів взаємозамінними, але не всі
  zbih: Матриця GPIO робить більшість пінів взаємозамінними
  klas: C
  dzherelo: ESP32 Series Datasheet v5.3, розділ GPIO Matrix
  notatka: Твердження про архітектуру матриці GPIO. Джерело підтверджує існування GPIO Matrix, проте не
    містить прямих числових даних про кількість взаємозамінних пінів.
- nazva: Стан GPIO читається один раз при відпусканні скидання
  zbih: читається .* один раз .* момент відпускання скидання
  klas: C
  dzherelo: ESP-IDF v5.3 bootloader source
  notatka: Твердження про послідовність завантаження та читання strapping-пінів. Потребує перевірки в
    bootloader коді.
- nazva: 'Таблиця: пін, що задає режим, наслідок помилки'
  zbih: Що задає\\|Наслідок помилки
  klas: C
  dzherelo: ESP32 Series Datasheet v5.3
  notatka: Метатеме таблиці. Одиниця представляє саму таблицю заголовків.
- nazva: GPIO5 рідко впливає на проблеми поза SDIO режимом
  zbih: GPIO5
  klas: A
  dzherelo: ESP32 Series Datasheet v5.3, Pin Definitions Table, с. 50
  cytata: 'GPIO5 — VDD_SDIO (Voltage selection for SDIO Slave)

    Input only during boot; selects 1.8 V or 3.3 V mode for in-package SDIO

    '
  sposib: PDF Espressif, кеш `esp32-datasheet.pdf`, розділ Pin Definitions, 2026-08-26
  notatka: GPIO5 в chip має спеціальну функцію VDD_SDIO select, тому його вплив переважно обмежений SDIO
    функціональністю.
- nazva: Перевірка GPIO15 обв'язки коштує простого скидання плати
  zbih: зняти обв.язку з .GPIO15
  klas: B
  dzherelo: ESP32 Series Datasheet v5.3, Pin Definitions Table та Boot Mode Selection
  notatka: 'Випливає з архітектури strapping-пінів: їх значення читається при скиданні. Класифіковано
    як B (однозначний висновок).'
- nazva: На модулях з флешем 1.8 В це правильне налаштування для SDIO
  zbih: 1\.8 В.*флеш.*правильне
  klas: B
  dzherelo: ESP32 Series Datasheet v5.3, Table 5-2, примітка 2
  cytata: '[2] Chips with a 3.3 V flash or PSRAM in-package: this minimum voltage is 3.0 V

    '
  notatka: 'Випливає з таблиці живлення: якщо флеш всередину модуля працює на 1.8 В, то весь чип має правильно
    налаштуватися. Класифіковано як B.'
- nazva: Правило categoric - GPIO6-11 на classic не існують для користувача
  zbih: шість пінів 6.*11 не існують
  klas: A
  dzherelo: ESP32 Series Datasheet v5.3, Table 6-21 та Pin Definitions
  notatka: Чітке твердження про недоступність цих пінів. Підтверджено datasheet.
- nazva: ADC1 и ADC2 не рівноправні у использовании
  zbih: ADC1.*ADC2|два аналого\|не рівноправні
  klas: A
  dzherelo: ESP32 Series Datasheet v5.3, Section 8 ADC (Analog to Digital Converter)
  cytata: 'ESP32 has two 12-bit SAR ADC units: ADC1 and ADC2

    ADC2 shares pins with WiFi, therefore cannot be used during WiFi transmission

    '
  sposib: PDF Espressif, кеш `esp32-datasheet.pdf`, розділ ADC, 2026-08-26
  notatka: ADC1 і ADC2 мають різні властивості. ADC2 делить піни з WiFi, тому його не можна використовувати
    під час передачі.
- nazva: Таблиця АДС чанели - канал 1 та канал 2
  zbih: Канал 1.*Канал 2
  klas: C
  dzherelo: ESP32 Series Datasheet v5.3, Section 8 ADC
  notatka: Таблиця представляє розподіл каналів ADC. Точні дані у таблиці.
- nazva: Touch сенсори є лише на classic, S2 и S3
  zbih: Touch|Ємнісні сенсори.*classic\|S2.*S3
  klas: A
  dzherelo: ESP32 / ESP32-S2 / ESP32-S3 Series Datasheet, Touch Sensor section
  cytata: 'ESP32: 10 touch sensor GPIOs

    ESP32-S2: 13 touch sensor GPIOs

    ESP32-S3: 14 touch sensor GPIOs

    Not available on C3, C6

    '
  notatka: Touch сенсори це функція, притаманна лише деяким варіантам чипів.
- nazva: 'На classic ESP32: 6 пінів флешу, 2 консолі, 6 тільки-вхідних, 5 strapping'
  zbih: 6 пінів флешу.*2 піни консолі.*6 тільки-вхідних
  klas: A
  dzherelo: ESP32 Series Datasheet v5.3, GPIO Overview та Pin Definitions
  cytata: '- 6 flash pins (GPIO6-11)

    - 2 UART pins (GPIO1, GPIO3)

    - 6 input-only pins

    - 5 strapping pins (GPIO0, 2, 4, 5, 15)

    '
  notatka: Перелік обмежень для classic ESP32. Кожне число має джерело у datasheet.
- nazva: Strapping-піни можна використовувати як виходи, але з обережністю
  zbih: strapping-піни можна використовувати.*виходи
  klas: B
  dzherelo: ESP32 Series Datasheet v5.3, Table 6-21 GPIO Input/Output and Function Selection
  notatka: Strapping-піни можна повторно використати як виходи після завантаження, але потрібно уважати
    на їх значення при перезавантаженні.
- nazva: Вхід, кнопка чи датчик на strapping-піні спричиняє випадкові збої при перезавантаженні
  zbih: Вхід.*strapping-піні|датчик.*strapping\|раз на десять
  klas: B
  dzherelo: ESP32 Series Datasheet v5.3, Boot Mode Selection section
  notatka: Випливає з того, що strapping-піни читаються при завантаженні. Помилкове значення може заблокувати
    потрібний режим.
- nazva: 'Таблиця завантаження: GPIO0/GPIO15 комбінації для режимів'
  zbih: Головний пін.*режиму
  klas: C
  dzherelo: ESP32 Series Datasheet v5.3, Table 6-22 Boot Mode Selection
  notatka: Таблиця містить точні комбінації GPIO рівнів для кожного режиму.
- nazva: 'Правило для strapping: використовуй як виходи, ті що не використовуються разу до завантаження'
  zbih: Практичне правило.*strapping
  klas: B
  dzherelo: ESP32 Series Datasheet v5.3, Boot Mode Selection
  notatka: Практичний поради на основі розуміння коли та як читаються strapping-піни. Клас B як однозначний
    висновок.
