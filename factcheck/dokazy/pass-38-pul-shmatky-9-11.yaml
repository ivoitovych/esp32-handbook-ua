    М1 самостійно, 2026-08-26
  notatka: '**Прогалина в арифметиці самої книги, і саме тому цінна.**

    Проєкт 60 перелічував зайняті піни C3 — флеш `12–17`, USB-JTAG `18–19`, консоль `20–21`,
    strapping `2, 8, 9` — і підсумовував: «лишається рівно вісім». Але 22 − 13 = 9. Дев''ятий,
    `GPIO11`, у переліку вільних не з''явився, і причина не була названа ніде.

    Висновок книги правильний, **обґрунтування — ні**. Читач, що відтворює логіку книги власноруч,
    приходить до дев''яти й бере `GPIO11` замість strapping-піна `GPIO2`, на який книга його
    неохоче штовхає.

    А `GPIO11` — це вивід, з якого живиться флеш. Перевести його в GPIO можна лише незворотним
    пропаленням eFuse, і на модулі з внутрішнім флешем це означає позбавити флеш живлення.

    Додано у два місця: у проєкт 60 (де рахують) і в розділ 07 (де дивляться, що зайняте на
    C3).

    Окремо варте уваги те, **як** воно ховалося: у `esp32c3.inc` колонка коментаря для `GPIO11`
    порожня. Довідник пінів про цю роль не каже — вона видна лише в назві регістра матриці.'
