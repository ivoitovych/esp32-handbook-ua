- nazva: ESP_DRAM_LOGx — єдиний виняток із заборони логувати в ISR
  zbih: ESP_DRAM_LOGE|переривання вимкнені або всередині ISR|DRAM_STR\("mij_teg"\)
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/log/include/esp_log.h
  cytata: "/**\n * @brief Macros to output logs when the cache is disabled.\n * Unlike normal\
    \ logging macros, it's possible to use this macro when\n * interrupts are disabled or\
    \ inside an ISR.\n * Placing log strings in DRAM reduces available DRAM, so only use\n\
    \ * when absolutely essential.\n *\n * Usage: `ESP_DRAM_LOGE(DRAM_STR(\"my_tag\"), \"\
    format\", ...)\n */\n#define ESP_DRAM_LOGE(tag, format, ...) ...\n"
  sposib: curl raw.githubusercontent (перевірено М1 після зауваження агента шматка 11), 2026-08-26
  notatka: 'Книга давала категоричне «в ISR не можна `printf` і `ESP_LOGx`». Правило правильне,
    але ESP-IDF возить із собою саме той інструмент, який потрібен, коли правило заважає,
    — і книга про нього мовчала.

    Це четвертий випадок за два дні, коли категоричність книги приховувала виняток, названий
    у джерелі в тому самому абзаці. Перші три: `GPIO6–11` без `16–17`, «шість пінів, крапка»,
    «не бачить м''які поверхні» замість вимоги площі.

    Ціна винятку взята з джерела дослівно й у книгу перенесена: рядки в DRAM, DRAM мало, «лише
    коли без цього ніяк».'
