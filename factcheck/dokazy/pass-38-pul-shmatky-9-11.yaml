# Прохід 38 — шматки 9, 10 і 11 пулу: команди, піни, API/адреси/лог.
#
# 85 одиниць у трьох агентів. Тут — **тільки те, що я звірив сам**,
# дослівною цитатою з джерела, отриманою в цій сесії. Решта звітів
# лежить у `factcheck/PEREVIRYTY.md` і чекає на повторну перевірку.
#
# Межа проведена свідомо. Клас `A` означає «цитату справді отримано», а
# не «агент повідомив, що отримав». Різниця сьогодні коштувала:
# я вніс у розділ 25 команду `idf.py monitor --save-log log.txt` за
# звітом агента, пішов перевіряти підпис — і виявив, що це прапорець
# без значення. Помилка була б у друкованій книзі.




























