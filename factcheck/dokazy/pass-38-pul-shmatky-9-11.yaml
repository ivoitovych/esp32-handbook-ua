- nazva: На RISC-V рядка Backtrace немає — його будує монітор
  zbih: рядка `Backtrace:` у дампі немає\s*\n?взагалі|CONFIG_ESP_SYSTEM_USE_EH_FRAME|розмір\s*\n?образу
    росте на 20–100
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/docs/en/api-guides/fatal-errors.rst
  cytata: ".. only:: CONFIG_IDF_TARGET_ARCH_RISCV\n\n    Core  0 register dump:\n    MEPC\
    \    : 0x420048b4  RA      : 0x420048b4  SP      : 0x3fc8f2f0 ...\n    (жодного рядка\
    \ Backtrace: у дампі)\n\nMoreover, IDF Monitor is also capable of generating and printing\
    \ a\nbacktrace thanks to the stack dump provided by the board in the\npanic handler.\n\
    \nWhile the backtrace above is very handy, it requires the user to use\nIDF Monitor. Thus,\
    \ in order to generate and print a backtrace while\nusing another monitor program, it\
    \ is possible to activate\n``CONFIG_ESP_SYSTEM_USE_EH_FRAME`` option from the menuconfig,\
    \ under\nthe \"Backtracing method\" menu.\n\nthe option's drawback is that it results\
    \ in an increase of the\ncompiled binary's size (ranging from 20% to 100% increase in\
    \ size)\n"
  sposib: curl raw.githubusercontent (перевірено М1 після зауваження агента шматка 9), 2026-08-26
  notatka: 'Два різні механізми під однією назвою. На Xtensa чип друкує `Backtrace: 0x…:0x…`,
    монітор перекладає адреси. На RISC-V чип не друкує ланцюжка взагалі — монітор **відновлює**
    його зі знімка стека.

    Наслідок для читача різкий: лог з C3, знятий через `screen`, не містить ланцюжка викликів
    і не міститиме його ніколи. Розшифровувати нічого. На classic у тій самій ситуації адреси
    є, і `addr2line` відпрацює потім.

    Розділ 26 вчив знімати лог у файл і розшифровувати пізніше — порада, що на половині сімейств
    книги не працює. Тепер це сказано, і сказано з виходом: `CONFIG_ESP_SYSTEM_USE_EH_FRAME`,
    з ціною в 20–100 % розміру образу.'
