- nazva: Драйвер I²C називає причину в консолі, а не мовчить
  zbih: 'i2c_new_master_bus\(1049\): invalid SDA/SCL pin number|називає причину в консолі|[Мм]овчазним
    воно\s*\n?стає лише тоді'
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/esp_driver_i2c/i2c_master.c,
    .../components/esp_common/include/esp_check.h, .../Kconfig
  cytata: "(i2c_master.c:1049)\nESP_RETURN_ON_FALSE(GPIO_IS_VALID_GPIO(bus_config->sda_io_num)\
    \ &&\n    GPIO_IS_VALID_GPIO(bus_config->scl_io_num), ESP_ERR_INVALID_ARG,\n    TAG, \"\
    invalid SDA/SCL pin number\");\n\n(esp_check.h — варіант, що діє типово)\n#define ESP_RETURN_ON_FALSE(a,\
    \ err_code, log_tag, format, ...) do { \\\n        if (unlikely(!(a))) { \\\n        \
    \    ESP_LOGE(log_tag, \"%s(%d): \" format, __FUNCTION__, __LINE__ ...); \\\n        \
    \    return err_code; \\\n        } \\\n    } while(0)\n\n(Kconfig)\nconfig COMPILER_OPTIMIZATION_CHECKS_SILENT\n\
    \    bool \"Disable messages in ESP_RETURN_ON_* and ESP_EXIT_ON_* macros\"\n    default\
    \ n\n"
  sposib: curl raw.githubusercontent (перевірено М1 після зауваження агента шматка 11), 2026-08-26
  notatka: 'Книга писала, що схема з `GPIO22` на S3 «не запрацює **й помилки не дасть**»,
    і тут же — що виклик поверне `ESP_ERR_INVALID_ARG`. Два твердження в одному реченні суперечать
    одне одному.

    Джерело вирішує суперечку на користь другого: мовчазний варіант макроса вмикається лише
    опцією `COMPILER_OPTIMIZATION_CHECKS_SILENT`, а вона типово `n`. Тобто в консолі стоїть
    готовий діагноз із назвою функції та номером рядка.

    Виправлення важливіше за факт: книга посилала читача шукати мовчазну ваду там, де в логу
    лежить готова відповідь. Тепер сказано, за яких умов воно **справді** стає мовчазним —
    коли код повернення не перевіряють і лог гортають повз.'
