    \   1\n#define FUNC_VDD_SPI_GPIO11_0                       0\n\n(esp_efuse_table.csv)\n\
    VDD_SPI_AS_GPIO, EFUSE_BLK0, 58, 1, [] Set this bit to vdd spi pin\nfunction as gpio\n\
