- nazva: Режим завантаження словами друкує ROM, не esptool
  zbih: Режим словами\s*\n?— `SPI_FAST_FLASH_BOOT`|друкує сам ROM|У виводі\s*\n?`esptool`
    цього рядка немає
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esptool/master/esptool/{cmds,loader,__init__}.py
  cytata: "Пошук рядків `SPI_FAST_FLASH_BOOT` і `DOWNLOAD_BOOT` у трьох файлах,\nщо формують\
    \ увесь вивід esptool:\n\n    cmds.py       0 збігів\n    loader.py     0 збігів\n   \
    \ __init__.py   0 збігів\n"
  sposib: curl raw.githubusercontent + grep (перевірено М1 після зауваження агента шматка
    9), 2026-08-26
  notatka: '**Знову власна помилка, і знову в додатку D.** Я написав «`esptool` друкує режим
    словами» у блоці, доданому проходом 36 — тобто дві правки поспіль в одному абзаці, обидві
    хибні в приписуванні.

    Рядок `boot:0x13 (SPI_FAST_FLASH_BOOT)` друкує ROM у boot-лог по UART. Книга наводить
    його прикладом за десять рядків нижче, у підрозділі «Типовий boot-лог» — тобто джерело
    правильної відповіді стояло на тій самій сторінці.

    Доказ негативний, і це рідкість у реєстрі: він показує **відсутність** рядка в усьому
    виводі інструмента. Такий доказ слабший за цитату й залежить від того, що переглянуто
