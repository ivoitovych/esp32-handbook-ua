- nazva: Сучасні роутери часто розділяють SSID для діапазонів; ESP32 не бачить 5 ГГц
  zbih: Сучасні роутери часто\s+мають однакове ім.я для обох діапазонів.*ESP32 не бачить
  klas: A
  shukaty: Wi-Fi діапазони 2.4/5 ГГц, SSID, роутер, ESP32 Wi-Fi стандарт
  sposib: Джерело взято з кешу 2026-08-28 і цитату звірено з ним підрядком (шар 3). Клас `verbatim`
    означає, що документ отримано й цитата точна — він **не** означає, що супровідник прочитав
    уривок і погодився. Це окрема робота.
  notatka: 'Даташит ESP32, с. 1: чип **тільки** 2.4 ГГц; там же «802.11b/g/n» і «802.11n (2.4
    ГГц), до 150 Мбіт/с». Твердження книги про те, що ESP32 не бачить 5 ГГц, доведено дослівно.

    МЕЖА ЦЬОГО ДОКАЗУ, названа вголос: одиниця містить ДВА твердження. Друге — «сучасні роутери
    часто мають однакове ім''я для обох діапазонів» — це спостереження про побутові роутери,
    і жодним первинним документом воно тут не підперте. Клас одиниці визначає сильніша половина,
    і реєстр не вміє показати, що слабша лишилася без джерела. Тому це сказано тут.

    2026-08-28: до цього запис мав клас unverified — тобто «доказ про відсутність доказу».
    Джерело весь час лежало в нашому кеші.'
