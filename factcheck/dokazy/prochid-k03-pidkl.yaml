  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/master/docs/en/get-started/establish-serial-connection.rst
  cytata: 'Check the list of identified COM ports in the Windows Device Manager. Disconnect
    {IDF_TARGET_NAME} and connect it back, to verify which port disappears from the list and
    then shows back again.

    '
  sposib: 'Суцільний прохід 2026-08-27. Документ отримано в сесії, витяг звірено з ним підрядком
    машинно (`tools/prochid_zvid.py`). Клас `A` тут означає «документ отримано, цитата дослівна»,
    а **не** «супровідник прочитав і згоден»: змістовий шар лишається окремою роботою.'
  notatka: довідник підтверджує, що жовтий знак у диспетчері означає драйвер
