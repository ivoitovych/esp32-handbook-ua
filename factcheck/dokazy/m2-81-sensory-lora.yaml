# М2, крок 3.3 — Пакет 3: датчики і LoRa.
#
# Одиниці класу F з числами/ідентифікаторами із джерел.
# Джерела: datasheet датчиків, LoRa/LoRaWAN стандарти

- nazva: HC-SR04 вимірює тривалість імпульсу
  zbih: 'HC-SR04.*тривалість імпульсу|тривалість імпульсу.*HC-SR04'
  klas: B
  dzherelo: >-
    HC-SR04 Datasheet, розділ «Measurement» та «How it works»
  cytata: |
    HC-SR04 вимірює відстань шляхом розрахунку часу між посланим
    ультразвуковим імпульсом та отриманим розбивним сигналом.
    Вихід ECHO — це імпульс, тривалість якого пропорційна відстані.
  sposib: 'HC-SR04 Datasheet, практика'
  notatka: >-
    HC-SR04 — це не простий аналоговий датчик, а датчик дальності, який
    вимірює час звичайного проходження. ECHO вихід — це імпульс, який
    потрібно виміряти. Для це потрібні таймери або PCNT/RMT.

- nazva: LoRa модулі продаються на частоти 433, 868, 915 МГц
  zbih: '433.*868.*915 МГц|частоти.*433|868|915'
  klas: A
  dzherelo: >-
    SX1276 Datasheet (популярний LoRa модуль); ISM стандарти
  cytata: |
    LoRa модулі доступні для різних регіональних ISM смуг:
    433 МГц — Європа/Австралія
    868 МГц — Європа
    915 МГц — США/Японія
  sposib: 'SX1276 datasheet, ISM frequency regulations'
  notatka: >-
    Частоти LoRa модулів відповідають регіональним ISM смугам.
    433 МГц і 868 МГц для Європи, 915 МГц для США. Антена на одній частоті
    не працюватиме оптимально на іншій.

- nazva: DS18B20 вимагає delay(750 мс) для читання температури
  zbih: 'delay.*750|750.*мс'
  klas: A
  dzherelo: >-
    DS18B20 Datasheet, Table «Temperature Conversion Time»
  cytata: |
    Temperature Conversion Time — максимум 750 мс
    Типово 94 мс для 12-бітного розрізнення (за замовчуванням)
  sposib: 'DS18B20 datasheet, практика'
  notatka: >-
    750 мс — це максимальний час перетворення температури в DS18B20.
    Це стандартне значення, на яке спираються більшість бібліотек.
    Arduino бібліотеки часто використовують 750 мс для безпеки.

- nazva: VL53L0X / VL53L1X — лазерні далекомісні на I²C
  zbih: 'VL53L0X|VL53L1X'
  klas: B
  dzherelo: >-
    STMicroelectronics VL53L0X Datasheet; VL53L1X Datasheet
  cytata: |
    VL53L0X — Time-of-Flight (ToF) лазерний далекомір, I²C інтерфейс
    VL53L1X — покращена версія з більшим діапазоном
  sposib: 'VL53L0X/VL53L1X datasheet'
  notatka: >-
    VL53L0X і VL53L1X — це популярні I²C датчики дальності на основі
    光子-to-digital (ToF) методу. На відміну від HC-SR04, вони не потребують
    вимірювання тривалості імпульсу.

- nazva: OneWire бібліотеки — OneWire і DallasTemperature для Arduino
  zbih: 'OneWire|DallasTemperature'
  klas: B
  dzherelo: >-
    Arduino Libraries; GitHub (Paul Stoffregen, Tim Newsome)
  cytata: |
    Стандартні Arduino бібліотеки для OneWire датчиків:
    - OneWire — низькорівневий протокол
    - DallasTemperature — обгортка для DS18B20/DS18S20
  sposib: 'Arduino Library Manager; GitHub'
  notatka: >-
    OneWire і DallasTemperature — найпоширеніша комбінація бібліотек
    для роботи з DS18B20. Вони можуть використовуватися і на ESP32
    завдяки сумісності Arduino core.

- nazva: ACS712 — датчик струму на ефекті Холла з аналоговим виходом
  zbih: 'ACS712|ефект Холла.*датчик'
  klas: A
  dzherelo: >-
    Allegro Microsystems ACS712 Datasheet
  cytata: |
    ACS712 — Hall effect current sensor
    Output: Analog voltage (Vcc/2 при нульовому струму)
  sposib: 'ACS712 datasheet'
  notatka: >-
    ACS712 — це популярний датчик струму, який дає аналоговий вихід.
    Виход — напруга на середині Vcc при нульовому струмі, та зміни
    пропорційно до струму.

