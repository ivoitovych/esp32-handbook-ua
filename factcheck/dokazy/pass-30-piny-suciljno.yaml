    пінцетом замкнути `GPIO0`|Кнопка `BOOT` на платах C3 діє саме на `GPIO9`
  status: derived
  source: https://raw.githubusercontent.com/espressif/esptool/master/docs/en/advanced-topics/boot-mode-selection.rst
    (Select Bootloader Mode, Automatic Bootloader)
  quote: 'The {chip} will enter the serial bootloader when {STRAP_BOOT_GPIO} is

    held low on reset. Otherwise it will run the program in flash.


    {STRAP_BOOT_GPIO} has an internal pullup resistor, so if it is left

    unconnected then it will pull high.


    Many boards use a button marked "Flash" (or "BOOT" on some Espressif

    development boards) that pulls {STRAP_BOOT_GPIO} low when pressed.


    esptool can automatically reset the board into bootloader mode … using

    the DTR and RTS lines.

    '
  method: Retrieved with `curl` from raw.githubusercontent.com, 2026-08-26; quote verified
    by substring match.
  note: 'Клас `B`. Джерело дає механізм повністю — рівень при скиданні, внутрішнє підтягування,
    кнопка, автоскидання через `DTR`/`RTS`. Порядок «тримати BOOT → натиснути EN → відпустити
    BOOT» із нього випливає однозначно, але дослівно так ніде не написаний.

    Ставити тут `A` було б тим самим, чим був би `A` для JTAG-пінів у проході 20: твердження
    безсумнівне, але не процитоване. Картка К4 — інструкція, і чесний клас для інструкції,
    зібраної з фактів, — `B`.

    Окремо звірено, що на C3 кнопка діє на `GPIO9`: це головний strapping-пін сімейства за
    підстановкою `STRAP_BOOT_GPIO`.'
- nazva: I²C і strapping на C3 — підтяжки збігаються з потрібними рівнями
  zbih: зовнішні підтягувальні резистори I²C тягнуть обидві лінії вгору|ведений, що притискає
    `SDA` до землі|Комбінація `GPIO8`=0 і `GPIO9`=0 недійсна|аналоговий вхід — це `GPIO0`–`GPIO4`
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esptool/master/docs/en/advanced-topics/boot-mode-selection.rst
    та .../esp-idf/components/soc/esp32c3/include/soc/adc_channel.h
  cytata: '{STRAP_BOOT_2_GPIO} must also be driven High, in order to enter the

    serial bootloader reliably. The strapping combination of

    {STRAP_BOOT_2_GPIO} = 0 and {STRAP_BOOT_GPIO} = 0 is invalid and will

    trigger unexpected behavior.

    (для esp32c3: STRAP_BOOT_2_GPIO = GPIO8, STRAP_BOOT_GPIO = GPIO9)


    (esp32c3/adc_channel.h)

    ADC1_GPIO0_CHANNEL 0   ADC1_GPIO1_CHANNEL 1   ADC1_GPIO2_CHANNEL 2

    ADC1_GPIO3_CHANNEL 3   ADC1_GPIO4_CHANNEL 4

    '
  sposib: Retrieved with `curl` from raw.githubusercontent.com, 2026-08-26; quote verified
    by substring match.
  notatka: 'Додаток A робить із двох звірених фактів висновок, і висновок правильний у неочевидний
    бік: типова обв''язка I²C на C3 завантаженню **не заважає**. Підтяжки тягнуть обидві лінії
    вгору, а потрібно саме `GPIO8` високий; `GPIO9` високий означає звичайний старт.

    Друга половина — застереження, і воно точне: ведений, що притискає `SDA` до землі в момент
    скидання, дає `GPIO8` = 0. Разом із `GPIO9` = 0 (натиснута кнопка `BOOT`) це та сама недійсна
    комбінація.

    «На C3 аналоговий вхід — це `GPIO0`–`GPIO4`, і більше нічого» — п''ять каналів `adc_channel.h`,
    рівно цей діапазон.'
  title: I²C і strapping на C3 — підтяжки збігаються з потрібними рівнями
  match: зовнішні підтягувальні резистори I²C тягнуть обидві лінії вгору|ведений, що притискає
