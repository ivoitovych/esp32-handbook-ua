# Прохід 30 — кошик `piny` за поділом, суцільно.
#
# 107 одиниць, у кожній є номер GPIO. Закриваються трьома шарами, і
# шари ці різні за силою — тому й записів тут кілька, а не один.
#
#   1. **Існування піна** в названому сімействі — клас B, механічно:
#      `tools/piny.py` звіряє кожне число з масками `soc_caps.h` при
#      кожному `make check`.
#   2. **Функція піна** (strapping, флеш, тільки-вхідний, ADC1/ADC2,
#      DAC, JTAG) — клас A, з проходів 12, 20, 24, 25 і 26.
#   3. **Порядок дій** із пінами (послідовність BOOT+EN, обв'язка) —
#      клас B: випливає з механізму, дослівно ніде не сформульований.
#
# Розділяти їх важливо. «GPIO34 існує в classic» і «GPIO34 не має
# підтягування» — різні твердження з різних джерел, і доказ на перше
# нічого не каже про друге. Саме змішування цих двох рівнів зовнішня
# рецензія назвала системним дефектом реєстру.




























































































































