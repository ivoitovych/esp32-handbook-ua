  notatka: 'Клас `B`, а не `A`, і межа тут проведена свідомо: маски — першоджерело, отримане
    дослівно, але **твердження книги** з них лише випливає. Доказ каже «такий пін у цьому
    сімействі існує» і не каже нічого про те, що книга про цей пін стверджує.

