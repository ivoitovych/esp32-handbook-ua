  cytata: "| GPIO0 Input | Mode |\n| Low/GND     | ROM serial bootloader for esptool |\n|\
    \ High/VCC    | Normal execution mode |\n\nGPIO2 must also be either left unconnected/floating,\
    \ or driven Low,\nin order to enter the serial bootloader.\n\n| 12 (MTDI) | If driven\
    \ High, flash voltage (VDD_SDIO) is 1.8V not\n  default 3.3V … May prevent flashing and/or\
    \ booting if 3.3V flash is\n  used … causing the flash to brownout. |\n| 15 (MTDO) | If\
    \ driven Low, silences boot messages printed by the ROM\n  bootloader. |\n\n(маска GPIO_STRAP,\
    \ esp32)\n0x01 - GPIO5   0x02 - MTDO (GPIO15)   0x04 - GPIO4\n0x08 - GPIO2   0x10 - GPIO0\
    \           0x20 - MTDI (GPIO12)\n"
