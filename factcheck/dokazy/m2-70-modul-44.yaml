- nazva: HC-SR04 видає 5 В на виводі ECHO
  zbih: HC-SR04.*5 В на виводі
  klas: B
  dzherelo: HC-SR04 Datasheet, таблиця параметрів
  cytata: 'Electric Parameter

    Working Voltage                               DC 5 V

    Echo Output Signal                            Input TTL lever signal

    '
  sposib: PDF HC-SR04 Datasheet, pdftotext -layout, 2026-08-26
  notatka: HC-SR04 живиться від 5 В (підтверджено в таблиці параметрів). Echo Output — це TTL сигнал,
    що означає логічні рівні, сумісні з 5-вольтовою системою. В контексті 5-вольтового живлення TTL вихід
    — це логічна одиниця на рівні живлення (5 В). Твердження випливає однозначно з цих параметрів.
- nazva: Подача 5 В на GPIO ESP32 пошкоджує вхід
  zbih: Пряме під.*до GPIO вбиває пін
  klas: B
  dzherelo: ESP32 Series Datasheet v5.3, Table 5-1 Absolute Maximum Ratings
  cytata: 'Table 5-1. Absolute Maximum Ratings

    Parameter: Allowed input voltage (VDDA, VDD3P3_RTC, VDD3P3_CPU)

    Min: –0.3 V

    Max: 3.6 V

    '
  sposib: PDF esp32-datasheet.pdf, pdftotext, 2026-08-26
  notatka: Абсолютний максимум входу GPIO — 3.6 В. Подача 5 В перевищує цю межу на 1.4 В, що гарантовано
    пошкодить вхідний буфер. Логічно випливає з таблиці абсолютних максимумів.
