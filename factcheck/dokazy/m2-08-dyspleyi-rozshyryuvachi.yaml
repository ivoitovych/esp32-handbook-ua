- nazva: ILI9341 — 240×320, інтерфейс SPI
  zbih: TFT ILI9341 · Інтерфейс → SPI
  klas: A
  dzherelo: ILI Technology, ILI9341 a-Si TFT LCD Single Chip Driver, 240RGBx320 Resolution
    and 262K color, Specification V1.11 — титул і розділ 7.6.2 «4-line Serial Interface»
  cytata: 'ILI9341

    a-Si TFT LCD Single Chip Driver

    240RGBx320 Resolution and 262K color


    7.6.1. 3-line Serial Interface

    7.6.2. 4-line Serial Interface

    '
  sposib: PDF ILI Technology, кеш `ili9341.pdf`, pdftotext -layout, 2026-08-26
  notatka: 'Послідовний інтерфейс у контролері справді є, у двох різновидах — трипровідний
    і чотирипровідний. Модулі, які трапляються читачеві, майже завжди чотирипровідні (з окремою
    лінією `D/C`), і саме їх книга має на увазі.

    Роздільність 240×320 підтверджено з титулу. У книзі її немає — а вона корисніша за діагональ,
    бо саме вона визначає обсяг кадрового буфера: 240×320×2 байти це 150 КБ, що більше за
    вільну DRAM classic. Тому бібліотеки малюють смугами, і читач, який спробує тримати кадр
    цілком, упреться в пам''ять.'
  title: ILI9341 — 240×320, інтерфейс SPI
