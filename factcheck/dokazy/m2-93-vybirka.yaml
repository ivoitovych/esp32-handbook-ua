- nazva: Код 0x08 в таблиці strapping пінів S3 означає GPIO0
  zbih: \|\s+`0x08`\s+\|.{0,80}\|\s+`GPIO0`\s+\|
  klas: A
  dzherelo: ESP32-S3 Technical Reference Manual — таблиця strapping пінів (розділ Boot Mode Selection)
