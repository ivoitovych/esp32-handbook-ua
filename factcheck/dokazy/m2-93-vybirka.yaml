- nazva: Код 0x10 означає RTCWDT_RTC_RESET (RTC watchdog скинув усе)
  zbih: \\| `0x10` \\|\\| RTCWDT_RTC_RESET \\|\\| RTC watchdog скинув усе
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/master/docs/en/api-guides/fatal-errors.rst
    — ESP-IDF, розділ «RTC Watchdog Timeout» (рядок 306)
  cytata: 'rst:0x10 (RTCWDT_RTC_RESET)


    The RTC watchdog is used in the startup code to keep track of

    execution time and it also helps to prevent a lock-up caused by an

    unstable power source. It is enabled by default. If the execution

    time is exceeded, the RTC watchdog will restart the system.

    '
  sposib: curl із esp-idf github, grep за текстом, 2026-08-27
  notatka: 'Код 0x10 у повідомленні `rst:` означає RTC watchdog reset, що

    скинув систему. Твердження повністю підтвердить джерелом. Це

    стандартний код reset-причин у ESP-IDF.

    '
