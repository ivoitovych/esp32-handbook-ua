- nazva: Трансивер CAN повинен відповідати логіці 3.3 В, або потрібен конвертер рівнів на RX
  zbih: або трансивер\s+на\s+3\.3\s+В,\s+або\s+конвертер\s+рівнів.*RX
  klas: A
  dzherelo: 'Специфікації трансиверів CAN: SN65HVD230 (3.3В), TJA1050 (5В), MCP2551 (5В) та рекомендації
    щодо логіки сумісності з ESP32'
  cytata: 'Трансивер має відповідати логіці **3.3 В**. SN65HVD230 живиться від

    3.3 В і підходить прямо. TJA1050 і MCP2551 розраховані на 5 В: їхній

    вихід `RX` може подавати 5 В на пін ESP32 і спалити його.


    Готові модулі на 5-вольтових трансиверах продаються масово й

    підписуються «для ESP32». Перевіряти треба самому: або трансивер на

    3.3 В, або конвертер рівнів на лінії `RX`.

    '
  sposib: Дослідження специфікацій трансиверів та рекомендацій практики
  notatka: 'Твердження описує критичне правило для роботи з CAN модулями:

    трансивер мусить бути на 3.3 В (як SN65HVD230) або потребувати

    конвертера рівнів на лінії RX. 5-вольтові трансивери (TJA1050,

    MCP2551) можуть спалити пін ESP32 своїм виходом 5В. Це важливо,

    оскільки готові модулі часто містять 5В трансивери і неправильно

    підписуються як «сумісні з ESP32».

    '
- nazva: Код 0x04 в таблиці strapping пінів C3 означає GPIO8
  zbih: \|\s+`0x04`\s+\|.{0,80}\|\s+`GPIO8`\s+\|
  klas: A
  dzherelo: ESP32-C3 Technical Reference Manual — таблиця strapping пінів (розділ Boot Mode Selection)
  cytata: '| Біт | [[classic]] | [[S3]] | [[C3]] |

    |---|---|---|---|

    | `0x04` | — | `GPIO46` | `GPIO8` |


    Читається так само: біт виставлений — пін був високим.

    '
  sposib: Таблиця з d-panik.md, посилання на Technical Reference Manual
  notatka: 'У таблиці strapping пінів для різних чипів вказано, що для C3

    біт 0x04 відповідає GPIO8 (на S3 це GPIO46, а на classic цей біт

    не використовується). Це критично для розуміння того, як чип

    вибирає режим завантаження на основі рівнів пінів.

    '
