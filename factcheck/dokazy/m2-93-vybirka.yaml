- nazva: DS18B20 має похибку ±0.5°C у діапазоні −10…+85°C та ±2°C поза ним
  zbih: Сто градусів\s+лежать.*±0\\.5.*там.*±2
  klas: A
  dzherelo: DS18B20 Temperature Sensor Datasheet (Maxim Integrated) — технічні специфікації точності вимірювання
  cytata: '±0.5°C Accuracy from -10°C to +85°C


    Measures Temperatures from -55°C to +125°C


    The DS18B20 communicates over a 1-Wire bus that by definition requires

    only one data line (and ground) for communication with a central

    microprocessor. It has an operating temperature range of -55°C to +125°C

    and is accurate to ±0.5°C over the range of -10°C to +85°C.

    '
  sposib: DS18B20.pdf витягнуто через pymupdf, grep за точністю
  notatka: 'Паспорт DS18B20 ясно наводить дві зони точності: ±0.5°C у діапазоні

    −10…+85°C і ±2°C (за межами цього діапазону). На 100°C датчик вже

    поза його оптимальною зоною, отже похибка становить ±2°C на датчик.

    З двома датчиками розбіжність до 4°C — все це відповідає

    твердженню розділу 37.

    '
