# Прохід 1 — тверде ядро.
#
# Твердження, у яких помилка коштує плати, і для яких першоджерело
# ДІСТАЄТЬСЯ з цього середовища: дерево ESP-IDF на raw.githubusercontent.
# Тому переважна частина проходу — клас A: витяг отримано й процитовано.
#
# Формат опису — factcheck/SCHEMA.md. Прив'язка: `sha` (точний хеш тексту)
# або `zbih` (взірець на всі входження твердження в книзі).
#
# Правило, яке тут дотримано без винятків: у полі `cytata` стоїть лише те,
# що справді витягнуто в цій сесії командою, зазначеною в `sposib`.

- nazva: Адреса другого бутлоадера задається ROM і має три значення
  zbih: 'бутлоадер.{0,40}(лежить за адресою|іде не на)|BOOTLOADER_OFFSET_IN_FLASH|«що новіше, то ближче до нуля»'
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/bootloader/Kconfig.projbuild
  cytata: |
    config BOOTLOADER_OFFSET_IN_FLASH
        hex
        default 0x1000 if IDF_TARGET_ESP32 || IDF_TARGET_ESP32S2
        # the first 2 sectors are reserved for the key manager with AES-XTS (flash encryption) purpose
        default 0x2000 if IDF_TARGET_ESP32P4 || IDF_TARGET_ESP32C5 || IDF_TARGET_ESP32H4
        default 0x0
        help
            Offset address that 2nd bootloader will be flashed to.
            The value is determined by the ROM bootloader.
            It's not configurable in ESP-IDF.
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: >-
    Знахідка проходу. Перша редакція давала двовипадкове правило
    «classic і S2 → 0x1000, S3, C3 і новіші → 0x0». Третій випадок
    (P4, C5, H4 → 0x2000) робив формулювання «і новіші» хибним, причому
    саме для тих чипів, які найновіші. Виправлено в розділах 16, 17, 21,
    29, картках К5 і К10, додатку C. Довідка Kconfig дала й формулювання
    для правила: значення визначає ROM, воно не налаштовується.

- nazva: Таблиця розділів лежить на 0x8000, застосунок на 0x10000
  zbih: 'таблиц\w+ розділів.{0,60}`0x8000`|`0x8000`.{0,40}однакова на всіх'
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/docs/en/api-guides/partition-tables.rst
  cytata: |
    For this reason a partition table is flashed to
    (:ref:`default offset <CONFIG_PARTITION_TABLE_OFFSET>`) 0x8000 in the flash.
    …
    In both cases the factory app is flashed at offset 0x10000.
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: >-
    Вихідний .rst документації ESP-IDF — те, з чого зроблено
    docs.espressif.com, який із цього середовища не дістається.

- nazva: Коди причин скидання (RESET_REASON)
  zbih: 'RTCWDT_BROWN_OUT_RESET|POWERON_RESET|TG0WDT_SYS_RESET|SW_CPU_RESET'
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/esp_rom/esp32/include/esp32/rom/rtc.h
  cytata: |
    typedef enum {
        NO_MEAN                =  0,
        POWERON_RESET          =  1,    /**<1, Vbat power on reset*/
        SW_RESET               =  3,    /**<3, Software reset digital core*/
        OWDT_RESET             =  4,    /**<4, Legacy watch dog reset digital core*/
        DEEPSLEEP_RESET        =  5,    /**<3, Deep Sleep reset digital core*/
        SDIO_RESET             =  6,    /**<6, Reset by SLC module, reset digital core*/
        TG0WDT_SYS_RESET       =  7,    /**<7, Timer Group0 Watch dog reset digital core*/
        TG1WDT_SYS_RESET       =  8,    /**<8, Timer Group1 Watch dog reset digital core*/
        RTCWDT_SYS_RESET       =  9,    /**<9, RTC Watch dog Reset digital core*/
        INTRUSION_RESET        = 10,    /**<10, Instrusion tested to reset CPU*/
        TGWDT_CPU_RESET        = 11,    /**<11, Time Group reset CPU*/
        SW_CPU_RESET           = 12,    /**<12, Software reset CPU*/
        RTCWDT_CPU_RESET       = 13,    /**<13, RTC Watch dog Reset CPU*/
        EXT_CPU_RESET          = 14,    /**<14, for APP CPU, reset by PRO CPU*/
        RTCWDT_BROWN_OUT_RESET = 15,    /**<15, Reset when the vdd voltage is not stable*/
        RTCWDT_RTC_RESET       = 16     /**<16, RTC Watch dog reset digital core and rtc module*/
    } RESET_REASON;
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: >-
    Покриває всю таблицю додатка D і всі згадки rst: у розділах 16, 20,
    26, 29 та картці К6. Шістнадцять рядків книги проти шістнадцяти
    рядків enum — розбіжностей немає. Зокрема 0xf = 15 =
    RTCWDT_BROWN_OUT_RESET, «Reset when the vdd voltage is not stable»,
    що дослівно підтверджує головну тезу книги про rst:0xf.

- nazva: Кількість блоків периферії за сімействами
  zbih: 'Кількості звірені з заголовками можливостей самого ESP-IDF'
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/soc/<ціль>/include/soc/soc_caps.h
  cytata: |
    esp32     SOC_UART_NUM (3)   SOC_I2C_NUM (2U)  SOC_SPI_PERIPH_NUM 3  SOC_I2S_NUM (2U)  SOC_TWAI_CONTROLLER_NUM 1U  SOC_DAC_CHAN_NUM 2
    esp32s2   SOC_UART_NUM (2)   SOC_I2C_NUM (2U)  SOC_SPI_PERIPH_NUM 3  SOC_I2S_NUM (1U)  SOC_TWAI_CONTROLLER_NUM 1U  SOC_DAC_CHAN_NUM 2
    esp32s3   SOC_UART_NUM (3)   SOC_I2C_NUM (2U)  SOC_SPI_PERIPH_NUM 3  SOC_I2S_NUM (2U)  SOC_TWAI_CONTROLLER_NUM 1U
    esp32c3   SOC_UART_NUM (2)   SOC_I2C_NUM (1U)  SOC_SPI_PERIPH_NUM 2  SOC_I2S_NUM (1U)  SOC_TWAI_CONTROLLER_NUM 1U
    esp32c6   SOC_UART_NUM (3)   SOC_I2C_NUM (2U)  SOC_SPI_PERIPH_NUM 2  SOC_I2S_NUM (1U)  SOC_TWAI_CONTROLLER_NUM 2
    esp32h2   SOC_UART_NUM (2)   SOC_I2C_NUM (2U)  SOC_SPI_PERIPH_NUM 2  SOC_I2S_NUM (1U)  SOC_TWAI_CONTROLLER_NUM 1U
  sposib: curl raw.githubusercontent для шести цілей, 2026-08-26
  notatka: >-
    Знахідка проходу. Усі рядки таблиці розділу 04 збіглися, крім I²C для
    C6: книга давала 1, soc_caps дає 2. Розбір показав, що обидва
    по-своєму праві — і що правильна відповідь корисніша за обидві.

- nazva: C6 має два I²C, другий низькоспоживчий
  zbih: 'низькоспоживчий.{0,200}LP-домені|1 \+ 1 LP'
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/soc/esp32c6/include/soc/soc_caps.h
  cytata: |
    #define SOC_I2C_NUM                 (2U) // I2C_NUM = HP_I2C + LP_I2C
    #define SOC_HP_I2C_NUM              (1U)
    #define SOC_LP_I2C_NUM              (1U)
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: >-
    Коментар у самому заголовку пояснює розбіжність: підсумкове число
    складається з високо- і низькоспоживчого контролерів. Для C6 — чипа,
    який беруть саме заради низького споживання, — це не подробиця, а
    можливість опитувати датчик, поки основна система спить. Таблицю
    розділу 04 виправлено на «1 + 1 LP» з поясненням.

- nazva: Придатних каналів Touch на S2 і S3 — чотирнадцять, а не п'ятнадцять
  zbih: 'нульовий канал зайнятий внутрішнім каналом|Touch.{0,80}чотирнадцять'
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/soc/esp32s3/include/soc/soc_caps.h
  cytata: |
    #define SOC_TOUCH_SENSOR_NUM                        (15) /*!< 15 Touch channels */
    #define SOC_TOUCH_MIN_CHAN_ID                       (1U)  /*!< Touch minimum channel number, (0 is internal denoise channel) */
    #define SOC_TOUCH_MAX_CHAN_ID                       (14) /*!< Touch maximum channel number */
  sposib: curl raw.githubusercontent (esp32s2 і esp32s3), 2026-08-26
  notatka: >-
    Канали 1…14 — саме чотирнадцять. Число 14 у книзі було правильним із
    попередньої сесії, але без причини; тепер причина процитована
    дослівно. Для classic ті самі константи дають 0…9, тобто десять.

- nazva: Термін підтримки ESP-IDF — 30 місяців, із них 12 Service
  zbih: '30 місяців|LTS в ESP-IDF|Service-періоді|Maintenance бекпортують'
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/master/SUPPORT_POLICY.md
  cytata: |
    Each ESP-IDF major and minor release (V4.1, V4.2, etc) is supported for
    30 months after the initial stable release date.
    …
    | Period      | Duration     | Recommended for new projects?         |
    | Service     | 12 months    | Yes                                   |
    | Maintenance | 18 months    | No                                    |
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: >-
    Підтверджує і термін, і відсутність окремого статусу LTS: політика
    однакова для всіх major і minor релізів.

