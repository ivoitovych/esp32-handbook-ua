    -Og, тобто типове значення, а не -O0.

- nazva: Апаратні піни IOMUX для UART0 і SPI
  zbih: 'uart_pins\.h|spi_pins\.h|Апаратні піни \(IOMUX\)'
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/soc/<ціль>/include/soc/{uart_pins,spi_pins}.h
  cytata: |
    esp32/uart_pins.h    U0RXD_GPIO_NUM 3    U0TXD_GPIO_NUM 1
    esp32s3/uart_pins.h  U0RXD_GPIO_NUM 44   U0TXD_GPIO_NUM 43
    esp32c3/uart_pins.h  U0RXD_GPIO_NUM 20   U0TXD_GPIO_NUM 21
    esp32/spi_pins.h     SPI2 (HSPI) MOSI 13 MISO 12 CLK 14 CS 15;  SPI3 (VSPI) MOSI 23 MISO 19 CLK 18 CS 5
    esp32s3/spi_pins.h   SPI2 MOSI 11 MISO 13 CLK 12 CS 10
    esp32c3/spi_pins.h   SPI2 MOSI 7  MISO 2  CLK 6  CS 10
  sposib: curl raw.githubusercontent для трьох цілей, 2026-08-26
  notatka: >-
    Покриває таблицю апаратних пінів у додатку A. Помилку в пінах SPI
    для C3 (було 6/2/4/7) виправлено за цим джерелом ще на етапі
    написання; тут зафіксовано доказ.

- nazva: Типові піни I²C і бортового світлодіода в Arduino
  zbih: 'pins_arduino\.h|типові для Arduino `SDA`|PIN_RGB_LED|DevKit\w*[^.]{0,40}`GPIO\d+`'
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/arduino-esp32/master/variants/{esp32,esp32s3,esp32c3}/pins_arduino.h
  cytata: |
    variants/esp32/pins_arduino.h     static const uint8_t SDA = 21;  static const uint8_t SCL = 22;
    variants/esp32s3/pins_arduino.h   static const uint8_t SDA = 8;   static const uint8_t SCL = 9;   #define PIN_RGB_LED 48
    variants/esp32c3/pins_arduino.h   static const uint8_t SDA = 8;   static const uint8_t SCL = 9;   #define PIN_RGB_LED 8
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: >-
    Джерело правки додатка A в сесії рецензування 06: для C3 стояло 5/6,
    таких значень немає в жодному варіанті. Те саме джерело підтверджує
    номери бортових світлодіодів, ужиті в розділі 33.
