- nazva: Режими SPI — CPHA задає номер фронту, не напрямок
  zbih: по \*\*першому\*\* фронту|по \*\*другому\*\*|котрому за ліком|режими 0 і 3 читають
    по\s*одному й тому самому фронту|режими 1 і 2|починати треба з пари 0 і 3|0 або 3
  klas: A
  dzherelo: https://raw.githubusercontent.com/adafruit/Adafruit-ST7735-Library/master/Adafruit_ST7789.h
    та .../Adafruit_ST7789.cpp, https://raw.githubusercontent.com/jgromes/RadioLib/master/src/BuildOpt.h
  cytata: "(Adafruit_ST7789.h)\nvoid init(uint16_t width, uint16_t height, uint8_t spiMode\
    \ = SPI_MODE0);\n\n(Adafruit_ST7789.cpp)\n@param  mode   SPI data mode; one of SPI_MODE0,\
    \ SPI_MODE1, SPI_MODE2\n               or SPI_MODE3 (do NOT pass the numbers 0,1,2 or\
    \ 3 …)\n\n(RadioLib BuildOpt.h)\n#define RADIOLIB_DEFAULT_SPI_SETTINGS  SPISettings(2000000,\
    \ MSBFIRST, SPI_MODE0)\n"
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Виправлення, і воно про однозначність формулювання, а не про число.

    Таблиця режимів у розділі 36 описувала режими 2 і 3 як «читання по передньому фронту»
    і «по задньому». «Передній фронт» у побутовому читанні — наростаючий, і при такому читанні
    рядки 2 і 3 виявляються переставленими: насправді режим 2 читає по спадному, а режим 3
    — по наростаючому.

    Правильне пояснення інше: `CPHA` каже, по **котрому за ліком** фронту читаються дані,
    а напрямок виходить із поєднання з `CPOL`. Таблицю перероблено на п''ять стовпців, де
    номер фронту й напрямок стоять окремо.

    З цього вийшло доповнення, яке економить час у полі: **режими 0 і 3 читають по одному
    й тому самому фронту**, наростаючому, і відрізняються лише рівнем тактування в спокої.
    Тому перебирати варто не всі чотири, а спершу пару 0 і 3, потім 1 і 2.

    Це ж пояснює розбіжність, знайдену в додатку E: книга давала ST7789 режим 3, а бібліотека
    Adafruit за замовчуванням ставить `SPI_MODE0` і пропонує третій як опцію. Обидва працюють
    — і тепер у таблиці стоїть «0 або 3» із поясненням, чому це не невизначеність.

    RadioLib для SX1276 і SX1262 підтверджує режим 0 дослівно (`RADIOLIB_DEFAULT_SPI_SETTINGS`),
    тобто рядки LoRa в додатку E точні.'
  title: Режими SPI — CPHA задає номер фронту, не напрямок
  match: по \*\*першому\*\* фронту|по \*\*другому\*\*|котрому за ліком|режими 0 і 3 читають
