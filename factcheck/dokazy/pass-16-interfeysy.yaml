  status: verbatim
  source: https://raw.githubusercontent.com/adafruit/Adafruit-ST7735-Library/master/Adafruit_ST7789.h
    та .../Adafruit_ST7789.cpp, https://raw.githubusercontent.com/jgromes/RadioLib/master/src/BuildOpt.h
  quote: "(Adafruit_ST7789.h)\nvoid init(uint16_t width, uint16_t height, uint8_t spiMode\
    \ = SPI_MODE0);\n\n(Adafruit_ST7789.cpp)\n@param  mode   SPI data mode; one of SPI_MODE0,\
    \ SPI_MODE1, SPI_MODE2\n               or SPI_MODE3 (do NOT pass the numbers 0,1,2 or\
    \ 3 …)\n\n(RadioLib BuildOpt.h)\n#define RADIOLIB_DEFAULT_SPI_SETTINGS  SPISettings(2000000,\
    \ MSBFIRST, SPI_MODE0)\n"
  method: curl raw.githubusercontent, 2026-08-26
  note: 'Виправлення, і воно про однозначність формулювання, а не про число.

