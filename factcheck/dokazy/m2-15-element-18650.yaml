- nazva: Заряджання 18650 нижче 0 °C — Panasonic NCR18650B і LG MJ1
  zbih: \*\*Не заряджати нижче 0 °C\.\*\*
  klas: A
  dzherelo: Panasonic NCR18650B, датшит SANYO/Panasonic — розділ «Specifications», рядок «Temperature»;
    LG INR18650MJ1, специфікація LG Chem — розділ «Precautions», рядок «Battery must be charged
    at operating temperature range»
  cytata: "[NCR18650B]\nTemperature   Charge*: 0 to +45°C\n              Discharge: -20 to\
    \ +60°C\n              Storage: -20 to +50°C\n* At temperatures below 10°C, charge at\
    \ a 0.25C rate.\n\n[INR18650MJ1]\nBattery must be charged at operating temperature range\
    \ 0 ~ 45℃.\nBattery must be discharged at operating temperature range -20 ~ 60℃.\n"
  sposib: PDF Panasonic/SANYO, кеш `ncr18650b.pdf` (batteryspace.com), і PDF LG Chem, кеш
    `lgmj1.pdf` (enerpower.de), pdftotext -layout, 2026-08-26
  notatka: 'Клас `A`: нижня межа заряджання «0 °C» — дослівна цифра з двох незалежних виробників,
    а не округлення. NCR18650B додає нюанс, якого немає в книзі: нижче +10 °C заряджати треба
    зменшеним струмом (0.25C), а не просто «можна/не можна» по один бік нуля.

    **Одне джерело суперечить:** LG INR18650HG2 (кеш `lghg2.pdf`, той самий каталог batteryspace.com)
    у розділі «Precautions» дає інше число: `Battery must be charged at operating temperature
    range -5 ~ 50℃`. За специфікацією виробника цей конкретний елемент можна заряджати аж
    до −5 °C. Це не робить правило книги небезпечним — «0 °C» лишається консервативнішим і
    безпечним порогом для будь-якого з трьох елементів, — але означає, що «0 °C» не універсальна
    фізична межа літію, а безпечний спільний знаменник, підтверджений двома джерелами з трьох.'
  title: Заряджання 18650 нижче 0 °C — Panasonic NCR18650B і LG MJ1
