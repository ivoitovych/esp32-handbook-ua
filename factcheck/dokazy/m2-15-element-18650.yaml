# М2, крок 15 — сам елемент 18650 (розділ 53), не зарядний чип.
#
# Джерела в кеші: `ncr18650b.pdf` (Panasonic/Sanyo, офіційна специфікація,
# через batteryspace.com), `samsung25r.pdf` і `samsung30q.pdf` (Samsung
# SDI, технічний вступ, через powerstream.com і bluerobotics.com),
# `vtc6.pdf` (Murata, офіційний сайт виробника, .ashx), `lghg2.pdf` і
# `lgmj1.pdf` (LG Chem, через batteryspace.com і enerpower.de). Реєстр —
# `factcheck/DZHERELA-m2.md` (рядки додам туди ж).
#
# Важливо: жоден з шести елементів не підтверджує «3.0 В розряджений» з
# T-53-003/T-53-026 дослівно — усі шість дають нижчу цифру (2.5 В або
# 2.0 В). Це не закрито тут навмисно; дивись notatka нижче й звіт
# координатору. Так само «3.7 В номінальна» з T-53-003 не збігається:
# усі шість джерел дають 3.6 В. Обидва — розбіжності, не докази.










