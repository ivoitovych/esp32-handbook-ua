- nazva: Паспортна межа розряду 18650 — 2.5 В, а не 3.0
  zbih: Паспортна межа розряду —\s+2\.5 В, а в частини елементів 2\.0 В\.
  klas: A
  dzherelo: Специфікації Samsung SDI INR18650-25R, Panasonic NCR18650B, Murata US18650VTC6
  cytata: 'Murata US18650VTC6:  Discharge: 0.2 ItA (600 mA), 2.0 V cutoff at 23deg.C

    Samsung INR18650-25R / Panasonic NCR18650B: End voltage (cut off) 2.5V

    '
  sposib: PDF виробників із дзеркал, кеш `samsung25r.pdf`, `ncr18650b.pdf`, `vtc6.pdf`, pdftotext
    -layout, 2026-08-26
  notatka: 'Стара редакція книги казала «2.5-3.0 В розряджений» і «акумулятор дає від 4.2
    до 3.0 В». Друге твердження неточне: 3.0 В — це де зупиняється **перетворювач**, а не
    елемент. Сам елемент за паспортом іде до 2.5 В, а VTC6 і HG2 — до 2.0 В.

    Різниця має практичний бік, тому переписано з поясненням, а не просто числом: між 3.0
    і 2.5 В лишається невикористаний залишок. Він невеликий за енергією, бо крива внизу крута,
    і платиться за нього ресурсом елемента — тож правильна порада не «вибирати до кінця»,
    а знати, що межа схеми й межа елемента різні.'
