# Прохід 9 — суцільна звірка командного рядка.
#
# Метод той самий, що в проході 7 для API: узято **всі** команди, які
# книга друкує в блоках коду, і звірено кожну з документацією й вихідним
# кодом інструмента, а не з пам'яттю.
#
# Прохід дав три виправлення, з них одне грубе: команда `merge-bin`,
# яку книга подає як основу серійної прошивки, у надрукованому вигляді
# не запускається взагалі.


















- nazva: merge-bin вимагає --chip; без нього команда падає
  zbih: --chip esp32 merge-bin|`--chip` тут \*\*обов.язковий\*\*|Specify the --chip argument
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esptool/master/esptool/__init__.py
    (merge_bin_cli) та .../docs/en/esptool/basic-options.rst
  cytata: "def merge_bin_cli(ctx, addr_filename, **kwargs):\n    \"\"\"Merge multiple raw\
    \ binary files into a single flashable file.\"\"\"\n    if ctx.obj[\"chip\"] == \"auto\"\
    :\n        raise FatalError(\n            f\"Specify the --chip argument (choose from\
    \ {', '.join(CHIP_LIST)}).\"\n        )\n\n(basic-options.rst)\n* Binary image generation\
    \ commands, such as elf2image or merge-bin,\n  require the chip type to be specified.\n"
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Найгрубша знахідка за дев''ять проходів, і саме тому, що стосується не рідкісного
    випадку, а головної команди розділу 21. `merge-bin` — це те, чим книга радить робити серійну
    прошивку; надрукована команда падає на першому ж запуску з `Specify the --chip argument`.

    Причина механічна: решта команд esptool працює через порт і визначає чип сама, а `merge-bin`
    складає файл офлайн — визначати нема звідки. Перевірено не за документацією, а за самим
    розбором аргументів.

    Виправлено в п''яти місцях: розділи 17 і 21, додаток C, картки К10 і К15. Заразом `--chip
    esp32` тепер стоїть в одному рядку з адресою `0x1000`, і зв''язок «цей чип — ця адреса»
    став видимим замість приміток збоку.'
