- nazva: --after watchdog-reset для чипів із native USB
  zbih: watchdog-reset|перелічується заново|USB-Serial/JTAG
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esptool/master/docs/en/esptool/advanced-options.rst
  cytata: ":not esp8266 and not esp32 and not esp32h2 and not esp32c6 and not esp32h4\n and\
    \ not esp32e22: * ``--after watchdog-reset`` hard-resets the chip by\n triggering an internal\
    \ watchdog reset. This is useful when the RTS control\n line is not available, especially\
    \ in the USB-OTG and USB-Serial/JTAG modes.\n Use this if a chip is getting stuck in download\
    \ mode when using the default\n reset method in USB-Serial/JTAG mode. Using this may cause\
    \ the port to\n re-enumerate on Linux (e.g. ``/dev/ttyACM0`` -> ``/dev/ttyACM1``).\n"
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Доповнення до переліку типових помилок розділу 17. Симптом «прошилося, а застосунок
    не стартував, чип сидить у завантажувачі» книга не розбирала, хоча на платах S3 і C3 із
    native USB він звичайний: лінії `RTS` фізично немає.

    Умова застосовності взята з самої директиви, а не вгадана: режим є на S2, S3, C3, P4,
    C5 і новіших, і його немає на classic, C6 та H2 — саме так і записано в книзі. Побічний
    ефект із перелічуванням порту теж названо, бо без нього читач вирішить, що плата зникла.'
  title: --after watchdog-reset для чипів із native USB
