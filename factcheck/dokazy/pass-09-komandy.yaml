- nazva: idf.py merge-bin бере адреси з конфігурації проєкту
  zbih: idf\.py merge-bin|merged-binary\.bin|адрес не набирати|адреси з конфігурації
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/docs/en/api-guides/tools/idf-py.rst
  cytata: "The command ``idf.py merge-bin`` will merge the bootloader, partition table,\n\
    the application itself, and other partitions (if there are any) according to\nthe project\
    \ configuration and create a single binary file\n``merged-binary.[bin|hex]`` in the build\
    \ folder, which can then be flashed later.\n\nExample usage:\n  idf.py merge-bin -o my-merged-binary.bin\
    \ -f raw\n"
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Доповнення, яке прибирає цілий клас помилок. Книга вчила лише `esptool merge-bin`
    із адресами, набраними вручну, — і сама ж на сусідній сторінці попереджає, що `0x1000`
    на S3 дає образ, який прошивається без скарг і не стартує.

    `idf.py merge-bin` цієї можливості не лишає: адреса бутлоадера, чип, режим і частота флешу
    беруться з конфігурації того самого проєкту. Правило, додане в книгу: є проєкт — `idf.py
    merge-bin`; є лише `.bin`-файли — `esptool --chip … merge-bin`.'
  title: idf.py merge-bin бере адреси з конфігурації проєкту
  match: idf\.py merge-bin|merged-binary\.bin|адрес не набирати|адреси з конфігурації
  status: verbatim
  source: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/docs/en/api-guides/tools/idf-py.rst
  quote: "The command ``idf.py merge-bin`` will merge the bootloader, partition table,\nthe\
    \ application itself, and other partitions (if there are any) according to\nthe project\
    \ configuration and create a single binary file\n``merged-binary.[bin|hex]`` in the build\
    \ folder, which can then be flashed later.\n\nExample usage:\n  idf.py merge-bin -o my-merged-binary.bin\
    \ -f raw\n"
  method: curl raw.githubusercontent, 2026-08-26
  note: 'Доповнення, яке прибирає цілий клас помилок. Книга вчила лише `esptool merge-bin`
    із адресами, набраними вручну, — і сама ж на сусідній сторінці попереджає, що `0x1000`
