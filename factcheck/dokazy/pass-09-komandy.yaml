- nazva: Решта команд esptool і idf.py, що вживає книга, існує дослівно
  zbih: read-flash 0 ALL|chip-id\s|flash-id\s|erase-region|verify-flash|app-flash|size-components|coredump-info|coredump-debug|create-component|add-dependency|reconfigure|fullclean|espefuse
    [^\n]{0,30}summary|`espefuse summary`|idf\.py menuconfig|`idf\.py menuconfig`|idf\.py
    set-target|idf\.py create-project|idf\.py size\b|idf\.py openocd|idf\.py gdb\b
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esptool/master/docs/en/esptool/{basic-commands,advanced-commands,basic-options,advanced-options}.rst
    та tools/idf_py_actions/{core_ext,serial_ext,debug_ext}.py в esp-idf release/v5.5, плюс
    idf-component-manager/idf_extensions.py
  cytata: "esptool (з переліку команд у __init__.py і документації):\n  write-flash read-flash\
    \ erase-flash erase-region read-mac flash-id\n  elf2image image-info merge-bin version\
    \ verify-flash dump-mem\n  read-mem write-mem get-security-info chip-id run …\n\nidf.py\
    \ (з ACTIONS у core_ext/serial_ext/debug_ext):\n  all(alias build) app app-flash bootloader\
    \ clean fullclean menuconfig\n  merge-bin monitor flash erase-flash partition-table reconfigure\n\
    \  set-target size size-components size-files python-clean read-otadata\n  efuse-summary\
    \ … openocd gdb coredump-info coredump-debug\n\nidf-component-manager: add-dependency\
    \ create-manifest upload-component\n  create-project-from-example\n\nПриклад із документації\
    \ дослівно:\n  esptool -p PORT -b 460800 read-flash 0 ALL flash_contents.bin\n"
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Суцільна перевірка, як у проході 7: узято всі команди, що книга друкує, а не сумнівні.
    Крім трьох виправлень вище, розбіжностей немає — включно з `read-flash 0 ALL`, яке дослівно
    збігається з прикладом документації, і `idf.py build`, що є псевдонімом до `all` (`''aliases'':
    [''build'']` у `core_ext.py`).

    Заразом підтверджено дві дрібниці, які книга стверджує в інших розділах: типова швидкість
    esptool — 115200, а 74880 названо «usual baud rate used by the ESP8266» для boot-логу.
    Друге підтверджує картку К6 з іншого боку, ніж прохід 8.'
