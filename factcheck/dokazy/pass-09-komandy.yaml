- nazva: Стиснення при передачі ввімкнене за замовчуванням
  zbih: \*\*Уже ввімкнене\*\*|стиснення ввімкнене \*\*за замовчуванням\*\*|`-u` \| вимкнути
    стиснення
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esptool/master/esptool/__init__.py
    та .../docs/en/esptool/basic-commands.rst
  cytata: "@click.option(\n    \"--compress\",\n    \"-z\",\n    is_flag=True,\n    help=\"\
    Compress data during transfer (default unless --no-stub is specified).\",\n)\n@click.option(\n\
    \    \"--no-compress\",\n    \"-u\",\n    is_flag=True,\n    help=\"Disable data compression\
    \ during transfer (default if --no-stub is specified)\",\n)\n\n(basic-commands.rst)\n\
    By default, the serial transfer data is compressed for better performance.\nThe ``-u/--no-compress``\
    \ option disables this behaviour.\n"
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Книга подавала `-z` як прапорець, що додається заради швидкості («швидше й надійніше»).
    Насправді стиснення й так увімкнене, і в звичайній команді `-z` не змінює нічого.

    Сенс він має рівно в одному випадку — разом із `--no-stub`, де стиснення типово вимкнене.
    А це саме той випадок, який книга розбирає окремо (клони, що не приймають stub), тож уточнення
    не академічне.

    Те саме стосується `--before default-reset --after hard-reset`: книга подавала їх як «керування
    скиданням», а це значення за замовчуванням. Таблицю прапорців замінено на ту, де перелічені
    значення, що справді щось міняють.'
  title: Стиснення при передачі ввімкнене за замовчуванням
  match: \*\*Уже ввімкнене\*\*|стиснення ввімкнене \*\*за замовчуванням\*\*|`-u` \| вимкнути
    стиснення
  status: verbatim
  source: https://raw.githubusercontent.com/espressif/esptool/master/esptool/__init__.py та
    .../docs/en/esptool/basic-commands.rst
  quote: "@click.option(\n    \"--compress\",\n    \"-z\",\n    is_flag=True,\n    help=\"\
    Compress data during transfer (default unless --no-stub is specified).\",\n)\n@click.option(\n\
    \    \"--no-compress\",\n    \"-u\",\n    is_flag=True,\n    help=\"Disable data compression\
    \ during transfer (default if --no-stub is specified)\",\n)\n\n(basic-commands.rst)\n\
    By default, the serial transfer data is compressed for better performance.\nThe ``-u/--no-compress``\
    \ option disables this behaviour.\n"
  method: curl raw.githubusercontent, 2026-08-26
  note: 'Книга подавала `-z` як прапорець, що додається заради швидкості («швидше й надійніше»).
    Насправді стиснення й так увімкнене, і в звичайній команді `-z` не змінює нічого.

