  zbih: 'Це базовий проєкт.*Wi-Fi.*I²C.*веб-сервер.*mDNS'
  klas: A
  dzherelo: "manual/59-proj-monitor.md, рядок 6"
  cytata: |
    Це базовий проєкт: на ньому зустрічаються Wi-Fi, I²C, веб-сервер, 
    mDNS, зберігання стану й обробка помилок.
  sposib: "дослівна цитата"

- nazva: "ESP32-S3-DevKitC-1 або classic DevKitC — одиниця в проєкті моніторингу"
  zbih: 'ESP32-S3-DevKitC-1 або classic DevKitC.*Кількість → 1'
