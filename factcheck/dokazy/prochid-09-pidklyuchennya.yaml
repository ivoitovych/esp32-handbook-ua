  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/master/docs/en/get-started/establish-serial-connection.rst
  cytata: 'Below is the list of USB to serial converter chips installed on most of the {IDF_TARGET_NAME}
    boards produced by Espressif

    '
