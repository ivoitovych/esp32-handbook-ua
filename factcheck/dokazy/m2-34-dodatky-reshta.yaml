- nazva: "T-F-012: драйвери USB-UART (CP2102, CH340, CH9102)"
  zbih: 'CP2102 / CP2102N.*Windows.*CH340 / CH341.*CH9102.*окремий.*драйвер'
  klas: E
  dzherelo: >-
    Додаток F, розділ «Драйвери», рядок 47 — це список необхідних
    драйверів, інструмент й конфігурація, а не факти про мікросхеми.
  cytata: |
    ## Драйвери

    - [ ] **CP2102 / CP2102N** (Silicon Labs) — Windows
    - [ ] **CH340 / CH341** (WCH) — Windows
    - [ ] **CH9102** — **окремий** драйвер, не той, що для CH340
    - [ ] **FT232** (FTDI) — Windows
  sposib: >-
    Прямий текст файлу `dodatky/f-oflayn.md`, рядки 47-51
  notatka: >-
    Укупи мікросхеми USB-UART мостів (CP2102, CH340, CH9102, FT232)
    згадуються, але твердження стосується драйверів для операційної
    системи, а не властивостей самих мікросхем. Для фактичних
    властивостей цих мікросхем див. `m2-07-mosty-usb-uart.yaml`.

- nazva: "T-K10-039: інтерфейси /dev/ttyUSB* і /dev/ttyACM*"
  zbih: '/dev/ttyUSB\*.*зовнішній міст.*CP2102, CH340'
  klas: E
  dzherelo: >-
    Картка К10, рядок 58 — це визначення пристроїв Linux,
    а не факти про мікросхеми.
  cytata: |
    `/dev/ttyUSB*` — зовнішній міст (CP2102, CH340).
    `/dev/ttyACM*` — native USB [[S3]] [[C3]].
  sposib: >-
    Прямий текст файлу `kartky/k10-komandy.md`, рядки 58-59
  notatka: >-
    Твердження про інтерфейси операційної системи Linux та
    відповідність пристроїв мікросхемам, але не про властивості
    самих мікросхем (кількість пінів, напруга, інтерфейс тощо).

- nazva: "manual/60-proj-loger.md: відсутні факти про мікросхеми"
  zbih: 'GPIO.*I²C.*1-Wire'
  klas: E
  dzherelo: >-
    Розділ 60 містить 6 тверджень у категорії `detali`, але всі
    вони стосуються GPIO й інтерфейсів, а не мікросхем.
  cytata: |
    (Всі 6 тверджень T-60-036 до T-60-075 стосуються розміщення GPIO
    для різних інтерфейсів, а не властивостей мікросхем)
  sposib: >-
    Огляд файлу `manual/60-proj-loger.md`
  notatka: >-
    Розділ містить картку GPIO для конкретного проєкту, але це
    практичні приклади розміщення, а не факти про мікросхеми.
    Для фактичних властивостей мікросхем див. попередні кроки М2.
