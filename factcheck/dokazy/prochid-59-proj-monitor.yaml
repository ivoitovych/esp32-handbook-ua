# Суцільний прохід — 59-proj-monitor.
#
# Посаджено `tools/prochid_posadka.py`. Сюди потрапляє лише
# те, що пережило третій шар: цитата знайшлася в названому
# документі дослівно. Заявок без такої перевірки тут немає.
#
# Взірці виведено механічно — найкоротший префікс, відмітний
# у всьому реєстрі. Це компроміс між двома законами:
# широкий взірець бреше, довгий ламається.







- nazva: 'T-59-079: Різниця виникає лише тоді, коли в старшому байті'
  zbih: Різниця\s+виникає\s+лише\s+тоді,
  klas: A
  dzherelo: https://raw.githubusercontent.com/boschsensortec/BME280_SensorAPI/master/bme280.c
  cytata: 'dig_h4_msb = (int16_t)(int8_t)reg_data[3] * 16;

    dig_h4_lsb = (int16_t)(reg_data[4] & 0x0F);

    calib_data->dig_h4 = dig_h4_msb | dig_h4_lsb;

    dig_h5_msb = (int16_t)(int8_t)reg_data[5] * 16;

    dig_h5_lsb = (int16_t)(reg_data[4] >> 4);

    calib_data->dig_h5 = dig_h5_msb | dig_h5_lsb;

    '
  sposib: 'Суцільний прохід 2026-08-27. Документ отримано в сесії, витяг звірено з ним підрядком
    машинно (`tools/prochid_zvid.py`). Клас `A` тут означає «документ отримано, цитата дослівна»,
    а **не** «супровідник прочитав і згоден»: змістовий шар лишається окремою роботою.'
  notatka: Коефіцієнти H4 і H5 вимагають знакового розширення через (int8_t), що включає 7-й
    біт (біт знаку). На екземплярах з цим бітом, встановленим у reg_data[3] або reg_data[5],
    коефіцієнти мають правильне від'ємне значення, інакше вологість неправильна при правильних
    температурі й тиску.
