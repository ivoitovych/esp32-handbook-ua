  rozrakhunok: "30 перевірок, усі збіглися. Найважливіші:\n  (3.3 − 2) / 0.007           \
    \ = 185.7 Ом      → книга: 185, беремо 220\n  5 × 20 / (10 + 20)           = 3.33 В  \
    \      → дільник HC-SR04\n  0.2 × 40 + 2 × 150           = 308 мА·с      → 308/3600 =\
    \ 0.0856 мА·год\n  2000 / 0.106                 = 18 868 год    → «понад два роки»\n \
    \ 0x6000 / 1024                = 24 КБ         → розділ nvs\n  (4×1024 − 64) / 1024  \
    \       = 3.94 МБ       → «приблизно 3.9»\n  115200 / 10                  = 11 520 Б/с\
    \    → «близько 11 КБ/с»\n  256 / 11520                  = 22.2 мс       → «частіше ніж\
    \ кожні 22»\n  65536 × 1.0 / 20             = 3277          → duty серво, 16 біт\n  65536\
    \ × 1.5 / 20             = 4915\n  65536 × 2.0 / 20             = 6554\n  3.7 / 200 000\
    \                = 18.5 мкА      → дільник вимірювання\n  4700 / 3                   \
    \  = 1567 Ом       → «близько 1.6 кОм»\n  128 − 16                     = 112         \
    \  → придатних адрес I²C\n  750 / 8                      = 93.75 мс      → DS18B20 при\
    \ 9 розрядах\n  120 / 2                      = 60 Ом         → два термінатори\n  320\
    \ × 240 × 2 / 1024         = 150 КБ        → кадровий буфер\n  320 × 240 × 2 × 8 / 40e6\
    \     = 30.7 мс       → той самий кадр по SPI\n  12 + 36 + 32 + 27            = 107 мА·с\
    \      → цикл логера\n  899 × 0.030                  = 26.97 мА·с    → фаза сну\n  96\
    \ × 107 / 3600              = 2.85 мА·год   → за добу\n  1750 / 2.85                 \
    \ = 614 діб\n  2500 × 0.7                   = 1750 мА·год\n  (0x20040000 − 0x20000000)/1024\
    \ = 256 КБ; +4+4 = 264 КБ → RP2040\n"
