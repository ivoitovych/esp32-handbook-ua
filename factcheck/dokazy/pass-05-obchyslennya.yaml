# Прохід 5 — арифметика. Клас D: зовнішнє джерело не потрібне й не буває.
#
# Прохід не дав жодного виправлення: усі тридцять обчислень збіглися.
# Це перший прохід із нульовим результатом, і саме такий результат є
# метою — але сам по собі він нічого не гарантує на майбутнє.
#
# Тому головний підсумок проходу не в цьому файлі, а в
# `tools/arytmetyka.py`: перерахунок став **постійною перевіркою** в
# `make check`. Разова звірка старіє від першої ж правки числа; перевірка
# в конвеєрі — ні.

- nazva: Арифметика книги перерахована й закріплена в make check
  zbih: >-
    ≈ 308 мА·с|0\.086 мА·год|18 000 годин|3277|4915|6554|11 КБ|22 мілісекунд|
    185 Ом|3\.33 В|1\.6 кОм|93\.75|94 мс|7\.5 с|60 Ом|150 КБ|107 мА·с|
    2\.85 мА·год|614|1750|264 КБ|24 КБ|3\.9 МБ|112
  klas: D
  dzherelo: tools/arytmetyka.py
  rozrakhunok: |
    30 перевірок, усі збіглися. Найважливіші:
      (3.3 − 2) / 0.007            = 185.7 Ом      → книга: 185, беремо 220
      5 × 20 / (10 + 20)           = 3.33 В        → дільник HC-SR04
      0.2 × 40 + 2 × 150           = 308 мА·с      → 308/3600 = 0.0856 мА·год
      2000 / 0.106                 = 18 868 год    → «понад два роки»
      0x6000 / 1024                = 24 КБ         → розділ nvs
      (4×1024 − 64) / 1024         = 3.94 МБ       → «приблизно 3.9»
      115200 / 10                  = 11 520 Б/с    → «близько 11 КБ/с»
      256 / 11520                  = 22.2 мс       → «частіше ніж кожні 22»
      65536 × 1.0 / 20             = 3277          → duty серво, 16 біт
      65536 × 1.5 / 20             = 4915
      65536 × 2.0 / 20             = 6554
      3.7 / 200 000                = 18.5 мкА      → дільник вимірювання
      4700 / 3                     = 1567 Ом       → «близько 1.6 кОм»
      128 − 16                     = 112           → придатних адрес I²C
      750 / 8                      = 93.75 мс      → DS18B20 при 9 розрядах
      120 / 2                      = 60 Ом         → два термінатори
      320 × 240 × 2 / 1024         = 150 КБ        → кадровий буфер
      320 × 240 × 2 × 8 / 40e6     = 30.7 мс       → той самий кадр по SPI
      12 + 36 + 32 + 27            = 107 мА·с      → цикл логера
      899 × 0.030                  = 26.97 мА·с    → фаза сну
      96 × 107 / 3600              = 2.85 мА·год   → за добу
      1750 / 2.85                  = 614 діб
      2500 × 0.7                   = 1750 мА·год
      (0x20040000 − 0x20000000)/1024 = 256 КБ; +4+4 = 264 КБ → RP2040
  sposib: python3 tools/arytmetyka.py, 2026-08-26
  notatka: >-
    Перевірку внесено в `make check` окремою ціллю `arytmetyka`. Це
    відповідь на те, як у книгу колись потрапили значення `duty` для
    серво від іншої роздільності: абзац із неправильним добутком
    внутрішньо несуперечливий і зовнішнього джерела не потребує, тож ні
    читання, ні звірка з першоджерелом його не ловлять. Ловить лише
    калькулятор — і тепер він запускається сам.
