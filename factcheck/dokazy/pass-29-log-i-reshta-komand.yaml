# Прохід 29 — кошики `log` і решта `komandy`, суцільно.
#
# Продовження проходу 28 тим самим важелем: майже все тут звірено раніше
# (проходи 9, 10, 17), але взірці писалися під те місце, де факт
# знайшли, — блок коду або абзац розділу. Комірки таблиці симптомів,
# пункти чеклістів і згадки в сусідніх розділах лишалися в `F`.
#
# Прохід не додає знань. Він додає **видимість** уже перевіреного, і
# саме тому дешевий: жодного нового джерела.
#
# Взірці тут ширші за звичайні, тож аудит `sketch -v` обов'язковий і
# зроблений: кожен запис перевірено на те, які саме одиниці він накрив.


















































































































































































