- nazva: Роль esptool і послідовність дій із незнайомою платою
  zbih: програма, що розмовляє з ROM-бутлоадером|це буде через `esptool`|`chip-id` і `flash-id`
    — перші дві команди|`read-flash` робиться до першої зміни|Дамп \(`read-flash`\) робиться
    \*\*до\*\*|доки чип відповідає на `chip-id`, він живий|`chip-id` не відповідає — це вже
    залізо
  klas: B
  dzherelo: https://raw.githubusercontent.com/espressif/esptool/master/docs/en/index.rst та
    .../esptool/basic-commands.rst
  cytata: 'esptool is a Python-based, open-source, platform-independent utility to

    communicate with the ROM bootloader in Espressif chips.

    '
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Клас `B`, а не `A`, і це свідомо. Дослівно з джерела випливає лише перше твердження
    — що `esptool` розмовляє з ROM-бутлоадером.

    Решта («перші дві команди для незнайомої плати», «дамп до першої зміни», «доки чип відповідає
    на `chip-id`, він живий») — **порядок дій**, який випливає з властивостей команд однозначно,
    але в жодному документі так не сформульований. Це рекомендація книги, побудована на звірених
    фактах, і чесний клас для неї — `B`.

    Записую це окремо, бо спокуса поставити `A` тут така сама, як була з JTAG-пінами в проході
    20: твердження здається загальновідомим і безсумнівним. Але «безсумнівне» і «процитоване»
    — різні класи.'
