- nazva: merge-bin — прапорці флешу і призначення формату
  zbih: '`--chip` у `merge-bin` обов.язковий|`--flash-mode`, `--flash-size` і `--flash-freq`|склеює
    їх в один образ, у якому зсуви вже всередині|формат передачі прошивки людині|Адреси всередині
    `merge-bin` мають бути ті самі|порту не має — вона складає файл офлайн'
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esptool/master/esptool/__init__.py
    (merge_bin_cli) та .../docs/en/esptool/basic-commands.rst
  cytata: "def merge_bin_cli(ctx, addr_filename, **kwargs):\n    \"\"\"Merge multiple raw\
    \ binary files into a single flashable file.\"\"\"\n    if ctx.obj[\"chip\"] == \"auto\"\
    :\n        raise FatalError(\n            f\"Specify the --chip argument (choose from\
    \ {', '.join(CHIP_LIST)}).\"\n        )\n\n(basic-commands.rst)\nThe ``merge-bin`` command\
    \ will merge multiple binary files … Any gaps\nbetween the input files are padded with\
    \ 0xFF bytes.\nOptions such as ``--flash-mode``, ``--flash-size`` and ``--flash-freq``\n\
    are used to set the corresponding values in the image header, exactly\nas they would be\
    \ when flashing.\n"
