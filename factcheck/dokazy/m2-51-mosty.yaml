- nazva: 'T-09-036: Плата з FT232 раптом перестала визначатися після оновлення драйвера —
    можлива причина підробка'
  zbih: FT232.*перестала визначатися|діяпу оновлення драйвера|справа може бути в цьому
  klas: E
  dzherelo: Практичні повідомлення користувачів, звіти про інциденти з драйвером FTDI 2014–2015
    років, форуми користувачів
  cytata: 'З manual/09-pidklyuchennya.md, рядки 53-55:

    "Сьогодні це рідше, але сам факт: якщо плата з FT232 раптом перестала

    визначатися після оновлення драйвера — справа може бути в цьому."

    '
  sposib: Текст manual/09-pidklyuchennya.md, спостереження із архіву повідомлень про FTDI
    інцидент 2014–2015 років, 2026-08-26
  notatka: 'Клас E: практична порада для діагностики, яка ґрунтується на історичних інцидентах.
    Якщо плата працювала, а після оновлення драйвера FTDI перестала визначатися — перший підозрілий
    момент — це підробка чипа. Драйвер мав функцію виявлення і блокування підробок.'
