






- nazva: 'T-09-034: FT232RL масово підробляють, клони працюють, доки їх не розпізнає офіційний
    драйвер'
  zbih: FT232RL.*підробляють|клони.*FT232|драйвер.*FTDI
  klas: E
  dzherelo: Практичні повідомлення користувачів, ринкові спостереження про наявність підробок
    FT232RL; історичні звіти про драйвер FTDI 2014–2015
  cytata: 'З manual/09-pidklyuchennya.md, рядки 51-52:

    "**FT232RL масово підробляють.** Клони працюють, поки офіційний драйвер

    їх не розпізнає. Історично драйвери FTDI вміли робити підроблені чипи

    непрацездатними."

    '
  sposib: Текст manual/09-pidklyuchennya.md, спостереження на ринку комплектуючих, 2026-08-26
  notatka: 'Клас E: ринкове спостереження, яке автори підтримують з практичного досвіду. У
    2014–2015 роках драйвер FTDI мав функцію виявлення підробок, що робило їх непрацездатними.
    Сьогодні це рідше, але факт залишається: FT232RL — популярний чип, і підробок на ринку
    немало.'
  title: 'T-09-034: FT232RL масово підробляють, клони працюють, доки їх не розпізнає офіційний
