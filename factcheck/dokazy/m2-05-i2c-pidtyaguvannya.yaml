# М2, крок 1 — підтягування I²C проти самої специфікації шини.
#
# Прохід 18 закрив номінал через рекомендацію ESP-IDF (2-5 кОм). Тут —
# рівнем нижче: чому саме такий діапазон, із формули самої специфікації
# NXP UM10204. Це закриває практичні твердження книги про 100 проти
# 400 кГц, які з рекомендації ESP-IDF не випливають.
#
# Взірці перевірено на чинному тексті М1 (база 0288701), а не на моїй.

- nazva: Чому 4.7 кОм годиться на 100 кГц і не годиться на 400 кГц
  zbih: 'Практично: 4\.7 кОм годиться для 100 кГц'
  klas: A
  dzherelo: >-
    NXP UM10204, I2C-bus specification and user manual — розділ 7.1
    «Pull-up resistor sizing», Table 10 «Characteristics of the SDA and
    SCL bus lines», примітка [4]
  cytata: |
    7.1 Pull-up resistor sizing
    The bus capacitance is the total capacitance of wire, connections and pins.
    This capacitance limits the maximum value of Rp due to the specified rise time.
    …
    T = t2 - t1 = 0.8473 × RC

    Table 10 (rise time of both SDA and SCL signals):
      tr   Standard-mode  max 1000 ns
           Fast-mode      max  300 ns
           Fast-mode Plus max  120 ns

    [4] In order to drive full bus load at 400 kHz, 6 mA IOL is required at 0.6 V
        VOL. Parts not meeting this specification can still function, but not at
        400 kHz and 400 pF.
  sposib: >-
    PDF NXP UM10204 (62 с.) із дзеркала, кеш `~/dzherela-cache`,
    реєстр `factcheck/DZHERELA-m2.md`, pdftotext -layout, 2026-08-26
  notatka: >-
    Специфікація дає не число, а формулу: `Rp(max) = tr / (0.8473 × Cb)`.
    Підставивши межі `tr` із Table 10, отримуємо саме те, що книга
    стверджує практично:

    100 кГц (`tr` 1000 нс): при 100 пФ — до 11.8 кОм, при 200 пФ — до
    5.9 кОм. 4.7 кОм проходить із запасом.

    400 кГц (`tr` 300 нс): при 100 пФ — уже 3.5 кОм, при 200 пФ —
    1.8 кОм. 4.7 кОм **не проходить**, і саме тому книжкова порада
    «перейти на 2.2 кОм» правильна.

    «Короткі дроти» теж отримують міру: обмежує не довжина сама по собі,
    а ємність, яку вона додає. Специфікація нормує повне навантаження
    400 пФ; кожні кілька сантиметрів дроту й кожен модуль додають до
    нього свою частку.

    Нижню межу задає інший бік: примітка [4] називає 6 мА IOL для повного
    навантаження на 400 кГц, а базове припущення шини — 3 мА. При 3.3 В
    це дає `Rp(min)` близько 1.1 кОм — те саме «не менше 1 кОм», яке
    прохід 18 узяв із ESP-IDF, тільки тепер із причиною.

- nazva: Ємність шини I²C нормується, і саме вона обмежує довжину
  zbih: 'На 400 кГц\s+або на десятках сантиметрів фронт не встигає піднятися'
  klas: A
  dzherelo: >-
    NXP UM10204 — Table 10, параметр Cb; розділ 7.1
  cytata: |
    Cb   capacitive load for each bus line   -   400   pF

    [9] The maximum bus capacitance allowable may vary from this value
        depending on the actual operating voltage and frequency.
  sposib: >-
    PDF NXP UM10204 із дзеркала, кеш `~/dzherela-cache`, pdftotext -layout,
    2026-08-26
  notatka: >-
    Книга каже «на десятках сантиметрів фронт не встигає піднятися» — і
    це правда, але причина в специфікації названа інакше й точніше: межа
    не в довжині, а в **ємності** 400 пФ на лінію, до якої довжина лише
    додає. Через це та сама довжина поводиться по-різному з різною
    кількістю модулів на шині, і читач, який виміряв «у мене 30 см
    працює», не має підстав переносити це на свою наступну плату.
