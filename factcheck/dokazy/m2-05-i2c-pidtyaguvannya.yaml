- nazva: Ємність шини I²C нормується, і саме вона обмежує довжину
  zbih: На 400 кГц\s+або на десятках сантиметрів фронт не встигає піднятися
  klas: A
  dzherelo: NXP UM10204 — Table 10, параметр Cb; розділ 7.1
  cytata: "Cb   capacitive load for each bus line   -   400   pF\n\n[9] The maximum bus capacitance allowable\
    \ may vary from this value\n    depending on the actual operating voltage and frequency.\n"
  sposib: PDF NXP UM10204 із дзеркала, кеш `~/dzherela-cache`, pdftotext -layout, 2026-08-26
  notatka: 'Книга каже «на десятках сантиметрів фронт не встигає піднятися» — і це правда, але причина
    в специфікації названа інакше й точніше: межа не в довжині, а в **ємності** 400 пФ на лінію, до якої
    довжина лише додає. Через це та сама довжина поводиться по-різному з різною кількістю модулів на шині,
    і читач, який виміряв «у мене 30 см працює», не має підстав переносити це на свою наступну плату.'
  title: Ємність шини I²C нормується, і саме вона обмежує довжину
  match: На 400 кГц\s+або на десятках сантиметрів фронт не встигає піднятися
  status: verbatim
  source: NXP UM10204 — Table 10, параметр Cb; розділ 7.1
  quote: "Cb   capacitive load for each bus line   -   400   pF\n\n[9] The maximum bus capacitance allowable\
    \ may vary from this value\n    depending on the actual operating voltage and frequency.\n"
  method: PDF NXP UM10204 із дзеркала, кеш `~/dzherela-cache`, pdftotext -layout, 2026-08-26
  note: 'Книга каже «на десятках сантиметрів фронт не встигає піднятися» — і це правда, але причина в
    специфікації названа інакше й точніше: межа не в довжині, а в **ємності** 400 пФ на лінію, до якої
    довжина лише додає. Через це та сама довжина поводиться по-різному з різною кількістю модулів на шині,
    і читач, який виміряв «у мене 30 см працює», не має підстав переносити це на свою наступну плату.'
