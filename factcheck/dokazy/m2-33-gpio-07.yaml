- nazva: CD4051 — аналоговий мультиплексор, восьми каналів
  zbih: \*\*Аналоговий мультиплексор\*\* CD4051 — вісім аналогових входів
  klas: A
  dzherelo: Texas Instruments, CD405xB CMOS Single 8-Channel Analog Multiplexer or Demultiplexer With
    Logic-Level Conversion (SCHS047O), розділи «Features» і «Description»
  cytata: 'CD4051B, CD4052B, CD4053B

    CD405xB CMOS Single 8-Channel Analog Multiplexer or Demultiplexer


    Features

    • Analog and digital multiplexing and demultiplexing

    8-channel multiplexer having three binary control inputs

    • Bidirectional signal path

    ON resistance, 125Ω (typical)


    Description

    The CD405xB analog multiplexers and demultiplexers

    are digitally-controlled analog switches having low ON

    impedance and very low OFF leakage current.

    '
  sposib: PDF TI, кеш `cd4051.pdf`, реєстр `factcheck/DZHERELA-m2.md`, pdftotext -layout, 2026-08-26
  notatka: 'Вісім каналів підтверджено: CD4051 названо 8-Channel у Features та описано 8 можливостей комутації
    (Ch 0 – Ch 7). Аналоговий сигнал (analog multiplexer), а не цифровий, що критично для прикладу з ADC
    у розділі 07. Використання для мультиплексування аналогових входів на один ADC-пін прямо зазначено
    в Applications.'
  title: CD4051 — аналоговий мультиплексор, восьми каналів
