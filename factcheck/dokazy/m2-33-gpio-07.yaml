- nazva: 74HC165 — зсувний регістр, вхід
  zbih: 74HC165 на входи
  klas: A
  dzherelo: Texas Instruments, SNx4HC165 8-Bit Parallel-Load Shift Registers (SCLS116H), розділи «Features»
    і «Description»
  cytata: 'SN54HC165, SN74HC165

    SNx4HC165 8-Bit Parallel-Load Shift Registers


    Features

    • 8-bit parallel-load shift

    • Outputs Can Drive Up to 10 LSTTL Loads

    • Parallel-to-Serial Data Conversion


    Description

    The SNx4HC165 devices are 8-bit parallel-load shift

    registers that, when clocked, shift the data toward a

    serial (QH) output. Parallel-in access to each stage is

    provided by eight individual direct data (A−H) inputs

    that are enabled by a low level at the shift/load

    (SH/LD) input.

    '
  sposib: PDF TI, кеш `74hc165.pdf`, реєстр `factcheck/DZHERELA-m2.md`, pdftotext -layout, 2026-08-26
  notatka: 8 розрядів паралельного входу підтверджено. Вісім окремих ліній входу (eight individual direct
    data (A−H) inputs), що дозволяє читати сигнали на вхід через послідовний інтерфейс SPI. Можливість
    каскадування досягається послідовним виходом (serial QH output).
