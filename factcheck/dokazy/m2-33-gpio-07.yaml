- nazva: 74HC595 — зсувний регістр, вихід
  zbih: \*\*Зсувний регістр\*\* 74HC595 на виходи
  klas: A
  dzherelo: Texas Instruments, SNx4HC595 8-Bit Shift Registers With 3-State Output Registers (SCLS041J),
    розділи «Features» і «Description»
  cytata: 'SN54HC595, SN74HC595

    SNx4HC595 8-Bit Shift Registers With 3-State Output Registers


    Features

    • 8-bit serial-in, parallel-out shift

    • High-current 3-state outputs can drive up to 15 LSTTL loads


    Description

    The SNx4HC595 devices contain an 8-bit, serial-in,

    parallel-out shift register that feeds an 8-bit D-type

    storage register. The storage register has parallel 3-

    state outputs. Separate clocks are provided for both

    the shift and storage register.

    '
  sposib: PDF TI, кеш `74hc595.pdf`, реєстр `factcheck/DZHERELA-m2.md`, pdftotext -layout, 2026-08-26
  notatka: 8 розрядів підтверджено в названі і на першій сторінці документа. Видихід на паралельні лінії
    (parallel output) та можливість каскадування (serial outputs for cascading) — ключові характеристики
    для задачі розширення портів на виходи.
