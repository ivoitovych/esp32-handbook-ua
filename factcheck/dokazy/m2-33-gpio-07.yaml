  notatka: Це не факт про мікросхему, а перенаправлення читача до розділу 07, де детально розібрані всі
    ці варіанти. Окремі твердження про розширювачі (T-07-115), регістри (T-07-117) та мультиплексор (T-07-118)
    мають власні доказами.
