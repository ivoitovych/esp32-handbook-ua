- nazva: GPIO5 на classic — теж strapping, і книга це тепер каже
  zbih: '`GPIO5` на\s*\n?classic — теж strapping-пін|правило книги —\s*\n?називати strapping-піни
    там, де їх беруть'
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/docs/en/api-reference/peripherals/gpio/esp32.inc
  cytata: "* - GPIO5\n    -\n    -\n    - Strapping pin\n\nStrapping pin: GPIO0, GPIO2, GPIO5,\
    \ GPIO12 (MTDI), and GPIO15 (MTDO)\nare strapping pins.\n"
  sposib: curl raw.githubusercontent через агента пулу (шматок 5), 2026-08-26; взірець, клас
    і виправлення книги — М1
  notatka: 'Прогалина не в фактах, а в **послідовності самої книги**. Проєкт 60 позначає `GPIO2`
    на C3 знаком ⚠ і присвячує йому два абзаци виправдання — а `GPIO5` на classic, у тій самій
    таблиці, у тій самій ролі виходу, не отримує ані позначки, ані згадки. І `GPIO5` теж strapping.

