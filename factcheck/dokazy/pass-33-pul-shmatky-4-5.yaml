# Прохід 33 — шматки 4 і 5 пулу: розділ GPIO і два проєкти.
#
# Розбіжностей нуль на 40 з гаком перевірених одиниць — але два шматки
# дали **три прогалини**, і всі три знайшлися однаково: агент читав
# джерело цілком і питав «що тут є, чого немає в книзі».
#
# Це те саме, що прохід 26 назвав четвертим місцем помилок. Різниця в
# тому, що там я шукав його навмисне, а тут воно вийшло побічно, з
# суцільного читання. Отже, метод відтворюваний і не залежить від того,
# хто читає.






















