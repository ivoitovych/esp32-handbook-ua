  source: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/docs/en/api-reference/peripherals/gpio/esp32.inc
  quote: 'SPI0/1: GPIO6-11 and GPIO16-17 are usually connected to the SPI flash

    and PSRAM integrated on the module and therefore should not be used

    for other purposes.

    '
