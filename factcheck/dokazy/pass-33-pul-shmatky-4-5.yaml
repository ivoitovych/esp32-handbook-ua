- nazva: Тільки-вхідні, консоль і USB-JTAG у довіднику пінів
  zbih: '`GPIO1` \(TX\) і `GPIO3` \(RX\) — це консоль|USB-JTAG\*\* \[\[S3\]\] `GPIO19`, `GPIO20`|перенести
    вимірювання на \*\*ADC1\*\*|На C3 — `GPIO12`–`GPIO17`'
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/docs/en/api-reference/peripherals/gpio/{esp32,esp32s3,esp32c3}.inc
    та .../components/soc/esp32/include/soc/adc_channel.h
  cytata: '(esp32.inc)

    * - GPIO1 … - TXD

    * - GPIO3 … - RXD

    TXD & RXD are usually used for flashing and debugging.


    (esp32s3.inc)

    USB-JTAG: GPIO19 and GPIO20 are used by USB-JTAG by default. If they

    are reconfigured to operate as normal GPIOs, USB-JTAG functionality

    will be disabled.


    (esp32c3.inc)

    USB-JTAG: GPIO18 and GPIO19 are used by USB-JTAG by default.

    SPI0/1: GPIO12 ~ GPIO17 are usually used for SPI flash and are not

    recommended for other uses.


    (adc_channel.h, esp32)

    ADC1_CHANNEL_0_GPIO_NUM 36 … ADC1_CHANNEL_7_GPIO_NUM 35

    (тобто канали ADC1 — це GPIO 32…39)

    '
  sposib: curl raw.githubusercontent через агента пулу (шматок 4), 2026-08-26; взірець і клас
    — М1
  notatka: 'Формулювання джерела про USB-JTAG точніше за книжкове й варте того, щоб його запам''ятати:
    піни не «зайняті», а **використовуються за замовчуванням**, і переналаштування їх на звичайний
    GPIO вимикає відлагоджувач. Книга каже це саме так — «переналаштувати їх можна, але це
    вимикає покрокове налагодження».'
