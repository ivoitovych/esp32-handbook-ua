- nazva: ADC2 при Wi-Fi — драйвер розводить, а не віддає сміття
  zbih: ADC2 ділиться з Wi-Fi|повертає \*\*помилку\*\*, а не зіпсоване число|читання, яке
    перестало вдаватися|датчик просто «замовкає» на старому|перенести вимірювання на \*\*ADC1\*\*|перестає
    вдаватися\. Людина шукає
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/docs/en/api-reference/peripherals/adc_oneshot.rst
  cytata: ":esp32 or esp32s2 or esp32s3: - ADC2 is also used by Wi-Fi.\n  :cpp:func:`adc_oneshot_read`\
    \ has provided protection between the\n  Wi-Fi driver and ADC oneshot mode driver.\n:esp32c3:\
    \ - ADC2 oneshot mode is no longer supported, due to hardware\n  limitations. The results\
    \ are not stable.\n"
  sposib: curl raw.githubusercontent (перевірено М1 після зауваження агента шматка 4), 2026-08-26
  notatka: 'Книга писала: «Спроба виміряти повертає помилку **або сміття**», і далі «починає
    віддавати дурницю». Друга половина хибна: драйвер **розводить** себе з радіостеком, тобто
    повертає помилку, а не зіпсоване число.

    Різниця практична й неприємна. Читач шукав «дурні дані» — а насправді шукати треба неперевірений
    код повернення `adc_oneshot_read`. Симптом при цьому не «сміття в логу», а датчик, що
    мовчки завис на старому значенні, — і це набагато важче помітити.

    Агент помітив цю нюансу побіжно, поза власним переліком, і чесно позначив, що одиниці
    з таким ідентифікатором у роботі немає. Саме так і мала спрацювати чужа пара очей.'
