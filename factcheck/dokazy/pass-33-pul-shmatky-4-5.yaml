- nazva: На модулях із PSRAM зайняті ще GPIO16 і GPIO17
  zbih: На модулях із PSRAM до цього переліку додаються `GPIO16`|GPIO16-17 are usually connected|16
    і 17 — лише там, де на модулі є PSRAM
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/docs/en/api-reference/peripherals/gpio/esp32.inc
  cytata: 'SPI0/1: GPIO6-11 and GPIO16-17 are usually connected to the SPI flash

    and PSRAM integrated on the module and therefore should not be used

    for other purposes.

    '
  sposib: curl raw.githubusercontent через агента пулу (шматок 4), 2026-08-26; взірець, клас
    і виправлення книги — М1
  notatka: '**Прогалина, і того самого класу, що дві помилки проходу 17: «не збереться».**

    Книга давала категоричне правило «шість пінів 6–11 не існують. Ніколи, за жодних умов»
    — і джерело називає в тому самому рядку ще `GPIO16` і `GPIO17`. На модулях із PSRAM (`WROVER`
    і подібні) вони так само зайняті.

    Читач, який узяв `WROVER` за схемою, накресленою для `WROOM`, вішає щось на `GPIO16` —
    і псує доступ до PSRAM. Категоричність книги тут працювала проти неї: «шість пінів, крапка»
    звучить як вичерпний перелік і не лишає місця сумніву.

    Різницю між шісткою й парою джерело теж дає: 6–11 зайняті завжди, а 16–17 — «usually»,
    тобто лише там, де PSRAM є. Це в книгу додано, бо без цього правило стало б надто широким
    у другий бік.

    Заведено в `factcheck/SPROSTOVANE.md` із перевіркою на присутність згадки `GPIO16` поруч;
    випробувано вилученням доданого блоку — знаходиться.'
  title: На модулях із PSRAM зайняті ще GPIO16 і GPIO17
  match: На модулях із PSRAM до цього переліку додаються `GPIO16`|GPIO16-17 are usually connected|16
