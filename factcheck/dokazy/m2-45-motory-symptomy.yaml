- nazva: L298N падіння напруги при 12 В — близько 2-3 В
  zbih: подали 12 В — двигун отримав 10
  klas: D
  dzherelo: L298N datasheet — таблиця Electrical Characteristics
  cytata: 'VCEsat (Total Drop) — Typ 3.2 V (IL = 2A), Max 4.9 V

    Sink Saturation Voltage: Typ 1.2 V (IL = 2A)

    Source Saturation Voltage: Typ 1.7 V (IL = 2A)

    '
  sposib: 'Розрахунок на основі таблиці L298N: при 2А через драйвер падіння складає ~3.2 В. При 12В на
    вході: 12 - 3.2 = 8.8 В ≈ 10 В'
  notatka: 'L298N є низькоімпедансним драйвером з внутрішніми транзисторами. Падіння напруги залежить
    від струму. Книга наводить практичний приклад: при 12 В вхід і 2А навантаженні вихід близько 9-10
    В.'
  rozrakhunok: 'Максимальний вихід = 12 В (живлення) - 3.2 В (падіння при 2А) = 8.8 В

    Це відповідає описуваним в книзі ~10 В

    '
- nazva: L298N при 5 В живленні дає ~3 В на виход
  zbih: Для\s+5\-вольтового\s+живлення\s+—\s+часто\s+взагалі\s+непрацездатно:\s+після\s+падіння\s+лишається\s+3\s+В
  klas: D
  dzherelo: L298N datasheet — таблиця Electrical Characteristics
  cytata: 'VCEsat (Total Drop): Typ 3.2 V при IL = 2A

    Для 5V живлення: 5V - 2V падіння ≈ 3V

    '
  sposib: 'Розрахунок: при 5В на вході та 1-2А через двигун падіння ~2В, залишається 3В. При вищих струмах
    (2А) може бути менше.'
  notatka: 'Це практична межа для використання L298N з 5В живленням. При більших струмах или нижчих вхідних
    напругах двигун не отримує достатньої напруги для роботи. | Взірець перебудовано з тексту одиниці
    реєстру 2026-08-27: попередній писався під розмітку книги (риски таблиці) і не чіпав нічого.'
  rozrakhunok: 'При 5В вході та падінні 2В: 5 - 2 = 3В

    При падінні до 4.9В (максимум): 5 - 4.9 = 0.1В (критично)

    '
- nazva: Серво живиться від окремого джерела, земля спільна
  zbih: серво живиться від окремого джерела 5 В.*земля спільна
  klas: E
  dzherelo: Практика схемотехніки для управління серво-двигунами
  cytata: '(Типова архітектура для сервомеханізму: окремий 5В для силового каналу, GPIO для сигналу, GND
    спільна)'
  sposib: 'Це рекомендація на основі практики: серво потребує стабільного 5В і окремого повітряння від
    логіки'
  notatka: Це архітектурна рекомендація, а не факт з даташа. Клас E — практика/порада.
- nazva: Конденсатори 100 нФ на виводах двигуна для фільтрації шумів
  zbih: конденсатори 100 нФ.*на виводах двигуна
  klas: A
  dzherelo: L298N datasheet — розділ Application Information
  cytata: 'L298N: A 100nF capacitor must be connected between

    Logic Supply Voltage pins

    '
  sposib: L298N datasheet від STMicroelectronics, кеш `l298n.pdf`, розділ Connection Diagram, pdftotext
    -layout, 2026-08-26
  notatka: 100 нФ конденсаторы (нанофарад) рекомендуються для фільтрації високочастотного шуму, особливо
    важливо при комутації великих струмів.
- nazva: 'Проблема: низька напруга живлення — додати 470 мкФ конденсатор'
  zbih: 1 А\+.*470 мкФ по живленню
  klas: E
  dzherelo: Практика живлення ESP32 з недостатнім джерелом
  cytata: ESP32 потребує плавного живлення; конденсатор 470 мкФ служить як буфер для стабілізації напруги
    під час піків струму
  sposib: 'Розрахунок RC-ланцюга: 470 мкФ при типовому ESR ~0.1 Ом дає постійну часу ~47 мс, достатню
    для згладжування коливань'
  notatka: 'Практична рекомендація для вирішення проблеми, коли джерело живлення не може забезпечити стабільну
    напругу. Клас E — практика. | Переглянуто 2026-08-27 у розборі 36 надмірних E. Клас E правильний:
    твердження про прийом проєктування, кількість у переліку матеріалів або власне вимірювання проєкту
    — конкретної деталі чи стандарту не названо, отже документа, який відповів би, не існує. Число в назві
    є, але воно номінал у пораді, а не величина з паспорта.'
