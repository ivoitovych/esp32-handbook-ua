# М2, крок 19 — manual/05-elektronika.md, кошик `elektro` (22 одиниці за
# PODIL.md). Джерела тут НЕ datasheet мікросхем ESP32/DW01/TP4056, а
# базова електроніка: ESP32 Series Datasheet (уже в кеші, `esp32-
# datasheet.pdf`, Table 5-1..5-3), ESP32-WROOM-32E datasheet (кеш
# `esp32-wroom-32e.pdf`, Figure 9 Peripheral Schematics), специфікація
# I²C NXP UM10204 (кеш `i2c-um10204.pdf`, §7.1 Pull-up resistor sizing),
# і чотири нові джерела:
#   `led-red-wp7113id.pdf`   — Kingbright WP7113ID, червоний LED
#   `led-blue-wp7113qbc.pdf` — Kingbright WP7113QBC/D, синій LED
#   `irf540.pdf`             — Vishay IRF540, звичайний power MOSFET
#   `irlz44.pdf`             — Vishay IRLZ44, MOSFET логічного рівня
#
# УВАГА про ID: локальний manual/05-elektronika.md відстає від гілки М1
# на один абзац (блок `::: zhyvlennya` про 40 мА, вже виправлений у М1).
# Через це нумерація T-05-* після цього абзацу зсунута відносно
# PODIL.md (який побудований із гілки М1). Дві одиниці з переліку
# PODIL — T-05-026 і T-05-036 (обидві про сумарну межу 1200 мА) —
# фізично відсутні в локальному тексті: цей конкретний абзац тут ще
# старий. Я їх не чіпаю: локально їм нема за що зачепитися, і робити
# вигляд, що вони закриті, було б неправдою. Решту 20 одиниць я знайшов
# за ТЕКСТОМ (а не номером T-05-NNN із PODIL) у локальному реєстрі —
# нижче фігурують локальні id.

- nazva: Червоний LED — падіння близько 2 В
  zbih: 'Для типового червоного світлодіода від 3\.3 В: падіння на ньому близько 2 В, бажаний струм 5–10 мА\.'
  klas: A
  dzherelo: >-
    Kingbright WP7113ID (High Efficiency Red, GaAsP/GaP), datasheet —
    таблиця «Electro-Optical Characteristics»
  cytata: |
    Forward Voltage IF = 10mA   VF   High Efficiency Red   Typ. 1.9   Max. 2.3   V
  sposib: >-
    PDF Kingbright, кеш `led-red-wp7113id.pdf`, pdftotext -layout,
    2026-08-26
  notatka: >-
    `1.9 В` типове — це і є «близько 2 В» книги, з тим самим струмом
    випробування `IF = 10 мА`, що збігається з верхньою межею
    заявленого «5–10 мА». Нижньої межі (5 мА) датшит окремо не
    характеризує — це вже вибір автора книги, не цифра з документа.

- nazva: Резистор 220–330 Ом для червоного LED — арифметика закону Ома
  zbih: 'Резистор 220–330 Ом підходить майже завжди\.'
  klas: D
  dzherelo: >-
    Закон Ома, застосований до `T-05-019` (падіння `1.9–2.3 В`, датшит
    Kingbright WP7113ID) і живлення `3.3 В`
  cytata: |
    R = (Vсупply - Vf) / I

    При Vf = 2.0 В (типове з datasheet), Vсупply = 3.3 В:
      R = 220 Ом → I = (3.3 - 2.0) / 220 = 5.9 мА
      R = 330 Ом → I = (3.3 - 2.0) / 330 = 3.9 мА
  sposib: обчислення, 2026-08-26
  notatka: >-
    Чесна розбіжність, а не збіг один-в-один: заявлений струм у книзі —
    «5–10 мА» (T-05-019), а резистори 220–330 Ом за законом Ома дають
    3.9–5.9 мА — нижній край діапазону, не середину. Це не помилка:
    консервативніший струм означає довший ресурс LED і менший нагрів
    резистора, і «майже завжди підходить» лишається правдою (світить
    помітно на будь-якому зі значень). Але хто підставить формулу
    буквально під «5–10 мА», отримає інший резистор (130–260 Ом).

- nazva: Синій/білий LED — падіння близько 3 В
  zbih: 'Синій і білий світлодіоди мають більше падіння \(близько 3 В\), тому від 3\.3 В світять слабко — це нормально\.'
  klas: B
  dzherelo: >-
    Kingbright WP7113QBC/D (Blue, InGaN), datasheet — таблиця
    «Electro-Optical Characteristics»
  cytata: |
    Forward Voltage IF = 20mA   VF   Blue   Typ. 3.3   Max. 4.0   V
  sposib: >-
    PDF Kingbright, кеш `led-blue-wp7113qbc.pdf`, pdftotext -layout,
    2026-08-26
  notatka: >-
    Клас `B`, не `A`: перша половина речення («близько 3 В») —
    дослівний збіг із `Typ. 3.3 В` (при `IF=20 мА`, іншому струмі
    випробування, ніж у червоного). Друга половина («тому... світять
    слабко») — вже висновок, а не цитата: якщо `3.3 В` живлення ледь
    вище за `Vf=3.3 В` типове (і нижче за `Max. 4.0 В` — тобто гірші
    екземпляри в розкиді виробництва можуть не запалитися взагалі),
    струм через резистор виходить малий, звідси тьмяне світіння.
    Datasheet цього логічного кроку не робить, я — так.

- nazva: Логічні рівні ESP32 — близько 0 В / близько 3.3 В
  zbih: 'Для ESP32: близько 0 В — логічний нуль, близько 3\.3 В — логічна одиниця\.'
  klas: B
  dzherelo: >-
    ESP32 Series Datasheet — Table 5-3. DC Characteristics (3.3 V, 25 °C)
  cytata: |
    VIH   High-level input voltage    0.75 × VDD  —  VDD + 0.3   V
    VIL   Low-level input voltage     –0.3  —  0.25 × VDD         V
    VOH   High-level output voltage   0.8 × VDD  —  —             V
    VOL   Low-level output voltage    —  —  0.1 × VDD             V
  sposib: >-
    PDF Espressif, кеш `esp32-datasheet.pdf` (з попереднього кроку),
    pdftotext -layout, 2026-08-26
  notatka: >-
    Клас `B`: книга каже «близько 0 В» і «близько 3.3 В» — розмовне
    спрощення. Таблиця дає не точку, а порогові зони: логічний нуль —
    усе нижче `0.25×VDD` (0.825 В при VDD=3.3 В), одиниця — усе вище
    `0.75×VDD` (2.475 В). Формально «0 В» і «3.3 В» — це не самі пороги,
    а типові усталені рівні (`VOL`, `VOH`), які книга наближує словом
    «близько». Висновок однозначний, цитата не дослівна щодо самого
    формулювання.

- nazva: Знижувати 5 В обов'язково — абсолютний максимум входу 3.6 В
  zbih: '\*\*Пристрій на 5 В → ESP32\.\*\* Потрібне зниження \*\*обов''язково\*\*\.'
  klas: B
  dzherelo: >-
    ESP32 Series Datasheet — Table 5-1. Absolute Maximum Ratings
  cytata: |
    VDDA, VDD3P3, VDD3P3_RTC, VDD3P3_CPU, VDD_SDIO
      Allowed input voltage   Min –0.3   Max 3.6   V

    Stresses above those listed in Table 5-1 Absolute Maximum Ratings
    may cause permanent damage to the device.
  sposib: >-
    PDF Espressif, кеш `esp32-datasheet.pdf`, pdftotext -layout,
    2026-08-26
  notatka: >-
    5 В перевищує `3.6 В` абсолютного максимуму — це і є причина, чому
    зниження «обов'язкове», а не просто бажане. Datasheet не пише
    прямо «5 В подавати не можна», але з абсолютного максимуму це
    випливає однозначно — звідси `B`, не `A`.

- nazva: 3.3 В — практична межа GPIO, консервативніша за паспортну 3.6 В
  zbih: '3\.3 В — межа для GPIO\. 5 В можна тільки на `VIN`\.'
  klas: B
  dzherelo: >-
    ESP32 Series Datasheet — Table 5-1 (Allowed input voltage, Max
    3.6 В) і Table 5-3 (VIH Max = VDD + 0.3 В)
  cytata: |
    Allowed input voltage: Min –0.3, Max 3.6 V
    VIH High-level input voltage: 0.75 × VDD — VDD + 0.3 V
  sposib: >-
    PDF Espressif, кеш `esp32-datasheet.pdf`, pdftotext -layout,
    2026-08-26
  notatka: >-
    Паспортна межа насправді `3.6 В` (VDD 3.3 В + 0.3 В запасу), не
    рівно `3.3 В`. Книжкове «3.3 В — межа» — свідомо консервативніше
    округлення для читача-практика: правило «не вище 3.3» ніколи не
    виведе за паспортну межу, тоді як буквальне «можна до 3.6» — це вже
    запас виробника на шум і допуск, а не робочий орієнтир. Це узгоджено
    з рештою розділу (`nezvorotne`-блок про 5 В на GPIO), не суперечність.

- nazva: I²C — внутрішнє підтягування ESP32 (45 кОм) заслабке, потрібні зовнішні резистори
  zbih: 'Зовнішнє підтягування для I²C — окрема історія: там вбудованого замало, потрібні справжні резистори 4\.7 кОм \(розділ 35\)\.'
  klas: B
  dzherelo: >-
    ESP32 Series Datasheet, Table 5-3 (RPU — Resistance of internal
    pull-up resistor, Typ. 45 кОм) і NXP UM10204 I²C-bus specification
    and user manual, §7.1 Pull-up resistor sizing
  cytata: |
    [ESP32 Table 5-3]
    RPU   Resistance of internal pull-up resistor   —   45   —   kΩ

    [UM10204 §7.1]
    The bus capacitance is the total capacitance of wire, connections
    and pins. This capacitance limits the maximum value of Rp due to
    the specified rise time.
    ...with a supply voltage of VDD = 5 V ± 10 % and VOL(max) = 0.4 V
    at 3 mA, Rp(min) = (5.5 - 0.4) / 0.003 = 1.7 kΩ.
  sposib: >-
    PDF Espressif, кеш `esp32-datasheet.pdf`, і PDF NXP, кеш
    `i2c-um10204.pdf` (з попереднього кроку), pdftotext -layout,
    2026-08-26
  notatka: >-
    Клас `B`, складене з двох джерел: внутрішнє підтягування ESP32
    типово `45 кОм` — на порядок вище за те, що допускає I²C-шина
    (за формулою UM10204 з VDD≈3.3 В і типовою ємністю шини 100–400 пФ
    вихідний `Rp` виходить одиниці кОм, не десятки), звідси «вбудованого
    замало». Число «4.7 кОм» саме по собі в UM10204 не написане — це
    практичне значення посередині діапазону, який задають формули
    специфікації, а не цитата. `[розділ 35]` — посилання книги на
    інший розділ, не перевіряю тут повторно.

- nazva: WROOM-32E — 100 нФ близько до виводів живлення в референсній схемі
  zbih: '\*\*Керамічний 100 нФ\*\* біля кожної мікросхеми, якомога ближче до її ніжок живлення\.'
  klas: B
  dzherelo: >-
    ESP32-WROOM-32E/32UE Datasheet, Espressif — Figure 9, «Peripheral
    Schematics» (типова схема застосування модуля)
  cytata: |
    9 Peripheral Schematics
    This is the typical application circuit of the module connected
    with peripheral components (for example, power supply, antenna,
    reset button, JTAG interface, and UART interface).
      VDD33 ... C1 22uF   C2 0.1uF ... EN ... 3V3
  sposib: >-
    PDF Espressif, кеш `esp32-wroom-32e.pdf` (з попереднього кроку),
    pdftotext -layout, 2026-08-26
  notatka: >-
    Клас `B`: референсна схема Espressif ставить `0.1 мкФ` (= 100 нФ)
    саме на вивід живлення `VDD33` модуля — конкретний, задокументований
    приклад тієї самої практики. Але це один приклад (живлення самого
    модуля), а не загальна вимога «біля кожної мікросхеми» на платі
    користувача — книжкове узагальнення на «кожну мікросхему» ширше за
    те, що показує це джерело.

- nazva: MOSFET логічного рівня — офіційний термін і поріг відкривання
  zbih: 'Ключове слово «логічного рівня» \(logic level\): такий відкривається від 3\.3 В\.'
  klas: A
  dzherelo: >-
    Vishay Siliconix IRLZ44, datasheet — «FEATURES» і «SPECIFICATIONS»
  cytata: |
    FEATURES
    • Logic-level gate drive                          Available
    • RDS(on) specified at VGS = 4 V and 5 V           Available

    Gate-source threshold voltage   VGS(th)   VDS = VGS, ID = 250 μA
      Min 1.0   Max 2.0   V
  sposib: >-
    PDF Vishay, кеш `irlz44.pdf`, pdftotext -layout, 2026-08-26
  notatka: >-
    «Logic-level gate drive» — дослівний термін виробника, точно той,
    що й у книзі. Поріг відкривання `VGS(th) = 1.0–2.0 В` дійсно
    гарантує повне відкривання значно нижче `3.3 В`. Нюанс: сам
    datasheet характеризує `RDS(on)` найнижче при `VGS = 4.0 В`, не
    рівно `3.3 В` — «відкривається від 3.3 В» правдиве (поріг нижче), але
    паспортних чисел `RDS(on)` саме при `3.3 В` виробник не дає.

- nazva: Звичайний MOSFET при 3.3 В — поріг близько, відкривається частково
  zbih: 'Звичайний MOSFET від 3\.3 В відкривається частково, гріється і згорає\.'
  klas: B
  dzherelo: >-
    Vishay Siliconix IRF540 (звичайний, без позначки logic-level),
    datasheet — «SPECIFICATIONS»
  cytata: |
    Gate-source threshold voltage   VGS(th)   VDS = VGS, ID = 250 μA
      Min 2.0   Max 4.0   V
    Drain-source on-state resistance   RDS(on)   VGS = 10 V   ID = 17 A
      Max 0.077   Ω
  sposib: >-
    PDF Vishay, кеш `irf540.pdf`, pdftotext -layout, 2026-08-26
  notatka: >-
    Клас `B`: поріг відкривання `2.0–4.0 В` буквально накриває `3.3 В`
    — частина серійних екземплярів за specification може взагалі не
    відкритися при цій напрузі, а ті, що відкриються, працюють у зоні,
    для якої `RDS(on)` в datasheet не нормується (єдина паспортна точка
    — `VGS=10 В`). «Гріється» — логічний наслідок роботи поза
    характеризованою зоною, а не цифра з документа: сам datasheet не
    пише «при 3.3 В грітиметься».

- nazva: Величезна кількість модулів «для Arduino» на 5 В — ринкове спостереження, не з документа
  zbih: 'величезна кількість модулів «для Arduino» працює на \*\*5 В\*\*'
  klas: E
  dzherelo: —
  cytata: —
  sposib: >-
    Немає одного документа, що це підтверджує чи спростовує — це
    узагальнення про стан ринку периферії за роками, не характеристика
    однієї мікросхеми чи стандарту.
  notatka: >-
    Схожий випадок на «Бібліотека» в m2-16: формально є цифра «5 В»,
    механічне правило дало б `F`, але по суті це редакційне
    спостереження про екосистему, а не факт, який звіряють одним
    datasheet.

- nazva: Конденсатор 470 мкФ — «найдешевше рішення найчастішої проблеми» — авторська оцінка
  zbih: 'Конденсатор 470 мкФ між `3V3` і `GND` поруч із модулем — найдешевше розв''язання найчастішої проблеми в усій книзі\.'
  klas: E
  dzherelo: —
  cytata: —
  sposib: >-
    «Найдешевше» і «найчастішої проблеми в усій книзі» — порівняльні
    судження автора про частоту симптомів у власній практиці, не
    характеристики з документа. Жоден datasheet цього не рахує.
  notatka: >-
    Сам номінал `470 мкФ` — інженерна практика (клас можна було б
    сперечатися), але саме це речення оцінює місце проблеми серед усіх
    проблем книги — це вже точно поза зовнішньою звіркою.

- nazva: «5 В на GPIO. Абсолютний лідер.» — рейтинг причин спалених плат, авторська оцінка
  zbih: '\*\*5 В на GPIO\.\*\* Абсолютний лідер\. 2\.'
  klas: E
  dzherelo: —
  cytata: —
  sposib: >-
    Ранжування «що частіше спалює плати» — узагальнення практики (форуми,
    власний досвід), не показник, який публікує виробник чи стандарт.
  notatka: >-
    На відміну від «40 мА» чи «3.6 В» — тут немає документа в принципі:
    жоден виробник не веде статистику причин виходу з ладу чужих плат.

- nazva: «100 нФ і 470 мкФ знімають більшість збоїв» — авторський підсумок, не вимірювана частка
  zbih: '100 нФ біля кожної мікросхеми і 470 мкФ біля роз''єма живлення знімають більшість «незрозумілих» збоїв\.'
  klas: E
  dzherelo: —
  cytata: —
  sposib: >-
    «Більшість» тут — частка від «незрозумілих» збоїв за практикою
    автора, без визначеного знаменника; жоден зовнішній документ такої
    статистики не веде.
  notatka: >-
    Самі номінали (100 нФ, 470 мкФ) — та сама практика, що й
    `m2-19` вище (WROOM-32E schematic для 100 нФ); але це речення —
    підсумковий висновок про частку, а не номінал сам собою.
