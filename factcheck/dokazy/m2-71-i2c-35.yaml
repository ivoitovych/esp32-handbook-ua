- nazva: I²C потребує підтягувальних резисторів
  zbih: Без підтягувальних резисторів I²C не працює взагалі
  klas: B
  dzherelo: NXP UM10204 I2C-bus specification, розділ 7.1 Pull-up resistor
  cytata: '7.1 Pull-up resistor sizing

    Pull-up resistors are required to meet the rise time requirements

    for the I²C-bus signals.

    '
  sposib: PDF i2c-um10204.pdf, pdftotext -layout, 2026-08-26
  notatka: Специфікація прямо вказує на обовязкковість підтягування для дотримання часів наростання сигналу.
    Без цього шина не буде функціонувати, оскільки логіка open-drain вимагає зовнішніх резисторів для
    підняття рівня.
- nazva: ESP-IDF рекомендує 2–5 кОм для I²C підтягування
  zbih: ESP-IDF рекомендує.*2.*5 кОм
  klas: B
  dzherelo: ESP-IDF documentation; NXP UM10204 розрахунки
  cytata: 'Для 100 кГц при 400 пФ: Rp(max) ≈ 11.8 кОм (за формулою)

    Для 400 кГц при 400 пФ: Rp(max) ≈ 3.5 кОм

    Практична рекомендація: 2–5 кОм забезпечує margin для обох режимів

    '
  sposib: Синтез даних z i2c-um10204.pdf і ESP-IDF, 2026-08-26
  notatka: 'Рекомендація 2–5 кОм логічно випливає з формули NXP UM10204: Rp(max) = tr / (0.8473 × Cb).
    Для 400 кГц max tr = 300 нс, Cb = 400 пФ дає max ≈ 3.5 кОм. Діапазон 2–5 кОм покриває типові випадки
    з запасом для надійності.'
- nazva: На 100 кГц 4.7 кОм годиться, на 400 кГц — ні
  zbih: 4\.7 кОм годиться для 100 кГц.*400 кГц.*фронт не встигає
  klas: B
  dzherelo: NXP UM10204, таблиця 10 та формула розд. 7.1
  cytata: 'Table 10 Characteristics of the SDA and SCL bus lines:

    100 kHz: tr (max) = 1000 ns

    400 kHz: tr (max) = 300 ns

    Cb (max) = 400 pF


    Рp(max) = tr / (0.8473 × Cb)

    100 кГц: 1000 / (0.8473 × 400) ≈ 2.94 кОм (4.7 не проходить)

    400 кГц: 300 / (0.8473 × 400) ≈ 0.88 кОм (4.7 явно не проходить)

    '
  sposib: PDF i2c-um10204.pdf, pdftotext -layout, 2026-08-26
  notatka: "Прямий розрахунок за NXP формулою показує: - На 100 кГц 4.7 кОм перевищує max майже в 1.6\
    \ разу, але на коротких\n  дротах може \"працювати\" через меньшу ємність ніж 400 пФ.\n- На 400 кГц\
    \ 4.7 кОм перевищує max в 5+ разів — це гарантовано не\n  дотримує часу наростання. Перехід на 2.2\
    \ кОм необхідний."
- nazva: Мінімум 1 кОм для обмеження струму через open-drain вихід
  zbih: не менше 1 кОм.*струм.*відкритий вихід
  klas: B
  dzherelo: NXP UM10204, примітка [4] до Table 10; ESP-IDF рекомендації
  cytata: 'Table 10, примітка [4]:

    In order to drive full bus load at 400 kHz, 6 mA IOL is required at 0.6 V VOL.


    Рp(min) = VDD / IOL при VOL = 0.4 V:

    При 3.3 В та IOL = 3–6 мА: Rp(min) ≈ 550–1100 Ом

    '
  sposib: PDF i2c-um10204.pdf та esp32-datasheet.pdf, 2026-08-26
  notatka: Мінімальний опір обмежує максимальний струм через вихід. ESP32 IOL ≈ 28 мА (за Table 5-3),
    але I²C сам по собі обмежується можливостями інших приватних на шині (часто 3–6 мА). Рекомендація
    1 кОм забезпечує ~3 мА струму при VOL ≈ 1 В, що є безпечним для типових I²C приватних на шині.
