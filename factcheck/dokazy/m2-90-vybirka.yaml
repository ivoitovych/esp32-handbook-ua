- nazva: Адреса bootloader.bin для S3, C3, C6, H2 — 0x0
  zbih: bootloader\.bin.*0x0
  klas: A
  dzherelo: https://github.com/espressif/esp-idf/blob/master/docs/en/api-guides/bootloader.rst — ESP-IDF,
    API Guide, Bootloader (Partition table offset calculation)
  cytata: ".. Above is calculated as:\n    0x1000 at start of flash + IDF_TARGET_MAX_BOOTLOADER_SIZE +\
    \ 0x1000 signature sector // for esp32\n    0x0 at start of flash + IDF_TARGET_MAX_BOOTLOADER_SIZE\
    \ + 0x1000 signature sector // for esp32s2, esp32s3, esp32c2, esp32c3, esp32c6, esp32c61, esp32h2,\
    \ esp32h21\n    0x2000 at start of flash + IDF_TARGET_MAX_BOOTLOADER_SIZE + 0x1000 signature sector\
    \ // for Key Manager supported targets: esp32c5, esp32h4, esp32p4\n"
  sposib: curl repo github.com/espressif/esp-idf, pdftotext текстів RST, 2026-08-27
  notatka: Таблиця в картці k05 правильно наводить адреси другого бутлоадера для різних чипів. Адреса
    0x0 для S3, C3, C6, H2 підтверджена в документації ESP-IDF. Класичні 0x1000 — для ранніх версій (classic,
    S2), 0x2000 — для нових (P4, C5, H4).
  title: Адреса bootloader.bin для S3, C3, C6, H2 — 0x0
  match: bootloader\.bin.*0x0
  status: verbatim
  source: https://github.com/espressif/esp-idf/blob/master/docs/en/api-guides/bootloader.rst — ESP-IDF,
    API Guide, Bootloader (Partition table offset calculation)
  quote: ".. Above is calculated as:\n    0x1000 at start of flash + IDF_TARGET_MAX_BOOTLOADER_SIZE +\
    \ 0x1000 signature sector // for esp32\n    0x0 at start of flash + IDF_TARGET_MAX_BOOTLOADER_SIZE\
    \ + 0x1000 signature sector // for esp32s2, esp32s3, esp32c2, esp32c3, esp32c6, esp32c61, esp32h2,\
    \ esp32h21\n    0x2000 at start of flash + IDF_TARGET_MAX_BOOTLOADER_SIZE + 0x1000 signature sector\
    \ // for Key Manager supported targets: esp32c5, esp32h4, esp32p4\n"
  method: curl repo github.com/espressif/esp-idf, pdftotext текстів RST, 2026-08-27
  note: Таблиця в картці k05 правильно наводить адреси другого бутлоадера для різних чипів. Адреса 0x0
