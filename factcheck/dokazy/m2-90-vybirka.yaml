- nazva: 'I2C: на спокої обидві лінії мають бути HIGH (3.3 В). Якщо немає — поломаний резистор підтягування.'
  zbih: '\*\*Мультиметр: 3\.3 В на обох лініях у спокої\.\*\* Немає — підтягування\.'
  klas: A
  dzherelo: https://www.nxp.com/docs/en/user-guide/UM10204.pdf — NXP Semiconductors, UM10204, I2C-bus
    specification and user manual, Rev. 7.0 (2021-10-01), Section 3.1.1 «SDA and SCL signals» (p. 3)
  cytata: 'Both SDA and SCL are bidirectional lines, connected to a positive supply

    voltage via a current-source or pull-up resistor (see Figure 3). When the

    bus is free, both lines are HIGH.

    '
  sposib: curl PDF з nxp.com, pdftotext -layout, 2026-08-27
  notatka: Це фундаментальна вимога I2C стандарту. Резистори підтягування притягують лінії до напруги
    живлення, тому при відсутності будь-яких пристроїв на шині обидві лінії мають бути HIGH. На ESP32
    це 3.3 В (VDD). Якщо вольтметр показує меше — проблема у розіменюванні або короткому замиканні. Твердження
    розділу 35 є мінемонічною схемою для поділу несправностей.
  title: 'I2C: на спокої обидві лінії мають бути HIGH (3.3 В). Якщо немає — поломаний резистор підтягування.'
  match: '\*\*Мультиметр: 3\.3 В на обох лініях у спокої\.\*\* Немає — підтягування\.'
  status: verbatim
  source: https://www.nxp.com/docs/en/user-guide/UM10204.pdf — NXP Semiconductors, UM10204, I2C-bus specification
    and user manual, Rev. 7.0 (2021-10-01), Section 3.1.1 «SDA and SCL signals» (p. 3)
  quote: 'Both SDA and SCL are bidirectional lines, connected to a positive supply

