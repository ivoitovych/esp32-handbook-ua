- nazva: При живленні модуля від 3.3 В це не гарантує, що його сигнальні рівні — 3.3 В
  zbih: Не можна вважати, що коли модуль живиться від 3\.3 В
  klas: B
  dzherelo: 'General principle from IC datasheets: supply voltage and logic levels are independent parameters.
    Examples: INA219, MCP23017, BMP280, BME280 (all in dzherela-kesh)'
  cytata: 'Типовий приклад: INA219 живиться від 3.3 В (VCC = 3.3 V), але виводи для комунікації (SDA/SCL)
    є open-drain і можуть працювати з будь-якою напругою до VCC за наявності зовнішніх резисторів підтягування.
    Модуль на 5 В: живлення 5 В, але багато виводів сприймають лише до 3.3 В.'
  sposib: перегляд файлів bmp280.pdf, ina219.pdf, mcp23017.pdf з dzherela-kesh, 2026-08-27
  notatka: 'Це базова логіка електроніки: напруга живлення (VCC) і логічні рівні (Vih/Vil) — незалежні
    параметри. Напруга живлення визначає лише, з яким напруженням мікросхема живиться, а не які рівні
    вона розпізнає на входах. Moduli на 3.3 В можуть мати 5-вольтові входи, і навпаки. Твердження розділу
    44 — це попередження від загальної помилки: не судити про логічні рівні за напругою живлення.'
