








- nazva: 'Таблиця модулів: шість модулів дають 780 Ом паралельного опору'
  zbih: шість.*модулів дають 780 Ом
  klas: D
  dzherelo: Розділ 35 «Як воно влаштоване» — розрахунок паралельного опору при кількох модулях
    з власними резисторами
  cytata: 'Багато модулів датчиків мають власні резистори на платі. Це зручно, поки

    модуль один. Три модулі зі своїми резисторами по 4.7 кОм дають сумарно

    близько 1.6 кОм.


    …


    Проблема починається далі: **шість** модулів дають 780 Ом, і це вже

    нижче за мінімум — ведені не зможуть притиснути лінію до потрібного

    низького рівня.

    '
  sposib: Текст розділу 35 manual/35-i2c.md, рядки 37-52
  notatka: 'Розрахунок паралельного опору: (4.7 кОм / 6) ≈ 0.78 кОм = 780 Ом. Це нижче мінімальної
    межі, яка обговорюється у розділі.'
