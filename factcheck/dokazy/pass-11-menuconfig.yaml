# Прохід 11 — шляхи в menuconfig.
#
# Окрема категорія, бо помилка тут коштує особливо дорого відносно свого
# розміру: читач відкриває menuconfig, шукає названий пункт, не знаходить
# і не має способу перевірити, чи пункт перейменували, чи він дивиться не
# туди. Пошук клавішею `/` допомагає лише тому, хто знає ім'я символа, а
# книга дає назви меню.
#
# Джерело — самі файли Kconfig, тобто те, з чого menuconfig і будує
# дерево. Це першоджерело в буквальному сенсі: рендер меню є похідним.




















- nazva: Дерево menuconfig — корінь і Component config
  zbih: Serial flasher config|Partition Table`|Component config` → `ESP System Settings|Component
    config` → `Core dump|Component config` → `ESP PSRAM|Три перші пункти меню
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/Kconfig та components/{esptool_py,partition_table,bootloader}/Kconfig.projbuild,
    components/{esp_system,espcoredump,esp_psram,log,bt,freertos}/Kconfig
  cytata: "(Kconfig — корінь)\nmainmenu \"Espressif IoT Development Framework Configuration\"\
    \n    menu \"Build type\"\n    menu \"Compiler options\"\n    menu \"Component config\"\
    \n\n(Kconfig.projbuild — потрапляють у корінь)\nesptool_py:        menu \"Serial flasher\
    \ config\"\npartition_table:   menu \"Partition Table\"\nbootloader:        menu \"Bootloader\
    \ config\"\n\n(Kconfig — потрапляють у Component config)\nesp_system:  menu \"ESP System\
    \ Settings\"\nespcoredump: menu \"Core dump\"\nesp_psram:   menu \"ESP PSRAM\"\nlog: \
    \        menu \"Log\"\nbt:          menu \"Bluetooth\"\nfreertos:    menu \"FreeRTOS\"\
    \n"
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Виправлення таблиці розділу 11: частина рядків називала пункт без шляху, і читач
    мусив здогадуватися, чи це корінь, чи `Component config`. Тепер шлях повний скрізь, а
    правило назване: `Kconfig.projbuild` компонента йде в корінь, звичайний `Kconfig` — у
    `Component config`.

    Практичний наслідок правила: у корені лежить те, що стосується збірки й прошивки взагалі,
    а не окремого компонента. Це пояснює, чому `Serial flasher config` не всередині `Component
    config`.'
