- nazva: Відкат вмикається в підменю Application Rollback
  zbih: Application Rollback|Enable app rollback support
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/bootloader/Kconfig.app_rollback
  cytata: "menu \"Application Rollback\"\n    config BOOTLOADER_APP_ROLLBACK_ENABLE\n    \
    \    bool \"Enable app rollback support\"\n    …\n        bool \"Enable app anti-rollback\
    \ support\"\n"
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Виправлення розділу 19: книга давала `Bootloader config` → `App rollback support`,
    пропускаючи рівень підменю. Насправді `Bootloader config` → `Application Rollback` → `Enable
    app rollback support`.

    Поруч видно `Enable app anti-rollback support` — інший механізм (заборона встановлювати
    старішу версію через eFuse), якого книга не описує й не плутає з відкатом. Розбіжності
    немає, зафіксовано на майбутнє.'
