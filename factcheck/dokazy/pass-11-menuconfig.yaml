- nazva: Рівні оптимізації компілятора
  zbih: Optimization Level|Debug without optimization \(-O0\)|Debug \(-Og\)|Optimize for size
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/Kconfig
  cytata: "menu \"Compiler options\"\n    choice COMPILER_OPTIMIZATION\n        prompt \"\
    Optimization Level\"\n        default COMPILER_OPTIMIZATION_DEBUG\n        config COMPILER_OPTIMIZATION_DEBUG\n\
    \            bool \"Debug (-Og)\"\n        config COMPILER_OPTIMIZATION_SIZE\n       \
    \     bool \"Optimize for size (-Os with GCC, -Oz with Clang)\"\n        config COMPILER_OPTIMIZATION_PERF\n\
    \            bool \"Optimize for performance (-O2)\"\n        config COMPILER_OPTIMIZATION_NONE\n\
    \            bool \"Debug without optimization (-O0)\"\n"
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Розділ 27 підтверджено дослівно, включно з твердженням, що `Debug (-Og)` — це
    і є значення за замовчуванням (`default COMPILER_OPTIMIZATION_DEBUG`).

    У таблиці розділу 11 рядок був скорочений до `Compiler options` → `-Os`, тобто пропускав
    рівень `Optimization Level`; уточнено.'
