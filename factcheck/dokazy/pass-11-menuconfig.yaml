  zbih: configCHECK_FOR_STACK_OVERFLOW|Check using canary bytes \(Method 2\)|`Bluetooth` →
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/freertos/Kconfig
    та .../components/bt/Kconfig
  cytata: "(freertos/Kconfig)\nmenu \"FreeRTOS\"\n    menu \"Kernel\"\n        choice FREERTOS_CHECK_STACKOVERFLOW\n\
    \            prompt \"configCHECK_FOR_STACK_OVERFLOW\"\n            default FREERTOS_CHECK_STACKOVERFLOW_CANARY\n\
    \                bool \"Check using canary bytes (Method 2)\"\n\n(bt/Kconfig)\nmenu \"\
    Bluetooth\"\n    choice BT_HOST\n        prompt \"Host\"\n            bool \"Bluedroid\
    \ - Dual-mode\"\n            bool \"NimBLE - BLE only\"\n            bool \"Disabled\"\
    \n"
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Без розбіжностей. Розділ 41 називає `Component config` → `Bluetooth` → `Host`,
    і саме так меню й влаштоване; назви варіантів (`Bluedroid - Dual-mode`, `NimBLE - BLE
    only`) підтверджують і те, що книга каже про призначення кожного.

    Шлях до `configCHECK_FOR_STACK_OVERFLOW` у розділі 30 теж перевірено цим проходом і теж
