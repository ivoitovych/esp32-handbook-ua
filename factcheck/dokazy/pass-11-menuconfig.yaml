- nazva: Maximum log verbosity — стеля компіляції окремо від типового рівня
  zbih: Maximum log verbosity|Same as default|мовчки не робить\s*нічого|до чого можна підняти
    в runtime|dynamic log level changes
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/log/Kconfig.level
    та .../components/log/Kconfig.level_settings
  cytata: "choice LOG_DEFAULT_LEVEL\n    bool \"Default log verbosity\"\n    help\n      \
    \  By default, this setting limits which log statements\n        are compiled into the\
    \ program. For example, selecting\n        \"Warning\" would mean that changing log level\
    \ to \"Debug\"\n        at runtime will not be possible. To allow increasing log\n   \
    \     level above the default at runtime, see the next option.\n\nchoice LOG_MAXIMUM_LEVEL\n\
    \    bool \"Maximum log verbosity\"\n    default LOG_MAXIMUM_EQUALS_DEFAULT\n    help\n\
    \        This config option sets the highest log verbosity that it's possible to select\n\
    \        at runtime by calling esp_log_level_set(). This level may be higher than\n  \
    \      the default verbosity level which is set when the app starts up.\n    config LOG_MAXIMUM_EQUALS_DEFAULT\n\
    \        bool \"Same as default\"\n\n(Kconfig.level_settings)\nconfig LOG_DYNAMIC_LEVEL_CONTROL\n\
    \    bool \"Enable dynamic log level changes at runtime\"\n    default y\n"
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Доповнення, і воно закриває реальну пастку. Книга правильно писала, що підняти
    рівень у runtime можна лише для того, що не вирізане при компіляції, — але єдиним виходом
    називала «збирати з `Debug`». Це псує головне: пристрій починає сипати логом постійно.

    `Maximum log verbosity` розводить два різні поняття: `Default` — з чим прошивка стартує,
    `Maximum` — до чого її можна підняти на ходу. Пара `Default = Info`, `Maximum = Debug`
    дає рівно те, чого хоче розділ 25: тихий пристрій, який на команду піднімає детальність
    окремої підсистеми без перезбирання.

    Важлива подробиця, теж із джерела: типове значення `Maximum` — `Same as default`, тобто
    запасу за замовчуванням немає й вмикати його треба свідомо. Саме тому пастка й трапляється.

    `esp_log_level_set` при цьому працює типово: `LOG_DYNAMIC_LEVEL_CONTROL` має `default
    y`.'
