- nazva: Меню логування зветься Log, а не Log output
  zbih: Component config` → `Log` → `Log Level|`Log` → `Log Level
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/log/Kconfig
    та .../components/log/Kconfig.level
  cytata: "(log/Kconfig)\nmenu \"Log\"\n    …\n    rsource \"./Kconfig.level\"\n\n(log/Kconfig.level)\n\
    menu \"Log Level\"\n    choice LOG_DEFAULT_LEVEL\n        bool \"Default log verbosity\"\
    \n        default LOG_DEFAULT_LEVEL_INFO\n"
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Виправлення у двох місцях (розділи 11 і 25). Меню зветься `Log`, і рівні лежать
    не в ньому безпосередньо, а в підменю `Log Level`. Назва `Log output` — від старіших версій
    ESP-IDF.

    Сам пункт `Default log verbosity` існує дослівно, і типове значення справді `Info` — це
    книга стверджувала правильно.'
