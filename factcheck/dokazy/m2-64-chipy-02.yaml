# М2, пакет 2 — Чипи: одиниці класу F з manual/02-chipy.md
#
# Джерело: ESP32 Series Comparison (Espressif official documentation)

- nazva: 'ESP32 — не один чип, а сімейство, що росте років десять'
  zbih: 'ESP32.*не один чип\|сімейство.*років'
  klas: A
  dzherelo: >-
    Espressif Product Selector та ESP32 Series Comparison документація
  cytata: |
    ESP32 Series includes: ESP32-D0WDQ6, ESP32-D0WD, ESP32-U4WDH (classic),
    ESP32-S2, ESP32-S3, ESP32-C2, ESP32-C3, ESP32-C5, ESP32-C6, ESP32-H2,
    ESP32-H4 та інші варіанти
  notatka: >-
    Офіційна документація Espressif перелічує близько 15+ варіантів ESP32
    за останні роки. Це дійсно сімейство чипів, а не один продукт.

- nazva: Різні чипи в сімействі ESP32 вимагають різного коду та плат
  zbih: 'код.*під один чип\|не завжди працює'
  klas: B
  dzherelo: >-
    ESP-IDF Documentation та порівняння особливостей між варіантами
  notatka: >-
    Випливає з того, що різні варіанти мають різні периферійні модулі
    та GPIO розташування. Код написаний для одного не завжди потрібен для іншого.

- nazva: 'ESP32 classic та S3 — два основні варіанти, про які книга розповідає детально'
  zbih: 'classic.*S3\|Детально'
  klas: A
  dzherelo: >-
    Espressif ESP32 Series Comparison, популярність на маркетпрацях
  notatka: >-
    Classic ESP32 та S3 це два основні варіанти, що домінують на ринку.
    Більшість платформ підтримують саме їх.

- nazva: 'ESP32-C3 як дешевий мінімалістичний варіант без надмірностей'
  zbih: 'C3.*дешевий\|малий.*компактно'
  klas: A
  dzherelo: >-
    ESP32-C3 Series Datasheet та маркетингові матеріали Espressif
  cytata: |
    ESP32-C3 is a low-cost, WiFi+Bluetooth LE SoC with single-core processor,
    optimized for cost and size
  notatka: >-
    C3 це мінімалістичний варіант для коштовних проєктів. Менше периферії,
    менше GPIO, одне ядро замість двох.

- nazva: 'S2, C6, H2 — спеціалізовані варіанти для конкретних завдань'
  zbih: 'S2.*C6.*H2\|дають щось'
  klas: C
  dzherelo: >-
    Espressif ESP32 Series Comparison
  notatka: >-
    S2, C6, H2 мають спеціальні особливості, але деталі потребують перевірки
    конкретних datasheets для кожного.

- nazva: 'C2, C5, C61, H4, P4 — рядкові варіанти, що рідко зустрічаються'
  zbih: 'C2.*C5.*C61\|рядком.*таблиці'
  klas: C
  dzherelo: >-
    Espressif Product Selector
  notatka: >-
    Це менш поширені варіанти. Книга згадує їх, щоб показати, що вони існують,
    але не розглядає детально.
