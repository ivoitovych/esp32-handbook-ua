# Прохід 19 — обсяги й адреси флешу: закриття черги обчисленнями.
#
# Прохід за пунктом 4 рецензії — свідоме закриття, а не «доведемо F до
# нуля». Спершу тріаж (клас E за механічним правилом), далі — найдешевша
# з решти група: числа, які перевіряються калькулятором.
#
# Вибір саме цієї групи не випадковий. Помилка в обсязі флешу дає
# **обірваний дамп**, а це найдорожча помилка розділу 20: її помічають
# після стирання, коли повертатися вже нема з чого.

- nazva: Шістнадцяткові обсяги флешу в командах read-flash
  zbih: '0x400000|0x800000|0x1000000'
  klas: D
  dzherelo: tools/arytmetyka.py — перерахунок при кожній перевірці
  cytata: |
    0x400000  / 1024 / 1024 =  4 МБ
    0x800000  / 1024 / 1024 =  8 МБ
    0x1000000 / 1024 / 1024 = 16 МБ
  sposib: make arytmetyka, 2026-08-26
  notatka: >-
    Книга друкує ці три числа в розділі 17, додатку C і на картці К2 як
    явну заміну для `ALL`. Зовнішнього джерела тут не потрібно — це
    перерахунок, і він тепер постійний: змінене число завалить `make
    arytmetyka`.

    Практична вага більша, ніж здається. `read-flash 0 0x400000` на
    восьмимегабайтному чипі дає рівно половину дампа, і файл при цьому
    цілком «правильного» вигляду. Книга тому й вимагає звіряти розмір
    файлу з обсягом флешу — тепер обидва числа перевірені.

- nazva: Службова область флешу до застосунку — 64 КБ
  zbih: 'сектор|0x8000.{0,40}0x1000|не може починатися раніше|близько 64 КБ|0xF000|службов'
  klas: D
  dzherelo: >-
    tools/arytmetyka.py; розкладка з
    components/partition_table/partitions_singleapp.csv (прохід 7)
  cytata: |
    таблиця розділів  0x8000 + 0x1000 (сектор) = 0x9000  → перший розділ
    nvs               0x9000 + 0x6000          = 0xF000
    phy_init          0xF000 + 0x1000          = 0x10000 → застосунок
    0x10000 / 1024                             = 64 КБ

    сектор 0x1000 / 1024 = 4 КБ
  sposib: make arytmetyka, 2026-08-26
  notatka: >-
    Замикає ланцюжок, який книга досі подавала трьома окремими
    твердженнями в розділах 16, 18 і 19: чому таблиця розділів займає
    цілий сектор, чому наступний розділ не може починатися раніше ніж
    `0x9000`, і звідки береться «близько 64 КБ службових».

    Тепер це один перерахунок із п'яти кроків, і кожен крок видимий.
    Розмір розділів узято з `partitions_singleapp.csv` ESP-IDF (прохід 7),
    тобто арифметика спирається на звірені числа, а не на самі себе.

    Заразом видно, що «4 МБ мінус 64 КБ службових = 3.9 МБ» із розділу 18
    — не округлення на око, а точний наслідок цієї ж розкладки.
