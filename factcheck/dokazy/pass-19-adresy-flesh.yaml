  notatka: 'Замикає ланцюжок, який книга досі подавала трьома окремими твердженнями в розділах
    16, 18 і 19: чому таблиця розділів займає цілий сектор, чому наступний розділ не може
    починатися раніше ніж `0x9000`, і звідки береться «близько 64 КБ службових».

    Тепер це один перерахунок із п''яти кроків, і кожен крок видимий. Розмір розділів узято
