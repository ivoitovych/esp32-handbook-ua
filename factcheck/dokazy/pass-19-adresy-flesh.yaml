# Прохід 19 — обсяги й адреси флешу: закриття черги обчисленнями.
#
# Прохід за пунктом 4 рецензії — свідоме закриття, а не «доведемо F до
# нуля». Спершу тріаж (клас E за механічним правилом), далі — найдешевша
# з решти група: числа, які перевіряються калькулятором.
#
# Вибір саме цієї групи не випадковий. Помилка в обсязі флешу дає
# **обірваний дамп**, а це найдорожча помилка розділу 20: її помічають
# після стирання, коли повертатися вже нема з чого.






























- nazva: Шістнадцяткові обсяги флешу в командах read-flash
  zbih: 0x400000|0x800000|0x1000000
  klas: D
  dzherelo: tools/arithmetic.py — перерахунок при кожній перевірці
  sposib: make arytmetyka, 2026-08-26
  notatka: 'Книга друкує ці три числа в розділі 17, додатку C і на картці К2 як явну заміну
    для `ALL`. Зовнішнього джерела тут не потрібно — це перерахунок, і він тепер постійний:
    змінене число завалить `make arytmetyka`.

    Практична вага більша, ніж здається. `read-flash 0 0x400000` на восьмимегабайтному чипі
    дає рівно половину дампа, і файл при цьому цілком «правильного» вигляду. Книга тому й
    вимагає звіряти розмір файлу з обсягом флешу — тепер обидва числа перевірені.'
