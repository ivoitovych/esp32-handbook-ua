- nazva: Адреса bootloader.bin для ESP32 чипів — 0x1000
  zbih: Останнє\s+тягне\s+за\s+собою\s+перерахунок\s+явних\s+зсувів\s+у\s+CSV:\s+жоден\s+розділ\s+не\s+може\s+починатися\s+раніше\s+ніж\s+нова\s+адреса|\[\[classic\]\]\s+Адреса\s+`0x1000`\s+тут\s+—\s+знову\s+classic,\s+і\s+тепер\s+вона\s+узгоджена\s+з\s+`\-\-chip\s+esp32`\s+у\s+тому\s+ж\s+рядку;\s+для\s+і|У\s+ручному\s+варіанті\s+адреса\s+бутлоадера\s+набирається\s+з\s+голови,\s+і\s+саме\s+там\s+роблять\s+помилку:\s+`0x1000`\s+на\s+S3\s+дає\s+обра|⚠\s+У\s+команді\s+вище\s+стоїть\s+`0x1000`\s+—\s+адреса\s+\*\*classic\s+і\s+S2\*\*
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esptool/master/docs/en/advanced-topics/boot-mode-selection.rst
  cytata: '{IDF_TARGET_BOOTLOADER_OFFSET:default="0x0", esp32="0x1000", esp32s2="0x1000",
    esp32p4="0x2000"}

    '
  sposib: curl esptool boot-mode-selection.rst, grep BOOTLOADER_OFFSET, 2026-08-26
  notatka: 'Таблиця розділу 16 показує адреси. Для ESP32: 0x1000. Джерело вказує: esp32="0x1000".
    | Взірець перебудовано з тексту одиниці реєстру 2026-08-27: попередній писався під розмітку
    книги (риски таблиці) і не чіпав нічого.'
