- nazva: Стабілізатор (LDO) · 3.3 В із 5 В
  zbih: Стабілізатор.*LDO
  klas: C
  dzherelo: Даташит AMS1117-3.3 (Advanced Monolithic Systems) — падіння напруги й вихід
  cytata: Робить 3.3 В із 5 В.
  sposib: не застосовується
  notatka: 'Це описова характеристика компонента на платі, а не факт про мікросхему ESP32. Клас E: редакційна
    інформація про анатомію платі. | Було E — «зовнішнього джерела не існує». Названо конкретну деталь
    чи стандарт, отже документ існує, і його просто немає в кеші. Це визначення класу C. Різниця не формальна:
    E ховає одиницю з наряду назавжди, C лишає її в наряді з полем shukaty.'
  shukaty: 'ams1117 datasheet: dropout при 800 мА, вихід 3.3 В'
