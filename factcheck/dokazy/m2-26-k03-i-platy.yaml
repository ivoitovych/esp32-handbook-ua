  klas: C
  dzherelo: FTDI datasheet для FT232 та CP2102 datasheet для CP2102
  shukaty: Інформація про функціональні параметри яких чипів так чутливі до варіацій виробництво; на скільки
    офіційний драйвер перевіряє справжність; як клони можуть виявитися непрацездатними при оновленні
  notatka: Це практична спостереження про масово перероблювані чипи на ринку. Потребує datasheet для FT232RL
