  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/master/docs/en/api-reference/peripherals/adc/index.rst
  cytata: 'By design, ``Vref`` is set to 1100 mV. However, due to manufacturing variations,
    the actual value may range between 1000 mV and 1200 mV depending on the chip

    '
  sposib: 'Суцільний прохід 2026-08-27. Документ отримано в сесії, витяг звірено з ним підрядком
