- nazva: 'T-05-079: **Open-drain** уміє лише притискати лінію до землі, а'
  zbih: \*\*Open\-drain\*\*\s+уміє\s+лише\s+притискати
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/master/docs/en/api-reference/peripherals/gpio.rst
  cytata: 'For example, the IO, which outputs a LEDC PWM signal, can also act as a GPIO input
    to generate interrupts or GPIO ETM events. Careful handling on the configuration step
    is necessary for such dual use of IO pins cases. :cpp:func:`gpio_config` is an API that
    overwrites all the current configurations, so it must be called to set the pin mode to
    :cpp:enumerator:`gpio_mode_t::GPIO_MODE_INPUT`

    '
  sposib: 'Суцільний прохід 2026-08-27. Документ отримано в сесії, витяг звірено з ним підрядком
    машинно (`tools/prochid_zvid.py`). Клас `A` тут означає «документ отримано, цитата дослівна»,
    а **не** «супровідник прочитав і згоден»: змістовий шар лишається окремою роботою.'
  notatka: documentation shows GPIO can be configured in different output modes including
    open-drain
