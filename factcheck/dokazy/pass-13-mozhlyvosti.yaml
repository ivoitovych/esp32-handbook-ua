# Прохід 13 — зведені таблиці можливостей чипів.
#
# Дві найчастіше цитовані таблиці книги: розділ 02 (ядра, пам'ять, радіо)
# і розділ 04 (кількість блоків периферії). Саме за ними обирають чип, і
# саме їх переписують у чужі статті.
#
# Джерело — `soc_caps.h`, тобто те, за чим збирається сам фреймворк:
# якщо прапорця там немає, драйвер не збереться, хоч би що казав
# datasheet.
































































