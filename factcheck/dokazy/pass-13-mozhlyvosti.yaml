- nazva: Кількість блоків периферії за сімействами
  zbih: SPI, усього|SPI, вільних|TWAI \(CAN\) \|| I²S \| 2|SOC_UART_HP_NUM|Рядок «SPI, вільних»
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/soc/{esp32,esp32s2,esp32s3,esp32c3,esp32c6,esp32h2}/include/soc/soc_caps.h
  cytata: 'прапорець                32   s2   s3   c3   c6   h2

    SOC_UART_NUM             3    2    3    2    3    2

    SOC_UART_HP_NUM          3    2    3    2    2    2

    SOC_UART_LP_NUM          —    —    —    —    1    —

    SOC_HP_I2C_NUM           2    2    2    1    1    2

    SOC_LP_I2C_NUM           —    —    —    —    1    —

    SOC_SPI_PERIPH_NUM       3    3    3    2    2    2

    SOC_I2S_NUM              2    1    2    1    1    1

    SOC_TWAI_CONTROLLER_NUM  1    1    1    1    2    1

    SOC_DAC_CHAN_NUM         2    2    —    —    —    —

    SOC_TOUCH_SENSOR_NUM    10   15   15    —    —    —

    '
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Одне виправлення на всю таблицю. Книга давала C6 три UART нарівні з classic і
    S3, тоді як для I²C того самого C6 акуратно писала «1 + 1 LP». Насправді третій UART теж
    низькоспоживчий: `SOC_UART_HP_NUM` = 2, `SOC_UART_LP_NUM` = 1.

    Виправлено на «2 + 1 LP», а пояснення про LP-домен переписано так, щоб охоплювало обидва
    блоки. Заразом названо саму пастку: у C6 `SOC_UART_NUM` і `SOC_I2C_NUM` рахують LP-екземпляри
    разом зі звичайними, і брати треба пару `HP`/`LP`.

    Решта таблиці збіглася: SPI (3/3/3/2/2/2 і «вільних» на один менше через контролер флешу),
    I²S, TWAI з двома контролерами на C6, DAC лише в classic і S2.

    Рядок Touch підтверджує вже наявне пояснення книги: у заголовку стоїть 15 для S2 і S3,
    а книга друкує 14 і прямо пише, що нульовий канал зайнятий придушенням шуму. Розбіжності
    немає — є свідома різниця між «рахує апаратура» і «придатне до використання».'
  title: Кількість блоків периферії за сімействами
