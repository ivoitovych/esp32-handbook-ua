- nazva: Обсяг SRAM у таблиці — datasheet, а не адресні вікна
  zbih: Обсяг SRAM у таблиці — це фізична пам.ять чипа|328 КБ|вікно даних — близько 480|обчислені
    з меж адресних вікон|вікно DRAM|вікна даних і інструкцій збігаються
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/soc/{esp32,esp32s2,esp32s3,esp32c3,esp32c6,esp32h2}/include/soc/soc.h
  cytata: 'esp32:   DRAM 0x3FFAE000…0x40000000 (328 КБ)  IRAM 0x40080000…0x400AA000 (168 КБ)

    esp32s2: DRAM 0x3FFB0000…0x40000000 (320 КБ)  IRAM 0x40020000…0x40070000 (320 КБ)

    esp32s3: DRAM 0x3FC88000…0x3FD00000 (480 КБ)  IRAM 0x40370000…0x403E0000 (448 КБ)

    esp32c3: DRAM 0x3FC80000…0x3FCE0000 (384 КБ)  IRAM 0x4037C000…0x403E0000 (400 КБ)

    esp32c6: DRAM = IRAM = 0x40800000…0x40880000 (512 КБ)

    esp32h2: DRAM = IRAM = 0x40800000…0x40850000 (320 КБ)

    '
  sposib: curl raw.githubusercontent + перерахунок tools/arithmetic.py, 2026-08-26
  notatka: 'Виправлення, і воно стосується не факту, а **способу перевірки**, про який книга
    сама заявляла. `docs/fakty.md` стверджував, що обсяги SRAM обчислені з меж адресних вікон
    і збігаються із заявленими для п''яти сімейств із шести. Перерахунок цього не підтвердив.

    Рівний збіг є лише там, де вікна даних і інструкцій збігаються між собою (C6, H2) або
    де вікно DRAM і є вся пам''ять (S2). На C3 із заявленим збігається вікно **IRAM**, а не
    DRAM. Для classic і S3 не збігається жодне вікно.

    Виправлено чесно: обсяги SRAM — величини з datasheet, а вікна — це інше число. Заявлений
    обсяг лишається в наряді як клас `C`.

    Але з помилки вийшло доповнення, і корисне. Вікна відповідають на практично важливіше
    питання: скільки пам''яті чип узагалі здатен адресувати як дані. На classic це 328 КБ
    із 520, на S3 — 480 із 512. Тобто число з таблиці годиться для порівняння чипів і не годиться
    для планування буфера. Додано в розділ 02 блоком уваги.

    Шість перерахунків вікон додано в `tools/arithmetic.py` (36 замість 30), щоб число не
    роз''їхалося мовчки.'
  title: Обсяг SRAM у таблиці — datasheet, а не адресні вікна
