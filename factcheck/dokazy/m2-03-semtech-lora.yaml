- nazva: RFM69 не є LoRa-модулем
  zbih: \*\*RFM69 — це не LoRa\.\*\*
  klas: A
  dzherelo: RFM69HCW ISM Transceiver Module v1.1 (HopeRF), розділ «Key Product Features»;
    для порівняння — SX1276/77/78/79 Datasheet Rev. 4, «Key Product Features»
  cytata: "RFM69HCW — KEY PRODUCT FEATURES\n  FSK Bit rates up to 300 kb/s\n  FSK, GFSK, MSK,\
    \ GMSK and OOK modulations\n\n(слово «LoRa» у документі RFM69HCW не трапляється жодного\
    \ разу)\n\nSX1276/77/78/79 — KEY PRODUCT FEATURES\n  LoRa(TM) Modem\n  168 dB maximum\
    \ link budget\n"
  sposib: PDF HopeRF через cdn-shop.adafruit.com; PDF Semtech там само; pdftotext -layout,
    2026-08-26
  notatka: 'Виправлення помилки роду, а не числа. Стара редакція розділу подавала «**SX1262
    / RFM69HCW**» одним рядком переліку LoRa-модулів — тобто ставила поруч чип, що вміє LoRa,
    і модуль, що не вміє її взагалі.

    Ціна помилки для читача висока й підступна. RFM69 коштує приблизно як RFM95, називається
    схоже, продається поруч. Купивши його за цим рядком, читач не зв''яжеться з жодним LoRa-вузлом
    — а симптом буде той самий, що в двох інших несправностей, які розділ уже описує: тиша
    при різних SF і тиша при несправній антені. Бібліотека теж не підкаже: RadioLib підтримує
    і SX127x/SX126x, і RF69, тож код збереться й запуститься.

    Заведено у `factcheck/SPROSTOVANE-m2.md` зі взірцем.'
