- nazva: Ширша смуга — швидше й менш далеко
  zbih: \*\*Bandwidth\*\* — ширша смуга означає швидше і менш далеко
  klas: A
  dzherelo: SX1276/77/78/79 Datasheet, Rev. 4, Table 15 «LoRa Bandwidth Options» (с. 28) і
    Table 8 «Receiver Specifications» (RFS_L10_HF, RFS_L62_HF)
  cytata: "Table 15 LoRa Bandwidth Options\n  Bandwidth (kHz)   Spreading Factor   Coding\
    \ rate   Nominal Rb (bps)\n        7.8               12               4/5            \
    \ 18\n       15.6               12               4/5             37\n       62.5     \
    \          12               4/5            146\n        125               12         \
    \      4/5            293\n        250               12               4/5            586\n\
    \        500               12               4/5           1172\n\nRF sensitivity, Long-Range\
    \ Mode, 10.4 kHz bandwidth:  SF = 11   -146 dBm\nRF sensitivity, Long-Range Mode, 62.5\
    \ kHz bandwidth:  SF = 11   -137 dBm\n"
  sposib: PDF Semtech через дзеркало cdn-shop.adafruit.com, pdftotext -layout, 2026-08-26
  notatka: 'Обидві половини твердження мають окреме число. «Швидше» — Table 15: від 18 біт/с
    на 7.8 кГц до 1172 біт/с на 500 кГц при тих самих SF і швидкості коду. «Менш далеко» —
    таблиця чутливості: при однаковому SF11 вужча смуга дає −146 дБм, ширша −137 дБм, тобто
    9 дБ програшу в бюджеті лінії.

    Джерело підтверджує й рамку розділу: керованих параметрів справді три, і воно називає
    ті самі — «spreading factor, modulation bandwidth and error coding rate».'
