# М2, джерело 2 наряду — Semtech SX1276/77/78/79, розділ 43.
#
# Розділ мій від початку до кінця, тож тут і докази, і виправлення.
#
# Результат: параметрична частина розділу (SF, смуга, швидкість коду)
# витримала звірку дослівно, аж до особливого випадку SF6. А перелік
# модулів містив помилку роду, а не числа: як LoRa-модуль названо чип,
# що LoRa не вміє взагалі.
#
# Про спосіб. semtech.com віддає datasheet лише через портал Salesforce,
# який без браузера не проходиться (`curl` отримує HTML-заглушку на 21 КБ
# незалежно від адреси). Той самий документ узято з дзеркала Adafruit;
# збіг перевірено за назвою файлу в порталі — DS_SX1276-7-8-9_W_APP_V7,
# 132 сторінки, Rev. 4 - March 2015.





























- nazva: Робочий діапазон SF у LoRa — 7…12, а SF6 окремий режим
  zbih: робочий діапазон \*\*7…12\*\*|Апаратно існує ще й SF6
  klas: A
  dzherelo: SX1276/77/78/79 Datasheet, Rev. 4 (March 2015), розділ 4.1.1.2 «Spreading Factor»,
    Table 13 «Range of Spreading Factors», с. 27
  cytata: "Table 13 Range of Spreading Factors\n  SpreadingFactor   Spreading Factor    LoRa\
    \ Demodulator\n  (RegModulationCfg) (Chips / symbol)        SNR\n        6           \
    \       64               -5 dB\n        7                 128              -7.5 dB\n \
    \       8                 256               -10 dB\n        9                 512    \
    \         -12.5 dB\n       10                1024               -15 dB\n       11    \
    \            2048             -17.5 dB\n       12                4096               -20\
    \ dB\n\nSpreading Factor 6\nSF = 6 Is a special use case for the highest data rate transmission\
    \ possible\nwith the LoRa modem. To this end several settings must be activated in the\n\
    SX1276/77/78/79 registers when it is in use:\n  Set SpreadingFactor = 6 in RegModemConfig2\n\
    \  The header must be set to Implicit mode.\n  Set the bit field DetectionOptimize of\
    \ register RegLoRaDetectOptimize to \"0b101\".\n  Write 0x0C in the register RegDetectionThreshold.\n"
  sposib: PDF Semtech (DS_SX1276-7-8-9_W_APP_V7, 132 с.) через дзеркало cdn-shop.adafruit.com,
    pdftotext -layout, 2026-08-26
  notatka: 'Розділ 43 звірено дослівно, включно з обґрунтуванням «чому діапазон названо від
    сімки»: SF6 справді вимагає неявного заголовка й власних налаштувань детектування, і справді
    не вмикається «просто меншим числом». Книга формулює це точніше за наряд, який просив
    звірити «діапазон 7…12».

    Заразом підтверджено дві сусідні тези розділу. Чутливість зростає з SF: на смузі 62.5
    кГц −121 дБм при SF6 проти −139 дБм при SF12. І час ефіру росте різко: кількість чипів
    на символ подвоюється на кожному кроці, 64 → 4096.

    Ще одна вимога розділу — «обидва боки мусять мати однакові параметри» — стверджена джерелом
    прямо: «SpreadingFactor must be known in advance on both transmit and receive sides of
    the link as different spreading factors are orthogonal to each other».'
