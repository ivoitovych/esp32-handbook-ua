- nazva: 'T-12-061: `delay` тут не блокує систему, а `loop` —'
  zbih: '`delay`\s+тут\s+не\s+блокує'
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/arduino-esp32/master/cores/esp32/esp32-hal-misc.c
  cytata: "void delay(uint32_t ms) {\n  vTaskDelay(ms / portTICK_PERIOD_MS);\n}\n"
  sposib: 'Суцільний прохід 2026-08-27. Документ отримано в сесії, витяг звірено з ним підрядком
    машинно (`tools/prochid_zvid.py`). Клас `A` тут означає «документ отримано, цитата дослівна»,
    а **не** «супровідник прочитав і згоден»: змістовий шар лишається окремою роботою.'
  notatka: Функція delay() використовує vTaskDelay(), яка призводить передачу керування планувальнику
    FreeRTOS, а не блокує систему. Крім того, у main.cpp loop виконується в завданні FreeRTOS
    під назвою "loopTask".
