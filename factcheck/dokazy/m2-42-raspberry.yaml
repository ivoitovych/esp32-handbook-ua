- nazva: Raspberry Pi — час завантаження поза межами обох документів
  zbih: Старт · Raspberry Pi → десятки секунд
  klas: E
  dzherelo: —
  cytata: —
  sposib: 'PDF з кешу `rpi4-datasheet.pdf` і `rpi5-datasheet.pdf`, pdftotext -layout, 2026-08-26 — перевірено
    пошуком слова «boot» в обох витягнутих текстах: збігів немає.'
  notatka: 'Ні datasheet Pi 4, ні product brief Pi 5 жодного разу не згадують час завантаження — і це
    очікувано: старт до робочого стану залежить від дистрибутива Raspberry Pi OS, швидкості SD-карти й
    того, які служби він піднімає, а не від самої плати. Це не «недоступне джерело» (клас C) — канонічного
    документа з такою цифрою від Raspberry Pi Ltd просто не існує, це спостережуваний факт про клас пристроїв.
    Тому клас E, як і «Ціна плати» для AVR у попередньому кроці.'
- nazva: Raspberry Pi — жодної згадки режиму сну там, де про живлення говорять детально
  zbih: Сон · Raspberry Pi → не передбачено
  klas: B
  dzherelo: Raspberry Pi (Trading) Ltd, Raspberry Pi 4 Model B Datasheet, розділ 4.1 «Power Requirements»;
    Raspberry Pi 5 Product Brief, розділ «Specification»
  cytata: '4.1     Power Requirements

    The Pi4B requires a good quality USB-C power supply capable of delivering 5V at 3A. If attached

    downstream USB devices consume less than 500mA, a 5V, 2.5A supply may be used.

    '
  sposib: 'PDF з кешу `rpi4-datasheet.pdf` і `rpi5-datasheet.pdf`, pdftotext -layout, 2026-08-26 — перевірено
    пошуком слів «sleep», «suspend», «standby», «hibernate», «shutdown», «low-power» в обох витягнутих
    текстах: збігів немає в жодному з двох документів.'
  notatka: На відміну від AVR і RP2040, чиї datasheet присвячують окремі розділи й таблиці режимам сну
    з мікроамперними цифрами, обидва документи Raspberry Pi говорять про живлення тільки в термінах вимог
    до блока живлення (розділ 4.1 у Pi 4) і не мають жодного розділу про режим сну чи низькоспоживчий
    стан. Відсутність у документах, які інакше детально покривають живлення, — не пряма цитата, тому клас
    B, а не A, той самий патерн, що й «Радіо → ні» для AVR у попередньому кроці.
- nazva: Raspberry Pi — «реальний час» поза тим, що документи оцінюють
  zbih: Реальний час · Raspberry Pi → погано
  klas: E
  dzherelo: —
  cytata: —
  sposib: 'PDF з кешу `rpi4-datasheet.pdf` і `rpi5-datasheet.pdf`, pdftotext -layout, 2026-08-26 — перевірено
    пошуком «real-time», «realtime», «deterministic», «RTOS», «scheduler»: збігів немає (крім «Real-time
    clock (RTC)» у Pi 5 — див. нотатку).'
  notatka: 'Єдина згадка «real-time» в обох документах — «Real-time clock (RTC), powered from external
    battery» у специфікації Pi 5. Це годинник реального часу (мікросхема, що рахує дату й час, а не процесорний
    час), а не властивість детермінованості виконання — не плутати одне з одним, це пастка термінології,
    а не доказ. Жодних даних про латентність переривань, планувальник чи детермінізм ні один із документів
    не наводить: Raspberry Pi Ltd просто не публікує такого для одноплатного комп''ютера із загальним
    Linux, на відміну від Microchip і Raspberry Pi для RP2040, які прямо документують час реакції на переривання.
    Оцінка «погано» — порівняльне редакційне судження автора книги про клас пристрою (загальна ОС проти
    голого заліза), не цифра з джерела. Клас E.'
- nazva: Raspberry Pi 5 — офіційний прайс-лист, висока ціна проти мікроконтролерних плат
  zbih: Ціна плати · Raspberry Pi → висока
  klas: A
  dzherelo: Raspberry Pi Ltd, Raspberry Pi 5 Product Brief (Published April 2026), розділ «Specification»
    → «List price»
  cytata: "List price:\n            1GB  $45\n            2GB  $65\n            4GB  $110\n          \
    \  8GB  $175\n            16GB $305\n"
  sposib: PDF з кешу `rpi5-datasheet.pdf`, завантажено `vzyaty.sh` з datasheets.raspberrypi.com, pdftotext
    -layout, 2026-08-26
  notatka: На відміну від кристалів (RP2040, ATmega328P), де ціни в datasheet немає в принципі, офіційний
    product brief готової плати Pi 5 таки публікує прайс-лист — і це рідкісний випадок класу A саме для
    «ціни». $45–305 за саму плату — це на порядок вище за Arduino Uno (~$25) чи Pi Pico на RP2040 (~$4–5)
    з тієї ж таблиці, що й підтверджує «висока» відносно решти рядка. Модель Pi 4 в її власному datasheet
    (Release 1.1) ціни не наводить — прайс-лист є тільки в новішому форматі документа Pi 5, тому саме
    він і використаний як джерело.
- nazva: «Проти Raspberry Pi» — редакційна рамка, не технічне твердження
  zbih: \*\*Проти Raspberry Pi\.\*\* Це різні класи\.
  klas: E
  dzherelo: —
  cytata: —
  sposib: Немає зовнішнього джерела для перевірки — див. нотатку.
  notatka: 'Речення відкриває підрозділ порівняння й саме по собі не несе перевірного технічного факту
    (жодного числа, жодної конкретної характеристики) — це редакційна теза, після якої йдуть уже конкретні
    порівняння (файлова система, час завантаження, споживання), розбиті на окремі одиниці. «Різні класи
    пристроїв» — категоріальне судження автора, а не щось, що підтверджує чи спростовує datasheet. Клас
    E, як «Ціна плати» для AVR у попередньому кроці.


    НЕ ТВЕРДЖЕННЯ: структура тексту (заголовок, рамка, перелік). Клас `E` правильний, але міряє дрібність
    витягача, а не книгу.'
