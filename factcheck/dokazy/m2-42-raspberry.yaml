- nazva: Raspberry Pi 4 — ядро на 1.5 ГГц, більше за 1 ГГц
  zbih: Частота · Raspberry Pi → понад 1 ГГц
  klas: A
  dzherelo: Raspberry Pi (Trading) Ltd, Raspberry Pi 4 Model B Datasheet, Release 1.1 (March 2024), розділ
    2.1 «Hardware»
  cytata: "2.1    Hardware\n      • Quad core 64-bit ARM-Cortex A72 running at 1.5GHz\n"
  sposib: PDF з кешу `rpi4-datasheet.pdf`, pdftotext -layout, 2026-08-26
  notatka: '1.5 ГГц > 1 ГГц — з запасом, і це найповільніша з підтримуваних книгою плат: Pi 5 (product
