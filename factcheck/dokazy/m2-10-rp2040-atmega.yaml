- nazva: ATmega328P — немає операційної системи серед можливостей чипа
  zbih: ОС · AVR \(Arduino Uno\) → немає
  klas: B
  dzherelo: Microchip, ATmega48A/PA/88A/PA/168A/PA/328/P Data Sheet (DS40002061B), «Introduction»
    і розділ «Features» → «Special Microcontroller Features»
  cytata: "The ATmega48A/PA/88A/PA/168A/PA/328/P is a low power, CMOS 8-bit microcontrollers\
    \ based on the\nAVR® enhanced RISC architecture.\n\nSpecial Microcontroller Features\n\
    \                    ̶           Power-on Reset and Programmable Brown-out Detection\n\
    \                ̶               Internal Calibrated Oscillator\n                ̶   \
    \            External and Internal Interrupt Sources\n                ̶              \
    \ Six Sleep Modes: Idle, ADC Noise Reduction, Power-save, Power-down, Standby, and Extended\
    \ Standby\n"
  sposib: PDF з кешу `atmega328p.pdf`, pdftotext -layout, 2026-08-26
  notatka: 'Datasheet прямо не пише «операційної системи немає» — про софт датащит узагалі
    не говорить, це нормально для нього. Висновок B випливає з архітектури: чип описаний як
    «8-bit microcontroller» без блоку керування пам''яттю, привілейованих рівнів чи планувальника,
    а весь перелік «Special Microcontroller Features» вичерпується скиданням, генератором,
    перериваннями й режимами сну — жодного системного/ядерного примітиву. Разом з обсягом
    SRAM (2 КБ, попередній запис) цього достатньо, щоб «немає ОС» було прямим наслідком архітектури,
    а не голослівним твердженням.'
