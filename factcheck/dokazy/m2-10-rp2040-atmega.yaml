# М2, крок 10 — порівняльна таблиця розділу 01, комірки ATmega328P (AVR,
# Arduino Uno). Джерело в кеші: `atmega328p.pdf` (Microchip,
# ATmega48A/PA/88A/PA/168A/PA/328/P Data Sheet, DS40002061B). Наряд —
# `factcheck/UNREACHABLE-SOURCES.md`, група «RP2040, ATmega328P».
#
# Межа кроку: рядок таблиці називається «AVR (Arduino Uno)», не
# «ATmega328P» — це плата, а не голий кристал. Де книга стверджує щось
# про саму плату (зовнішній кварц, ціну плати), а не про кристал,
# datasheet кристала цього не доводить: це або інший клас доказу, або
# інше джерело (схема Arduino Uno), яке в цій сесії не діставали.
#
# Обидва тексти витягнуті: `pdftotext -layout atmega328p.pdf
# atmega328p.txt` і `pdftotext -layout rp2040.pdf rp2040.txt`,
# 2026-08-26.
#
# Комірки RP2040 у цьому наряді відсутні (id T-01-041/046/051/056/061/
# /066/071/076 уже позначені як закриті іншим проходом,
# `pass-04-obkhidni.yaml`), тому в цьому файлі їх немає. Але звірка з
# `rp2040.pdf` під час цього кроку виявила проблему саме в тому проході:
# його `zbih: 'RP2040|264 КБ'` — це ДИЗ'ЮНКЦІЯ двох альтернатив, і
# альтернатива `RP2040` сама по собі збігається з текстом БУДЬ-ЯКОЇ
# комірки колонки RP2040, бо кожна містить слово «RP2040». Через це
# докази про SRAM (SRAM_BASE/SRAM_STRIPED_END з pico-sdk) хибно
# приліпилися до T-01-041 (Радіо), T-01-056 (ОС), T-01-061 (Старт),
# T-01-066 (Сон), T-01-071 (Реальний час), T-01-076 (Ціна плати) —
# жодна з цих комірок не стосується SRAM. Це саме пастка з правила 4
# SCHEMA.md, і вона не моя, щоб лагодити (чужий файл доказів), тож
# лишаю це в звіті, а не в правках.
#
# Окремо: `rp2040.pdf` містить кращі, прямі цитати на 133 МГц і 264 КБ
# (Key features, розділ 1), ніж непряме обчислення з заголовка pico-sdk,
# яке зараз використовує pass-04. І там-таки, Table 637 (5.7.2, «Power
# Consumption for typical user cases») прямо підтверджує, що сон
# RP2040 вимірюється в одиницях мА (Dormant: typical 0.18 мА, max
# 4.2 мА; Sleep: typical 0.39 мА, max 4.5 мА) — це підтверджує саме те
# слово, що стоїть у таблиці розділу 01 («Сон · RP2040 → мА»), на
# відміну від «мкА» в AVR/STM32. Ця знахідка теж не оформлена як запис
# доказу нижче — вона стосується не моїх 8 комірок AVR, а чужого файла.










- nazva: ATmega328P — немає радіомодуля серед периферії
  zbih: Радіо на борту · AVR \(Arduino Uno\) → ні
  klas: B
  dzherelo: Microchip, ATmega48A/PA/88A/PA/168A/PA/328/P Data Sheet (DS40002061B), вступ і
    розділ «Features» — «Peripheral Features» і «Special Microcontroller Features»
  cytata: 'The ATmega48A/PA/88A/PA/168A/PA/328/P provides the following features: 4K/8Kbytes
    of In-System

    Programmable Flash with Read-While-Write capabilities, 256/512/512/1Kbytes EEPROM, 512/1K/1K/2Kbytes

    SRAM, 23 general purpose I/O lines, 32 general purpose working registers, three flexible
    Timer/Counters with

    compare modes, internal and external interrupts, a serial programmable USART, a byte-oriented
    2-wire Serial

    Interface, an SPI serial port, a 6-channel 10-bit ADC (8 channels in TQFP and VQFN packages),
    a

    programmable Watchdog Timer with internal Oscillator, and five software selectable power
    saving modes.

    '
  sposib: PDF з кешу `atmega328p.pdf`, pdftotext -layout, 2026-08-26
  notatka: 'Вступ datasheet перелічує периферію вичерпно (це той самий перелік, що дублюється
    розбито по пунктах у «Features»: USART, 2-wire (I²C), SPI, ADC, Watchdog, компаратор,
    лічильники) — радіо чи будь-якого бездротового інтерфейсу серед них немає. Висновок «ні»
    випливає з повноти переліку, а не з прямої фрази «немає радіо», тому клас B, а не A —
    той самий патерн, що й приклад із SCHEMA.md про `SOC_UART_NUM 3`.'
