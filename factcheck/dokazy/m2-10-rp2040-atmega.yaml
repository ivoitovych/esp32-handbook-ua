- nazva: ATmega328P — 16 МГц серед «типових» тактових частот
  zbih: Частота · AVR \(Arduino Uno\) → 16 МГц
  klas: A
  dzherelo: Microchip, ATmega48A/PA/88A/PA/168A/PA/328/P Data Sheet (DS40002061B), Table 20-7
    «Examples of UBRRn Settings for Commonly Used Oscillator Frequencies» і розділ 29.3 «Speed
    Grades»
  cytata: "Table 20-7.         Examples of UBRRn Settings for Commonly Used Oscillator Frequencies\
    \ (Continued)\n                          fosc = 16.0000MHz                      fosc =\
    \ 18.4320MHz                      fosc = 20.0000MHz\n\nSpeed Grade:\n                \
    \    ̶           0 - 4MHz@1.8 - 5.5V, 0 - 10MHz@2.7 - 5.5.V, 0 - 20MHz @ 4.5 - 5.5V\n"
  sposib: PDF з кешу `atmega328p.pdf`, pdftotext -layout, 2026-08-26
  notatka: 16 МГц — не максимум кристала (максимум за Speed Grade — 20 МГц при 4.5–5.5 В),
    а один із «типових» («Commonly Used») тактових частот, прямо названих у таблиці налаштувань
    USART — саме ту, яку обрала плата Arduino Uno для зовнішнього резонатора. Сам зовнішній
    кварц 16 МГц — властивість плати Arduino Uno, а не кристала; це datasheet ATmega328P підтверджує
    лише опосередковано (частота підтримується і є «типовою»), а не як специфікацію конкретної
    плати. Прямого підтвердження, що саме на Arduino Uno стоїть резонатор 16 МГц, треба шукати
    у схемі плати (Arduino Uno Rev3), а не в datasheet кристала — вона в цій сесії не звірялася.
