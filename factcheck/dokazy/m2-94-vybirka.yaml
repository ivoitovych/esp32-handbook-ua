- nazva: 'T-16-034: У наступному поколінні бутлоадер став на `0x0`'
  zbih: У\s+наступному\s+поколінні|бутлоадер\s+став\s+на\s+`0x0`
  klas: A
  dzherelo: 'ESP-IDF Programming Guide, api-guides/bootloader.rst і api-guides/boot-mode-selection.rst,
    рядок 5 — підстановка IDF_TARGET_BOOTLOADER_OFFSET (кеш: dzherela-kesh/8af5fd4e-boot-mode-selection.rst,
    dzherela-kesh/a4dbe955-bootloader.rst)'
  cytata: '{IDF_TARGET_BOOTLOADER_OFFSET:default="0x0", esp32="0x1000", esp32s2="0x1000",
    esp32p4="0x2000", esp32c5="0x2000", esp32s31="0x2000"}

    '
  sposib: grep по кешованих .rst ESP-IDF, 2026-08-27
  notatka: 'Агент був поставив джерелом саму книгу. Справжнє джерело — підстановка IDF_TARGET_BOOTLOADER_OFFSET,
    з якої ESP-IDF рендерить свою документацію: типове 0x0, classic і S2 — 0x1000, P4 і C5
    — 0x2000. Таблиця книги (рядки 70–72 розділу 16) збігається з нею повністю, включно з
    третім значенням і складом кожної групи. Друге місце в тому ж кеші, bootloader.rst рядок
    152, зараховує S2 до групи 0x0 — це розбіжність усередині документації самої ESP-IDF,
    і права там підстановка з рядка 5, бо саме нею рендериться текст. Книга стоїть на правильному
    боці.'
  title: 'T-16-034: У наступному поколінні бутлоадер став на `0x0`'
