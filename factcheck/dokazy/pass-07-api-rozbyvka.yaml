- nazva: Виклики FreeRTOS і атрибути розміщення
  zbih: xTaskCreate|xQueue|xSemaphore|xEventGroup|vTaskDelay|uxTaskGetStackHighWaterMark|pdMS_TO_TICKS|portMAX_DELAY|portYIELD_FROM_ISR|IRAM_ATTR|RTC_DATA_ATTR
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/freertos/FreeRTOS-Kernel/include/freertos/{task,queue,semphr,event_groups,timers}.h
    та components/esp_common/include/esp_attr.h
  cytata: "Усі 15 викликів FreeRTOS, що вживає книга, знайдено в заголовках ядра.\nМакроси:\n\
    \  #define IRAM_ATTR _SECTION_ATTR_IMPL(\".iram1\", __COUNTER__)\n  #define RTC_DATA_ATTR\
    \ _SECTION_ATTR_IMPL(\".rtc.data\", __COUNTER__)\n  #define configMAX_PRIORITIES ( 25\
    \ )\n"
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: '`RTC_DATA_ATTR` кладе змінну в секцію `.rtc.data` — це і є механічне підтвердження
    того, чому вона переживає deep sleep, тоді як звичайна змінна не переживає. `IRAM_ATTR`
    кладе функцію в `.iram1`, звідки вона виконується при вимкненому кеші флешу.'
