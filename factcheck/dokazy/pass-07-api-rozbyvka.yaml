# Прохід 7 — суцільна звірка API, типова розбивка флешу, конфігурація пінів.
#
# Головне в цьому проході — **суцільність**. Попередні перевіряли окремі
# твердження; цей узяв усі 104 унікальні виклики API, які вживає книга, і
# звірив кожен із заголовками ESP-IDF, FreeRTOS і компонентів реєстру.
#
# Результат: жодного виправлення. Це другий прохід поспіль із нулем
# знахідок у своїй царині — і саме такий результат є метою.
#
# Проте прохід дав два доповнення: діагностичну функцію, якої книзі
# бракувало, і стелю пріоритетів, яку книга не називала.













