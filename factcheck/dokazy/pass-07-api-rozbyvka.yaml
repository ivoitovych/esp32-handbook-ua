- nazva: Типова розбивка флешу та вирівнювання розділів
  zbih: nvs.*0x9000.*0x6000|phy_init.*0xF000|factory.*0x10000|вирівняні на `0x10000`|вирівнюються
    на `0x1000`
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/partition_table/partitions_singleapp.csv
    та .../components/partition_table/gen_esp32part.py
  cytata: "# Name,   Type, SubType, Offset,  Size, Flags\nnvs,      data, nvs,     ,     \
    \   0x6000,\nphy_init, data, phy,     ,        0x1000,\nfactory,  app,  factory, ,   \
    \     1M,\n\n(gen_esp32part.py)\nALIGNMENT = {\n    APP_TYPE: 0x10000,\n    DATA_TYPE:\
    \ 0x1000,\n    BOOTLOADER_TYPE: 0x1000,\n    PARTITION_TABLE_TYPE: 0x1000,\n}\n"
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Підтверджує таблицю розділу 18 повністю: `nvs` розміром `0x6000`, `phy_init` розміром
    `0x1000`, `factory` 1 МБ — і, головне, вирівнювання: розділи типу `app` на 64 КБ, типу
    `data` на 4 КБ. Саме ці два числа книга називає вимогою апаратного відображення пам''яті.

    Окремо зафіксовано для наступних ревізій: у розбивці з OTA (`partitions_two_ota.csv`)
    `nvs` уже `0x4000`, і додається `otadata` розміром `0x2000`. Книга цієї розбивки таблицею
    не подає, тож розбіжності немає, але сума службових областей до `0x10000` сходиться саме
    так — і це підтверджує «близько 64 КБ» у розділі 19.'
