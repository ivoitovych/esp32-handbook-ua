  cytata: '#define configMAX_PRIORITIES                         ( 25 )

    '
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Доповнення проходу. Розділ 31 писав «від 0 до `configMAX_PRIORITIES - 1`», не
