- nazva: gpio_dump_io_configuration показує реальну конфігурацію піна
  zbih: gpio_dump_io_configuration|FuncSel|спитайте в чипа
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/docs/en/api-reference/peripherals/gpio.rst
  cytata: "GPIO driver offers a dump function :cpp:func:`gpio_dump_io_configuration` to show\
    \ the\ncurrent configurations of IOs, such as pull-up/pull-down, input/output enable,\
    \ pin mapping, etc.\n\n    gpio_dump_io_configuration(stdout, (1ULL << 4) | (1ULL << 18)\
    \ | (1ULL << 26));\n\n================IO DUMP Start================\nIO[4] -\n  Pullup:\
    \ 1, Pulldown: 0, DriveCap: 2\n  InputEn: 1, OutputEn: 0, OpenDrain: 0\n  FuncSel: 1 (GPIO)\n\
    \  GPIO Matrix SigIn ID: (simple GPIO input)\n…\nIO[26] **RESERVED** -\n"
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Доповнення проходу, і воно точно в жанрі книги. Розділ 29 розбирає «GPIO поводиться
    дивно» через здогадки — strapping, флеш, тільки-вхідний. Ця функція дає пряму відповідь:
    що зараз у регістрах, хто тримає пін (`FuncSel`, `GPIO Matrix SigIn/SigOut ID`) і чи він
    зарезервований системою. Додано в розділ 29 блоком уваги.'
