# Прохід 37 — поріг відбраковування DS18B20.
#
# Знахідка М2, підтверджена їхнім же доказом `m2-04-ds18b20`, у якому
# дослівно наведено рядок паспорта. Книга при цьому лишалася невиправленою
# до цього проходу: знахідку надіслали, а текст не змінили — рівно той
# випадок, проти якого заведено `factcheck/SPROSTOVANE.md`.
#
# Суть помилки не в числі, а в тому, **чим воно є**. ±0.5 °C — похибка
# одного датчика, а книга вживала її як допустиму розбіжність **між
# двома**. Похибки незалежні, тож поріг занижений удвічі в робочому
# діапазоні й увосьмеро в окропі.
#
# Це шостий випадок того самого взірця за добу: число праве, а те, чим
# воно є, — ні. Взірець сформульовано в проході 24 і підтверджено М2.

- nazva: Паспортна похибка DS18B20 — на датчик, а не між датчиками
  zbih: 'Паспортна похибка DS18B20 — \*\*±0\.5 °C у діапазоні|±2 °C\*\* поза ним|законно розходяться \*\*до 1 °C\*\*|в \*\*окропі не можна\*\*'
  klas: C
  dzherelo: >-
    DS18B20 Programmable Resolution 1-Wire Digital Thermometer,
    Maxim Integrated / Analog Devices, таблиця Electrical
    Characteristics, рядок `Thermometer Error tERR`
  shukaty: >-
    рядок `Thermometer Error tERR` у таблиці Electrical Characteristics:
    два діапазони, −10…+85 °C і −55…+125 °C, із власним допуском на
    кожен. Дослівний витяг уже стоїть у доказі М2 `m2-04-ds18b20`.
  sposib: >-
    Клас `C`, а **не** `A`, і це принципово. Дослівний рядок паспорта
    здобув М2 і навів у себе; я його лише прочитав у їхньому записі.
    Власну спробу зробив: `cdn-shop.adafruit.com` із цієї мережі не
    відповідає взагалі, `analog.com` закритий політикою егресу.

    Клас `A` означає «першоджерело отримано **в цій сесії** й
    процитовано дослівно». Поставити його тут означало б записати чужу
    роботу як свою — той самий дефект, який ми ловимо в помічників, і
    рівно та помилка, за яку в цьому реєстрі вже виправлено `pass-31` і
    `pass-17`. Цитату тому й не наводжу: за правилом класу `C` її не
    наводять.
  notatka: >-
    `tERR` — похибка **вимірювання одним приладом** відносно істини.
    Два прилади, кожен зі своєю незалежною похибкою, у робочому
    діапазоні можуть законно розійтися на суму — до 1 °C. Поза
    діапазоном −10…+85 °C паспорт дозволяє ±2 °C, тобто до 4 °C між
    двома справними.

    Звідси й друга половина виправлення: сто градусів лежать **поза**
    вузьким діапазоном, тому перевірка в окропі — найгірший можливий
    вибір умов. Книга радила саме склянку води, не уточнюючи яку.
