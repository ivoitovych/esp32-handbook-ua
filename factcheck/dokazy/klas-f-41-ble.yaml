- nazva: 'T-41-038: Тоді пристрій самоописовий — будь-який універсальний BLE-застосунок покаже'
  zbih: Тоді\s+пристрій\s+самоописовий\s+—
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/master/docs/en/api-guides/ble/get-started/ble-data-exchange.rst
  cytata: 'In fact, the definitions of these services and characteristic data are also provided
    by the SIG. For example, the value of the Heart Rate Measurement must include a flag field
    and a heart rate measurement field, and may include fields such as energy expended, RR-interval,
    and transmission interval, among others. Therefore, these definitions from SIG allow Bluetooth
    LE devices from different manufacturers to recognize each other''s services or characteristic
    data, enabling cross-manufacturer communication.

    '
  sposib: 'Суцільний прохід 2026-08-27. Документ отримано в сесії, витяг звірено з ним підрядком
    машинно (`tools/prochid_zvid.py`). Клас `A` тут означає «документ отримано, цитата дослівна»,
    а **не** «супровідник прочитав і згоден»: змістовий шар лишається окремою роботою.'
  notatka: Підтверджує, що стандартні GATT послуги дозволяють універсальним додаткам розпізнавати
    та виводити осмислені значення без кастомного клієнта
