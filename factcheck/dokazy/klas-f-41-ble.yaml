- nazva: 'T-41-078: Для BLE-проєкту брати NimBLE: різниця в пам''яті вирішальна'
  zbih: 'Для\s+BLE\-проєкту\s+брати\s+NimBLE:'
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/master/docs/en/api-guides/ble/overview.rst
  cytata: 'Although both support Bluetooth LE, ESP-NimBLE requires less heap and flash size.

    '
  sposib: 'Суцільний прохід 2026-08-27. Документ отримано в сесії, витяг звірено з ним підрядком
    машинно (`tools/prochid_zvid.py`). Клас `A` тут означає «документ отримано, цитата дослівна»,
    а **не** «супровідник прочитав і згоден»: змістовий шар лишається окремою роботою.'
  notatka: Документація стверджує, що NimBLE вимагає менше пам'яті в принципі, але не зазначає,
    що ця різниця "вирішальна" саме для C3. Більш того, в таблиці підтримки чипів показано,
    що обидва стеки (Bluedroid і NimBLE) підтримуються на C3.
