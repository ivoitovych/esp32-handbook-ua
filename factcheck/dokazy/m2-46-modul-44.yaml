- nazva: Живлення і логічні рівні — різні питання
  zbih: Живлення і логічні рівні — різні питання
  klas: E
  dzherelo: Розділ 44, примітка з помаранчевим фоном «nezvorotne»
  cytata: '**Живлення і логічні рівні — різні питання.** Модуль може живитися від

    5 В і при цьому мати виводи на 3.3 В, або живитися від 3.3 В і мати

    виводи, що не сприймають 3.3 В як одиницю.

    '
  sposib: Текст розділу 44 manual/44-neznayomyy-modul.md, рядки 38-40
  notatka: Це ключовий мент, що пояснює, чому потрібна перевірка обох параметрів в datasheet, а не припущення
    на основі напруги живлення.
  title: Живлення і логічні рівні — різні питання
  match: Живлення і логічні рівні — різні питання
  status: no-external-signal
  source: Розділ 44, примітка з помаранчевим фоном «nezvorotne»
  quote: '**Живлення і логічні рівні — різні питання.** Модуль може живитися від

    5 В і при цьому мати виводи на 3.3 В, або живитися від 3.3 В і мати

    виводи, що не сприймають 3.3 В як одиницю.

    '
  method: Текст розділу 44 manual/44-neznayomyy-modul.md, рядки 38-40
  note: Це ключовий мент, що пояснює, чому потрібна перевірка обох параметрів в datasheet, а не припущення
    на основі напруги живлення.
