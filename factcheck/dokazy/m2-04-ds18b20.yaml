- nazva: Унікальний 64-бітний код і кількість пристроїв на лінії
  zbih: У кожного унікальний 64-бітний\s+адресний код, зашитий на заводі
  klas: A
  dzherelo: DS18B20 datasheet (Maxim), розділи «Features» і «Overview»
  cytata: 'Each DS18B20 has a unique 64-bit serial code, which allows multiple

    DS18B20s to function on the same 1-Wire bus.


    In this bus system, the microprocessor (the master device) identifies and

    addresses devices on the bus using each device''s unique 64-bit code. Because

    each device has a unique code, the number of devices that can be addressed

    on one bus is virtually unlimited.

    '
  sposib: PDF Maxim через дзеркало cdn-shop.adafruit.com, pdftotext -layout, 2026-08-26
  notatka: 'Обидві половини твердження книги підтверджено: код 64-бітний і унікальний, і саме він дозволяє
    кільком датчикам жити на одній лінії.

    Джерело додає межу, якої в книзі немає і яку варто знати: з погляду **адресації** кількість пристроїв
    «virtually unlimited». Тобто все, що обмежує реальну лінію, — електрика й топологія, а не протокол.
    Розділ 37 називає ті самі причини відмов (підтягування, довжина, паразитне живлення), тож суперечності
    немає — є уточнення, звідки межа береться.'
