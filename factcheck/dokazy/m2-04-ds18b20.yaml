- nazva: Підтягування 4.7 кОм на лінії 1-Wire
  zbih: 1-Wire, резистор 4\.7 кОм
  klas: A
  dzherelo: DS18B20 datasheet (Maxim), Figure 4 «Supplying the Parasite-Powered DS18B20», Figure 5 і блок-схема
    — номінал підтягування на DQ
  cytata: '(на схемах підключення DQ підтягнуто до VPU резистором 4.7k —

    Figure 1 «DS18B20 Block Diagram», Figure 4, Figure 5)


    The control line requires a weak pullup resistor since all devices are

    linked to the bus via a 3-state or open-drain port (the DQ pin in the case

    of the DS18B20).

    '
  sposib: PDF Maxim через дзеркало cdn-shop.adafruit.com, pdftotext -layout, 2026-08-26
  notatka: '4.7 кОм — номінал із самих схем datasheet, а не з практики спільноти. Джерело водночас пояснює,
    **чому** підтягування взагалі потрібне: вихід відкритий стік, лінію нема чому підняти.'
