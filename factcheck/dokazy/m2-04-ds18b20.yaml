- nazva: DS18B20 — діапазон, роздільність і час перетворення
  zbih: приблизно від −55 до \+125 °C, роздільність налаштовується від 9 до|перетворення при 12 розрядах
    займає\s+\*\*близько 750 мілісекунд\*\*|При 9 розрядах перетворення займає\s+близько 94 мс
  klas: A
  dzherelo: DS18B20 Programmable Resolution 1-Wire Digital Thermometer, datasheet Maxim Integrated (нині
    Analog Devices), 22 с., розділи «Features», «Operation—Measuring Temperature» і таблиця конфігураційного
    регістра
  cytata: "Measures Temperatures from -55°C to +125°C\nThermometer Resolution is User Selectable from\
    \ 9 to 12 Bits\n\nThe resolution of the temperature sensor is user-configurable to 9, 10, 11,\nor\
    \ 12 bits, corresponding to increments of 0.5°C, 0.25°C, 0.125°C, and\n0.0625°C, respectively. The\
    \ default resolution at power-up is 12-bit.\n\nR1  R0   RESOLUTION (BITS)   MAX CONVERSION TIME\n\
    \ 0   0          9              93.75ms   (tCONV/8)\n 0   1         10             187.5ms    (tCONV/4)\n\
    \ 1   0         11              375ms     (tCONV/2)\n 1   1         12              750ms     (tCONV)\n\
    \nDC ELECTRICAL CHARACTERISTICS\nPARAMETER          SYMBOL   CONDITIONS          MAX      UNITS\n\
    Thermometer Error   tERR    -10°C to +85°C     ±0.5       °C\n                            -55°C to\
    \ +125°C    ±2         °C\n"
  sposib: PDF Maxim через дзеркало cdn-shop.adafruit.com (analog.com віддає Access Denied на рівні Akamai),
    pdftotext -layout, 2026-08-26
  notatka: 'Розділ 37 звірено дослівно по всіх чотирьох числах: діапазон −55…+125 °C, роздільність 9…12
    розрядів, 750 мс при 12 розрядах, 94 мс при 9 (у джерелі 93.75 мс).

    Заразом підтверджується порада розділу «знизити роздільність»: час перетворення справді ділиться навпіл
    на кожному кроці вниз, бо таблиця дає рівно tCONV, tCONV/2, tCONV/4, tCONV/8.

    Побічне, вартого уваги при читанні розділу: за замовчуванням датчик вмикається на 12 розрядах. Тобто
    «повільно» — стан за замовчуванням, і хто нічого не налаштовував, отримує саме 750 мс.

    Окремо про «точність 0.5 °C» у тому самому реченні книги. У значенні «крок при 9 розрядах» воно точне:
    джерело дає саме 0.5 °C як increment для 9 біт. Але те саме число є в джерела й **похибкою** — tERR
    ±0.5 °C, і лише в діапазоні −10…+85 °C; поза ним ±2 °C. Збіг двох різних величин на одному числі створює
    пастку, у яку вкладиш М1 уже потрапив: поріг виявлення підробки взято рівним 0.5 °C, тобто тіснішим
    за паспортну похибку двох справних датчиків. Знахідку надіслано окремо.

    І висновок, вартий самого розділу 37: при 12 розрядах крок 0.0625 °C при похибці ±0.5 °C. Три молодші
    розряди — це роздільність, а не точність, і читати їх як точність не варто.'
  title: DS18B20 — діапазон, роздільність і час перетворення
