# Прохід 20 — JTAG-піни й типова обв'язка периферії з черги.
#
# Робота за чергою після тріажу проходу 19. Беруться пункти з найбільшою
# вагою — ті, де ознака «пін» поєднується з «незворотне».
#
# Прохід цікавий тим, що дав **частковий** результат, і це зафіксовано
# чесно: два піни з чотирьох закриті класом A, два лишилися в наряді.
# Спокуса натягнути на них клас A з пам'яті була саме тут, бо мапінг
# MTCK/MTMS відомий усім, хто працював із JTAG. Правило `SCHEMA.md`
# існує рівно для таких моментів.

- nazva: MTDI і MTDO — це GPIO12 і GPIO15
  zbih: '\| TDI \| `GPIO12` \||\| TDO \| `GPIO15` \||MTDI|MTDO'
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esptool/master/docs/en/advanced-topics/boot-mode-selection.rst
  cytata: |
    | 12 (MTDI)   | If driven High, flash voltage (VDD_SDIO) is 1.8V not default 3.3V…
    | 15 (MTDO)   | If driven Low, silences boot messages printed by the ROM bootloader…
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: >-
    Половина таблиці JTAG розділу 27 закривається дослівно, і закривається
    джерелом із зовсім іншої теми: документація esptool називає `GPIO12`
    саме як `MTDI`, а `GPIO15` — як `MTDO`.

    Це водночас підтверджує головне попередження розділу 27: обидва піни
    JTAG на classic — strapping-піни. `MTDI` високий при старті означає
    флеш на 1.8 В, а `MTDO` низький глушить boot-лог. Тобто під'єднаний
    адаптер може і не дати платі стартувати, і забрати лог, яким це
    діагностують.

- nazva: TCK і TMS на classic — GPIO13 і GPIO14
  zbih: '\| TMS \| `GPIO14` \||\| TCK \| `GPIO13` \|'
  klas: C
  dzherelo: >-
    ESP32 Series Datasheet, розділ «Pin Definitions» (таблиця
    альтернативних функцій IO_MUX). Звідси недосяжний — політика egress
  shukaty: >-
    у таблиці IO_MUX знайти рядки GPIO13 і GPIO14 і звірити альтернативну
    функцію: очікується MTCK для GPIO13 і MTMS для GPIO14
  notatka: >-
    Друга половина таблиці лишається незакритою, і це записано, а не
    приховано.

    Мапінг `MTCK`/`MTMS` на `GPIO13`/`GPIO14` не трапився в жодному з
    досяжних звідси джерел: ані в заголовках `soc/`, ані в документації
    esptool, ані в посібнику з JTAG-налагодження ESP-IDF, ані в описі
    ESP-Prog. Він живе в таблиці IO_MUX самого datasheet.

    Спокуса поставити тут клас `A` була найбільшою за всі двадцять
    проходів: мапінг відомий кожному, хто хоч раз чіпав JTAG на ESP32, і
    жоден читач не засумнівався б. Саме для таких моментів і написане
    правило: клас `A` лише тоді, коли текст джерела справді отримано.

    Практична вага помилки тут, до речі, невелика: переплутані `TCK` і
    `TMS` дають непрацюючий JTAG, а не спалену плату. Але реєстр не
    сортує чесність за ціною помилки.

- nazva: Кольорова обв'язка прикладів — classic і тільки classic
  zbih: 'GPIO\d+\s+→ (?:синій|зелений|жовтий|білий|червоний|чорний)|→ датчик DS18B20, лінія DATA|→ дисплей SSD1306'
  klas: B
  dzherelo: >-
    https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/soc/esp32/include/soc/soc_caps.h
    (маски дійсних пінів) + `tools/piny.py`
  cytata: |
    esp32: SOC_GPIO_PIN_COUNT 40
           SOC_GPIO_VALID_GPIO_MASK (0xFFFFFFFFFFULL & ~(BIT24|BIT28…BIT31))

    Усі піни прикладів (0, 4, 21, 22) дійсні для classic;
    GPIO22 недійсний для S3 і C3, GPIO21 — граничний для C3.
  sposib: python3 tools/piny.py, 2026-08-26
  notatka: >-
    Схеми в розділах 22 і 56 — приклади «як підписати дроти перед
    втручанням», а не BOM проєкту. Сімейства вони не оголошують, тож
    `tools/piny.py` їх не перевіряв.

    Перевірено вручну: всі чотири піни дійсні для classic, і жоден із
    розділів не обіцяє іншого сімейства. Розбіжності немає.

    Але записано окремо, бо випадок межовий: якби хтось додав до цих
    розділів рядок «або S3», `GPIO22` став би помилкою мовчки. Це та сама
    пастка, що зі проєктами 59 і 60 — просто тут її ще немає.

    Практичний висновок для процесу: перевірка `piny.py` спирається на
    те, що файл сам себе оголошує. Розділ без такого оголошення з-під неї
    випадає — і це прийнятно лише доти, доки в ньому немає обіцянки про
    сімейство.
