- nazva: TP4056 — струм заряджання задає резистор, 1.2 кОм дає 1 А
  zbih: \*\*Струм заряджання\*\* задається резистором на платі, типово 1 А\.
  klas: A
  dzherelo: TP4056 datasheet NanJing Top Power ASIC Corp — опис виводу PROG (Pin 2) і таблиця «Rprog Current
    Setting»
  cytata: "PROG(Pin 2): Constant Charge Current Setting and Charge Current\nMonitor Pin charge current\
    \ is set by connecting a resistor RISET\nfrom this pin to GND. ... In all modes during charging, the\
    \ voltage\non ISET pin can be used to measure the charge current as follows:\n  IBAT = (VPROG / RPROG)\
    \ × 1200   (VPROG=1V)\n\nRprog Current Setting\n  RPROG (k)   IBAT (mA)\n  10          130\n  5  \
    \         250\n  4           300\n  3           400\n  2           580\n  1.66        690\n  1.5 \
    \        780\n  1.33        900\n  1.2         1000\n"
  sposib: PDF NanJing Top Power ASIC, кеш `tp4056.pdf`, pdftotext -layout, 2026-08-26
  notatka: 'Пряме влучання: і механізм («задається резистором»), і число («типово 1 А») підтверджені окремо
    — резистор `RPROG=1.2 кОм`, який стоїть на типовому модулі TP4056, у власній таблиці виробника дає
    рівно `IBAT=1000 мА`. Клас `A`, бо цитата дослівна й формула, і таблиця.'
  title: TP4056 — струм заряджання задає резистор, 1.2 кОм дає 1 А
