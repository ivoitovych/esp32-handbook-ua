- nazva: TP4056 продається із захистом DW01 — два транзистори в типовій схемі
  zbih: 'TP4056 продається у \*\*двох варіантах\*\*: із захистом \(додаткова мікросхема DW01 і два транзистори
    на платі\) і без\.'
  klas: B
  dzherelo: DW01A — One Cell Lithium-ion/Polymer Battery Protection IC, datasheet Fortune Semiconductor
    Corp — «Pin Configuration», «Typical Application Circuit», «Description of Operation»
  cytata: "Pin No.  Symbol   Description\n  1        OD     MOSFET gate connection pin for discharge control\n\
    \  3        OC     MOSFET gate connection pin for charge control\n\n8. Typical Application Circuit\n\
    \  ... R1, C1, DW01A, R2, M1, M2 ...  (M1 і M2 — два MOSFET,\n  під'єднані між CS/OD/OC мікросхеми\
    \ й BATT-)\n\n11. Description of Operation — Normal Condition\n  If VODP<VCC<VOCP and VCH<VCS<VOI1,\
    \ M1 and M2 are both turned on.\n  The charging and discharging processes can be operated normally.\n"
  sposib: PDF Fortune Semiconductor (офіційний сайт ic-fortune.com), кеш `dw01.pdf`, pdftotext -layout,
    2026-08-26
  notatka: 'Клас `B`, не `A`: datasheet DW01A ніде не пише фразою «на платі стоять два транзистори» —
    це малюнок типової схеми (позначки `M1`, `M2`) і опис двох виводів керування затвором (`OD` — розряд,
    `OC` — заряд), з яких висновок «два транзистори» випливає однозначно, але не дослівно. DW01A сам по
    собі — лише компаратор напруги/струму; силові ключі зовнішні, і схема виробника показує їх саме парою.
    Книжкове «додаткова мікросхема DW01 і два транзистори» — точний опис цієї типової схеми.'
  title: TP4056 продається із захистом DW01 — два транзистори в типовій схемі
  match: 'TP4056 продається у \*\*двох варіантах\*\*: із захистом \(додаткова мікросхема DW01 і два транзистори
    на платі\) і без\.'
  status: derived
  source: DW01A — One Cell Lithium-ion/Polymer Battery Protection IC, datasheet Fortune Semiconductor
    Corp — «Pin Configuration», «Typical Application Circuit», «Description of Operation»
  quote: "Pin No.  Symbol   Description\n  1        OD     MOSFET gate connection pin for discharge control\n\
    \  3        OC     MOSFET gate connection pin for charge control\n\n8. Typical Application Circuit\n\
    \  ... R1, C1, DW01A, R2, M1, M2 ...  (M1 і M2 — два MOSFET,\n  під'єднані між CS/OD/OC мікросхеми\
    \ й BATT-)\n\n11. Description of Operation — Normal Condition\n  If VODP<VCC<VOCP and VCH<VCS<VOI1,\
    \ M1 and M2 are both turned on.\n  The charging and discharging processes can be operated normally.\n"
  method: PDF Fortune Semiconductor (офіційний сайт ic-fortune.com), кеш `dw01.pdf`, pdftotext -layout,
    2026-08-26
  note: 'Клас `B`, не `A`: datasheet DW01A ніде не пише фразою «на платі стоять два транзистори» — це
    малюнок типової схеми (позначки `M1`, `M2`) і опис двох виводів керування затвором (`OD` — розряд,
    `OC` — заряд), з яких висновок «два транзистори» випливає однозначно, але не дослівно. DW01A сам по
    собі — лише компаратор напруги/струму; силові ключі зовнішні, і схема виробника показує їх саме парою.
    Книжкове «додаткова мікросхема DW01 і два транзистори» — точний опис цієї типової схеми.'
- nazva: TP4056 — паралельне навантаження заважає визначенню кінця заряду
  zbih: '\*\*Одночасна робота й заряджання\.\*\* Проста схема «акумулятор і навантаження паралельно на
    виході TP4056» працює, але заряджання при цьому не завершується коректно: модуль не бачить, коли елемент
    заповнився, бо струм іде і в навантаження\.'
  klas: B
  dzherelo: TP4056 datasheet NanJing Top Power ASIC Corp — «DESCRIPTION» і опис виводу BAT (Pin 5)
  cytata: 'The TP4056 automatically terminates the charge cycle when the

    charge current drops to 1/10th the programmed value after the final

    float voltage is reached.


    BAT(Pin5): Battery Connection Pin. Connect the positive terminal of

    the battery to BAT pin. ... BAT pin provides charge current to the

    battery and provides regulation voltage of 4.2V.

    '
  sposib: PDF NanJing Top Power ASIC, кеш `tp4056.pdf`, pdftotext -layout, 2026-08-26
  notatka: 'Клас `B`: datasheet не описує сценарій «навантаження паралельно акумулятору» явно, але механізм
    термінації випливає з нього однозначно. TP4056 завершує заряд, коли струм на виводі `BAT` падає до
    1/10 запрограмованого значення. `BAT` — спільний вузол з акумулятором і навантаженням: якщо навантаження
    весь час забирає частину струму, повний струм через `BAT` не опускається до порогу навіть після заповнення
    елемента, і чип не бачить завершення заряду. Це прямий наслідок описаного механізму термінації, а
    не цитата про сам сценарій.'
  title: TP4056 — паралельне навантаження заважає визначенню кінця заряду
