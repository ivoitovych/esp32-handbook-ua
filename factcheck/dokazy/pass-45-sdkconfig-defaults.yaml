# Прохід 45 — `sdkconfig.defaults` у git.
#
# ## Дев'ята заявлена суперечність — і найближча до справжньої
#
# Помічник побачив розходження не у **факті**, а в **модальності**:
#
#     книга:        «Саме він має лежати в git, а не `sdkconfig`.»
#     документація: «The sdkconfig file may or may not be added to the
#                    source control system … It is recommended to commit
#                    sdkconfig.defaults»
#
# Тобто документація радить те саме, що й книга, але **не забороняє**
# протилежного. Книга забороняє.
#
# ## Чому це не помилка
#
# Наступним абзацом книга сама називає причину: «`sdkconfig` у
# репозиторії — поширена помилка: файл великий, змінюється від кожної
# дрібниці й породжує конфлікти при злитті». Це обґрунтована позиція
# автора, а не переказ документації, і довідник для того й пишуть.
#
# ## Але межу треба провести, і вона нижче
#
# Позитивна половина твердження («`sdkconfig.defaults` має лежати в
# git») **задокументована** — доказ нижче. Негативна («а не
# `sdkconfig`») задокументована **не є**: джерело тут навмисно
# нейтральне.
#
# > Новий рід, якого ми не розрізняли: **припис, поданий так, ніби він
# > задокументований.** Це не хиба факту й не хиба джерела — це хиба
# > модальності, і третій шар її не ловить, бо цитата дослівна.
#
# Ознака: у книзі «має», «мусить», «не можна», а в джерелі —
# «recommended», «may», «typically».

- nazva: sdkconfig.defaults рекомендовано тримати в системі контролю версій
  zbih: 'Саме він\s+має лежати в git'
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/master/docs/en/api-guides/build-system.rst
  cytata: |
    It is recommended to commit sdkconfig.defaults for providing baseline configurations.
  sposib: >-
    `curl` на `raw.githubusercontent.com`, гілка `master`. Документ
    отримано в цій сесії, витяг наведено дослівно. Другий шар зроблено
    супровідником: витяг звірено з твердженням, і межу проведено.
  notatka: >-
    Підтверджує **позитивну** половину: `sdkconfig.defaults` тримати в
    git рекомендовано джерелом. Заперечна половина («а не
    `sdkconfig`») джерелом **не підтверджується**: там сказано
    `may or may not be added`. Це обґрунтована позиція автора, і
    наступний абзац книги називає причину — конфлікти при злитті.
    Записано тут навмисно, щоб наступний прохід не порахував заборону
    задокументованою.
