  cytata: 'idf.py set-target will clear the build directory and re-generate the sdkconfig
    file from scratch. The old sdkconfig file will be saved as sdkconfig.old.

    '
  sposib: 'Суцільний прохід 2026-08-27. Документ отримано в сесії, витяг звірено з ним підрядком
