# М2, крок 3 — розділ 28 (апаратна діагностика). Одиниці T-28.
#
# Файл: `manual/28-analizator.md`
# Джерела в кеші: `esp32-datasheet.pdf`, `i2c-um10204.pdf`
# Взірці перевірено на чинному тексті М2.

- nazva: "T-28-014: Напруга 3V3 під навантаженням повинна бути близько 3.3 В"
  zbih: '3V3.*близько 3\.3 В|близько 3\.3 В.*3V3'
  klas: A
  dzherelo: >-
    ESP32 Series Datasheet v5.3, Table 5-2 «Recommended Power Supply
    Characteristics» і Table 5-3 «DC Characteristics»
  cytata: |
    З manual/28-analizator.md, рядок 24:
    "Живлення під навантаженням. Не на холостому ходу, а коли пристрій
    працює і радіо ввімкнене. `3V3` відносно `GND`: має бути близько 3.3 В."

    Джерело — esp32-datasheet.pdf:
    Table 5-2. Recommended Power Supply Characteristics
    VDDA, VDD3P3_RTC, VDD3P3,
    VDD_SDIO (3.3 V mode)  |  Voltage applied to power supply pins per power domain  |  Min: 2.3/3.0 [2]  |  Typ: 3.3  |  Max: 3.6  |  V
  sposib: >-
    Книга `manual/28-analizator.md`, PDF Espressif `esp32-datasheet.pdf`,
    таблиця 5-2, pdftotext -layout, 2026-08-26
  notatka: >-
    Типова напруга живлення — 3.3 В. Мінімум залежить від типу чипа
    (з флешем в корпусі — 3.0 В, без флешу — 2.3 В). Текст правильно вказує
    на вимоги під навантаженням, не на холостому ходу.

- nazva: "T-28-015: Просідання нижче 3.0 В причина незрозумілих глюків"
  zbih: 'Просідання.*3\.0 В|3\.0 В.*причина.*глюк'
  klas: B
  dzherelo: >-
    ESP32 Series Datasheet v5.3, Table 5-2, Table 5-4 «Current Consumption»;
    також розділ 06 книги про причини збоїв
  cytata: |
    З manual/28-analizator.md, рядок 25:
    "Просідання нижче 3.0 В — причина ваших «незрозумілих глюків» (розділ 06)."

    Зі esp32-datasheet.pdf, Table 5-2:
    Примітка 2 до VDDA, VDD3P3_RTC, VDD3P3, VDD_SDIO (3.3 V mode):
    "Chips with a 3.3 V flash or PSRAM in-package: this minimum voltage is 3.0 V"

    Table 5-4 показує споживання: пік до 240 мА при передачі.
  sposib: >-
    Аналіз текстури книги, cross-reference з datasheet, 2026-08-26
  notatka: >-
    Клас B, тому що висновок випливає однозначно з поєднання двох фактів:
    мінімуму 3.0 В для стабільної роботи та піків споживання струму.
    Просідання живлення причиняє reset або некоректну роботу логіки.

- nazva: "T-28-019: На лініях I²C у спокої має бути 3.3 В від pull-up резисторів"
  zbih: 'I²C.*спокої.*3\.3 В|лініях I²C.*підтягува'
  klas: A
  dzherelo: >-
    ESP32 Series Datasheet v5.3, Table 5-3 «DC Characteristics», VOH і RP параметри;
    NXP UM10204 «I²C-bus specification and user manual», розділ про pull-up
  cytata: |
    З manual/28-analizator.md, рядок 31-33:
    "Логічний рівень у спокої. На лініях I²C у спокої має бути 3.3 В (це
    роблять підтягувальні резистори). Нуль означає, що підтягування немає або
    лінія кимось притиснута — і шина не працюватиме ніколи."

    Зі esp32-datasheet.pdf, Table 5-3:
    VOH · High-level output voltage  |  0.8 × VDD  |  —  |  —  |  V
    RPU · Resistance of internal pull-up resistor  |  —  |  45  |  —  |  kΩ

    З i2c-um10204.pdf, Figure 3 і розділ про pull-up:
    "Both SDA and SCL are bidirectional lines, connected to a positive supply
    voltage via a current-source or pull-up resistor ... When the bus is free,
    both lines are [HIGH]"
  sposib: >-
    Книга, esp32-datasheet.pdf таблиця 5-3, i2c-um10204.pdf,
    pdftotext -layout, 2026-08-26
  notatka: >-
    Обов'язкова статична умова для I²C: лінії в спокої повинні бути в стані
    HIGH (3.3 В при живленні 3.3 В). Це забезпечують pull-up резистори.
    Відсутність 3.3 В на лінії в спокої — ознака проблеми з підтягуванням.

- nazva: "T-28-024: Мультиметр показує середнє, швидкий сигнал виглядає як середина 0…3.3 В"
  zbih: 'Мультиметр.*середнє|сотні тисяч разів.*0 і 3\.3 В'
  klas: A
  dzherelo: >-
    ESP32 Series Datasheet v5.3, Table 5-3 «DC Characteristics» про перехідні
    часи і частоти комутації
  cytata: |
    З manual/28-analizator.md, рядок 38-42:
    "Мультиметр показує **середнє** значення. Сигнал, що перемикається сотні
    тисяч разів на секунду, покаже щось посередині між 0 і 3.3 В — і це
    нормально, а не несправність. Мультиметром перевіряють статику: живлення,
    контакт, рівень у спокої. Динаміку — іншими приладами."

    Зі esp32-datasheet.pdf, Table 5-3 — параметри перехідних часів та частот
    роботи цифрових виходів підтримують швидкі комутації на мегагерцових
    частотах, що пояснює збільшене показання мультиметра.
  sposib: >-
    Текст книги, логіка вимірювань мультиметра, 2026-08-26
  notatka: >-
    Інформативна порада про обмеження мультиметра. Цифрові сигнали на
    мегагерцових частотах мультиметр не може відслідкувати, він показує
    середнє значення. Це нормально й не означає несправність.

- nazva: "T-28-041: Лінії не піднімаються до 3.3 В — немає підтягування або завелике"
  zbih: 'лінії не піднімаються до 3\.3 В|немає підтягування.*завелике'
  klas: A
  dzherelo: >-
    NXP UM10204 «I²C-bus specification», розділ про pull-up резистори й
    rise time, параметри VOL, VOH
  cytata: |
    З manual/28-analizator.md, рядок 71 (таблиця I²C аналізатора):
    "| лінії не піднімаються до 3.3 В | немає підтягування або воно завелике |"

    З i2c-um10204.pdf, розділ про pull-up devices:
    "Pull-up resistors Rp maintain the SDAH and SCLH lines at a HIGH level when
    the bus is free and ensure that the signals are pulled up from a LOW to a
    HIGH level within the [specified rise time]."

    "For bus loads between 200 pF and 400 pF, the pull-up device can be a current
    source (3 mA [recommended])"
  sposib: >-
    Таблиця z manual/28-analizator.md, i2c-um10204.pdf, pdftotext, 2026-08-26
  notatka: >-
    Діагностичний висновок: якщо лінія не сягає 3.3 В в спокої, причина
    одна з двох — либо pull-up відсутній, либо його опір/струм недостатні
    для навантаження на шині.

- nazva: "T-28-063: Практичний порядок пошуку — крок 3: чи піднято лінії до 3.3 В"
  zbih: 'Рівень у спокої.*Чи піднято лінії'
  klas: A
  dzherelo: >-
    ESP32 Series Datasheet v5.3, логічні рівні й параметри живлення;
    також розділ 35 про I²C сканер
  cytata: |
    З manual/28-analizator.md, рядок 120-127 (практичний порядок):
    "Коли периферія не працює, порядок такий — від дешевого до дорогого:
    1. Живлення пристрою.
    2. Спільна земля.
    3. **Рівень у спокої.** Чи піднято лінії до 3.3 В."
  sposib: >-
    Текст manual/28-analizator.md, рядки 120-127, 2026-08-26
  notatka: >-
    Кроки 1–3 закривають дев'ять з десяти проблем. Перевірка рівня в спокої —
    третій крок діагностики, статичний параметр, який можна виміряти
    мультиметром перед тим, як залучати складніші прилади.
