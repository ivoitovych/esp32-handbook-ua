- nazva: SSD1306 — монохромний дисплей
  zbih: OLED SSD1306 · Кольори → моно
  klas: A
  dzherelo: Solomon Systech, SSD1306 Advance Information (Rev 1.1, Apr 2008), розділ 8.7 «Graphic
    Display Data RAM (GDDRAM)»
  cytata: '8.7    Graphic Display Data RAM (GDDRAM)

    The GDDRAM is a bit mapped static RAM holding the bit pattern to be displayed. The size
    of the RAM is

    128 x 64 bits and the RAM is divided into eight pages, from PAGE0 to PAGE7, which are
    used for

    monochrome 128x64 dot matrix display, as shown in Figure 8-13.

    '
  sposib: PDF Solomon Systech, кеш `ssd1306.pdf`, реєстр `factcheck/DZHERELA-m2.md`, pdftotext
    -layout, 2026-08-26
  notatka: '«Монохромний» підтверджено дослівно словом «monochrome» в описі самого кадрового
    буфера, а не лише випливає з назви OLED-панелі. Побічне: розмір GDDRAM — рівно 128×64
    біт, один біт на піксель, що й відповідає роздільності 128×64, яку книга в розділі 46
    і додатку E не називає числом (хоча вона корисніша за розмір у дюймах — саме вона визначає,
    що кадровий буфер SSD1306 займає лише 1 КБ проти 150 КБ в кольорового TFT такого ж класу,
    розділ 46 книги про це не згадує). У самій книзі числової роздільності немає, тож окремої
    одиниці для неї в реєстрі не існує.'
