# Прохід 8 — strapping-піни й розшифровка boot: у логу.
#
# Джерело — документація esptool про вибір режиму завантаження. Вона
# описує саме те, що бачить читач у консолі, і виявилася найщільнішим
# першоджерелом з усіх, знайдених за вісім проходів.
#
# Прохід підтвердив два попередні виправлення дослівно й дав одне
# доповнення, яке змінює діагностику цілого класу несправностей.

- nazva: Strapping-піни за сімействами
  zbih: 'strapping.{0,120}`GPIO0`|`GPIO0`, `GPIO2`, `GPIO5`, `GPIO12`, `GPIO15`|`GPIO9` притиснутий|`GPIO8` при цьому|`GPIO46`'
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esptool/master/docs/en/advanced-topics/boot-mode-selection.rst
  cytata: |
    {IDF_TARGET_STRAP_BOOT_GPIO:default="GPIO9", esp8266="GPIO0", esp32="GPIO0",
     esp32s2="GPIO0", esp32s3="GPIO0", esp32p4="GPIO35", esp32c5="GPIO28",
     esp32h21="GPIO14", esp32h4="GPIO14"}
    {IDF_TARGET_STRAP_BOOT_2_GPIO:default="GPIO8", esp32="GPIO2", esp32s2="GPIO46",
     esp32s3="GPIO46", esp32p4="GPIO36", esp32c5="GPIO27", esp32h21="GPIO13",
     esp32h4="GPIO13"}
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: >-
    Підтверджує головні піни входу в download mode для всіх сімейств
    книги: `GPIO0` на classic, S2 і S3; `GPIO9` на C3 (значення
    `default`), із другим піном `GPIO8`. Збігається з розділом 07,
    карткою К9 і додатком A.

    Заразом видно, що для P4, C5 і H4 піни зовсім інші (`GPIO35`,
    `GPIO28`, `GPIO14`) — ще один доказ того, що правило «і новіші»,
    виправлене в проході 1 для адреси бутлоадера, не працює й для пінів.

- nazva: "boot: у логу — бітова маска станів strapping-пінів"
  zbih: 'бітова маска регістра `GPIO_STRAP`|маска рівнів на\s*strapping|`0x20`.{0,80}`GPIO12`|Саме число після `boot:`|Саме \*\*число\*\* після `boot:`|`GPIO4` не керує режимом завантаження|його рівень чип фіксує|`0x04`.{0,40}`GPIO4`|`boot:0x13`|`boot:0x3`'
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esptool/master/docs/en/advanced-topics/boot-mode-selection.rst
  cytata: |
    ``boot:0xNN (DESCRIPTION)`` is the hex value of the strapping pins, as represented
    in the `GPIO_STRAP register <…/components/soc/{IDF_TARGET_PATH_NAME}/include/soc/gpio_reg.h>`__.

    The individual bit values are as follows:

    .. only:: esp32

       -  ``0x01`` - GPIO5
       -  ``0x02`` - MTDO (GPIO15)
       -  ``0x04`` - GPIO4
       -  ``0x08`` - GPIO2
       -  ``0x10`` - GPIO0
       -  ``0x20`` - MTDI (GPIO12)
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: >-
    Доповнення проходу, і найцінніше за всі вісім. Книга друкувала
    `boot:0x13` у кожному прикладі логу й пояснювала лише текст у дужках,
    ніби число службове. Насправді це прямий вимір: які рівні чип
    зафіксував на strapping-пінах у момент скидання.

    Практичний наслідок великий. Уся книга повторює, що зовнішня обв'язка
    на strapping-піні дає загадкові збої, і радить її знімати — методом
    здогадки. Тепер це читається з логу: виставлений біт `0x20` означає
    `GPIO12` високий, тобто флеш на 1.8 В і мовчазна плата. Перевірка
    коштує нуль і не потребує приладів.

    Арифметика сходиться на обох типових значеннях: `0x13` = 0x01+0x02+0x10
    (GPIO5, GPIO15, GPIO0 високі) — норма; `0x3` = 0x01+0x02, тобто те
    саме без `GPIO0` — download mode.

    Додано розгорнуто в додаток D і стисло на картку К6.

- nazva: GPIO12 високий дає VDDSDIO 1.8 В і brownout тривольтового флешу
  zbih: 'VDDSDIO|найзліший пін|напругу внутрішнього стабілізатора|флеш \*\*тривольтовий\*\*|GPIO ?12[^\n]{0,80}1\.8 ?В|1\.8 ?В[^\n]{0,60}GPIO ?12|напругу живлення флешу|перемикає флеш на 1\.8|флеш живиться 1\.8|флеш отримує 1\.8|MTDI[^\n]{0,60}(?:1\.8|напруг)'
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esptool/master/docs/en/advanced-topics/boot-mode-selection.rst
  cytata: |
    :esp32: -  VDDSDIO has been enabled at 1.8V (due to MTDI/GPIO12, see above),
            but this flash chip requires 3.3V so it's browning out.
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: >-
    Дослівне підтвердження механізму, доданого в розділ 07 у проході 6 за
    Kconfig бутлоадера. Тут те саме сказано з боку симптому: не «плата
    не стартує», а «флеш вимагає 3.3 В і провалюється по живленню».
    Формулювання книги («на переважній більшості модулів флеш
    тривольтовий») тепер спирається на джерело, а не лише на висновок.

    Це рідкісний випадок, коли два незалежні першоджерела Espressif —
    Kconfig ESP-IDF і документація esptool — описують ту саму пастку з
    різних боків, і обидва доступні звідси.
