# Черга з названим, але недосяжним джерелом — 26-zboyi.
#
# Посаджено `tools/posadka_c.py`. Клас `C` — розписка з
# адресою, не доказ: документ названо, звідси не дістати.
# Чесніше за `F` («ніхто не дійшов») рівно на одне —
# тут відомо, що саме замовляти.

- nazva: 'T-26-042: Наслідок практичний і неприємний: лог з C3, знятий'
  zbih: 'Наслідок\s+практичний\s+і\s+неприємний:'
  klas: C
  dzherelo: ESP32-C3 Series — поведінка backtrace при screen/picocom
  shukaty: ESP32-C3 Series — поведінка backtrace при screen/picocom
  sposib: Розбір черги 2026-08-27. Документ названо розбором як конкретну деталь або стандарт
    із номером; звідси він недосяжний (даташити мікросхем на GitHub не лежать, платні стандарти
    — ніде публічно). Клас `C` означає «джерело назване, цитати немає», а **не** «перевірено».
  notatka: цитати немає; що саме шукати — у полі `shukaty`
