# Прохід 35 — шматок 7 пулу, і власна помилка проходу 26.
#
# Прохід дав одне виправлення, і виправляти довелося **себе**: абзац,
# доданий у проході 26 як доповнення, виявився хибним у двох випадках із
# трьох. Причому хибним рівно так, як прохід 26 сам і описав — «напрямок
# висновку при правильних числах».
#
# Одна знахідка агента натомість відхилена: перевірка показала, що книга
# права, а звіт її неправильно прочитав. Записую обидві, бо реєстр без
# відхилених знахідок був би вітриною, а не інвентаризацією.

- nazva: Коди RESET_REASON — уся таблиця причин скидання
  zbih: 'Числові коди з ROM-заголовка ESP-IDF \(enum `RESET_REASON`\)|POWERON_RESET \| подано живлення|SW_CPU_RESET \| програмне скидання ядра|RTCWDT_BROWN_OUT_RESET \| \*\*просіло живлення\*\*'
  klas: A
  dzherelo: >-
    https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/esp_rom/esp32/include/esp32/rom/rtc.h
  cytata: |
    typedef enum {
        NO_MEAN                =  0,
        POWERON_RESET          =  1,    /**<1, Vbat power on reset*/
        SW_RESET               =  3,    /**<3, Software reset digital core*/
        OWDT_RESET             =  4,    /**<4, Legacy watch dog reset digital core*/
        DEEPSLEEP_RESET        =  5,
        SDIO_RESET             =  6,    /**<6, Reset by SLC module*/
        TG0WDT_SYS_RESET       =  7,
        TG1WDT_SYS_RESET       =  8,
        RTCWDT_SYS_RESET       =  9,
        INTRUSION_RESET        = 10,
        TGWDT_CPU_RESET        = 11,
        SW_CPU_RESET           = 12,
        RTCWDT_CPU_RESET       = 13,
        EXT_CPU_RESET          = 14,    /**<14, for APP CPU, reset by PRO CPU*/
        RTCWDT_BROWN_OUT_RESET = 15,    /**<15, Reset when the vdd voltage
                                              is not stable*/
        RTCWDT_RTC_RESET       = 16
    } RESET_REASON;
  sposib: >-
    curl raw.githubusercontent через агента пулу (шматок 7), 2026-08-26;
    взірець і клас — М1
  notatka: >-
    Усі шістнадцять рядків таблиці додатка D звірено поштучно з
    переліком у ROM-заголовку: і числа, і назви, і те, що `0xf` — це
    саме нестабільна напруга живлення («Reset when the vdd voltage is
    not stable»).

    Це закриває найдовшу таблицю додатка одним доказом і, головне,
    підтверджує три значення, які книга називає найчастішими: `0x1`
    норма, `0xc` після паніки, `0xf` живлення.

- nazva: "ROM класифікує boot: значення цілком, а не пін за піном"
  zbih: 'Далі значення не розшифровуються, і це свідоме рішення|ETS_IS_FLASH_BOOT|дивіться на рядок у дужках'
  klas: A
  dzherelo: >-
    https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/soc/esp32c3/include/soc/boot_mode.h
  cytata: |
    #define IS_1XXX(v)   (((v)&0x08)==0x08)
    #define IS_00XX(v)   (((v)&0x0c)==0x00)
    #define IS_0100(v)   (((v)&0x0f)==0x04)

    #define ETS_IS_FLASH_BOOT()  (IS_1XXX(BOOT_MODE_GET()) || \
                                  IS_0100(BOOT_MODE_GET()))
    #define ETS_IS_JOINT_DOWNLOAD_BOOT()  IS_00XX(BOOT_MODE_GET())
    #define ETS_IS_UART_BOOT()   IS_0111(BOOT_MODE_GET())
  sposib: >-
    знайдено агентом пулу (шматок 7), перевірено М1 власним curl,
    2026-08-26
  notatka: >-
    **Виправлення власної помилки проходу 26, і найнеприємніше за весь
    фактчекінг.**

    У проході 26 я додав у додаток D розшифровку: «на C3 `boot:0xc` —
    обидва високі, звичайний старт; `boot:0x4` — коректний вхід у
    download mode», і окремо «`boot:0x0` — та сама недійсна комбінація».

    Два з трьох тверджень хибні. За власними макросами ROM `0x4` — це
    `IS_0100`, тобто **флеш-завантаження**, а `0x0` — `IS_00XX`, тобто
    **завантаження**, і жодної «недійсної комбінації» в цій класифікації
    немає.

    Як це сталося. Я взяв таблицю «біт — пін» із документації esptool,
    склав із правилами strapping розділу 07 і вивів значення. Обидва
    джерела правильні; **висновок із їхнього складання — ні**. Місток
    між рівнем пінів і класифікацією значень лежить у technical
    reference manual, якого звідси немає, і я цього не помітив.

    Це рівно та вада, яку прохід 26 сам і назвав: правильні числа,
    хибний напрямок висновку. Назвати її й одразу вчинити — гірше, ніж
    не назвати.

    Виправлено вилученням розшифровки. Замість неї в книзі стоїть
    пояснення, чому її там немає, і порада дивитися на рядок у дужках,
    який друкує сам `esptool`. Формулювання заведено в
    `factcheck/SPROSTOVANE.md`.

- nazva: Порядок читання backtrace — знахідку відхилено
  zbih: 'ланцюжок `адреса:стек`, читати знизу вгору|Нижній кадр — де почалося, верхній — де впало|Читати \*\*знизу вгору\*\*: нижні кадри — хто викликав'
  klas: A
  dzherelo: >-
    https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/docs/en/api-guides/fatal-errors.rst
  cytata: |
    Backtrace: 0x400e14ed:0x3ffb5030 0x400d0802:0x3ffb5050
    0x400e14ed: app_main at /Users/user/esp/example/main/main.cpp:36

    0x400d0802: main_task at /Users/user/esp/esp-idf/components/…/cpu_start.c:470
  sposib: >-
    перевірено М1 власним curl після знахідки агента пулу (шматок 7),
    2026-08-26
  notatka: >-
    **Знахідку агента відхилено, і причина варта запису.**

    Агент навів речення з `fatal-errors.rst` — «Fatal error location is
    the top line, and subsequent lines show the call stack» — і зробив
    висновок, що книга радить читати в протилежний бік.

    Це не так. Книга каже: «Нижній кадр — де почалося, верхній — де
    впало». Тобто про **розташування** кадрів книга каже те саме, що
    джерело: збій угорі, зовнішній виклик унизу. Розшифрований приклад це
    підтверджує дослівно — `app_main` (де впало) стоїть першим,
    `main_task` (хто викликав) під ним.

    Розходиться не факт, а **порада, з якого кінця починати**. ESP-IDF
    радить починати з верхнього рядка, книга — простежити ланцюг від
    початку виконання. Обидві поради сумісні з тією самою розкладкою.

    Лишаю як є: для того, хто вперше бачить backtrace, рух від відомого
    (звідки все почалося) до невідомого (де впало) зрозуміліший. Але
    записую сам факт розбіжності порад — якщо колись знадобиться, у
    книзі є місце для одного речення про рекомендацію ESP-IDF.

    Ширший висновок для роботи з пулом: **звіт агента — знахідка, а не
    вирок**. Три з чотирьох його розбіжностей були справжні; ця — ні, і
    відрізнити можна було лише повторною перевіркою джерела.
