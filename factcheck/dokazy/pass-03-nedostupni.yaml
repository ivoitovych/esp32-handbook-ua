# Прохід 3 — твердження, першоджерела яких недосяжні з цього середовища.
#
# Клас C і тільки C. Правило схеми діє без винятків: поле `cytata` тут
# порожнє скрізь, бо жоден із цих документів у цій сесії не відкривався.
# Замість цитати — `shukaty`: що саме в документі підтвердить твердження.
#
# Це не «недороблено». Це підготовлена робота: `tools/factcheck.py blocked`
# зводить її в наряд `factcheck/NARYAD-nedostupni.md`, придатний віддати
# людині з відкритим доступом.
#
# Окрема чесна поправка. У `docs/fakty.md` запис про MAX17048 посилається
# на сторінку Analog Devices так, ніби її відкривали. Насправді відомості
# прийшли з пошукового переказу, а не з документа. Тут це зафіксовано як
# клас C — саме так, як воно є.

- nazva: BME280 — карта регістрів і формули компенсації
  zbih: 'BME280|BMP280|REG_CALIB|dig_H\d|ctrl_hum|ctrl_meas|0x(?:D0|60|F5|F4|F2)(?![0-9A-Fa-f])'
  klas: C
  dzherelo: https://www.bosch-sensortec.com/ (BME280 Datasheet, BST-BME280-DS002)
  shukaty: >-
    розділ «Register description»: адреси 0xD0 (id = 0x60), 0xE0, 0xF2
    (ctrl_hum), 0xF4 (ctrl_meas), 0xF5 (config, біти 7–5 t_sb, 4–2 filter,
    0 spi3w_en), 0xF7 (дані); блоки калібрування 0x88–0xA1 і 0xE1–0xE7,
    включно з упаковкою dig_H4 і dig_H5 у спільний байт 0xE5; розділ
    «Compensation formulas» — цілочислові версії для T, P, H і формати
    Q, у яких повертається результат.
  notatka: >-
    Найбільша група в книзі, що впирається в недосяжне джерело: увесь
    драйвер проєкту 59 і рекомендації розділів 44 і 45. Формули були
    звірені рядок у рядок у сесії рецензування 05 — але за знанням, а не
    за відкритим документом, тож клас тут C. Проміжний шлях до класу B:
    референсний драйвер `BoschSensortec/BME280_driver` на GitHub — той
    самий код від того самого автора; його спробує наступний прохід.

- nazva: DS18B20 — час перетворення, діапазон, роздільність
  zbih: 'DS18B20|750 мс|94 мс|−127|64-бітний адресний код|паразитне живлення'
  klas: C
  dzherelo: https://www.analog.com/ (DS18B20 Datasheet, Maxim Integrated)
  shukaty: >-
    таблиця часу перетворення за роздільністю (9 біт ≈ 93.75 мс,
    12 біт ≈ 750 мс); робочий діапазон −55…+125 °C; налаштування
    роздільності 9–12 біт; вимога підтягувального резистора 4.7 кОм;
    розділ про паразитне живлення й обмеження на кількість пристроїв;
    64-бітний унікальний ROM-код.
  notatka: >-
    Значення −127 °C, яке книга називає кодом помилки, у datasheet
    відсутнє: це домовленість бібліотеки `DallasTemperature`
    (`DEVICE_DISCONNECTED_C`). Окремий пункт для наступного проходу —
    його можна закрити класом A з GitHub, бо бібліотека відкрита.

- nazva: Специфікація I²C — адресація, ємність шини, режими
  zbih: '7-бітна|112|зарезервовано 16|ємність\w* шини|100 кГц і 400 кГц|open-drain'
  klas: C
  dzherelo: https://www.nxp.com/docs/en/user-guide/UM10204.pdf (I²C-bus specification and user manual)
  shukaty: >-
    розділ адресації: 7-бітний простір, перелік зарезервованих адрес
    (0000 XXX і 1111 XXX — разом 16), звідки 112 придатних; таблиця
    режимів Standard-mode 100 кбіт/с і Fast-mode 400 кбіт/с; граничне
    значення ємності шини 400 пФ і його зв'язок із номіналом підтяжки;
    визначення clock stretching.
  notatka: >-
    Число 112 з'явилося в розділі 35 у сесії рецензування 04 на заміну
    вигаданим «до сорока пристроїв». Арифметика 128 − 16 очевидна, але
    сам перелік зарезервованих адрес — зі специфікації, і його треба
    звірити.

- nazva: Bluetooth Core — типовий ATT MTU
  zbih: 'ATT MTU|23\s*байт|20 байтів'
  klas: C
  dzherelo: https://www.bluetooth.com/specifications/specs/ (Core Specification, Vol. 3, Part F — ATT)
  shukaty: >-
    визначення ATT_MTU за замовчуванням для LE (23 байти) і розмір
    заголовка операції запису/сповіщення (3 байти), звідки 20 байтів
    корисних даних; процедура Exchange MTU.
  notatka: >-
    Проміжний шлях до класу B: константи стеків NimBLE й Bluedroid у
    самому ESP-IDF, які дістаються. Наступний прохід спробує саме це.

- nazva: Datasheet ESP32 — електричні межі, струми, температура
  zbih: '40 мА|20 мА|абсолютна межа струму|−40 до \+85|Recommended Operating Conditions|десятки мкА|сотні мА, короткими сплесками'
  klas: C
  dzherelo: https://www.espressif.com/en/support/documents/technical-documents (ESP32 Series Datasheet)
  shukaty: >-
    розділ «Recommended Operating Conditions»: гранично допустимий струм
    на пін (40 мА) і типова сила драйвера за замовчуванням; робочий
    діапазон температур; таблиця споживання за режимами (deep sleep,
    light sleep, modem sleep, активний, пік передачі Wi-Fi).
  notatka: >-
    Найважливіша недосяжна група після BME280: на цих числах стоять
    розділи 05, 06 і 47, тобто вся частина про живлення. Частина
    закривається обхідним шляхом — `gpio_set_drive_capability` у
    ESP-IDF описує рівні сили драйвера, — і це завдання наступного
    проходу.

- nazva: Трансивери CAN і RS-485 — рівні живлення й логіки
  zbih: 'SN65HVD230|TJA1050|MCP2551|MAX485|SP3485'
  klas: C
  dzherelo: https://www.ti.com/ та https://www.analog.com/ (datasheet відповідних трансиверів)
  shukaty: >-
    напруга живлення й рівні логічних входів/виходів кожного:
    SN65HVD230 (3.3 В), TJA1050 і MCP2551 (5 В, рівень виходу RX),
    MAX485 (5 В) і його 3.3-вольтові аналоги на кшталт SP3485/MAX3485.
  notatka: >-
    Твердження книги «5-вольтовий трансивер може спалити пін ESP32»
    спирається саме на рівень виходу RX і на те, що вхід ESP32 не
    толерантний до 5 В. Обидві половини потребують окремих datasheet.

- nazva: Li-ion і TP4056 — напруги, ємність, захист
  zbih: '4\.2 В|3\.7 В|2\.5–3\.0 В|18650|TP4056|DW01|не заряджати нижче 0'
  klas: C
  dzherelo: https://www.analog.com/ (TP4056 і DW01 datasheet) та специфікації виробників елементів 18650
  shukaty: >-
    для TP4056: типовий струм заряджання і резистор, яким він задається;
    склад варіанта із захистом (DW01 плюс подвійний MOSFET) і що саме він
    захищає. Для елементів: напруга повного заряду 4.2 В, номінальна
    3.7 В, межа розряду, заборона заряджання нижче 0 °C і її причина
    (металізація літію).
  notatka: >-
    Розділ 53 — найризикованіший у книзі з погляду наслідків, тож ця
    група має бути закрита першою, щойно з'явиться доступ.

- nazva: Паливоміри акумулятора — MAX17048 проти лічильників кулонів
  zbih: 'MAX17048|ModelGauge|лічильник кулонів|LTC294\d|MAX17260'
  klas: C
  dzherelo: https://www.analog.com/en/products/max17048.html (MAX17048/MAX17049 Datasheet)
  shukaty: >-
    підтвердження, що ModelGauge працює **без шунта** й не веде обліку
    кулонів («does not require coulomb counting», «eliminates
    current-sense resistor»); для протиставлення — наявність шунта в
    LTC2941/LTC2942 і MAX17260.
  notatka: >-
    Чесна поправка до власного реєстру. Виправлення розділу 53 у сесії
    рецензування 05 спиралося на **пошуковий переказ**, а не на
    відкритий datasheet, і в `docs/fakty.md` записане з посиланням на
    сторінку продукту так, наче її читали. Саме виправлення правильне —
    MAX17048 справді модельний паливомір, — але клас доказу тут C, і
    зафіксувати це чесніше, ніж лишити видимість класу A.

- nazva: Дисплеї — зсув SH1106 і адреси I²C-модулів
  zbih: 'SH1106|SSD1306|зсунут\w+ на два пікселі|`0x(?:3C|76|77|68|23|29|40|20|70|50|44|28)`'
  klas: C
  dzherelo: datasheet відповідних мікросхем (Solomon Systech, Bosch, Sensirion, ROHM, ST, TI, Microchip)
  shukaty: >-
    для SH1106 — розмір внутрішньої відеопам'яті (132 стовпці проти 128
    у SSD1306), звідки береться зсув на два пікселі; для решти —
    таблиця адрес I²C і піни вибору адреси в кожному datasheet.
  notatka: >-
    Покриває таблицю адрес у додатку E й таблицю дисплеїв у розділі 46 —
    десятки окремих тверджень, кожне з яких перевіряється швидко, але
    лише за наявності доступу.

- nazva: LoRa SX127x і SX126x — параметри модуляції
  zbih: 'Spreading Factor|SF.{0,10}(7|12)|SX127|SX126|RFM95'
  klas: C
  dzherelo: https://www.semtech.com/ (SX1276/SX1262 Datasheet)
  shukaty: >-
    діапазон Spreading Factor (7…12) і його вплив на час передачі й
    чутливість; допустимі значення Bandwidth і Coding Rate; вимога
    узгодженого навантаження на виході передавача.
  notatka: >-
    Твердження «ніколи не вмикати передавач без антени» в розділі 43
    подано як категоричне, і воно таким і лишається — але підстава для
    нього має бути в datasheet, а не в фольклорі.

- nazva: Ступені захисту IP
  zbih: 'IP20|IP54|IP65|IP67|Ступінь захисту'
  klas: C
  dzherelo: IEC 60529 (Degrees of protection provided by enclosures, IP Code)
  shukaty: >-
    таблиця першої цифри (тверді тіла) і другої (вода); зокрема точне
    формулювання IP65 (струмені) та IP67 (тимчасове занурення, глибина й
    тривалість).
  notatka: >-
    Стандарт платний, і це окремий випадок: він не «недосяжний через
    egress», а недосяжний за суттю. Практично закривається за
    авторитетним вторинним джерелом із явною позначкою, що це вторинне.

# ⚠ ВЗІРЕЦЬ БУВ ШИРОКИЙ І ЗАСТАРІЛИЙ — звужено в проході 37.
#
# Голі назви `RP2040`, `STM32`, `Raspberry Pi` збігалися з усією
# відповідною колонкою. Гірше: клас `C` означає «джерело недосяжне», а
# джерела вже в кеші М2 — тобто реєстр оголошував недосяжним те, що
# перевірене, і `C` як сильніший клас перекривав чесніші `E` і `A`
# сусідніх доказів.
#
# Лишаю лише ті числа, яких досі ніхто не звірив.
- nazva: Порівняльна таблиця — числа, ще не звірені жодною стороною
  # Взірець перев'язано 2026-08-27. Попередній шукав `24–550 МГц`,
  # `Raspberry Pi 4` і `1.5 ГГц` — жодного з цих формулювань у книзі
  # більше немає: рядок переписано на `24 МГц – сотні МГц`, `133 МГц`,
  # `понад 1 ГГц`, а «Pi 4» стало просто «Raspberry Pi».
  #
  # Доказ від цього став **холостим** — і це правильна поведінка, а не
  # вада. Прив'язка навмисно крихка: правка прози відчіплює доказ, і
  # реєстр перестає ручатися за формулювання, якого вже немає. Гірший
  # варіант — взірець настільки широкий, що переживає будь-яку правку й
  # мовчки ручається за що завгодно.
  #
  # Знайшов це аудит покриття, який М2 лишили незробленим: 58 холостих
  # доказів, і один із них мій.
  zbih: '24 МГц – сотні МГц|\| 133 МГц \||понад 1 ГГц'
  klas: C
  dzherelo: >-
    https://datasheets.raspberrypi.com/rp2040/rp2040-datasheet.pdf,
    ATmega328P datasheet (Microchip), лінійка STM32 (ST)
  shukaty: >-
    RP2040: максимальна тактова частота 133 МГц і обсяг SRAM 264 КБ;
    ATmega328P: 16 МГц і 2 КБ SRAM; STM32: нижня і верхня межі частот у
    лінійці (від F0 до H7).
  notatka: >-
    Таблиця розділу 01 порівнює ESP32 з чужими платформами, і числа в
    ній — чужі. Помилка тут не зіпсує плату, але підриває довіру до
    решти, тож група лишається в наряді.

- nazva: Припої та інструмент
  zbih: 'Sn63Pb37|Sn60Pb40|300–320 °C|безсвинцев'
  klas: C
  dzherelo: специфікації виробників припою (наприклад, ряд IEC 61190-1-3)
  shukaty: >-
    температура плавлення евтектичного Sn63Pb37 (183 °C) і Sn60Pb40;
    типова температура жала для ручного паяння; на скільки вища вона для
    безсвинцевих сплавів.
