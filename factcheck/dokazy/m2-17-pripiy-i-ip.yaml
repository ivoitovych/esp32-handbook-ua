# М2, крок 7 — розділи 51 (паяння) і 54 (корпус). Обидва мої.
#
# Два джерела різної долі. Припій закрився з першого разу — виробники
# публікують таблиці сплавів вільно. Стандарт IEC 60529 платний, і це
# **четвертий** стан «недосяжного», якого не було в моїй класифікації:
# не мережа, не фільтр проти інструмента, не «джерела не існує», а
# «джерело існує, авторитетне, і коштує грошей».

- nazva: Свинцевий припій плавиться нижче за безсвинцевий
  zbih: 'Припій зі свинцем \(Sn63Pb37 або Sn60Pb40\)'
  klas: A
  dzherelo: >-
    Kester (ITW), Alloy Temperature Chart —
    https://www.kester.com/Portals/0/Documents/Knowledge%20Base/Alloy%20Temperature%20Chart.pdf
  cytata: |
    Kester Solder Alloys
    Alloy              Melting Range °C
      Sn63Pb37             183
      Sn60Pb40             183-190
    LEAD-FREE
      Sn96.5Ag3Cu0.5       217-220     (SAC305)
      Sn96.5Ag3.5          221
      Sn99.3Cu0.7          227
  sposib: >-
    PDF Kester, кеш `kester-alloys.pdf`, реєстр `factcheck/DZHERELA-m2.md`,
    pdftotext -layout, 2026-08-26
  notatka: >-
    Обидва сплави книги названо в таблиці виробника поіменно.
    `Sn63Pb37` має **одне** число — 183 °C, без діапазону: це евтектика,
    тобто сплав переходить із твердого в рідкий без проміжного
    тістоподібного стану. `Sn60Pb40` уже 183-190 °C. Саме тому перший
    «прощає більше помилок»: немає інтервалу, у якому з'єднання можна
    зрушити й дістати холодну пайку.

    Порівняння з безсвинцевим підтверджується числами: 217-227 °C проти
    183, тобто на 34-44 °C вище. Це закриває й сусіднє твердження
    розділу 51 «безсвинцевий — на 30-40 градусів більше»: інтервал книги
    майже точно збігається з різницею точок плавлення.

- nazva: Безсвинцевий потребує на 30-40 °C більше
  zbih: 'Безсвинцевий — на 30–40 градусів більше\.'
  klas: B
  dzherelo: >-
    Kester (ITW), Alloy Temperature Chart — рядки `Sn63Pb37` і
    сімейство `LEAD-FREE`
  cytata: |
      Sn63Pb37             183
      Sn96.5Ag3Cu0.5       217-220
      Sn96.5Ag3.5          221
      Sn99.3Cu0.7          227
  sposib: >-
    PDF Kester, кеш `kester-alloys.pdf`, pdftotext -layout, 2026-08-26
  notatka: >-
    Клас `B`: книга говорить про температуру **жала**, а таблиця дає
    температуру **плавлення сплаву**. Це різні величини — жало ставлять
    вище за точку плавлення.

    Але різниця між ними переноситься: 217-227 проти 183 дає 34-44 °C,
    і книжкове «на 30-40 градусів більше» лягає в цей інтервал. Тобто
    підтверджено саме **різницю**, а не абсолютні 300-320 °C.

    Абсолютна температура жала лишається незвіреною: її не буває в
    таблиці сплавів, вона належить до практики паяння й документів на
    паяльні станції. Це окреме джерело, і його я не брав.
