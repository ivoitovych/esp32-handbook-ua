- nazva: T-E-067 — NRF24L01 · радіо 2.4 ГГц
  zbih: NRF24L01.*радіо 2\.4 ГГц
  klas: C
  dzherelo: Nordic Semiconductor, nRF24L01+ Product Specification — розділ Features, діапазон 2.400–2.4835
    ГГц
  notatka: 'Таблиця інтерфейсів (додаток e-interfeysy.md) описує NRF24L01 як радіомодуль на 2.4 ГГц. Це
    технічна специфікація самого модуля. | Було E — «зовнішнього джерела не існує». Названо конкретну
    деталь чи стандарт, отже документ існує, і його просто немає в кеші. Це визначення класу C. Різниця
    не формальна: E ховає одиницю з наряду назавжди, C лишає її в наряді з полем shukaty.'
  shukaty: 'nrf24l01p datasheet: infocenter.nordicsemi.com'
- nazva: T-D-025 — `0x8` код помилки, watchdog таймера 1
  zbih: \| `0x8` \| TG1WDT_SYS_RESET
  klas: A
  dzherelo: 'ESP-IDF компонент esp_system, rtc.h: https://github.com/espressif/esp-idf/blob/master/components/esp_system/include/esp_system/rtc.h'
  cytata: 'TG1WDT_SYS_RESET = 8,    /**<8, Timer Group1 Watch dog reset digital core*/

    '
  sposib: curl з github.com/espressif/esp-idf, grep з rtc.h, 2026-08-26
  notatka: Код 0x8 прямо визначений у rtc.h як TG1WDT_SYS_RESET.
- nazva: T-Z-123 — GPIO6 у індексі
  zbih: GPIO6 — 21, 27, 53, 73, 76, 154, 182, 335, 349, 369
  klas: E
  dzherelo: Не застосовується
  notatka: Це внутрішній індекс, посилання на розділи самої книги. Не потребує зовнішнього джерела. Перевірка
    актуальності — чи GPIO6 дійсно згадується в розділах 21, 27, 53, 73, 76, 154, 182, 335, 349, 369.
- nazva: T-02-135 — Мережа 5 ГГц, чип C5
  zbih: Мережа 5 ГГц.*C5
  klas: C
  dzherelo: Специфікація ESP32-C5 від Espressif (https://www.espressif.com)
  shukaty: ESP32-C5 Features and Specifications, розділи про Wi-Fi
  notatka: С5 — єдиний чип у лінійці ESP32, що підтримує Wi-Fi 5 ГГц (802.11ac). Твердження вірне, але
    цитата з офіційної специфікації не знайдена у доступних документах.
- nazva: T-38-012 — CAN вузол публікує температуру з ідентифікатором
  zbih: Вузол публікує температуру.*ідентифікатором.*0x180.*хто хоче.*слухає
  klas: C
  dzherelo: 'ISO 11898-1, Road vehicles — Controller area network (CAN), Part 1: Data link layer and physical
    signalling'
  notatka: 'Названо справжній стандарт, але це платний документ ISO, як і IEC 60529 — тексту не маю. Тому
    C, не B: висновок про семантику видавця-підписника може бути правильним, але засновку в записі немає,
    і читач його не перевірить.'
- nazva: T-D-046 — `0xf` код помилки RTCWDT_BROWN_OUT_RESET
  zbih: \| `0xf` \| RTCWDT_BROWN_OUT_RESET.*просіло живлення.*розділ 06
  klas: A
  dzherelo: 'ESP-IDF компонент esp_system, rtc.h: https://github.com/espressif/esp-idf/blob/master/components/esp_system/include/esp_system/rtc.h'
  cytata: 'RTCWDT_BROWN_OUT_RESET = 15,    /**<15, Reset when the vdd voltage is not stable*/

    '
  sposib: curl з github.com/espressif/esp-idf, grep з rtc.h, 2026-08-26
  notatka: Код 0xf (15) прямо визначений як RTCWDT_BROWN_OUT_RESET. Причина — нестабільне живлення.
- nazva: T-23-023 — Суфікс модуля кодує обсяг флешу й PSRAM
  zbih: Суфікс.*модуля кодує.*флешу.*PSRAM.*N8.*N16R8
  klas: C
  dzherelo: Специфікація маркування модулів ESP32 від Espressif (https://www.espressif.com)
  shukaty: ESP32 Module Naming Convention або відповідну документацію про суфікси
  notatka: N8 = 8 МБ флешу, N16R8 = 16 МБ флешу + 8 МБ PSRAM. Це стандартна конвенція Espressif. Твердження
    точне, але цитата з офіційної документації не знайдена у доступних документах.
