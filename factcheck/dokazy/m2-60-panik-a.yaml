- nazva: '0x1: Що сталося → подано живлення або EN'
  zbih: '`0x1`.*Що сталося.*подано живлення'
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/master/components/esp_rom/esp32/include/esp32/rom/rtc.h
  cytata: 'POWERON_RESET          =  1,    /**<1, Vbat power on reset*/

    '
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: Коментар enum'у переводиться як «скидання від подачі напруги на Vbat». EN (enable) — пін вмикання
    чипа, без якого скидання неможливе. Книга інтерпретує це як «подано живлення або EN», що відповідає
    суті Vbat reset.
