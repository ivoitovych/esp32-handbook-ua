- nazva: '`rst:0xf` — симптом просідання живлення'
  zbih: '`rst:0xf`.*кабель.*конденсатор.*джерело 1 А'
  klas: E
  dzherelo: Картка К13 (розділ 06), переведена до таблиці симптомів. ESP32 Series Datasheet v5.3 таблиці
    5-2 та 5-4 підтримують вимоги.
  cytata: 'Симптом `rst:0xf` у boot-лозі означає скидання харду, здебільшого через просадку напруги.

    Дії (попередження до перевірки):

    1. Перевірити кабель (найчастіше — вузький або довгий USB кабель з великим опором)

    2. Додати конденсатор 470 мкФ між 3V3 і GND близько модулю

    3. Переключити на джерело від 1 А (якщо під 500 мА)


    Картка К13 пояснює: таблиця вимірювань, порядок лікування, рекомендація 1 А.

    '
  sposib: Аналіз з ESP32 практики та документації К13.
  notatka: Клас E — це діагностична порада, а не факт про чип. Проте, підґрунтя в таблицях 5-2 та 5-4
    datasheet справді підтримує рекомендацію про джерело та конденсатор. Причина `rst:0xf` — дійсно просадка
    напруги, а не код (розраховано на основі досвіду й нижня межа живлення 3.0 В у Table 5-2).
- nazva: Перезавантаження при Wi-Fi — джерело не тягне піків
  zbih: Перезавантаження при Wi-Fi.*джерело від 1 А.*470 мкФ
  klas: E
  dzherelo: Картка К13 (розділ 06), таблиця 5-4 datasheet про пікове споживання Wi-Fi.
  cytata: 'Перезавантаження саме при вмиканні Wi-Fi — це типова ознака недостатнього

    струму живлення. Рекомендовані дії:

    1. Джерело від 1 А (таблиця 5-4 показує пік 240 мА передачі)

    2. Конденсатор 470 мкФ для згладжування піків


    Table 5-4 (поточне споживання):

    Transmit 802.11b, DSSS 1 Mbps, POUT = +19.5 dBm — Typ: 240 mA

    (за 50% duty cycle)

    '
  sposib: Практична порада від К13, підтримана таблицею 5-4 datasheet.
  notatka: Клас E — порада про лікування, не факт про мікросхему. Але за основою лежить дійсне пікове
    споживання з таблиці 5-4 (240 мА), які вимагають джерела здатного витримати цей імпульс без просадки.
- nazva: Стабілізатор гарячий — перевантаження або слабкий клон
  zbih: Стабілізатор гарячий.*зовнішні 3\.3 В
  klas: E
  dzherelo: Картка К13 (розділ 06), практична діагностика.
  cytata: 'Якщо регулятор (LDO) на платі розробки гарячий:

    - Причина 1: перевантаження (часто Wi-Fi + датчики під напругою близько до межі 3.0 В)

    - Причина 2: слабкий LDO на клоні (паспорт обіцяє 500 мА, але насправді 200–300 мА)


    Дія: подати 3.3 В напряму на пін 3V3 модуля, мимо вбудованого LDO.

    Це крайня міра, але вирішує проблему на клонах.

    '
  sposib: Практична спостереження, підтримана картою К13.
  notatka: 'Клас E — это діагностична рекомендація, не факт. Але зв''язок із вимогами Table 5-2 (мін.
    3.0 В для модулів) справді логічний: коли LDO просідає нижче 3.0 В, система перезавантажується.'
- nazva: I²C не знаходить пристрій — немає підтягування
  zbih: I²C не знаходить пристрій · Дія → 4\.7 кОм на `SDA` і `SCL`
  klas: E
  dzherelo: Розділ 35 посібника, І²С протокол (вимога стандарту).
  cytata: 'I²C використовує відкритий колектор (open drain): кожен учасник може витримувати

    лінію в низькому (0 В) стані, але не може притягувати її в високому (3.3 В).

    Для цього потрібні резистори підтягування.


    Рекомендація: резистор 4.7 кОм від кожної лінії (SDA, SCL) до 3.3 В.

    Це стандартне значення для витримки й часу спаду на швидкостях до 100 кГц.

    '
  sposib: I²C стандарт, практична рекомендація розділу 35 посібника.
  notatka: Клас E — це порада про проектування, а не факт про мікросхему. Але це конкретна, обґрунтована
    рекомендація, основана на фізиці I²C.
- nazva: 'RS-485: помилки на довгій лінії — потрібни термінатори'
  zbih: RS-485:.*помилки.*довгій.*120 Ом.*кінцях
  klas: C
  dzherelo: TIA/EIA-485-A, розділ про узгодження лінії; або datasheet трансивера MAX485/SN65HVD (analog.com
    із цієї мережі недосяжний)
  cytata: 'RS-485 — диференціальна шина для дальних відстаней.

    На довгих лініях (понад 10–20 метрів) виникають відбиття сигналів.

    Для придушення відбить потрібні термінуючи резистори.


    Рекомендація: 120 Ом резистор між A і B лиш на кінцях лінії, не посередині.

    Це усуває відбиття й стабілізує сигнал.

    '
  sposib: RS-485 стандарт, практична рекомендація розділу 34 посібника.
  notatka: Клас E — порада про проектування. Це стандартна практика на основі фізики хвиль й диференціальних
    ліній.
  shukaty: перевірити, чи документ нормує саме цей номінал, і навести дослівно
- nazva: Реле вмикається при старті — вхід ключа висить при завантаженні
  zbih: Реле вмикається при старті.*10 кОм.*вимкнено
  klas: E
  dzherelo: Розділ 47 та розділ 62 посібника, практика проектування з реле.
  cytata: 'GPIO під час завантаження можуть змінити стан (часто за умовчанням висока).

    Якщо вхід ключа реле не визначений, реле вмикається миттєво при старті.


    Рекомендація: додати резистор 10 кОм від входу ключа до землі.

    Це утримує вхід у стані «вимкнено» до тих пір, поки код не встановить GPIO.

    '
  sposib: Практична порада з розділів 47, 62, базується на поведінці GPIO при завантаженні.
  notatka: 'Клас E — порада про проектування ключа. Основана на спостереженні: GPIO часто висока при розпочатку,
    тому потрібна явна інівалізація або резистор-стулка до землі.'
- nazva: Реле не спрацьовує — модуль керування на 5 В
  zbih: Реле не спрацьовує.*модуль на 5 В
  klas: C
  dzherelo: Даташит реле SRD-05VDC-SL-C — напруга котушки
  cytata: 'Більшість доступних реле-модулів на ринку розраховані на 5 В логіки входу.

    ESP32 видає 3.3 В на GPIO, це часто недостатньо для активації опто-муфти

    або транзистора в модулі.


    Перевіряти паспорт модуля: деякі можуть працювати на 3.3 В, але багато вимагають 5 В.

    '
  sposib: Спостереження з практики проектування (розділ 47 посібника).
  notatka: 'Клас E — факт про компоненти, які виробник виготовляє, а не про ESP32. Це можна підняти до
    A, якщо буде наведено паспорт конкретного модуля, але это залежить від партії й виробника. | Було
    E — «зовнішнього джерела не існує». Названо конкретну деталь чи стандарт, отже документ існує, і його
    просто немає в кеші. Це визначення класу C. Різниця не формальна: E ховає одиницю з наряду назавжди,
    C лишає її в наряді з полем shukaty.'
  shukaty: srd-05vdc-sl-c datasheet
- nazva: 'Реле не спрацьовує — дія: живити модуль від 5 В'
  zbih: Реле не спрацьовує.*живити 5 В
  klas: C
  dzherelo: Даташит реле SRD-05VDC-SL-C — напруга котушки
  cytata: 'Якщо модуль реле вимагає 5 В логіки:

    1. Підключити живлення модуля до 5 В (або USB)

    2. GPIO ESP32 (3.3 В) часто здатна активувати оптопару через 1 кОм-2 кОм резистор

    3. У гіршому разі: використовувати MOSFET або транзистор-драйвер 3.3→5 В


    Зв''язати GND ESP32 із GND модуля дахі при різних напругах!

    '
  sposib: Практична порада з розділу 47 посібника.
  notatka: 'Клас E — порада про лікування. Базується на контрасту 3.3 В (ESP32) та 5 В (реле-модуль).
    Це стандартна практика при роботі з різнонапруговими компонентами. | Було E — «зовнішнього джерела
    не існує». Названо конкретну деталь чи стандарт, отже документ існує, і його просто немає в кеші.
    Це визначення класу C. Різниця не формальна: E ховає одиницю з наряду назавжди, C лишає її в наряді
    з полем shukaty.'
  shukaty: srd-05vdc-sl-c datasheet
