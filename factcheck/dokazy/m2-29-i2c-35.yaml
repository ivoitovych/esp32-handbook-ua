    При Cb > 400 пФ, яка додається довгими дротами, формула дає

    Rp < 1 кОм, тобто нижче за мінімум (Rp > 1 кОм для 3 мА IOL).

    '
  method: PDF NXP UM10204 із дзеркала, кеш ~/dzherela-cache, pdftotext -layout, 2026-08-26
  note: 'При метровій довжині дроту ємність додає близько 80–100 пФ/м, отже метр додає 80–100
