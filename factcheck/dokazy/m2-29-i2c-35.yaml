- nazva: Три модулі по 4.7 кОм дають близько 1.6 кОм паралельно
  zbih: Три модулі зі своїми резисторами по 4\.7 кОм дають сумарно близько 1\.6 кОм
  klas: D
  dzherelo: Паралельна комбінація трьох резисторів по 4.7 кОм
  cytata: 'Закон паралельного з''єднання резисторів:

    1/Rp = 1/R₁ + 1/R₂ + 1/R₃


    Для R₁ = R₂ = R₃ = 4.7 кОм:

    1/Rp = 1/4.7 + 1/4.7 + 1/4.7 = 3/4.7

    Rp = 4.7/3 ≈ 1.57 кОм

    '
  sposib: Елементарна схемотехніка; перевірено розрахунком
  rozrakhunok: '4.7 кОм ÷ 3 = 1.57 кОм, що книга округлює до 1.6 кОм.

    За формулою Rp(max) = tr / (0.8473 × Cb) з таблиці 10, при 1.6 кОм на 400 пФ книга отримує
    межу частоти: tr(max) = 1.6 × 0.8473 × 400 = 542 нс

    Це нижче за 1000 нс (100 кГц), лишень вище за 300 нс (400 кГц) — тобто шина працює нестабільно.
    З цього випливає необхідність зменшення резисторів або кількості модулів.'
  title: Три модулі по 4.7 кОм дають близько 1.6 кОм паралельно
  match: Три модулі зі своїми резисторами по 4\.7 кОм дають сумарно близько 1\.6 кОм
  status: arithmetic
  source: Паралельна комбінація трьох резисторів по 4.7 кОм
  quote: 'Закон паралельного з''єднання резисторів:

    1/Rp = 1/R₁ + 1/R₂ + 1/R₃


    Для R₁ = R₂ = R₃ = 4.7 кОм:

    1/Rp = 1/4.7 + 1/4.7 + 1/4.7 = 3/4.7

    Rp = 4.7/3 ≈ 1.57 кОм

    '
  method: Елементарна схемотехніка; перевірено розрахунком
  calculation: '4.7 кОм ÷ 3 = 1.57 кОм, що книга округлює до 1.6 кОм.

    За формулою Rp(max) = tr / (0.8473 × Cb) з таблиці 10, при 1.6 кОм на 400 пФ книга отримує
    межу частоти: tr(max) = 1.6 × 0.8473 × 400 = 542 нс

    Це нижче за 1000 нс (100 кГц), лишень вище за 300 нс (400 кГц) — тобто шина працює нестабільно.
    З цього випливає необхідність зменшення резисторів або кількості модулів.'
- nazva: На метрові дистанції I²C не призначений; RS-485 або менші резистори
  zbih: RS-485
  klas: A
  dzherelo: NXP UM10204 Rev. 7.0 — розділи 7.1, 7.2; обмеження ємності шини (Cb max 400 пФ)
    в Table 11
  cytata: 'Table 11. Characteristics of the SDA and SCL bus lines:

    Cb capacitive load for each bus line — max 400 pF


    Section 7.2 Operating above the maximum allowable bus capacitance:

    Bus capacitance limit is specified to limit rise time reductions and

    allow operating at the rated frequency.


    Available strategies include:

    - Reduced fSCL (Section 7.2.1)

    - Higher drive outputs (Section 7.2.2)

    - Bus buffers (Section 7.2.3)

    - Switched pull-up circuit (Section 7.2.4)


    Maximum Rp = tr / (0.8473 × Cb).

    При Cb > 400 пФ, яка додається довгими дротами, формула дає

    Rp < 1 кОм, тобто нижче за мінімум (Rp > 1 кОм для 3 мА IOL).

    '
  sposib: PDF NXP UM10204 із дзеркала, кеш ~/dzherela-cache, pdftotext -layout, 2026-08-26
  notatka: 'При метровій довжині дроту ємність додає близько 80–100 пФ/м, отже метр додає
    80–100 пФ, що набирається разом з 10–20 пФ від модулів дає межу 400 пФ. На цій межі формула
    Rp(max) дає значення, що не задовольняють обмеженню за мінімальним струмом 3 мА.

    Книга пропонує три рішення: 1. Снизити швидкість (100 кГц замість 400 кГц) 2. Вибрати
    2.2 кОм замість 4.7 кОм (але це подвоює струм) 3. RS-485 для довгих дистанцій (інший протокол,
    розділ 34)'
