- nazva: Зовнішні 4.7 кОм обов'язкові для сумарного навантаження
  zbih: Для чогось серйознішого зовнішні 4\.7 кОм обов'язкові
  klas: D
  dzherelo: NXP UM10204 Rev. 7.0 — розділи 5 та 6, рекомендації щодо pull-up резисторів; ESP32
    технічна документація про вбудовані резистори
  cytata: 'Вбудовані pull-up резистори в ESP32 мають опір у десятки кілоомів

    (типово 20–50 кОм), що недостатньо для I²C на будь-якій відчутній

    довжині дроту або при кількох пристроях.


    Зовнішні резистори 4.7 кОм задовольняють формулу Rp(max) при типових

    ємностях 100–200 пФ на 100 кГц.


    При додаванні кількох модулів, кожен з вбудованими резисторами,

    сумарна еквівалентна опір паралельної комбінації знижується, що

    може порушити обмеження за Rp(min) або додати затримку на рост.

    '
  sposib: ESP32 технічна документація; формула з NXP UM10204
  rozrakhunok: 'Один модуль з вбудованим резистором ~40 кОм не впливає на 4.7 кОм зовнішній
    через значну різницю опору.

    Два модулі зі своїми резисторами по 4.7 кОм паралельно: 1/Rp = 1/4.7 + 1/4.7 = 2/4.7,
    Rp ≈ 2.35 кОм Три модулі: Rp ≈ 1.57 кОм (див. попередню одиницю)

    При 1.57 кОм і Cb = 200 пФ: tr(max) = 1.57 × 0.8473 × 200 = 266 нс

    Це нижче за 300 нс (межа для 400 кГц), тому шина працює нестабільно.'
  title: Зовнішні 4.7 кОм обов'язкові для сумарного навантаження
  match: Для чогось серйознішого зовнішні 4\.7 кОм обов'язкові
  status: arithmetic
  source: NXP UM10204 Rev. 7.0 — розділи 5 та 6, рекомендації щодо pull-up резисторів; ESP32
    технічна документація про вбудовані резистори
  quote: 'Вбудовані pull-up резистори в ESP32 мають опір у десятки кілоомів

    (типово 20–50 кОм), що недостатньо для I²C на будь-якій відчутній

