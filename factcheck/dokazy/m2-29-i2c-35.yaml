  zbih: 'Типовий номінал: \*\*4\.7 кОм\*\* від `SDA` до 3\.3 В'
  klas: D
  dzherelo: NXP UM10204 Rev. 7.0 — I2C-bus specification and user manual, розділ 7.1 «Pull-up
    resistor sizing», Table 10 та 11
  cytata: "7.1 Pull-up resistor sizing\n\nRp(max) = tr / (0.8473 × Cb)\n\nTable 11. Characteristics\
    \ of the SDA and SCL bus lines:\n  Cb   capacitive load for each bus line   max 400 pF\n\
    \nTable 10. Characteristics of the SDA and SCL I/O stages:\n  tr   rise time of both SDA\
    \ and SCL signals\n       Standard-mode  max 1000 ns\n       Fast-mode      max  300 ns\n"
  sposib: PDF NXP UM10204 (62 с.) із дзеркала, кеш ~/dzherela-cache, реєстр factcheck/DZHERELA-m2.md,
    pdftotext -layout, 2026-08-26
  rozrakhunok: 'Для 100 кГц (Standard-mode, tr = 1000 нс) при типовій ємності 100 пФ: Rp(max)
    = 1000 / (0.8473 × 100) = 11.8 кОм.

    4.7 кОм менше за 11.8 кОм, отже годиться з запасом.

    Для рекомендованої вагової ємності 200 пФ: Rp(max) = 1000 / (0.8473 × 200) = 5.9 кОм.

    4.7 кОм ще в межах, але без великого запасу — саме типовий номінал.'
