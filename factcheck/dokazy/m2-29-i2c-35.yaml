- nazva: Без зовнішніх резисторів 4.7 кОм I²C взагалі не працює
  zbih: Без зовнішніх підтягувальних резисторів 4\.7 кОм I²C не працює
  klas: A
  dzherelo: NXP UM10204 Rev. 7.0, розділ 2 (I²C-bus features), опис open-drain логіки
  cytata: 'Pull-up resistors Rp maintain the SDAH and SCLH lines at a HIGH level

    when the bus is free. Only the slave devices or the master are allowed

    to pull the bus LOW by the open-drain or open-collector output stage.


    Без цих резисторів нема силу для піднесення лінії вгору — вона залишиться

    на потенціалі чіпу або плаває. Жодна пристрій не може проводити сигнал.

    '
  sposib: PDF NXP UM10204 (62 с.) із дзеркала, кеш ~/dzherela-cache, pdftotext -layout, 2026-08-26
  notatka: 'Це найчастіша причина, чому нічого не працює на макетці. Вбудовані резистори в
    чипі (десятки кОм) надто великі для цього. Фізичний закон: open-drain без pull-up = лінія
    не піднімається.'
  title: Без зовнішніх резисторів 4.7 кОм I²C взагалі не працює
