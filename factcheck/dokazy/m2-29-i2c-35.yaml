    Зовнішні резистори 4.7 кОм задовольняють формулу Rp(max) при типових

    ємностях 100–200 пФ на 100 кГц.


    При додаванні кількох модулів, кожен з вбудованими резисторами,

    сумарна еквівалентна опір паралельної комбінації знижується, що

    може порушити обмеження за Rp(min) або додати затримку на рост.

    '
  method: ESP32 технічна документація; формула з NXP UM10204
  calculation: 'Один модуль з вбудованим резистором ~40 кОм не впливає на 4.7 кОм зовнішній
    через значну різницю опору.

    Два модулі зі своїми резисторами по 4.7 кОм паралельно: 1/Rp = 1/4.7 + 1/4.7 = 2/4.7,
    Rp ≈ 2.35 кОм Три модулі: Rp ≈ 1.57 кОм (див. попередню одиницю)

    При 1.57 кОм і Cb = 200 пФ: tr(max) = 1.57 × 0.8473 × 200 = 266 нс

