# Суцільний прохід — 07-gpio.
#
# Посаджено `tools/prochid_posadka.py`. Сюди потрапляє лише
# те, що пережило третій шар: цитата знайшлася в названому
# документі дослівно. Заявок без такої перевірки тут немає.
#
# Взірці виведено механічно — найкоротший префікс, відмітний
# у всьому реєстрі. Це компроміс між двома законами:
# широкий взірець бреше, довгий ламається.

- nazva: 'T-07-055: **Практичне правило:** strapping-піни можна використовувати, але як **виходи**,'
  zbih: \*\*Практичне\s+правило:\*\*\s+strapping\-піни\s+можна
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/master/docs/en/api-guides/startup.rst
  cytata: 'Startup code called from the reset vector determines the boot mode by checking
    ``GPIO_STRAP_REG`` register for bootstrap pin states.

    '
  sposib: 'Суцільний прохід 2026-08-27. Документ отримано в сесії, витяг звірено з ним підрядком
    машинно (`tools/prochid_zvid.py`). Клас `A` тут означає «документ отримано, цитата дослівна»,
    а **не** «супровідник прочитав і згоден»: змістовий шар лишається окремою роботою.'
  notatka: strapping pins дійсно використовуються як входи під час завантаження, що дозволяє
    використовувати їх як виходи в нормальній роботі
