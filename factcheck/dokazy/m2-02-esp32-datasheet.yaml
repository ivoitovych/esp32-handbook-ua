- nazva: Діапазон модуля WROOM — 85 °C у версіях N, 105 °C у версіях H
  zbih: версії `-H4` і `-H8` на \+105 °C|85 °C міряються одразу за\s+межами модуля
  klas: A
  dzherelo: https://www.espressif.com/sites/default/files/documentation/esp32-wroom-32e_esp32-wroom-32ue_datasheet_en.pdf
    — ESP32-WROOM-32E & ESP32-WROOM-32UE Datasheet, Table 1 «Series Comparison» (с. 8) і Table
    14 «Recommended Operating Conditions»
  cytata: "Table 1: ESP32-WROOM-32E Series Comparison\nPart Number              Flash    \
    \          PSRAM            Ambient Temp. (°C)\nESP32-WROOM-32E-N4       4 MB (Quad SPI)\
    \    —                –40 ~ 85\nESP32-WROOM-32E-N8       8 MB (Quad SPI)    —        \
    \        –40 ~ 85\nESP32-WROOM-32E-N16     16 MB (Quad SPI)    —                –40 ~\
    \ 85\nESP32-WROOM-32E-H4       4 MB (Quad SPI)    —                –40 ~ 105\nESP32-WROOM-32E-H8\
    \       8 MB (Quad SPI)    —                –40 ~ 105\n\n3 Ambient temperature specifies\
    \ the recommended temperature range of the\n  environment immediately outside the Espressif\
    \ module.\n\nTable 14: Recommended Operating Conditions\nT   Operating ambient temperature\
    \   –40  …  85 (85 °C version) / 105 (105 °C version)  °C\n"
  sposib: curl PDF з espressif.com, pdftotext -layout, 2026-08-26
  notatka: 'Джерело виправлення розділу 54. Дає три речі, яких у книзі не було.

    Перша: 85 °C — діапазон **модуля**, а не чипа. Друга: примітка 3 означує його як температуру
    середовища **одразу за межами модуля**, тобто всередині корпусу виробу, а не надворі —
    саме та відстань, яку розділ 54 і має пояснювати. Третя: версії `-H` на 105 °C існують,
    і це дешевший хід, ніж перероблення корпусу.

    Стара редакція («це діапазон чипа, а не пристрою») хибна двічі: цифра належить модулю,
    а чип витримує більше. Заведено у `factcheck/SPROSTOVANE-m2.md`.'
  title: Діапазон модуля WROOM — 85 °C у версіях N, 105 °C у версіях H
  match: версії `-H4` і `-H8` на \+105 °C|85 °C міряються одразу за\s+межами модуля
  status: verbatim
  source: https://www.espressif.com/sites/default/files/documentation/esp32-wroom-32e_esp32-wroom-32ue_datasheet_en.pdf
    — ESP32-WROOM-32E & ESP32-WROOM-32UE Datasheet, Table 1 «Series Comparison» (с. 8) і Table
    14 «Recommended Operating Conditions»
  quote: "Table 1: ESP32-WROOM-32E Series Comparison\nPart Number              Flash     \
    \         PSRAM            Ambient Temp. (°C)\nESP32-WROOM-32E-N4       4 MB (Quad SPI)\
    \    —                –40 ~ 85\nESP32-WROOM-32E-N8       8 MB (Quad SPI)    —        \
    \        –40 ~ 85\nESP32-WROOM-32E-N16     16 MB (Quad SPI)    —                –40 ~\
