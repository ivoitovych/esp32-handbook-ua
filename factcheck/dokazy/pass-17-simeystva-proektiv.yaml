- nazva: pioarduino, а не офіційна платформа PlatformIO
  zbih: pioarduino/platform-espressif32/releases/download|Чому в рядку `platform` посилання|Офіційна
    платформа PlatformIO лишилася на Arduino 2\.x
  klas: A
  dzherelo: https://raw.githubusercontent.com/pioarduino/platform-espressif32/main/README.md
    та .../55.03.311/platform.json
  cytata: '### Stable Arduino

    currently espressif Arduino 3.3.11 and IDF v5.5.5.


    [env:stable]

    platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip

    board = ...


    (platform.json теґа 55.03.311)

    "version": "55.03.311"

    …/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11.tar.xz

    '
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Виправлення за рецензією. Розділ 13 правильно пояснював, що для Arduino 3.x і
    нових чипів потрібен `pioarduino`, — і давав для копіювання `platform = espressif32 @
    6.5.0`, тобто офіційну платформу епохи Arduino 2.x. Причому й у прикладі для S3.

    Розбіжність між тим, що книга радить, і тим, що читач може скопіювати, гірша за просто
    застарілий приклад: копіюють частіше, ніж читають.

    Усі приклади переведено на `pioarduino`. Рядок `platform` у розділі про кілька середовищ
    винесено в спільну секцію `[env]` — дві плати мусять збиратися однією платформою.

    Пінування показано тегом релізу (`55.03.311`), а сам номер відсилає до таблиці версій
    частини IV, як вимагає Р4.

    Підтверджено й те, що робить пораду несуперечливою: README форка називає ті самі Arduino
    3.3.11 та IDF 5.5.5, що стоять у `toolchain-baseline.yaml`.'
