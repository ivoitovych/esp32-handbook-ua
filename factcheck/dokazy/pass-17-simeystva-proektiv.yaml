# Прохід 17 — сімейства в проєктах: піни проти BOM.
#
# Прохід за зовнішньою рецензією, і найважливіший за всі сімнадцять.
# Рецензент знайшов те, чого не бачила жодна внутрішня перевірка: рядок
# «S3-DevKitC-1 або classic DevKitC» у переліку складових — це **контракт
# на розпіновку**, а схема під ним була дійсна лише для одного з двох.
#
# Причина, чому це прожило шістнадцять проходів, теж названа рецензентом
# і виявилася точною: реєстр умів перевіряти числа, назви й документи, але
# не вмів перевіряти **складені інженерні твердження**, де одна частина
# перевіряється за datasheet датчика, а друга — за документацією плати.










# ⚠ КЛАС БУВ ХИБНИЙ — виправлено в проході 40 за знахідкою М2 19:40Z.
#
# Стояв `B`, а в полі джерела — не документ, а міркування:
# «загальновідома електромеханіка реле». Те саме поле тут-таки й
# зізнавалося: «первинний нормативний документ звідси недосяжний».
# Тобто запис сам казав `C`, а клас казав `B`.
#
# Це рівно та вада, яку М2 знайшов у помічників на Haiku: не знайшовши
# документа, назвати джерелом властивість світу. Різниця лише в тому,
# що тут її зробив я, за десять проходів до появи будь-якого пулу.
#
# Ціна класу `B` тут була б висока саме через тему: хибне «звірено» на
# безпековому твердженні прибирає його з кожної черги назавжди.











- nazva: GPIO22 не існує в S3, а GPIO22/23/34 — у C3
  zbih: GPIO22` на S3 не існує|Жодного з пінів `GPIO22`, `GPIO23`, `GPIO34` на C3 не існує|маска
    дійсних пінів|SOC_GPIO_VALID_GPIO_MASK
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/soc/{esp32,esp32s2,esp32s3,esp32c3,esp32c6,esp32h2}/include/soc/soc_caps.h
  cytata: "esp32:   SOC_GPIO_PIN_COUNT 40\n         SOC_GPIO_VALID_GPIO_MASK (0xFFFFFFFFFFULL\
    \ & ~(BIT24|BIT28|BIT29|BIT30|BIT31))\n         SOC_GPIO_VALID_OUTPUT_GPIO_MASK (… & ~(BIT34…BIT39))\n\
    esp32s2: SOC_GPIO_PIN_COUNT 47\n         SOC_GPIO_VALID_GPIO_MASK (0x7FFFFFFFFFFFULL &\
    \ ~(BIT22|BIT23|BIT24|BIT25))\nesp32s3: SOC_GPIO_PIN_COUNT 49\n         SOC_GPIO_VALID_GPIO_MASK\
    \ (0x1FFFFFFFFFFFFULL & ~(BIT22|BIT23|BIT24|BIT25))\nesp32c3: SOC_GPIO_PIN_COUNT 22\n\
    \         SOC_GPIO_VALID_GPIO_MASK ((1U<<SOC_GPIO_PIN_COUNT) - 1)\nesp32c6: SOC_GPIO_PIN_COUNT\
    \ 31\nesp32h2: SOC_GPIO_PIN_COUNT 28\n"
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Два виправлення рівня «не збереться».

    Проєкт 59 радив S3 першим рядком складових і давав `GPIO21`/`GPIO22` для I²C. У S3 пінів
    22–25 **немає взагалі** — маска вирізає їх явно. Читач із S3-DevKitC-1 отримав би `ESP_ERR_INVALID_ARG`
    і німу шину.

    Проєкт 60 радив C3 і давав `GPIO21/22` (I²C), `GPIO18/19/23` (SPI) і `GPIO34` (ADC). У
    C3 рівно 22 піни, `GPIO0`–`GPIO21`; з трьох підсистем не існує жодної цілком.

    Виправлено не заміною чисел, а введенням **таблиці пінів за платами** в кожен із проєктів,
    із винесенням розпіновки в один блок `#if CONFIG_IDF_TARGET_*` нагорі коду. Тепер перенесення
    на інший чип — одна правка в одному місці, а не пошук чисел по всьому розділу.

    Заразом з''ясувалося, що на C3 проєкт 60 вичерпує всі вільні піни й потребує ще одного:
    вісім безумовно вільних (`0`,`1`,`3`,`4`,`5`, `6`,`7`,`10`) проти дев''яти потрібних.
    Дев''ятим узято strapping-пін `GPIO2` — виключно як вихід. Це записано в книгу прямо,
    бо саме такі межі й вирішують вибір чипа на етапі схеми.'
