- nazva: Програмний ліміт часу не рятує від зварених контактів реле
  zbih: зварилися|Зварені контакти|фізично\s*з.єднаний метал|аварійний вимикач.{0,60}єдиний
    захист|Чого програмний ліміт не рятує
  klas: C
  dzherelo: первинний документ не отримано. Шукати треба IEC 60947-5-1, додаток L (mechanically
    linked contacts) і ISO 13849-1 — обидва за платним доступом, звідси недосяжні
  shukaty: формулювання про примусово зв'язані контакти (mechanically linked contacts) і про
    те, що знеструмлення котушки не гарантує роз'єднання при зварюванні. Достатньо одного
    абзацу з IEC 60947-5-1 Annex L або з ISO 13849-1 про вимогу апаратного розмикання.
  sposib: розбір відмови за механізмом, 2026-08-26
  notatka: 'Виправлення безпекового характеру, найважче за наслідками з усіх сімнадцяти проходів.
    Проєкт 62 писав, що ліміт часу «рятує від залиплого реле».

    Це неправда для найгіршого випадку. Ліміт знімає сигнал із котушки — і на цьому його влада
    закінчується. Зварені контакти лишаються замкненими, насос працює далі.

    Розділ переписано так, щоб межа була видима: таблиця «від чого рятує / від чого ні», де
    зварені контакти й пробитий ключ стоять у стовпці «ні», і прямий висновок — від них рятує
    лише механічний аварійний вимикач у силовому колі, який у проєкті вже є.

    Клас `B`, не `A`: механізм відмови очевидний з електромеханіки, але нормативного першоджерела
    звідси не дістати. Записано в наряд.

    Заразом виправлено сусіднє перебільшення: «керувальний вхід приймає 3.3 В, бо на модулі
    стоїть оптопара». Оптопара цього не гарантує — її світлодіод живиться через резистор,
    підібраний під 5 В, і струм при 3.3 В може не дотягнути до порога. Книга тепер вимагає
    це перевірити, а не вивести.'
  title: Програмний ліміт часу не рятує від зварених контактів реле
