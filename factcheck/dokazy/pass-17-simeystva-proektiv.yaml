- nazva: DAC на S2 — GPIO17 і GPIO18, а не 25/26
  zbih: Канал 1 \| `GPIO25`|\[\[S2\]\] \| `GPIO17`|`GPIO25` і `GPIO26` на S2 \*\*не існують
  klas: A
  dzherelo: https://raw.githubusercontent.com/espressif/esp-idf/release/v5.5/components/soc/{esp32,esp32s2}/include/soc/dac_channel.h
  cytata: '(esp32/dac_channel.h)

    #define DAC_CHAN0_GPIO_NUM      25

    #define DAC_CHAN1_GPIO_NUM      26


    (esp32s2/dac_channel.h)

    #define DAC_CHAN0_GPIO_NUM      17

    #define DAC_CHAN1_GPIO_NUM      18

    '
  sposib: curl raw.githubusercontent, 2026-08-26
  notatka: 'Знахідка не рецензента, а нового інструмента `tools/piny.py`, який зробили за
    його зауваженням. Перший же запуск позначив рядок розділу 33: «[[classic]] [[S2]] … на
    `GPIO25` і `GPIO26`».

    Для classic це правда, для S2 — ні двічі: DAC там на `GPIO17`/`GPIO18`, а `GPIO25` у S2
    взагалі не існує (маска вирізає 22–25).

    Показово, що ця помилка тієї самої природи, що знайдені рецензентом: твердження про два
    сімейства, вірне для одного. Тобто інструмент ловить саме клас, а не окремий випадок.'
