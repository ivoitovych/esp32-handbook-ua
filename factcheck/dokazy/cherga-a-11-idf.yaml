# Посадка cherga-a — 11-idf.
#
# Посаджено `tools/prochid_posadka.py`. Сюди потрапляє лише
# те, що пережило третій шар: цитата знайшлася в названому
# документі дослівно. Заявок без такої перевірки тут немає.
#
# Взірці виведено механічно — найкоротший префікс, відмітний
# у всьому реєстрі. Це компроміс між двома законами:
# широкий взірець бреше, довгий ламається.





