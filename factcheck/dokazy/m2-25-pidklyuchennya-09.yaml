  zbih: '`CP2102`.*драйвер із сайту SiLabs'
  klas: A
  dzherelo: Silicon Labs, CP2102/9 SINGLE-CHIP USB-TO-UART BRIDGE, datasheet, розділ 9 «CP2102/9
    Device Drivers» і «9.1. Virtual COM Port Drivers»
  cytata: 'Virtual COM Port Device Drivers

    - Works with existing COM port PC Applications

    - Royalty-free distribution license

    - Windows 8/7/Vista/Server 2003/XP/2000


    Royalty-free Virtual COM Port (VCP) device drivers provided by Silicon

    Laboratories allow a CP2102/9-based device to appear to the PC''s


    The latest drivers are available at

    http://www.silabs.com/support/Pages/software-downloads.aspx.

    '
  sposib: PDF /home/ubuntu/dzherela-cache/cp2102.pdf, pdftotext -layout, grep "Virtual COM
    Port\|Windows\|Silicon Laboratories", 2026-08-26
