# What is specific to this book. The technology reads it; no tool repeats it.
#
# Before this file existed, `groups` lived as a hardcoded `GRUPY` in eight
# separate tools and the title lived in `report.py`. The eight copies
# agreed, which is the dangerous state: copies do not lie until the fact
# changes, and then they lie all at once.

title: Довідник ESP32

# The book's own directories, in reading order. One registry file is kept
# per file found here, under `factcheck/cards/`, with the same name.
groups:
  - manual
  - kartky
  - dodatky
  - inserts

# The language of the book, for the checks that read its prose.
#
# `modality.py` compares a prescription in the book against a permission
# in the source ("the book says MUST, the datasheet says MAY"). The words
# that carry that force are language-specific: on an English book this
# whole block is different, and a tool carrying Ukrainian modal verbs
# would have matched nothing and printed a confident zero.
#
# Optional. If absent, the check says so and skips, rather than reporting
# a zero it did not earn.
modality:
  # A prescription in the book: the force a source must support.
  prescriptive: "\\b(має|мусить|мусять|не можна|завжди|ніколи|обов'язково)\\b"

  # «Має» is the subtlest word in the whole tool. In Ukrainian it means
  # "must", "possesses" and "is expected to" alike. The first version did
  # not tell them apart, and four of six matches were false:
  #
  #     «вона має ціну»            — possession
  #     «стан, який має пережити»  — a requirement on the state
  #     «має працювати»            — expectation
  #     «має бути близько 3.3 В»   — an expected instrument reading
  #
  # The word itself cannot be dropped: both GENUINE cases rest on it too.
  # So constructions are filtered out, not the word.
  not_prescriptive: "має\\s+(?:ціну|бути|стати|сенс|значення|працювати|пережити|вигляд|перевагу|недолік|власн\\w+|свій|свою|своє)"

# Patterns `intake.py` uses to read the book's own prose. Language of the
# book, not of the technology — on an English book these are different
# words, and a tool carrying these would pass everything silently.
#
# Optional; absent means those particular checks say so and skip.
intake:
  # The book named as a source in WORDS rather than by path: "розділ 29",
  # "картка К13", "додаток F". For `verbatim`/`derived` that is the same
  # self-citation as a path, and the gate did not see it.
  book_in_words: "(?:^|[^\\w])(розділ|картка|картку|картки|додаток|вкладка)\\s+[A-ZА-ЯЄІЇ0-9]"

  # An internal check, declared. Legitimate under `self-consistent`.
  internal_check: "^\\s*ВНУТРІШНЯ ЗВІРКА"

  # A checkable signal in a claim: a number with a unit, an address, a pin.
  # `no-external-signal` standing on one of these is worth a second look.
  signal: "\\d+\\s*(?:МГц|кГц|Гц|мА|А|В|мВ|КБ|МБ|ГБ|мс|мкс|с|°C|Ом|кОм|біт|МБіт)|0x[0-9a-fA-F]+|GPIO\\d+"

  # …except in the index, where a "number" is a page list and no external
  # source exists by nature.
  index: "покажчик|індекс|z-pokazhchyk|у індексі|T-Z-\\d+"

# How the unchecked queue is divided between maintainers, and by what.
#
# Not by topic and not by chapter, but by one question: in which document
# does the answer lie. That determines WHO CAN CLOSE IT — on this book the
# split is by reachability: ESP-IDF and esptool are in M1's container,
# vendor datasheets answer 403 there and are cached for M2.
#
# Entirely this book's data: the part numbers below are its subject.
# Order matters — a unit lands in the first basket that recognises it, so
# the specific (a part number) precedes the general (a number with a
# unit), or "a BME280 runs on 3.3 V" would go to the electrical basket.
split_buckets:
- who: M1
  key: api
  what: ESP-IDF calls and constants — component headers
  pattern: '`(esp_|gpio_|i2c_|spi_|uart_|nvs_|xTask|vTask|xQueue|heap_caps|ledc_|adc_|rmt_|twai_|CONFIG_|SOC_|MALLOC_CAP|ESP_[A-Z])'
- who: M1
  key: komandy
  what: the esptool and idf.py command line
  pattern: '`(esptool|idf\.py|espefuse|espsecure|otatool|parttool)\b|`(write-flash|read-flash|erase-flash|merge-bin|chip-id|flash-id)'
- who: M1
  key: piny
  what: GPIO numbers — soc/ headers and valid-pin masks
  pattern: GPIO\s?\d+|`IO\d+`
- who: M1
  key: adresy
  what: hexadecimal addresses and sizes
  pattern: 0x[0-9A-Fa-f]{3,}
- who: M1
  key: log
  what: lines the book promises you will see in the console
  pattern: E \(\d|W \(\d|I \(\d|`[A-Z][A-Za-z_ ]{8,}`
- who: M2
  key: detali
  what: specific parts — the vendor's datasheet
  pattern: \b(BME280|BMP280|BMP180|DS18B20|DS3231|DHT11|DHT22|SHT[234]\d|SSD1306|SH1106|ILI9341|ST7789|MAX485|MAX3232|MAX31855|MAX6675|SN65HVD\d+|TP4056|DW01|MCP23017|MCP2515|PCF8574|PCA9685|74HC\d+|CD4051|HC-SR04|SX12\d\d|RFM\d\d|MAX170\d\d|INA219|ADS1115|W5500|ENC28J60|CH340|CP210\d|FT232|CH9102|AMS1117|LM2596|MT3608|XL6009|18650|LiFePO4|AT24C\d+|24LC\d+|NEO-\d|ATmega\d+|RP2040|STM32)
- who: M2
  key: elektro
  what: electrical quantities — datasheets and specifications
  pattern: \d+\s*(мА|мкА|А\b|В\b|мВ|кОм|Ом|МОм|мА·год|нФ|мкФ|пФ|Вт|дБм|°C)

# Where a helper can actually reach a source from this container, named in
# the work order. Entirely this book's environment: another book has other
# repositories, and possibly no egress restriction at all.
#
# `sample.py` carried this list inline, so an order generated for another
# book would have sent its helpers to ESP-IDF.
reachable_sources:
  intro: |
    Only `raw.githubusercontent.com` is reachable. Everything else answers
    403; **do not repeat a request that returned 403**.
  where: |
    `espressif/esp-idf` (`docs/en/…`, `components/…`, `examples/…`),
    `espressif/esptool`, `espressif/arduino-esp32`, `torvalds/linux`
    (`drivers/…`), `esphome/esphome`, `micropython/micropython`,
    `adafruit/*`, `jgromes/RadioLib`, `olikraus/u8g2`, `Bodmer/TFT_eSPI`,
    `lvgl/lvgl`.
  caveat: |
    Separately: `espressif.com` returns, for some addresses, an **HTML
    stub of 15 495 bytes with status 200**. The response is "successful"
    and the document is absent. It does not look like a document —
    `nedosyazhne`.
