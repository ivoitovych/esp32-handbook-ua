# What is specific to this book. The technology reads it; no tool repeats it.
#
# Before this file existed, `groups` lived as a hardcoded `GRUPY` in eight
# separate tools and the title lived in `report.py`. The eight copies
# agreed, which is the dangerous state: copies do not lie until the fact
# changes, and then they lie all at once.

title: Довідник ESP32

# The book's own directories, in reading order. One registry file is kept
# per file found here, under `factcheck/cards/`, with the same name.
groups:
  - manual
  - kartky
  - dodatky
  - inserts

# The language of the book, for the checks that read its prose.
#
# `modality.py` compares a prescription in the book against a permission
# in the source ("the book says MUST, the datasheet says MAY"). The words
# that carry that force are language-specific: on an English book this
# whole block is different, and a tool carrying Ukrainian modal verbs
# would have matched nothing and printed a confident zero.
#
# Optional. If absent, the check says so and skips, rather than reporting
# a zero it did not earn.
modality:
  # A prescription in the book: the force a source must support.
  prescriptive: "\\b(має|мусить|мусять|не можна|завжди|ніколи|обов'язково)\\b"

  # «Має» is the subtlest word in the whole tool. In Ukrainian it means
  # "must", "possesses" and "is expected to" alike. The first version did
  # not tell them apart, and four of six matches were false:
  #
  #     «вона має ціну»            — possession
  #     «стан, який має пережити»  — a requirement on the state
  #     «має працювати»            — expectation
  #     «має бути близько 3.3 В»   — an expected instrument reading
  #
  # The word itself cannot be dropped: both GENUINE cases rest on it too.
  # So constructions are filtered out, not the word.
  not_prescriptive: "має\\s+(?:ціну|бути|стати|сенс|значення|працювати|пережити|вигляд|перевагу|недолік|власн\\w+|свій|свою|своє)"

# Patterns `intake.py` uses to read the book's own prose. Language of the
# book, not of the technology — on an English book these are different
# words, and a tool carrying these would pass everything silently.
#
# Optional; absent means those particular checks say so and skip.
intake:
  # The book named as a source in WORDS rather than by path: "розділ 29",
  # "картка К13", "додаток F". For `verbatim`/`derived` that is the same
  # self-citation as a path, and the gate did not see it.
  book_in_words: "(?:^|[^\\w])(розділ|картка|картку|картки|додаток|вкладка)\\s+[A-ZА-ЯЄІЇ0-9]"

  # An internal check, declared. Legitimate under `self-consistent`.
  internal_check: "^\\s*ВНУТРІШНЯ ЗВІРКА"

  # A checkable signal in a claim: a number with a unit, an address, a pin.
  # `no-external-signal` standing on one of these is worth a second look.
  signal: "\\d+\\s*(?:МГц|кГц|Гц|мА|А|В|мВ|КБ|МБ|ГБ|мс|мкс|с|°C|Ом|кОм|біт|МБіт)|0x[0-9a-fA-F]+|GPIO\\d+"

  # …except in the index, where a "number" is a page list and no external
  # source exists by nature.
  index: "покажчик|індекс|z-pokazhchyk|у індексі|T-Z-\\d+"
