# Записи, зроблені М2 власноруч під час хвилі 2 — там, де наряд
# показав помічникові половину джерела, а друга половина лежала
# в тому ж кеші сусіднім файлом.

- id: T-20-030
  verdykt: pidtverdzheno
  fayl: 9d5cf303-basic-options.rst
  cytata: |
    The serial port is selected using the ``-p`` option, like ``-p /dev/ttyUSB0`` (Linux and macOS) or ``-p COM1`` (Windows).
  de: "розділ «Serial Port: ``--port``, ``-p``», рядок 26"
  notatka: >-
    Помічник поставив ne_znayshov, і за своїм нарядом мав рацію: йому
    дали basic-commands.rst, де є `esptool flash-id` без опцій. Опція
    ж описана в basic-options.rst — сусідньому файлі того ж кешу,
    якого наряд не назвав. Заголовок розділу подає обидві форми,
    `--port` і `-p`; книга вживає довгу. Команда в книзі точна.
    Урок не про помічника, а про наряд: один ключ мусить вести до
    всіх файлів свого документа, бо документація esptool розкладена
    на команди й опції окремо.
