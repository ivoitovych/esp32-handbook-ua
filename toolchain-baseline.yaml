# ── Чим виготовляється сама книга ───────────────────────────────────────
#
# Доти тут пінувалося з точністю до патча все, про що книга **пише**, і
# ніде — те, чим її **виробляють**. Знахідка М2 від 2026-08-26 показала
# ціну: ті самі джерела дали 413 сторінок в одного супровідника і 407 в
# іншого. Для GitHub це дрібниця, для друку — ні: кількість сторінок
# задає товщину корінця, а отже й обкладинку.
#
# `build.py` вписує фактичні версії в `release/BUILD.txt`, а
# `pdf-smoke.py` попереджає, коли вони розійшлися із записаним тут.
# Саме попереджає: розбіжність версії ще не помилка, непомічена — так.
build_pandoc:
  version: "3.1.3"
  status: verified
  checked: 2026-08-26
  note: >-
    markdown → typst. Різниця між 3.1 і 3.10 змінює розбиття абзаців у
    typst-фрагменті й дає кілька сторінок на всю книгу

build_typst:
  version: "0.15.0"
  status: verified
  checked: 2026-08-26
  note: >-
    typst → PDF, ставиться з pip. Між мінорними версіями змінюються
    виключка й розбиття рядків

build_fonts:
  version: "Libertinus Serif (вбудований у Typst) + Liberation Sans + DejaVu Sans Mono"
  status: verified
  checked: 2026-08-26
  note: >-
    Libertinus Sans у системі **немає** ні в М1, ні в М2 — заголовки
    падають на Liberation Sans в обох, тож шрифт не є причиною
    розбіжності сторінок. У шаблоні він лишається першим у переліку
    свідомо: якщо колись з'явиться, верстка стане кращою, а BUILD.txt
    покаже зміну виготовлювача
